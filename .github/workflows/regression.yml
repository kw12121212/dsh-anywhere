name: Regression

on:
  push:
  pull_request:

jobs:
  regression:
    name: Full regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # Electron 端到端测试需要显示服务器与可用的沙箱；不改动回归命令本身（技术标准 ci-regression/ci-linux-display）。
      - name: Prepare Linux display for Electron
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Full project regression
        run: |
          npm ci && npm run typecheck && npm run build && npm run test:coverage && npm run test:e2e
