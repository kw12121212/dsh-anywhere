name: Package

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth 0 保证 Taskfile 的 VERSION 变量（git describe --tags --exact-match）能取到 tag。
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: wails3 task darwin:package:universal:dmg
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          wails3 task linux:create:appimage
          wails3 task linux:create:deb
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: wails3 task windows:package
      - name: Normalize artifact names
        run: |
          VERSION=$(v=$(git describe --tags --match "v*" --exact-match 2>/dev/null) && echo "${v#v}" || echo dev)
          case "${{ runner.os }}" in
            macOS)
              mv bin/dsh-anywhere.dmg "bin/dsh-anywhere_${VERSION}_macos_universal.dmg"
              ;;
            Linux)
              mv bin/*.AppImage "bin/dsh-anywhere_${VERSION}_linux_amd64.AppImage"
              mv bin/*.deb "bin/dsh-anywhere_${VERSION}_linux_amd64.deb"
              ;;
            Windows)
              mv bin/*-installer.exe "bin/dsh-anywhere_${VERSION}_windows_amd64_installer.exe"
              ;;
          esac
          ls -l bin/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-anywhere-${{ runner.os }}
          path: |
            bin/*.dmg
            bin/*.AppImage
            bin/*.deb
            bin/*_installer.exe
          if-no-files-found: error
