name: Package

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # 版本号来自 package.json（packaging/package-version-single-source），浅克隆即可取到；
      # 发布 tag 与版本的一致性由 release.yml 的 verify-tag 前置校验把关。
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # 打包只经 npm 打包 script（内部执行 electron-vite build 与 electron-builder，
      # 版本号从 package.json 注入 define 与 extraMetadata.version，fuses 由
      # electron-builder 内建 electronFuses 配置），不得在工作流复制打包命令
      # （技术标准 packaging/ci-calls-electron-builder-package）。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npm run dist:mac
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-anywhere-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*_installer.exe
          if-no-files-found: error
