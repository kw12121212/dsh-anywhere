name: Package

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # fetch-depth 0 保证打包脚本能用 git describe --tags --exact-match 精确匹配
      # tag 派生版本号；浅克隆取不到 tag 时会静默回退 dev 版产物。
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # 打包只经 npm 打包 script（内部执行 electron-vite build 与 electron-builder，
      # 含 APP_VERSION / extraMetadata.version 注入与 afterPack fuses），不得在工作流
      # 复制打包命令（技术标准 packaging/ci-calls-electron-builder-package）。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npm run dist:mac
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-anywhere-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*_installer.exe
          if-no-files-found: error
