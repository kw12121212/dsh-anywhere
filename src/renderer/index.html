<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>DSH Anywhere</title>
  </head>
  <body>
    <main class="container">
      <section id="connecting" class="panel">
        <h1 id="app-title">DSH Anywhere</h1>
        <p id="status" class="intro">正在连接 harness…</p>
      </section>

      <section id="unconfigured" class="panel" hidden>
        <h1>欢迎使用 dsh-anywhere</h1>
        <p class="intro">dsh-anywhere 会在本窗口中打开你的 DeepSeek harness（dsh web）页面。请先填写 harness 地址。</p>
        <p id="invalid-config" class="notice" role="alert" hidden>已有配置无效，请重新填写 harness 地址。</p>
        <form id="setup-form" novalidate>
          <label for="harness-url">harness 地址</label>
          <input
            id="harness-url"
            type="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="粘贴 dsh-url 或 dsh web 输出的地址"
          />
          <p id="url-error" class="error" aria-live="polite"></p>
          <button id="start" type="submit" disabled>开始使用</button>
        </form>
      </section>

      <section id="reauth" class="panel" hidden>
        <h1>需要重新认证</h1>
        <p class="intro">dsh web 会话已失效（dsh web 重启后，旧的启动令牌不再有效）。</p>
        <p class="intro">请在 DSH 主机上运行 <code>dsh-url</code> 获取新的地址，然后在设置中粘贴并保存。</p>
        <p id="reauth-error" class="error" aria-live="polite"></p>
        <div class="actions">
          <button id="open-settings" type="button">打开设置</button>
        </div>
      </section>

      <section id="load-failed" class="panel" hidden>
        <h1>无法连接 harness</h1>
        <p class="intro">地址：<code id="failed-url"></code></p>
        <p id="failed-reason" class="notice"></p>
        <p id="failed-error" class="error" aria-live="polite"></p>
        <div class="actions">
          <button id="retry" type="button">重试</button>
          <button id="change-url" type="button" class="secondary">修改地址</button>
        </div>
      </section>

      <section id="settings" class="panel" hidden>
        <h1>设置</h1>
        <form id="settings-form" novalidate>
          <label for="settings-url">harness 地址</label>
          <input
            id="settings-url"
            type="url"
            autocomplete="off"
            spellcheck="false"
            placeholder="粘贴 dsh-url 或 dsh web 输出的地址"
          />
          <p id="settings-error" class="error" aria-live="polite"></p>
          <div class="actions">
            <button id="save" type="submit" disabled>保存</button>
            <button id="cancel" type="button" class="secondary">取消</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
