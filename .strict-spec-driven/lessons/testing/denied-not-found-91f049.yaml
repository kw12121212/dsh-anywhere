    date: '2026-11-05'
    evidence: '2026-11-05：TunnelStateMachineTest 新增负向用例修复前『netlinkrib: permission denied』判 NEEDS_KEY 失败；修复后 58 个 core 测试通过；模拟器截断 key 时仍正确判需要 key'
