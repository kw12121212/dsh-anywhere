lesson:
  id: mock-revision-revision-764395
  title: mock 的刷新信号要照搬上游：写入后顺手推进 revision 会掩盖「只换目录签名不推进 revision」的真实语义
category: testing
status: active
created_at: '2026-11-24T12:47:53.281Z'
updated_at: '2026-11-24T12:47:53.281Z'
context: dsbot-models-providers 用 mock --manage 验收服务商写入后 Bot 模型选择是否更新
observation: mock 在每个服务商写端点后调用 bump() 推进团队 revision，App 的 state 增量请求（只带 since/live）因此拿到全量、模型选择随之更新，设备验收通过；上游这些写入只 dropCatalog，不推进 state.revision，state 只在请求带 models（modelsKey）且不同时才回全量——真实 DSH 上手机端模型目录永远不刷新。评审对照 channel.js 才发现
takeaway: 新增 mock 端点时，先查上游该写入改了哪些状态、经什么信号让客户端发现（revision、live 键、modelsKey、feed 事件），mock 只发同样的信号；客户端依赖某个刷新信号时，在 core 写成可测的请求构造并加 JUnit；验收前对照上游 state 处理（since/live/models 判定）核对一次 mock 的 unchanged 条件
applies_when: 为 mock-dsh-server 新增或修改写端点、或验收依赖写入后自动刷新的界面时
occurrences:
  - origin: dsbot-models-providers
    date: '2026-11-24'
    evidence: 2026-11-24 评审指出 NativeShell.requestState 不带 models、mock-dsh-providers.mjs bump()；修复后 mock 改为按 modelsKey 判定、写入不推进 revision，新增 Groq 后批量切换选择器立即出现 Llama 3.3 70B
