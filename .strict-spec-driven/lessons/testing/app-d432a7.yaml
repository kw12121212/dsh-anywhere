    date: '2026-11-16'
    evidence: 'RED：android/gradlew -p android/core test --tests work.keepwriting.core.MarkdownParseTest 编译失败 e: Unresolved reference ''parts''（MarkdownParseTest.kt:93:28 起，2026-11-16 本地记录）；修复后 MarkdownParseTest 12 例全绿，完整回归命令（npm ci && npm run typecheck && npm run build && npm run test:coverage && npm run test:e2e && android/gradlew -p android/core test）exit 0。'
