context: dsbot-avatars 完整回归（xvfb-run -a）
observation: 'e2e/main-window.spec.ts:401 的 remote.evaluate(window.open…) 偶发报 page.evaluate: Execution context was destroyed（远程页在 evaluate 期间发生导航）；同一提交前三次与紧接着的一次重跑都通过，本变更只改 Android 代码'
takeaway: 完整回归必须看日志末尾的 EXIT=，不能看外层 shell 的退出码（echo 会吞掉失败）；该用例单次失败且报错是导航中的上下文销毁时，先原样重跑完整回归命令确认是否偶发，偶发则记录而不改测试；连续失败才排查桌面代码
applies_when: 完整回归中 e2e/main-window.spec.ts 的 window.open 用例失败并报 Execution context was destroyed，而被测变更未改桌面端代码
