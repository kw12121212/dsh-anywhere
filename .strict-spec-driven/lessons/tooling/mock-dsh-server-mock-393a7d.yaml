lesson:
  id: mock-dsh-server-mock-393a7d
  title: 改了 mock-dsh-server 要重启进程再验收，且 mock 各接口的数据要互相一致
category: tooling
status: active
created_at: '2026-11-23T09:34:09.509Z'
updated_at: '2026-11-24T12:36:51.349Z'
context: dsbot-read-state 设备验收：评审后给 mock 的 /mock/bump 加了换预览与推实时 message，再在模拟器上复验
observation: 后台跑着的 mock 是修改前启动的旧进程：bump 后预览不变、没有实时消息，一度以为客户端预览或已读有问题。重启 mock 后实时 message 照常推送，但聊天页仍看不到新消息——mock 的 chat 接口不含 bump 出的消息，revision 触发的重取合并把实时条目替换掉；真实服务端的聊天页会包含它。另外重启 mock 会使会话失效，需要在模拟器设置页重新保存带 token 的地址。
takeaway: 改动 scripts/mock-dsh-server.mjs 后先 node --check，再停掉旧进程重启（并重新保存带 token 的地址），然后才验收；新增 mock 模式时让 state（lastAt/preview）、chat 条目与 feed 事件出自同一份数据，避免客户端在重取或合并时表现出真实服务不会出现的现象。
applies_when: 修改或新增 mock-dsh-server 的模式、端点后做模拟器验收，或验收现象与 mock 预期不符时
occurrences:
  - origin: dsbot-read-state
    date: '2026-11-23'
    evidence: /tmp/dsbot-probe/mock-rs.log（旧进程无 bump 预览）；重启后 /mock/bump?id=bot-5&message=1 已读时间前移到 1795426360936 但聊天页无新消息，补 chat 接口后一致
  - origin: dsbot-models-providers
    date: '2026-11-24'
    evidence: 2026-11-24 给 /mock/providers 增加 block/unblock 后重启 mock，App 会话失效（会话已失效页），重新保存带 token 地址后修复卡验收通过
