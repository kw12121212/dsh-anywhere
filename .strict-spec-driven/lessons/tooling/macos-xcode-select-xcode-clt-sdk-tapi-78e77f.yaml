lesson:
  id: macos-xcode-select-xcode-clt-sdk-tapi-78e77f
  title: macOS 回归链接失败：xcode-select 指向外置 Xcode 与新版 CLT SDK 的 tapi 错配
category: tooling
status: obsolete
created_at: '2026-10-28T05:44:24.403Z'
updated_at: '2026-10-28T14:02:16.963Z'
context: '在 macOS 本机执行 config.yaml 完整回归命令时，go build 链接主程序 dsh-anywhere 失败，报 tapi error: malformed file / unknown architecture arm64e.x1-macos。'
observation: xcode-select 指向 /Volumes/Samsung_T5/Xcode.app（较旧的 clang 21 工具链），而链接时 SDK 解析到 /Library/Developer/CommandLineTools/SDKs/MacOSX27.0.sdk 的新版 .tbd；旧工具链 ld 的 tapi 不认识新 tbd 中的 arm64e.x1-macos 目标三元组，逐帧报错。
takeaway: 不改命令，仅以环境变量 DEVELOPER_DIR=/Library/Developer/CommandLineTools 执行回归命令，让 clang/ld 与 SDK 来自同一套 CLT 即可链接通过（仅剩非致命的 version-min 警告）；CI 不受影响（GitHub runner 工具链自洽）。根治需重装/对齐 Xcode 与 CLT 版本。
applies_when: 在本机 macOS 跑 go build / go test -race / config.yaml 完整回归，遇到 tapi unknown architecture 或 malformed .tbd 链接错误时；尤其 xcode-select 指向外置卷 Xcode 且系统另装了更新版 Command Line Tools 的机器。
occurrences:
  - origin: ci-regression-matrix
    date: '2026-10-28'
    evidence: '无前缀运行回归：go build 在链接主程序时报 libresolv.9.tbd:4:20 error: unknown architecture；export DEVELOPER_DIR=/Library/Developer/CommandLineTools 后同一命令完整通过（coverage 95.4% meets 80%）。'
obsoleted_reason: 该问题源于 macOS 上链接 Go cgo（Wails）依赖；Go 构建链路已移除，Node/Electron 工具链不经过 xcode-select 链接该依赖
obsoleted_at: '2026-10-28T14:02:16.963Z'
