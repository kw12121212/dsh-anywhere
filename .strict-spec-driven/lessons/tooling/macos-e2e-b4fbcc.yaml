lesson:
  id: macos-e2e-b4fbcc
  title: macOS 非交互会话拒绝应用激活：e2e 焦点断言必须带会话激活门控
category: tooling
status: active
created_at: '2026-10-29T06:33:54.070Z'
updated_at: '2026-11-28T03:41:05.460Z'
context: 本变更完整回归在无人值守会话失败：单实例两处 focused===true 断言超时，基线 HEAD 同样失败（与变更无关）。
observation: 锁屏/后台会话下窗口服务器拒绝给后台启动的应用激活，实测连 app.focus({steal:true}) 都无法让任何窗口成为 key window；交互会话下则正常。与 Linux WSLg 无窗口管理器（lesson wslg-weston-7217b7）同类的环境限制。
takeaway: e2e 的窗口焦点类断言先用对照窗口探测 sessionGrantsActivation（新窗口 show+focus+app.focus steal 后 isFocused）：对照窗口也无法获焦即跳过 focused 断言并注记原因；对照窗口能获焦而目标窗口不能仍按失败处理，应用缺陷不会被掩盖。见 e2e/desktop-experience.spec.ts。
applies_when: macOS 上 e2e 出现整类 focused/isFocused 断言超时而功能断言全绿，或计划在无人值守会话跑 Playwright Electron 套件时。
occurrences:
  - origin: version-management
    date: '2026-10-29'
    evidence: 2026-10-28 探针实测：second-instance 后 winFocused=false，app.focus({steal:true}) 后仍 false；加门控后同会话 41/41 通过。
  - origin: macos-shell-window
    date: '2026-11-27'
    evidence: 2026-11-28 真机验收再次命中并扩展：锁屏期间 System Events 对一切应用（含 Finder/Chrome/TextEdit）窗口枚举一律返回 0、AppleEvents 直接 tell app 超时、screencapture 全黑、open 启动的应用看似「无窗口」，极易误判为应用缺陷（macos-shell-window 曾据 此误判 Window 场景不显示窗口）；验收前先用 lsappinfo info -only name "$(lsappinfo front)" 判定是否为 loginwindow，非 loginwindow 且 AX 窗口枚举恢复再下 UI 结论，并用 caffeinate -dis 防止验收中途息屏锁屏。
  - origin: macos-team-sidebar 真机验收（2026-11-28 凌晨，无人值守）
    date: '2026-11-27'
    evidence: 锁屏期间除已登记的 AX 枚举 0 与黑屏外，还有三类伴生症状同样指向锁屏而非应用缺陷：CGEvent 合成点击静默失效（真实点击事件被 loginwindow 吞掉）、screencapture -R 矩形截屏报 could not create image from rect（全屏截屏仍可用）、sample 显示全部线程空闲。根因是 caffeinate -dis -t 7200 两小时到期后显示器休眠触发锁屏——无人值守长验收必须用不带 -t 的 caffeinate 或周期性重起。另：窗口被其他应用完全遮挡会经 occlusion 触发 setActive(false) 断开 feed（按设计），表现为「SSE 停摆」，先用 CGWindowList 与独立探针判别再下结论
  - origin: macos-bot-chat 真机验收（2026-11-28）
    date: '2026-11-28'
    evidence: 长沙箱会话里 CGEvent 注入（点击 /tmp/clickat、滚动 scrollWheel、keycode 键盘）会随会话时长整体失效（点击落到遮挡窗口或被吞），而 System Events 的 AXPress 动作与 AX 读写始终有效：交互验收应优先 AXPress 行/按钮 + AX 设 textarea 值 + collectTexts 断言，CGEvent 仅作首选尝试；窗口被前置应用遮挡时点击会落到遮挡窗口（先 activate 且用 CGWindowList 确认窗口可见）
