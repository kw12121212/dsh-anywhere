lesson:
  id: wsl-worktree-android-tailnet-keystore-aar-90484d
  title: WSL 新 worktree 里跑 Android 取证与构建的三个环境前提：tailnet 解析、keystore 路径、AAR
category: tooling
status: active
created_at: '2026-11-22T16:00:20.433Z'
updated_at: '2026-11-25T04:14:14.532Z'
context: dsbot-baseline-0310 在 WSL 的新 worktree 里对真实 dsh 跑 runSpike、构建 :app 调试 APK 并在 Windows 模拟器验收。
observation: runSpike 直连 tailnet 主机名报 UnknownHostException：WSL 的 resolv.conf 指向公网 DNS，不走 MagicDNS。Windows 侧 keystore.properties 的 storeFile 是 C:/ 路径，WSL 里的 Gradle 把它拼成 ~/.gradle/daemon/.../C:/... 而找不到文件。新 worktree 没有 android/app/libs/tstunnel.aar（不入库），:app 依赖缺失。
takeaway: 取证：tailscale ip -4 <主机> 取 IP 写进临时 hosts 文件，经 JAVA_TOOL_OPTIONS=-Djdk.net.hosts.file=<文件> 交给 JVM，不改系统 DNS。签名：生成一个 600 权限的临时 properties，只把 storeFile 改写成 /mnt/c/... 形式，经 DSH_KEYSTORE_PROPS 传入，构建后立即删除，口令不打印。AAR：先跑 node scripts/build-android-tstunnel.mts（ANDROID_HOME=~/Android/Sdk），再构建 :app。模拟器访问 127.0.0.1:13080 前先 adb.exe reverse tcp:13080 tcp:13080。
applies_when: 在 WSL（尤其新建的 git worktree）里运行 android/core 的 runSpike 访问 tailnet 上的 dsh、在 WSL 里构建 :app/APK 并复用 Windows 侧 ~/.config/dsh-anywhere/keys 的 keystore，或把 APK 装到 Windows 模拟器上连本机 dsh 时
occurrences:
  - origin: dsbot-baseline-0310
    date: '2026-11-22'
    evidence: runSpike 首跑 FAIL auth-token-session UnknownHostException；assembleDebug 首跑 validateSigningDebug 找不到 .../C:/Users/.../release.keystore；worktree 无 libs/。按 takeaway 处理后 spike FAIL=0、assembleDebug 成功、模拟器在线验收通过。
  - origin: dsbot-system-about
    date: '2026-11-25'
    evidence: 2026-11-25 dsbot-system-about（主工作区而非新 worktree）：WSL 的 ~/.config/dsh-anywhere/keys 不存在、未设 ANDROID_HOME，assembleDebug 先报 SDK location not found 再报缺 keystore；按 takeaway 用 /mnt/c/Users/*/.config/dsh-anywhere/keys 生成 600 权限临时 properties 经 DSH_KEYSTORE_PROPS 传入、ANDROID_HOME=~/Android/Sdk 构建成功，runSpike 经 tailscale ip + jdk.net.hosts.file 访问真实 dsh FAIL=0
