    evidence: 2026-11-27：ls -lad ~/.gradle → /Volumes/Samsung_T5/AndroidDev/gradle-home，/Volumes 下只有 Macintosh HD 与 Recovery；校验结果：Electron zip sha256 a9a1a0a5b64df714957f83467c84823cb34792205922c6f136550b2403605922、SHASUMS256.txt 7ffbf4a406ba5df5bd97e8a549ed1042af209456f98cf041c4dfababdc2f9abb 与 api.github.com 一致，gradle-9.6.0-bin.zip sha256 bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01 与 services.gradle.org 一致；补齐后 android core 660 个测试全部通过。
