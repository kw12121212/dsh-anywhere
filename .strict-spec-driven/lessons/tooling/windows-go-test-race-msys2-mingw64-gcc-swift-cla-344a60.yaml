lesson:
  id: windows-go-test-race-msys2-mingw64-gcc-swift-cla-344a60
  title: Windows 原生跑 go test -race 需要 msys2 mingw64 gcc，Swift clang 不行
category: tooling
status: active
created_at: '2026-10-28T10:32:32.217Z'
updated_at: '2026-10-28T10:32:32.217Z'
context: 在 Windows 宿主（GAMEPC）原生 Git Bash 中执行 config.yaml 的完整回归命令（含 go test -race）时
observation: 默认 CGO_ENABLED=0 使 -race 直接报 requires cgo；设 CGO_ENABLED=1 后 Swift 工具链的 clang（MSVC 目标）链接 Go race 对象失败 LNK1143 invalid or corrupt file；C:/msys2/mingw64/bin/gcc.exe 配合 CGO_ENABLED=1 CC=gcc 全部包通过
