    date: '2026-11-23'
    evidence: logcat FATAL EXCEPTION main java.util.ConcurrentModificationException at StateListIterator.validateModification ← ChatScrollSupport derivedStateOf；修复后同一操作序列（进入聊天、推送提醒、切换、断线重连）logcat crash 缓冲 0 条
