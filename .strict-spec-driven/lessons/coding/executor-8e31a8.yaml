lesson:
  id: executor-8e31a8
  title: 单线程 executor 里登记的在途键防不住重复点按
category: coding
status: active
created_at: '2026-11-22T16:46:40.798Z'
updated_at: '2026-11-22T16:46:40.798Z'
context: dsbot-chat-bars-0310 的聊天条写操作（停止任务、电脑作答、重试）用 barInFlight 集合防重复提交，所有网络请求与状态变更收敛在 NativeShellConnection 的单线程 executor。
observation: 初版在同一个 executor Runnable 里检查、add、发请求、remove：排在后面的同键任务执行时前一个早已 remove，检查永远不命中；按钮也要等任务真正开始执行才禁用，executor 被探测、fetchState 等同步网络调用占用时窗口可达数秒，弱网连点会排队发出多次写请求。独立评审发现，模拟器连点三次复验修复后只发一次。
takeaway: 防重复点按的在途标记必须在点按的线程（主线程）上、投递到 executor 之前登记并判重，executor 只负责结束时移除；SnapshotStateList 跨线程增删安全。
applies_when: 在 :app 里给经单线程 executor 或任何串行队列执行的写操作（停止、作答、重试、发送）加防重复提交或按钮禁用状态时
occurrences:
