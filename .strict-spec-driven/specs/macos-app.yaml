schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: macos-app
  title: macOS 原生 App
requirements:
  session-establish-and-persist:
    strength: MUST
    statement: 在 macOS 原生客户端提交带 token 的 harness 地址后，应用只向该带 token 地址发起一次原生建立会话请求（仅在同源 scheme/host/port 下跟随不超过 5 次重定向），取得 dsh-auth-* 会话 cookie 后将其按目标源隔离并仅当前用户可读地持久化到应用私有存储，配置中只保存去掉 token 的干净地址；带 token 地址与 cookie 值不写入配置、界面文本或日志；退出并重启应用后直接复用已持久化会话进入在线状态。
    scenarios:
      first-token-url-establishes-once:
        - GIVEN: macOS 原生客户端尚未保存配置，dsh 服务可凭一次带 token 请求签发 dsh-auth 会话 cookie（含同源 303 重定向）
        - WHEN: 用户粘贴 dsh-url 输出的带 token 地址并提交
        - THEN: 客户端只请求一次该带 token 地址即建立会话，配置仅保存去掉 token 的干净地址，token 不出现在配置与任何界面文本中，状态进入在线
      restart-keeps-session:
        - GIVEN: 用户已在 macOS 原生客户端成功建立会话
        - WHEN: 退出并重新启动应用
        - THEN: 客户端无需重新输入地址或重新认证，直接以已保存干净地址与持久化会话进入在线状态
      cross-origin-redirect-does-not-leak-cookie:
        - GIVEN: 建立会话请求返回指向不同源的 302/303 重定向
        - WHEN: 客户端处理该重定向响应
        - THEN: 客户端不跟随跨源重定向、不向跨源目标发送任何 cookie 或 token，且不将此前残留的旧 cookie 误判为建会话成功
  origin-scoped-transport-and-headers:
    strength: MUST
    statement: macOS 原生客户端的全部探测、会话、/api/bot 与 /api/bot/feed 网络请求直接通过系统网络栈发出（不内置 Tailscale、tsnet 或任何本地代理），请求目标严格限定为已保存 harness 的同源地址，携带与目标一致的 Host 头及当前源对应的 dsh-auth-* cookie，且不发送 Origin、Referer 或跨站 Fetch 标记头。
    scenarios:
      api-and-feed-carry-cookie-and-host:
        - GIVEN: macOS 原生客户端已保存 harness 地址并持有对应的 dsh-auth 会话 cookie
        - WHEN: 客户端向 /api/bot 与 /api/bot/feed 发起请求
        - THEN: 请求命中已保存源，携带匹配的 Host 与 Cookie 头，且请求头中不含 Origin、Referer 与 Sec-Fetch-* 字段；不同源地址不共用会话 cookie
      system-network-without-builtin-tailscale:
        - GIVEN: 用户通过系统 Tailscale 客户端接入 tailnet 上的 dsh 地址（如 *.ts.net 或 100.64.0.0/10）
        - WHEN: macOS 原生客户端发起连接与同步
        - THEN: 客户端直接使用系统网络栈访问该地址并正常工作，不启动任何内置隧道或本地代理端口
  session-expired-reauth:
    strength: MUST
    statement: 当远端对干净地址的门禁检查、/api/bot 或 /api/bot/feed 返回 401 会话失效（门禁阶段先自动重试一次仍为 401），或当前目标源在私有存储中缺少 dsh-auth-* 会话 cookie 时，客户端不进入空白或假在线状态，而是显示本地重新认证页（说明运行 dsh-url 获取新带 token 地址并粘贴，不含旧 token 或 cookie 原文）；用户粘贴新的带 token 地址并提交后，无需重启应用即重建会话并恢复在线。
    scenarios:
      expired-401-shows-reauth-page:
        - GIVEN: macOS 原生客户端已保存干净地址，远端返回 401 会话失效
        - WHEN: 应用启动探测或在线订阅期间触发 401
        - THEN: 门禁先重试一次仍 401 后主界面显示本地重新认证页，给出运行 dsh-url 的提示与输入入口，不显示 401 原文、token 或 cookie
      missing-cookie-shows-reauth-page:
        - GIVEN: macOS 原生客户端已保存干净地址，但私有存储中没有该源的有效 dsh-auth 会话 cookie
        - WHEN: 启动应用或准备建立连接
        - THEN: 主界面显示本地重新认证页，引导用户粘贴新的带 token 地址
      reauth-recovers-without-restart:
        - GIVEN: 主界面正显示本地重新认证页
        - WHEN: 用户粘贴新的带有效 token 地址并提交
        - THEN: 应用无需重启即建立新会话、只保留干净地址，主界面恢复在线状态
  connection-error-page:
    strength: MUST
    statement: 连接探测（默认 10 秒超时；任何 HTTP 响应视为可达）遇到 DNS 解析失败、连接被拒绝、超时或 TLS 安全连接失败时，主界面显示按原因分类的本地错误页：展示不含 token 的干净地址、对应原因说明、以及「重试」与「修改地址」入口；若目标主机为 tailnet 地址（*.ts.net、100.64.0.0/10、fd7a:115c:a1e0::/48 或单标签 MagicDNS 主机名），错误页额外提示确认系统 Tailscale 客户端已连接；点击「重试」在服务恢复后自动回到在线状态，点击「修改地址」可修改当前配置地址。
    scenarios:
      refused-and-dns-error-page:
        - GIVEN: 已保存 http://127.0.0.1:13080/ 无服务监听，或保存了无法解析的域名
        - WHEN: 启动应用或执行探测
        - THEN: 主界面显示本地错误页，分别说明「连接被拒绝」或「无法解析主机名」，展示不含 token 的干净地址及「重试」「修改地址」按钮
      tailnet-failure-shows-tailscale-hint:
        - GIVEN: 已保存 *.ts.net 或 100.64.x.y 的 tailnet 地址且当前不可达
        - WHEN: 触发连接探测失败
        - THEN: 本地错误页在原因说明之外额外显示「请确认系统 Tailscale 已连接」提示
      retry-recovers-when-service-back:
        - GIVEN: 主界面显示本地错误页，随后 dsh 服务或系统 Tailscale 恢复可用
        - WHEN: 用户点击错误页上的「重试」
        - THEN: 客户端重新探测并验证会话，恢复进入在线状态与正常连接状态条
      tls-and-timeout-error-page:
        - GIVEN: 已保存的 https 地址证书不受信任，或目标主机 10 秒内未完成响应
        - WHEN: 执行连接探测
        - THEN: 本地错误页分别显示安全连接（TLS）失败或连接超时的说明，并提供重试与修改地址入口
  forbidden-host-hint:
    strength: MUST
    statement: 当远端对已保存 harness 源返回 403（Host 未列入 dsh trusted-host 白名单）时，主界面显示本地提示页说明需要在 DSH 主机将当前访问主机名加入 trusted-host（--trusted-host 参数），并提供修改地址或重试入口，不显示 token 与 cookie。
    scenarios:
      forbidden-403-shows-trusted-host-hint:
        - GIVEN: 已保存地址的 Host 未在 dsh 服务的 trusted-host 白名单中，门禁或 API 返回 403
        - WHEN: 应用连接该地址
        - THEN: 主界面显示本地 trusted-host 配置提示页与修改地址入口，不显示 token 或 cookie
  feed-status-and-lifecycle:
    strength: MUST
    statement: 会话通过后客户端订阅 /api/bot/feed SSE 事件流并在顶部状态条显示连接中、在线与重连状态：断线时按指数退避（1s 起步、封顶 60s）重连并按本地 revision 与 liveKey 调用 state 增量补齐；当应用所有窗口隐藏或系统进入睡眠时主动断开 feed 订阅并保留当前同步游标，应用重新可见或系统唤醒时重新探测门禁与订阅并按保留游标补齐期间状态。
    scenarios:
      online-and-backoff-reconnect:
        - GIVEN: 客户端已建立有效会话并进入在线状态，随后 SSE 流意外断开
        - WHEN: 服务端短暂中断后恢复
        - THEN: 状态条依次呈现连接中、在线、重连中，在断线期间按指数退避重连，恢复后发送已记录的 since/liveKey 补齐变更并回到在线
      inactive-disconnects-and-resumes-catchup:
        - GIVEN: 客户端在线并已同步至某一 revision
        - WHEN: 系统进入睡眠或所有窗口隐藏，随后唤醒或恢复显示
        - THEN: 失活期间断开 SSE 订阅；恢复活跃后重新检查并订阅 feed，携带先前的 revision 与 liveKey 补齐期间更新
  version-banner:
    strength: MUST
    statement: 连接建立时读取远端 update-check 与 hello 能力集合，与已测基准（DS-Bot 0.3.10、dsh 0.2.2-rc.3）及共同 api 版本比对：版本或能力版本不一致时在主界面顶部显示提示条（展示远端版本号并说明部分功能可能受限，但当前连接仍尽力可用），用户可点击关闭本次提示；版本匹配或远端未返回版本信息时不显示版本提示条。
    scenarios:
      mismatch-shows-dismissible-banner:
        - GIVEN: 远端返回与基准不一致的 DS-Bot/dsh 版本或不支持的 hello api 版本
        - WHEN: 连接建立完成
        - THEN: 主界面顶部显示版本提示条且不影响连接状态；用户点击关闭后本次会话期内不再显示该提示条
      matched-or-unknown-hides-banner:
        - GIVEN: 远端返回与基准一致的版本（0.3.10 与 0.2.2-rc.3）或缺失版本字段
        - WHEN: 连接建立完成
        - THEN: 主界面不显示版本提示条
  first-run-setup-and-live-validation:
    strength: MUST
    statement: 首次启动且原生 config.json 缺失（且未命中可迁移的 Electron 配置）时，主窗口显示首次设置界面（含欢迎说明、粘贴提示、地址输入框与提交按钮，且不显示配置无效提示）；若原生 config.json 损坏或地址无效，则显示首次设置界面并提示已有配置无效（不得触发迁移）。用户输入时实时校验：空值时禁用提交且不显示实时校验原因，非法地址禁用提交并展示固定原因（不含输入原文或 token）；提交合法地址后先探测可达，再剥离 token 原子保存干净地址（输入带 token 时先按原始输入建立一次会话），随后进入主窗口；探测、建会话或保存失败时停留在首次设置界面并展示不含 token 的错误信息。
    scenarios:
      fresh-launch-shows-setup-with-live-validation:
        - GIVEN: 原生数据目录与 Electron 目录均无已保存配置
        - WHEN: 启动 macOS 原生应用并分别输入空值、ftp://dsh.example.test/?token=abc123 与 http://127.0.0.1:13080/?token=abc123
        - THEN: 首次打开显示欢迎说明且无配置无效提示；非法输入禁用提交且提示不含 abc123；合法输入启用提交且不显示错误
      corrupt-native-config-shows-invalid-notice:
        - GIVEN: 原生 config.json 内容损坏或包含非法地址 ftp://dsh.example.test/，且 Electron 目录存在另一份有效配置
        - WHEN: 启动 macOS 原生应用
        - THEN: 主窗口显示首次设置界面并提示已有配置无效，不触发 Electron 迁移覆盖
      submit-valid-token-url-saves-clean-and-connects:
        - GIVEN: 首次设置界面已打开且远端 dsh 服务可达
        - WHEN: 用户粘贴 http://127.0.0.1:13080/?token=abc123 并提交
        - THEN: config.json 原子保存为 http://127.0.0.1:13080/（不含 abc123），建连一次建立会话并进入主窗口在线状态
      submit-failure-stays-on-setup-without-token:
        - GIVEN: 首次设置界面已打开，配置目录不可写或探测失败
        - WHEN: 用户提交 http://127.0.0.1:13080/?token=abc123
        - THEN: 主窗口停留在首次设置界面并显示可读错误，错误信息中不含 abc123
  macos-settings-window:
    strength: MUST
    statement: 应用提供标准 macOS Settings 窗口（⌘, 及应用菜单设置入口），与主窗口独立维护编辑草稿：打开时显示当前已保存干净地址、连接状态概要与无需滚动即可见的关于 DSH Anywhere 入口，重复打开聚焦已有窗口且不影响主窗口；编辑时实时校验：空值禁用保存且不显示实时校验原因，非法地址禁用保存并显示原因；点击保存时，若当前在线且地址未改动且未输入 token 则直接关闭设置窗口不重连；地址未改动且未输入 token 但当前不在线时直接关闭设置窗口并由主窗口无需重启重新连接，结果由主窗口按重新探测与会话检查显示；其余情况先探测（含 token 时按需一次建会话）成功后再原子保存干净地址、关闭窗口并无需重启立即生效；取消或保存失败不修改已保存配置与主窗口，探测、建会话或写入失败时设置窗口保持打开并显示不含 token 的错误信息。
    scenarios:
      open-settings-shows-clean-url-status-and-about:
        - GIVEN: 已保存 https://dsh.example.test/ 且主窗口正处于在线状态
        - WHEN: 用户按下 ⌘, 或选择设置入口，随后再次触发设置入口
        - THEN: 标准设置窗口打开并显示 https://dsh.example.test/、当前连接状态与关于入口；再次触发只聚焦已有设置窗口，主窗口保持在线不受影响
      settings-save-new-url-reconnects-without-restart:
        - GIVEN: 当前已保存 https://a.example.test/，用户在设置窗口粘贴 http://127.0.0.1:13080/?token=def456
        - WHEN: 点击保存
        - THEN: 探测并一次性建会话后 config.json 原子更新为 http://127.0.0.1:13080/（不含 def456），设置窗口关闭，主窗口无需重启即切换到新会话在线状态
      settings-save-unchanged-online-skips-reload:
        - GIVEN: 已保存 https://dsh.example.test/ 且主窗口正处于在线连接状态
        - WHEN: 用户在设置窗口不修改地址、不带 token 直接点击保存
        - THEN: 设置窗口关闭，且不中断或重建当前在线连接
      settings-save-failure-keeps-window-open-without-token:
        - GIVEN: 设置窗口已打开且目标地址探测失败或配置目录不可写
        - WHEN: 用户输入 http://127.0.0.1:13080/?token=abc123 并点击保存
        - THEN: 设置窗口保持打开并显示不含 abc123 的错误提示，原已保存配置与主窗口连接不受影响
      settings-url-field-spans-group-width:
        - GIVEN: 已保存 https://dsh.example.test/
        - WHEN: 用户打开设置窗口查看「连接地址」分组
        - THEN: 地址输入框横向铺满该分组的内容宽度，输入框左侧不出现空白或被长标题占用的标签列
      settings-about-entry-visible-without-scrolling:
        - GIVEN: 已保存 https://dsh.example.test/，设置窗口为默认打开尺寸
        - WHEN: 用户打开设置窗口
        - THEN: 「关于 DSH Anywhere…」入口无需滚动或拉高窗口即可见，点击后显示标准关于面板
      settings-live-validation-and-cancel-preserves-state:
        - GIVEN: 设置窗口已打开并把地址改为空值或 ftp://dsh.example.test/
        - WHEN: 查看保存按钮状态并最终点击取消或关闭窗口
        - THEN: 保存按钮不可用（ftp 地址显示原因，清空地址时不显示实时校验原因）；取消或关闭后原配置与主窗口保持不变
      settings-save-unchanged-offline-reconnects:
        - GIVEN: 已保存 https://dsh.example.test/，主窗口显示连接错误页或重新认证页
        - WHEN: 用户在设置窗口不修改地址、不带 token 直接点击保存
        - THEN: 设置窗口关闭，主窗口无需重启即重新连接，并按重新探测与会话检查的结果显示在线、对应错误页或重新认证页
  electron-config-migration:
    strength: MUST
    statement: 仅当原生 config.json 缺失时，客户端按只读方式扫描同机原版 Electron 配置目录（~/Library/Application Support/DSH Anywhere/ 与 ~/Library/Application Support/dsh-anywhere/），迁移其中有效的 harness URL（剥离可能残留的 token）至原生 config.json，并在原生 diagnostics.json 尚不存在时迁移合法的 https 诊断端点（非法或非 https 端点忽略且不阻断）；迁移过程中不修改、覆盖或删除 Electron 目录中的任何文件，也不迁移 Chromium cookie，随后自动进入带迁移提示的本地重新认证页引导重新认证；当原生 config.json 已存在（无论有效或损坏）时绝不触发迁移。
    scenarios:
      migrate-harness-url-and-diagnostics-readonly:
        - GIVEN: 原生目录尚无 config.json，Electron 目录中存在含 https://dsh.example.test/?token=old_tok 的 config.json 与含 https://diag.example.ts.net:18790 的 diagnostics.json
        - WHEN: 启动 macOS 原生客户端
        - THEN: 原生 config.json 写入干净地址 https://dsh.example.test/，原生 diagnostics.json 写入 https://diag.example.ts.net:18790/，Electron 目录下所有文件保持只读未变
      migrated-launch-enters-reauth-without-cookie:
        - GIVEN: 从 Electron 配置迁移了有效 harness URL，且原生存储没有对应 dsh-auth-* cookie
        - WHEN: 启动流程继续建连检查
        - THEN: 客户端不迁入 Chromium cookie，主界面自动进入本地重新认证页并展示已从 Electron 迁移地址、请粘贴新 dsh-url 重新认证的提示
      existing-native-config-never-overwritten-by-electron:
        - GIVEN: 原生目录已有有效 config.json（或已清除 diagnostics.json），而 Electron 目录仍有旧配置
        - WHEN: 启动 macOS 原生客户端
        - THEN: 跳过迁移，原生 config.json 不被覆盖且不重新写入 diagnostics.json
      invalid-electron-diagnostics-ignored-safely:
        - GIVEN: Electron 目录存在有效 config.json，但 diagnostics.json 内容损坏或为 http://insecure.test/
        - WHEN: 启动 macOS 原生客户端
        - THEN: 有效 harness URL 正常迁移并进入重新认证页，非法诊断端点被安全忽略且不写入原生 diagnostics.json
  macos-shell-three-column:
    strength: MUST
    statement: 会话在线时主窗口内容区呈现三栏布局：左侧为团队侧栏（本阶段为占位）、中间为聊天内容区（占位）、右侧为可开合的详情检查器（占位）；顶部全局连接状态条与版本提示条常驻显示且不遮挡三栏内容；窗口收窄时侧栏按系统行为自动收起且可重新展开，检查器可独立开合，最小窗口尺寸下聊天内容区仍完整可用；首次设置、连接中、错误页、重新认证与 Host 未受信任界面保持全宽呈现，不被三栏挤压。
    scenarios:
      connected-shows-three-column-shell:
        - GIVEN: macOS 原生客户端已建立会话进入在线状态
        - WHEN: 查看主窗口
        - THEN: 顶部连接状态条显示在线，内容区呈现团队侧栏、聊天内容与右侧检查器三栏占位，版本提示条（如有）不遮挡任何栏内容
      narrow-window-collapses-sidebar:
        - GIVEN: 主窗口三栏显示
        - WHEN: 把窗口宽度逐渐收窄到最小窗口尺寸
        - THEN: 侧栏按系统行为自动收起且可经菜单或界面重新展开，聊天内容区始终完整可用
      inspector-toggles-independently:
        - GIVEN: 主窗口三栏显示
        - WHEN: 切换右侧检查器开合
        - THEN: 检查器收起或展开，聊天内容区随之自适应宽度，顶部连接状态条显示不变
      setup-and-error-pages-stay-full-width:
        - GIVEN: 应用显示首次设置、连接中、错误页、重新认证或 Host 未受信任界面
        - WHEN: 查看主窗口
        - THEN: 这些界面保持全宽呈现不被三栏挤压，顶部连接状态条仍常驻
  macos-app-menus-and-shortcuts:
    strength: MUST
    statement: 应用提供中文菜单与快捷键：应用菜单包含「关于 DSH Anywhere」（显示标准关于面板与应用版本）、「设置…」（⌘, 打开或聚焦标准设置窗口）与「退出」；「视图」菜单包含「重新加载」（⌘R：有已保存地址时重新执行连接流程——重新探测、重新拉取 state 并重订阅 feed，回到在线或对应的错误/重新认证界面；无有效配置时回到首次设置界面）、「显示/隐藏侧栏」与「显示/隐藏检查器」（与界面实际开合状态一致切换）；菜单命令不修改已保存的 harness 配置与诊断端点。
    scenarios:
      app-menu-about-settings-quit:
        - GIVEN: 应用正在运行
        - WHEN: 依次展开应用菜单并选择「关于 DSH Anywhere」与「设置…」
        - THEN: 关于面板显示应用名称与版本，⌘, 与「设置…」打开（已打开则聚焦）标准设置窗口，「退出」结束应用
      view-menu-reload-refetches-and-resubscribes:
        - GIVEN: 主窗口在线，已保存 harness 地址且服务可达
        - WHEN: 选择「视图 → 重新加载」或按 ⌘R
        - THEN: 客户端重新探测并重新拉取 state、重订阅 feed 回到在线状态，已保存配置不变
      view-menu-reload-without-config:
        - GIVEN: 配置缺失或损坏
        - WHEN: 按 ⌘R
        - THEN: 主界面回到首次设置界面（损坏时带已有配置无效提示），不出现空白或假在线
      view-menu-toggle-sidebar-and-inspector:
        - GIVEN: 主窗口三栏显示
        - WHEN: 依次选择「视图 → 显示/隐藏侧栏」与「显示/隐藏检查器」
        - THEN: 侧栏与检查器各自开合，菜单项状态与界面实际开合一致
  macos-window-state-memory:
    strength: MUST
    statement: 应用把主窗口位置、尺寸、侧栏与检查器开合及侧栏宽度保存到应用私有数据目录的独立状态文件（原子写入），再次启动时若保存的位置与当前任一显示器相交，则按保存的位置、尺寸、开合与侧栏宽度恢复主窗口；保存位置与所有显示器都不相交（例如保存后拔掉了外接显示器）时，以默认尺寸居中显示在主显示器，不出现在任何显示器之外；状态文件缺失、内容损坏或数值无效时按没有保存状态处理（以默认尺寸与位置启动），不影响已保存的 harness 地址与诊断端点，也不提示配置无效。
    scenarios:
      restart-restores-geometry-panels-and-sidebar-width:
        - GIVEN: 用户把主窗口移到某位置并调整尺寸，展开侧栏并拖宽、收起检查器后退出应用
        - WHEN: 重新启动应用
        - THEN: 主窗口按保存的位置与尺寸恢复，侧栏展开且宽度、检查器收起状态一并恢复
      offscreen-falls-back-to-main-screen:
        - GIVEN: 主窗口状态保存在外接显示器上，随后拔掉外接显示器
        - WHEN: 启动应用
        - THEN: 主窗口以默认尺寸居中显示在当前主显示器的可见区域内，不出现在任何显示器之外
      corrupt-state-uses-defaults:
        - GIVEN: 状态文件内容损坏或尺寸数值无效，已保存有效的 harness 地址
        - WHEN: 启动应用
        - THEN: 主窗口以默认尺寸与位置启动并正常连接，不显示任何配置无效提示，harness 配置不受影响
      saving-window-state-keeps-other-config:
        - GIVEN: 已保存 harness 地址与诊断上报端点，窗口处于某位置与尺寸
        - WHEN: 移动缩放窗口后退出并重新启动
        - THEN: 窗口状态按新值恢复，config.json 与 diagnostics.json 内容不变
  macos-single-window-lifecycle:
    strength: MUST
    statement: 应用只维护一个主窗口：不提供「新建窗口」入口；应用已运行时再次打开该应用不出现第二个主窗口，而是激活既有主窗口（处于最小化时先恢复并置前）；关闭最后一个主窗口不退出应用，从 Dock 点击应用图标重新打开主窗口并按记忆的窗口状态恢复；重复打开与关窗重开过程中，主窗口显示的界面与已保存配置保持不变。
    scenarios:
      second-launch-activates-existing-window:
        - GIVEN: 应用已运行且主窗口可见
        - WHEN: 在访达中再次打开该应用
        - THEN: 不出现第二个主窗口，既有主窗口被带到前台获得焦点
      close-last-window-keeps-app-running:
        - GIVEN: 应用仅剩主窗口打开
        - WHEN: 关闭主窗口后点击 Dock 图标
        - THEN: 应用未退出，主窗口重新打开并恢复记忆的位置尺寸与开合状态
      reopen-preserves-config-and-session:
        - GIVEN: 应用在线且已保存 harness 地址
        - WHEN: 关闭主窗口再从 Dock 重开
        - THEN: 主窗口按记忆状态恢复，无需重新输入地址，已保存配置与当前会话状态保持一致
  macos-team-sidebar-shell:
    strength: MUST
    statement: macOS 主窗口在线后团队侧栏按 android-dsbot 平台无关需求渲染团队列表：侧栏顶部搜索框（⌘K 聚焦，视图菜单提供「搜索聊天」同一入口），其下按分组显示条目（分组头按远端 sections 原样显示、不可交互）；条目行含头像颜色圈与工作状态点、名称（超长截断）、Main/私有/待办标签、预览优先级一行与本机未读点；点击条目选中该聊天：侧栏高亮、内容区显示所选聊天名称占位（聊天内容由后续版本提供）、按 team-read-state 标记已读并作为提醒抑制的当前聊天；再次点击同一条目不重复标记；断开连接后侧栏保持最后列表，重连成功后自动刷新；正在连接尚无数据时侧栏显示加载提示。
    scenarios:
      sidebar-connected-list:
        - GIVEN: 已连接且远端 state 含分组、Bot 与群
        - WHEN: 主窗口在线态渲染侧栏
        - THEN: 侧栏显示与网页端一致的分组结构、排序与条目行（颜色圈、状态点、名称、标签、预览、未读点），远端缺字段时对应元素降级不显示且不崩溃
      cmdk-focuses-search:
        - GIVEN: 主窗口在线且侧栏可见
        - WHEN: 按下 ⌘K 或点选视图菜单「搜索聊天」
        - THEN: 侧栏搜索框获得焦点，输入即时过滤（名称/摘要/角色），清空恢复完整列表，无结果显示无匹配提示
      select-entry-clears-unread:
        - GIVEN: 某条目有未读点
        - WHEN: 点击该条目
        - THEN: 侧栏高亮该条目，内容区显示所选聊天名称占位，未读点消失并按本机已读持久化；重启后仍为已读
      empty-team-guide-shown:
        - GIVEN: 远端团队为全新空团队
        - WHEN: 主窗口在线态渲染侧栏
        - THEN: 侧栏显示首次创建引导（创建第一个 Chief），不显示空白列表
  macos-notice-banner-window:
    strength: MUST
    statement: macOS 应用内提醒横幅显示在主窗口内容顶部（连接状态条之下）：远端声明 notices 能力且未关闭「应用内提醒」时，非当前选中聊天的提醒以约 8 秒横幅显示（来源名称、类型与摘要，强调底色），新提醒替换旧横幅并重新计时，点按横幅选中对应聊天并收起，8 秒内未点按自动收起；远端未声明 notices 能力、或设置窗口已关闭「应用内提醒」时不显示横幅、其余功能照常；「应用内提醒」开关位于设置窗口、默认开启、本机保存并跨启动保持；横幅文本不写入日志与诊断上报。
    scenarios:
      banner-tap-switches-chat:
        - GIVEN: 侧栏选中 Bot A，远端声明 notices
        - WHEN: Bot B 发起提问
        - THEN: 主窗口顶部出现约 8 秒横幅显示 B 与提问摘要；点按后选中 B 的聊天并收起；不点按 8 秒后自动收起
      current-selection-no-banner:
        - GIVEN: 侧栏选中 Bot A
        - WHEN: Bot A 回复或提问
        - THEN: 不显示横幅
      banner-toggle-persists:
        - GIVEN: 设置窗口关闭「应用内提醒」
        - WHEN: 非当前聊天的 Bot 发起提问，随后退出重开应用
        - THEN: 不显示横幅且其余功能照常；重开后开关仍为关闭；重新开启后横幅恢复
  macos-bot-chat-shell:
    strength: MUST
    statement: macOS 主窗口内容区呈现当前选中聊天的私聊界面：顶部工具栏（停止、恢复、新分段/旧分段、运行统计、Bot 间消息记录入口）与消息列表、底部输入框；消息列表按 android-dsbot 平台无关需求渲染（Markdown 自绘、链接分流、工具折叠卡、图片与文件条目、分页与已到最早提示、右键菜单复制整条/选择文字、代码块复制按钮）；流式回复贴底跟随不跳动，离底时计数并显示回到最新；发送箱行（发送中/已发送等待确认/未发送点按重试与删除）按 chat-outbox 语义交互；Enter/⌥Enter 行为按团队偏好 enterToSend 即时生效；首次进入无缓存时显示加载，空聊天显示为空；会话过期时发送提示稍候不发往旧会话。
    scenarios:
      chat-selected-shows-history:
        - GIVEN: 侧栏选中某 Bot 且该聊天有历史
        - WHEN: 内容区渲染
        - THEN: 显示该聊天最新一页消息与输入框；向上滚动分页加载更早并在到最早时提示；选中别的聊天再回来时立即恢复内容与滚动位置
      stream-follows-bottom:
        - GIVEN: 停留在某 Bot 聊天底部
        - WHEN: 发送消息且 Bot 流式回复
        - THEN: 正在写的气泡逐字追加且列表贴底跟随不跳动；向上翻离底部后新消息只累计计数，回到最新按钮可跳底
      outbox-retry-once-ui:
        - GIVEN: 断网时在某私聊发送消息
        - WHEN: 消息转「未发送，点按重试」后点按重试，随后再快速连点
        - THEN: 重试进行中按钮不可再点；网络恢复后重试只发出一次，服务端消息出现后本地行消失
      parts-and-stats:
        - GIVEN: 某 Bot 有多段会话与运行记录
        - WHEN: 从头部工具栏新开分段、切回旧分段、打开运行统计与 Bot 间消息记录
        - THEN: 分段切换后聊天按对应分段显示（缓存失效重载，空段显示为空）；统计与记录以可读面板呈现且与网页端一致
      enter-pref-applies:
        - GIVEN: 团队偏好 enterToSend 分别为默认与关闭
        - WHEN: 在输入框按 Enter 与 ⌥Enter
        - THEN: 偏好开启时 Enter 发送、⌥Enter 换行；偏好关闭时 Enter 换行、⌥Enter 发送；偏好变化即时生效
  macos-cards-dock-shell:
    strength: MUST
    statement: macOS 私聊停靠区按 android-dsbot 平台无关需求渲染与交互（一次展开、排序、高度上限、作答同步、图表按数据绘制与降级、密钥不回显、沙箱 HTML 卡禁网隔离）；卡片视图族覆盖审批/提问/show_view 全段/密钥/学习差异/连接器/浏览器交接/btw；学习差异逐行双色折叠、浏览器交接在 dsh Web 宿主场景提示到桌面操作。
    scenarios:
      dock-renders-and-answers:
        - GIVEN: 当前会话有待处理卡（如提问）
        - WHEN: 停靠区渲染并作答
        - THEN: 卡片按排序显示且只展开一张；作答提交后本地消隐、state 刷新后网页端同步；无待处理时停靠区不显示
      sandbox-html-no-network:
        - GIVEN: 构造一张含外链图片与 fetch 调用的沙箱 HTML 卡
        - WHEN: 在停靠区展开渲染
        - THEN: 内容显示但无任何网络请求发出（外链资源被阻断）；WebView 无持久化存储与脚本桥接，导航全部被拦截
      charts-drawn-and-degrade:
        - GIVEN: show_view 卡含折线图表段与一张畸形数据段
        - WHEN: 渲染
        - THEN: 折线按数据以系统图表绘制；畸形段显示为只读文本，不崩溃不空白
  macos-group-chat-shell:
    strength: MUST
    statement: 群聊内容区（macOS 原生）：侧栏选中群后内容区显示群聊——头部（群名、运行中成员各带工作短语与逐成员停止、停止全部、群目标条）、消息列表（成员名称与颜色、群公告、轮次事件系统行、[PASS] 不可见、分页与回到最新）、输入框上方停靠区（群归属待处理项）与聊天条（群内后台任务、电脑操作请求、成员失败修复）、输入框支持 @ 成员补全（名册浮层键盘操作、多提及）；群聊作答与操作（停止、目标、任务停止、电脑请求作答）经 /api/bot 提交并经 feed 同步；私聊不显示群里接的任务；群聊占位（「群聊内容将在后续版本提供」）移除
    scenarios:
      group-chat-open:
        - GIVEN: 侧栏选中一个群且群内有轮次与待处理项
        - WHEN: 打开群聊
        - THEN: 内容区渲染群轮次与停靠区，头部显示运行成员与目标条，无占位文案
      mention-multi:
        - GIVEN: 群聊输入框聚焦且群有多名成员
        - WHEN: 输入 @ 选择两名成员再发送
        - THEN: 两条 @提及 随消息提交，被提及成员并行开工，回复实时呈现不重复
