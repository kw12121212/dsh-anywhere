schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: app-identity
  title: 应用身份
requirements:
  about-shows-name-and-version:
    strength: MUST
    statement: 应用菜单提供“关于 DSH Anywhere”命令，打开后显示应用显示名称 DSH Anywhere 与当前版本号：版本号在构建期取自 package.json 的 version（唯一版本来源），发布构建与未打标签的本地构建显示同一 package.json 版本号，不再区分 dev。
    scenarios:
      about-shows-package-version:
        - GIVEN: 以 package.json version 为 1.0.0 的提交构建的应用正在运行
        - WHEN: 用户选择应用菜单中的“关于 DSH Anywhere”
        - THEN: 对话框同时显示名称 DSH Anywhere 与版本号 1.0.0
      about-version-matches-artifacts:
        - GIVEN: 维护者以 v1.0.0 标签发布该提交
        - WHEN: 对照关于页、安装包文件名与 GitHub Release
        - THEN: 三处版本号同为 1.0.0
      about-keeps-current-page:
        - GIVEN: 主窗口正在显示 harness 页面
        - WHEN: 用户打开并关闭“关于 DSH Anywhere”
        - THEN: 主窗口仍显示同一页面，配置文件与窗口状态不变
  window-title-shows-display-name:
    strength: MUST
    statement: 主窗口标题栏显示应用显示名称 DSH Anywhere，而不是内部名称 dsh-anywhere。
    scenarios:
      main-window-title:
        - GIVEN: 应用已启动
        - WHEN: 主窗口显示初始化界面或 harness 页面
        - THEN: 窗口标题栏显示 DSH Anywhere，不显示 dsh-anywhere
  unified-packaging-identity:
    strength: MUST
    statement: 三平台构建产物使用同一应用身份：显示名称 DSH Anywhere、包标识 work.keepwriting.dsh-anywhere，并与定稿的公司、版权文案及项目图标源保持一致；Linux 桌面菜单条目的显示名称同为 DSH Anywhere，且构建资源中不再出现 Wails 脚手架占位值。
    scenarios:
      macos-bundle-metadata:
        - GIVEN: 运行 wails3 update build-assets 后重新生成的 macOS 构建资源
        - WHEN: 检查应用包元数据 Info.plist 与 Info.dev.plist
        - THEN: 应用名称为 DSH Anywhere、包标识为 work.keepwriting.dsh-anywhere、版权与描述为定稿文案，且不含 My Product 或 com.example.dshanywhere 等占位值
      windows-metadata:
        - GIVEN: 重新生成的 Windows 构建资源
        - WHEN: 检查 windows/info.json 与 NSIS 安装器定义
        - THEN: ProductName 为 DSH Anywhere，公司、版权与描述为定稿文案，且不含占位值
      linux-package-metadata:
        - GIVEN: 重新生成的 Linux 构建资源，以及构建任务生成的桌面条目
        - WHEN: 检查 linux/nfpm/nfpm.yaml 与构建生成的 build/linux/dsh-anywhere.desktop
        - THEN: 包名仍为 dsh-anywhere、描述与 vendor 为定稿文案，桌面条目 Name 为 DSH Anywhere 且 Exec 指向 dsh-anywhere
      app-icons-from-project-source:
        - GIVEN: 已替换的项目图标源
        - WHEN: 生成 macOS icons.icns 与 Windows icon.ico
        - THEN: 图标资源由项目图标源生成，不再是 Wails 默认图标
