schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: android-dsbot
  title: 原生 DS-Bot 界面
requirements:
  native-nav-skeleton:
    strength: MUST
    statement: App 主界面为原生 Compose 导航骨架：团队页为根页面，从团队页可进入私聊页、群聊页与详情面板（骨架占位，内容由后续变更填充），顶部提供设置入口；系统返回键按原生导航后退（聊天页回团队页、团队页退出 App），不依赖也不加载任何远程网页。
    scenarios:
      'nav-back-stack:':
        - GIVEN: App 已连接并显示团队页骨架
        - WHEN: 进入一个私聊页后按系统返回键
        - THEN: 回到团队页骨架；在团队页再按返回键退出 App（系统默认行为）
      'settings-entry-reachable:':
        - GIVEN: 任意骨架页面显示中
        - WHEN: 点击设置入口
        - THEN: 打开既有设置页，返回后回到原骨架页面
  connection-status-bar:
    strength: MUST
    statement: 原生骨架顶部显示全局连接状态条：初次连接显示「连接中」，feed 订阅且同步完成后显示在线（或收起为不干扰内容的最小形态），断开后显示「已断开，正在重连」并按指数退避重连，回到前台或恢复后自动补齐期间的 state 变化；连接状态条不遮挡页面操作。
    scenarios:
      'online-after-sync:':
        - GIVEN: App 启动且 harness 可达、会话有效
        - WHEN: feed 订阅并完成一次 state 同步
        - THEN: 状态条显示在线（或收起），团队页骨架可用
      'reconnect-banner:':
        - GIVEN: 在线状态下 harness 服务停止
        - WHEN: feed 断开
        - THEN: 状态条显示已断开并在后台按退避重连；服务恢复后状态条回到在线且期间的状态变化被补齐
  version-banner:
    strength: MUST
    statement: 连接建立时读取远端 DS-Bot 与 dsh 版本（update-check 的 value.current 与 value.dsh.current）并与已测基准（DS-Bot 0.3.10 与同期实测的 dsh 版本）比对：不一致时显示版本提示条说明远端版本与基准不一致、部分功能可能不可用，提供不再提示本次的关闭；一致或读不到版本（UNKNOWN）时不按版本提示（能力握手协商不出共同 api 版本时另按 capability-handshake 提示）；版本不一致时既有聊天功能仍尽力可用。
    scenarios:
      mismatch-shows-banner:
        - GIVEN: 远端 DS-Bot 版本为 0.4.0
        - WHEN: 连接建立完成
        - THEN: 显示版本提示条且包含不一致说明；点击关闭后本次连接期内不再显示
      unknown-no-banner:
        - GIVEN: 远端版本字段缺失（读不到版本）
        - WHEN: 连接建立完成
        - THEN: 不显示版本提示条
      baseline-no-banner:
        - GIVEN: 远端 DS-Bot 为 0.3.10 且 dsh 为已测同期版本
        - WHEN: 连接建立完成
        - THEN: 不显示版本提示条
      older-banner-still-usable:
        - GIVEN: 远端 DS-Bot 为 0.3.6
        - WHEN: 连接建立完成后进入私聊并发送消息
        - THEN: 显示版本提示条，私聊、群聊、交互卡片与附件仍照常可用
  native-error-page:
    strength: MUST
    statement: harness 不可达时原生骨架显示本地连接错误页：展示不含 token 的干净地址与按原因分类的说明（无法解析主机名、连接被拒绝、连接超时、安全连接失败），提供「重试」与「修改地址」按钮；重试恢复可达时回到团队页骨架；错误发生时按 diagnostics-reporting 规格产生错误态报告（不含 API 载荷与聊天内容）。
    scenarios:
      'unreachable-error-page:':
        - GIVEN: 已保存地址的服务已停止
        - WHEN: 启动 App 或点击重试
        - THEN: 显示本地错误页（干净地址、原因说明、重试与修改地址按钮），不显示首次设置页
      'retry-recovers-native:':
        - GIVEN: 错误页显示后服务恢复
        - WHEN: 点击重试
        - THEN: 回到团队页骨架，状态条进入连接中并在线
  team-page-list:
    strength: MUST
    statement: 团队页显示 Bot 与群聊的分组列表：每个条目显示名称（超长截断）与工作/空闲状态点；预览、置顶与分组、Main/私有标记等字段在远端返回时显示、缺失时降级为不显示（条目仍在列表中，头像以颜色圈呈现）；每个分组内 Main Bot 排在最前，其余按置顶优先、最近活动时间（lastAt）新到旧排序，无 lastAt 的排后、名称兜底；未读由本机已读状态计算（见 team-read-state），远端 unread 字段不作为依据；feed 的团队变更事件自动刷新列表，工具栏刷新入口手动重取全量；空团队显示首次创建引导（创建第一个 Chief）。
    scenarios:
      list-matches-web:
        - GIVEN: 已连接团队，远端 state 含分组与条目字段
        - WHEN: 进入团队页
        - THEN: 分组结构与条目按返回数据渲染，返回了预览/置顶字段时对应显示，字段缺失时条目仍显示且不崩溃，与 DS-Bot 网页端同源数据的呈现一致
      empty-team-guide:
        - GIVEN: 远端团队为全新空团队
        - WHEN: 进入团队页
        - THEN: 显示首次创建引导（创建第一个 Chief），不显示空白列表
      fields-missing-degrade:
        - GIVEN: 远端 state 的条目缺 preview/lastAt/pinned 字段
        - WHEN: 团队页渲染
        - THEN: 条目正常显示名称与状态，摘要/未读点/置顶不显示，无错误或空白页
      main-bot-first:
        - GIVEN: 同一分组里有 Main Bot、置顶 Bot 与最近活动更新的普通 Bot
        - WHEN: 团队页渲染
        - THEN: Main Bot 排第一，其次置顶 Bot，其余按最近活动新到旧排列
  team-search:
    strength: MUST
    statement: 团队页提供搜索框：按名称与最近消息内容过滤当前列表条目，输入即时过滤、清空恢复完整列表；搜索不改变分组与排序结构，无结果时显示无匹配提示。
    scenarios:
      'search-filters:':
        - GIVEN: 团队页显示完整列表
        - WHEN: 输入某 Bot 名称片段
        - THEN: 列表只剩名称或摘要含该片段的条目，结构仍按分组；清空输入后恢复完整列表
  needs-you-summary:
    strength: MUST
    statement: 团队页顶部提供「需要你」入口并显示待处理计数：汇总所有等待用户处理的审批、ask_user 提问与交互卡片；打开汇总页逐项显示类型与摘要（有来源会话时显示会话标识），点击条目跳转到对应聊天位置；无待处理时入口不显示计数。
    scenarios:
      'needs-you-jump:':
        - GIVEN: 一个 Bot 发起了 ask_user 提问
        - WHEN: 打开需要你汇总并点击该条目
        - THEN: 进入该 Bot 的聊天页（本变更内为对应会话的骨架跳转），返回后计数减少
  bot-chat-render:
    strength: MUST
    statement: 私聊页按 DS-Bot 网页端语义渲染聊天条目（群聊消息经共用渲染组件同样适用）：用户与 Bot 消息气泡、Markdown（标题、列表、表格、代码块可复制）、链接在段落、列表与标题行中均可点击——http(s) 链接交给系统浏览器，服务器本地文件路径链接由应用取回文件内容后交系统应用打开，长按链接可经「选择打开方式」选择器另选应用，打开失败给出可读原因；点按气泡复制整条消息，长按气泡弹出「复制整条 / 选择文字」菜单，选择文字进入全屏阅读器在其中选择并复制部分内容；工具调用以折叠卡显示、分段边界与 checkpoint 不产生可见分隔（显示为一条连续聊天）、消息中的图片引用（含用户消息的 imageRefs）显示为图片条目并可点开查看、Bot 交付的文件（files）显示为文件条目；未知语法或字段降级为纯文本不崩溃；向上滚动加载更早记录（分页），历史不足时提示已到最早。
    scenarios:
      file-link-in-list-opens:
        - GIVEN: 群聊/私聊消息的 Markdown 列表行含指向服务器本地路径的文件链接（Bot 汇报常见形态）
        - WHEN: 点击该链接
        - THEN: 应用经服务器取回文件内容并交系统应用打开（PDF 出查看器、视频出播放器），失败时显示可读原因，不崩溃
      link-chooser-open:
        - GIVEN: 消息内存在可点击链接（段落或列表行）
        - WHEN: 长按链接
        - THEN: 弹出「选择打开方式」选择器，选定应用后打开
      text-select-copy:
        - GIVEN: 任一消息气泡显示中
        - WHEN: 长按气泡并选「选择文字」
        - THEN: 进入全屏阅读器，可选中部分文字复制；点按气泡仍复制整条消息
      long-press-copy-whole:
        - GIVEN: 任一消息气泡显示中
        - WHEN: 长按气泡并选「复制整条」
        - THEN: 整条消息复制到剪贴板并提示
  bot-chat-send-stream:
    strength: MUST
    statement: 私聊底部输入框发送文字消息（send 端点，纯文本；Enter 行为遵循团队偏好）：Bot 回复经 feed 的 stream 事件逐字追加到正在写的气泡，stream end 后由 message 事件定格为完整条目，与 DS-Bot 网页端同一会话显示的内容一致；发送失败不自动重试（不重复发送），消息保留为「未发送，点按重试」，由用户手动重试或删除（见 chat-outbox）。
    scenarios:
      send-streams-reply:
        - GIVEN: 私聊页已打开、Bot 空闲
        - WHEN: 输入文字并发送
        - THEN: 用户消息立即出现，Bot 回复逐字流式追加并定格，内容与网页端一致
      send-fail-no-auto-retry:
        - GIVEN: 网络中断
        - WHEN: 发送消息失败
        - THEN: 消息显示「未发送，点按重试」，App 不自动重试、不重复发送
  bot-chat-work-control:
    strength: MUST
    statement: 私聊页提供停止 Bot 当前工作的入口（stop/abandon 语义）：停止后网页端同步显示已停止；中断的 Bot 可从私聊页恢复（resume）；提供新开分段（bot-new-part）与打开旧分段（bot-open-part）入口，分段切换后聊天显示对应分段条目；聊天页可查看运行统计（run-stats）与 Bot 之间的消息记录（exchange）。消息引用的文件文本（file-text）与记录文本详情（exchange-text）在 0.3.x 未观测到实样本，移交附件里程碑（dsbot-attachments）实测后接入。
    scenarios:
      'stop-works:':
        - GIVEN: Bot 正在工作中
        - WHEN: 点击停止
        - THEN: Bot 停止工作（网页端同步显示已停止），聊天不再追加
      'parts-switch:':
        - GIVEN: Bot 有多个分段
        - WHEN: 打开旧分段
        - THEN: 聊天切换显示该分段条目，可切回当前分段
  attachments-send:
    strength: MUST
    statement: 私聊输入区提供附件入口：从系统相册、相机与文件选择器选取图片或文件，发送前以缩略图/文件条目预览并可移除；附件先经 uploadFileBinary 上传（进行中与失败态可见、失败给出可读原因且可单件重试），receipt 齐备后与输入文本一起作为带附件消息提交（纯文本消息仍走 send 不变）；发送后用户消息立即上屏，回显与 Bot 回复照常经 feed 呈现；附件字节只经与 API 相同的分流路径传输，不写入任何日志
    scenarios:
      attach-send-works:
        - GIVEN: 私聊页已打开且会话就绪
        - WHEN: 选取一张图片与一个文件、输入文字并发送
        - THEN: 附件栏显示预览与上传状态，上传完成后消息提交，用户消息（含附件引用）上屏，Bot 回复经流式/事件呈现，与网页端同一会话一致
      attach-upload-fails:
        - GIVEN: 网络中断或服务端拒绝（超过大小限制等）
        - WHEN: 附件上传失败
        - THEN: 该附件显示失败原因，消息不发出，可重试该附件或移除后仅发文本，不自动重试
  attachments-view:
    strength: MUST
    statement: 聊天中的图片与文件附件可点开查看：图片全屏查看，文件交给系统查看器打开；提供保存（图片存入系统相册、文件经系统文件保存器）；查看与保存经 readAttachment 会话接口取回字节，失败给可读提示；附件内容不写入日志
    scenarios:
      attach-view-open:
        - GIVEN: 聊天含图片或文件附件条目
        - WHEN: 点击附件
        - THEN: 图片全屏显示或文件经系统查看器打开，字节经会话接口取回，内容不落日志
      attach-save:
        - GIVEN: 正在查看附件
        - WHEN: 选择保存
        - THEN: 图片出现在系统相册或文件经保存器落盘，成功失败均有提示
  group-chat:
    strength: MUST
    statement: 群聊页按 DS-Bot 网页端语义渲染与交互：成员消息带名称与颜色标识（成员 [PASS] 事件不可见）、群公告、运行中成员与逐成员停止入口；输入 @ 弹出成员名册（来自群成员 Bot）插入提及，同一消息可 @ 多个成员；可停止群内全部（stop-room-work）或单个成员（stop-member-work）的工作；群目标提供草稿提交与控制操作入口（goal-draft/goal-control，0.3.x 阶段/任务/证据视图数据源未实测，视图按服务端应答可读降级呈现）；room-progress 显示成员工作进度；流式回复与新消息经 feed 实时更新（多成员并行时流式仅作提示、条目以 message 事件落定去重）；与私聊共用条目渲染组件，未知字段降级不崩溃。管理员/回复模式标识与「引用一个聊天」的结构化提交字段在 0.3.x 未观测到实样本：引用以消息内文本标注近似（Bot 可读但无机器可读上下文），管理员标识暂缺——两项移交后续版本实测补齐（已在 questions 登记）
    scenarios:
      group-messages-render:
        - GIVEN: 群聊含多成员消息与 [PASS] 事件
        - WHEN: 从团队页进入群聊
        - THEN: 成员消息带名称颜色渲染，[PASS] 不可见，公告与网页端一致，无崩溃
      mention-and-reference:
        - GIVEN: 群聊页已打开且群有成员
        - WHEN: 输入 @ 从成员名册选择（可多个）后发送（如需引用另一聊天，以文本标注附上）
        - THEN: 提及随消息提交，被 @ 成员并行开工，回复经 message 事件实时呈现且不重复
      room-work-and-goal:
        - GIVEN: 群内有成员工作且群有目标
        - WHEN: 停止群/单个成员工作、提交目标草稿或执行控制操作、查看进度
        - THEN: 工作停止（网页端同步）、目标操作生效且有可读反馈，room-progress 反映成员进度或明确提示无工作
  interactive-cards:
    strength: MUST
    statement: 聊天中的交互卡片按 DS-Bot 网页端语义原生呈现：DS-Bot 0.3.10 中等待用户处理的工具审批、ask_user 提问、show_view 卡片、密钥请求、学习审批、连接器请求与浏览器交接来自团队状态，在输入框上方的待处理停靠区作答（见 pending-dock），作答参数与网页端一致；聊天记录里的已回答条目（用户对提问、卡片或交接给出的回复）按只读「已回答」形态呈现，不再作答；已关闭（closed）条目按只读已处理形态呈现；多问题条目（questions[] 复数）标注数量并引导网页端逐个处理；沙箱 HTML 卡片只在禁网络、禁止导航与无本地接口的隔离视图中显示；Bot 内容不可信：卡片做格式校验、嵌套深度与大小上限，超限或未知类型降级为只读文本不崩溃；密钥输入不回显、值不进日志与诊断上报；作答成功后该项从停靠区移出并与网页端同步；手机不充当 Bot 浏览器宿主
    scenarios:
      cards-answer-sync:
        - GIVEN: 团队状态中有待处理的审批或提问
        - WHEN: 在停靠区作答（允许/选选项/提交）
        - THEN: 作答提交成功、该项从停靠区移出、团队页待办提示同步消失，与网页端状态一致
      answered-record-readonly:
        - GIVEN: 聊天记录里有一条已回答的提问
        - WHEN: 打开该聊天
        - THEN: 该条目显示为「已回答：问题」与所选答案，不出现可作答的按钮，也不进入停靠区
      cards-degrade-sandbox:
        - GIVEN: 聊天含畸形/超限/未知类型卡片、已关闭卡片、多问题条目或沙箱 HTML 卡
        - WHEN: 渲染该卡片
        - THEN: 畸形/超限/未知降级为只读文本不崩溃；已关闭条目只读呈现；多问题条目标注数量引导网页端处理；沙箱 HTML 在禁网络/禁导航/无本地接口的隔离视图显示
  side-chat:
    strength: MUST
    statement: 私聊页提供 Side chat 旁路提问：从更多入口或 /side 输入打开侧问面板（底部抽屉或独立页）——side-new 新建旁路会话、side-ask 提问（可附最近消息快照，不运行工具不打断 Bot 工作）、side-cancel 取消进行中回答、side-close 关闭；Side chat 不接受附件（与网页端提示一致）；回答流式显示，切换聊天或进入后台再回来仍可见进行中回答状态；btw 卡片（插话引用）在聊天中显示并可删除（btw-delete），删除后与网页端同步消失
    scenarios:
      side-ask-streams:
        - GIVEN: 私聊页已打开且 Bot 可能有工作
        - WHEN: 打开侧问面板提问（附最近消息快照）
        - THEN: 旁路回答流式显示不打断主聊天，切换聊天或后台返回后进行中状态保留，取消/关闭生效
      btw-card-delete:
        - GIVEN: 聊天含 btw 卡片
        - WHEN: 查看并删除该卡片
        - THEN: 卡片显示插话内容与来源，删除后本地消失且与网页端同步
  capability-handshake:
    strength: MUST
    statement: 连接建立时读取远端 DS-Bot 的能力声明（hello 的 api 版本与 capabilities 名单）；断线重连后若远端已重启或更换插件（feed 首帧 hello 的 boot 与读取时不同，或不再携带 boot），重新读取版本与能力声明，同一次服务运行内的重连沿用已读结果：远端未声明的能力判为不可用，依赖它的新功能入口隐藏而不是出错；远端不支持能力声明（0.3.6 及更早）时，所有依赖能力声明的新功能判为不可用，既有私聊、群聊、交互卡片、附件与 Side chat 入口不受影响；远端 api 版本高于 App 支持的版本或协商不出共同版本时按版本不一致处理（即使读不到版本号也显示版本提示条，并尽力可用）。
    scenarios:
      legacy-remote-keeps-existing:
        - GIVEN: 远端为 DS-Bot 0.3.6（不支持 hello）
        - WHEN: 连接建立完成
        - THEN: 新功能入口全部隐藏，既有私聊、群聊、卡片、附件与 Side chat 入口照常显示与使用
      undeclared-capability-unavailable:
        - GIVEN: 远端 hello 的 capabilities 不含某项新功能的能力名
        - WHEN: 连接建立完成后 App 判定该能力
        - THEN: 该能力判为不可用（依赖它的入口由提供该入口的功能变更负责隐藏），不出现错误提示；名单中声明的能力判为可用
      restart-rereads:
        - GIVEN: 已连接并读取过能力声明
        - WHEN: 服务重启（boot 变化）或回退到不支持能力声明的版本后 App 重连
        - THEN: 重新读取版本与能力声明，能力判定与版本提示条按新结果更新；未重启的普通断线重连不重复读取
      incompatible-api-banner:
        - GIVEN: 远端 hello 协商不出 App 支持的 api 版本
        - WHEN: 连接建立完成
        - THEN: 显示版本提示条，所有依赖能力声明的新功能判为不可用，既有聊天功能照常可用
  model-repair-card:
    strength: MUST
    statement: Bot 因只有用户能修复的模型失败（缺 API key、key 格式不对、key 被拒、额度或余额不足、DeepSeek 账号登录失效、本地 Agent 缺失/未登录/额度/异常退出）被阻塞时，私聊页显示修复卡：可读的原因（含服务商名称与状态码，若有）与修复指引——缺 API key、key 格式不对与 key 被拒时指引在 App 的「模型与服务商」页填写或更换 key（或在 Bot 详情改用其他模型），并提供直达该页的按钮；其他服务商额度不足时指引到该服务商充值或改用其他模型；DeepSeek 账号登录失效指引到电脑网页端重新登录，本地 Agent 问题指引到运行 dsh 的电脑处理；DeepSeek 官方服务额度不足或 DeepSeek 账号余额不足时提供「去充值」链接经系统浏览器打开；修复卡提供「重试」（resume），重试后以服务端推送状态为准；未知失败代码显示通用说明；修复卡与日志不显示或记录任何密钥内容。
    scenarios:
      missing-key-card:
        - GIVEN: Bot 的模型没有配置 API key，上一轮因此失败
        - WHEN: 打开该 Bot 的私聊页并点修复卡上的「去模型与服务商」
        - THEN: 修复卡说明该 Bot 的模型还没有 API key 并指引在模型与服务商页填写；点按后打开模型与服务商页；修复卡提供重试
      quota-topup-link:
        - GIVEN: Bot 使用 DeepSeek 官方服务且余额不足被阻塞
        - WHEN: 在修复卡上点按「去充值」
        - THEN: 系统浏览器打开 DeepSeek 充值页
  group-goal-bar:
    strength: MUST
    statement: 群聊页在群有进行中的目标（起草中、进行中、已暂停）时在顶部显示群目标条：目标标题、状态，以及阶段进度（第 N/M 阶段与当前阶段标题、进度条按已通过阶段数）；起草中尚无阶段时只显示标题与「起草中」；目标已完成或已停止、或远端未返回目标数据时不显示；点按目标条打开既有目标操作对话框。
    scenarios:
      goal-stage-progress:
        - GIVEN: 群目标进行中，共 4 个阶段，前 1 个已通过，第 2 阶段进行中
        - WHEN: 打开该群聊页
        - THEN: 顶部显示目标标题与「第 2/4 阶段」及第 2 阶段标题，进度条反映 1/4 已通过
  work-phrase:
    strength: MUST
    statement: Bot 工作中时，私聊页的工作指示旁显示工作短语，群聊页运行中成员显示各自工作短语：Bot 自己说明在做什么时显示其说明，否则按正在使用的工具显示对应短语（如联网搜索、阅读网页、运行命令、打开文件、查找文件、写入修改、使用电脑、询问其他 Bot、查看记忆），有操作对象时附「· 对象」，未知工具显示通用短语，没有工具时显示「思考中」；工作指示带轻量动效，系统关闭动画时改为静态显示；远端未返回工作详情时只显示原有工作指示。
    scenarios:
      phrase-by-tool:
        - GIVEN: Bot 正在用联网搜索工具且未自述
        - WHEN: 查看私聊页工作指示
        - THEN: 显示「联网搜索」类短语
      reduced-motion-static:
        - GIVEN: 系统设置关闭了动画（动画时长缩放为 0）
        - WHEN: Bot 工作中
        - THEN: 工作指示与短语静态显示，不播放动效
  chat-task-bar:
    strength: MUST
    statement: 私聊页在 Bot 有活动中的后台任务（运行中、等待审批、等待交接）时，在输入框上方显示后台任务条：只含该 Bot 在私聊里接的任务（Bot 在群里接的任务不在私聊显示，与网页端一致），显示任务数量，展开后逐个显示任务标题与状态（等待审批的排在最前，其余按最近更新排序；任务多时展开区域限高可滚动），每个任务提供停止按钮（bot-stop-task）；点按停止后该按钮立即禁用直到请求结束，成功后以服务端推送的状态为准移除该任务并与网页端同步，失败显示可读提示；已结束的任务不显示；远端未返回任务数据时不显示任务条。
    scenarios:
      task-stop-one:
        - GIVEN: Bot 有两个运行中的后台任务
        - WHEN: 在私聊页展开任务条并停止其中一个
        - THEN: 该任务从任务条消失且网页端显示已停止，另一个任务仍在任务条中运行
      no-tasks-no-bar:
        - GIVEN: Bot 没有活动中的后台任务，或远端为 0.3.6 不返回任务数据
        - WHEN: 打开该 Bot 的私聊页
        - THEN: 不显示任务条，页面与原来一致
      group-task-not-in-private:
        - GIVEN: Bot 只有一个在群里接的后台任务
        - WHEN: 打开该 Bot 的私聊页
        - THEN: 私聊页不显示任务条
  computer-use-request:
    strength: MUST
    statement: Bot 请求操作电脑上的某个应用时，对应私聊页（群内请求则在对应群聊页）显示电脑操作请求卡：显示应用名（群内显示发起成员），提供「拒绝」「本次允许」「总是允许」三个作答（computer-app-answer 的 deny/once/always），点按后该卡按钮立即禁用直到请求结束，作答后卡片以服务端推送状态消隐并与网页端一致；同时有多个请求时最多展开两张、其余显示数量提示，作答后下一张补上；请求已被其他端处理时卡片随刷新消失，失败显示可读提示；Bot 正在操作电脑时私聊页提供「停止操作电脑」入口（computer-stop）；远端未返回电脑操作数据时不显示。
    scenarios:
      computer-answer-once:
        - GIVEN: Bot 请求操作某应用，私聊页显示请求卡
        - WHEN: 点按「本次允许」
        - THEN: 请求按本次允许提交，卡片消失，网页端同一请求同步消失
      computer-stop:
        - GIVEN: Bot 正在操作电脑
        - WHEN: 点按「停止操作电脑」
        - THEN: Bot 停止操作电脑，入口随状态刷新消失
  new-messages-jump:
    strength: MUST
    statement: 在私聊与群聊中离最新消息较远（约 600dp 以上）时，消息列表右下显示「回到最新」按钮；此期间有新消息到达时按钮显示「N 条新消息」（N 为离开底部后新到的条数）；点按后滚动到最新并清零；停在底部附近时不显示按钮，新消息照常显示。
    scenarios:
      count-new-while-away:
        - GIVEN: 在私聊中向上翻看到较早的消息
        - WHEN: Bot 连续发来 2 条新消息
        - THEN: 右下按钮显示「2 条新消息」，点按后滚到最新且按钮消失
  last-chat-prefetch:
    strength: SHOULD
    statement: App 记住上次打开的聊天（只保存聊天标识，不保存内容）；下次启动连接成功后在后台预先读取该聊天首页，启动仍停在团队页、不自动跳转，进入该聊天时立即显示预取内容并在后台刷新。
    scenarios:
      prefetch-on-launch:
        - GIVEN: 上次退出前最后打开的是 Bot A 的私聊
        - WHEN: 重新启动 App 并连接成功后进入 A
        - THEN: 启动停在团队页；进入 A 时立即显示内容，无加载空白
  foreground-fallback-poll:
    strength: MUST
    statement: App 在前台且已连接时每 15 秒兜底同步一次团队状态并刷新当前打开的聊天（流式输出进行中只同步状态），以补齐实时推送遗漏的变化；兜底同步的网络失败不改变连接状态、不提示错误（会话失效仍按 dsh 会话规则提示重新认证）；App 进入后台后不再发起兜底同步，回到前台时先重新探测连接再补齐。
    scenarios:
      poll-fills-gap:
        - GIVEN: 前台停在某私聊，实时推送漏掉了一条新消息
        - WHEN: 等待不超过 15 秒
        - THEN: 该消息出现在聊天中，期间无错误提示
  chat-cache-fast-switch:
    strength: MUST
    statement: 进入最近打开过的私聊或群聊（最近 16 个，包括刚离开又回到同一个聊天）时立即显示上次离开时的内容与滚动位置，同时在后台刷新：刷新结果没有变化时列表保持不动，有变化时更新列表且未变的消息不闪动；已加载的更早记录在刷新与新消息到达后仍保留，只有新的最新一页与当前列表无法衔接时才重置为最新一页（需要时重新上翻）；刷新期间不清空正在流式输出的回复；同一聊天的重复刷新不并发；一个聊天的慢读取不阻塞进入其他聊天时的缓存显示，离开后才到达的旧读取结果不会覆盖当前聊天；会话确认前发送提示稍候，不会发到可能已过期的会话；切换分段后该 Bot 的缓存失效、旧分段的在途读取作废并按新分段重新加载（新分段为空时显示为空）；聊天内容只保存在内存，按返回键退出 App 界面或进程结束后不保留（下次启动只预取上次打开的聊天）；首次进入（无缓存）时加载完成后显示最新消息。
    scenarios:
      switch-back-instant:
        - GIVEN: 先后打开过 Bot A 与 Bot B 的私聊，在 A 中滚动到中间位置后切到 B
        - WHEN: 从 B 返回团队页再进入 A
        - THEN: A 立即显示上次内容并停在离开时的位置，无加载空白；后台刷新到新消息时列表更新
      stale-result-dropped:
        - GIVEN: 进入 A 后网络很慢，A 的读取尚未返回
        - WHEN: 立即切换到有缓存的 B
        - THEN: B 立即显示自己的缓存内容，A 的读取返回后不会覆盖 B 的列表
      earlier-kept-after-new-message:
        - GIVEN: 在私聊中已加载两页更早记录并停在其中阅读
        - WHEN: Bot 发来新消息且之后发生后台刷新
        - THEN: 已加载的更早记录仍在，阅读位置不跳走
      empty-new-part:
        - GIVEN: 私聊显示着当前分段的消息
        - WHEN: 新开一个分段（新分段尚无消息）
        - THEN: 列表变为空，不再显示旧分段的消息
  in-app-notice-banner:
    strength: MUST
    statement: 远端声明支持提醒（hello capabilities 含 notices）时，App 在前台且已连接期间，任一非当前打开聊天里的 Bot 发起提问、请求审批、回复、在群里发消息或完成任务，顶部显示约 8 秒的应用内横幅（来源名称、类型与摘要），点按进入对应 Bot 或群聊天；同时到来多条时只显示最新一条；当前打开的聊天不弹横幅；同一 dsh 运行期间断线重连后补齐断线期间的提醒（只显示最新一条），不重复显示已到达过的提醒；首次连接或 dsh 重启后不补弹历史提醒，改为重新获取整体团队状态；远端不支持提醒时不显示横幅、其余功能照常；横幅文本不写入日志与诊断上报。
    scenarios:
      banner-other-chat:
        - GIVEN: 停在 Bot A 的私聊中
        - WHEN: Bot B 发起提问
        - THEN: 顶部出现约 8 秒的横幅显示 B 与提问摘要，点按进入 B 的聊天；8 秒内未点按则自动收起
      no-repeat-after-restart:
        - GIVEN: 已经显示过若干横幅
        - WHEN: dsh 重启后 App 自动重连
        - THEN: 不重复弹出已显示过的横幅，团队页按重新获取的整体状态显示
      current-chat-no-banner:
        - GIVEN: 停在 Bot A 的私聊中
        - WHEN: Bot A 回复
        - THEN: 不显示横幅，回复照常出现在聊天中
  notice-banner-toggle:
    strength: MUST
    statement: 设置页提供「应用内提醒」开关，默认开启，保存在本机并跨重启保留；关闭后不再显示任何应用内提醒横幅，重新开启后恢复。
    scenarios:
      toggle-off:
        - GIVEN: 设置页关闭了「应用内提醒」
        - WHEN: 非当前聊天的 Bot 发起提问
        - THEN: 不显示横幅；强杀重开后开关仍为关闭
  photo-compress:
    strength: SHOULD
    statement: 选择或拍摄的照片作为附件上传前，长边超过 2048 像素时等比缩小并以适中质量重新压缩，方向按照片的拍摄方向校正；长边不超过 2048 的照片、PNG 截图与 GIF 动图以及非图片文件原样上传。
    scenarios:
      large-photo-shrinks:
        - GIVEN: 选择一张 4000×3000 的相机照片
        - WHEN: 加入附件并上传
        - THEN: 上传的图片长边为 2048、方向正确，体积明显小于原图
  chat-outbox:
    strength: MUST
    statement: 私聊与群聊（含带附件的消息）发送后输入框立即清空，消息以「发送中」出现在聊天末尾；服务端出现对应的用户消息后该本地行由正式消息取代、不重复显示；请求已成功但服务端消息尚未对上时显示「已发送，等待确认」并可删除；发送失败的消息显示「未发送，点按重试」与「删除」，点按重试只重新发送一次（重试进行中不能再次点按），删除即丢弃；未送达与等待确认的消息按聊天保留，切换到其他聊天再回来仍在；失败的消息若实际已送达，服务端消息出现后本地行同样消失，不会因重试产生重复；聊天里早前已有的相同文字不会被误当成新消息的确认；App 从不自动重发；网页端等其他设备在私聊中发出的消息也实时出现；发送成功时给一次轻触感反馈。
    scenarios:
      offline-retry-once:
        - GIVEN: 断网后在私聊发送一条消息
        - WHEN: 消息显示「未发送，点按重试」后切到别的聊天再回来，恢复网络后点按重试
        - THEN: 该消息仍在，重试只发出一次，网页端同一会话只出现一条该消息，本地行随服务端消息出现而消失
      delete-failed:
        - GIVEN: 一条消息显示「未发送，点按重试」
        - WHEN: 点按删除
        - THEN: 该消息从聊天中消失且不会被发送
      same-text-twice:
        - GIVEN: 聊天中早前已有一条「好的」
        - WHEN: 快速连续发送两条「好的」
        - THEN: 两条都先显示发送中，服务端两条消息出现后两条本地行各被取代一次，不多不少
      group-confirm:
        - GIVEN: 群聊里早前已有一条「开工」
        - WHEN: 在群里再发一条「开工」
        - THEN: 本地行在服务端新消息出现后消失，不会被早前那条误当成确认
      unconfirmed-delete:
        - GIVEN: 消息已发出但服务端消息迟迟没有对上
        - WHEN: 查看该消息
        - THEN: 显示「已发送，等待确认」并可删除，App 不自动重发
  learning-approval-diff:
    strength: MUST
    statement: 学习审批在停靠区显示提案名称、理由与逐行差异（新增行与删除行用不同颜色区分，超过 8 行时折叠并可展开）：更新已有技能时对比原内容与新内容，新建技能显示为全部新增，修改 AGENTS.md 时逐条显示删除与新增的文字；提供同意与拒绝，作答后与网页端同步。
    scenarios:
      learning-diff-shown:
        - GIVEN: Bot 提议更新一个已有技能
        - WHEN: 在停靠区展开该学习审批
        - THEN: 看到删除行与新增行的差异，较长时折叠；点同意后审批移出且网页端同步
  connector-request-card:
    strength: MUST
    statement: Bot 请求接入某个连接器时，停靠区显示连接器请求卡（连接器名称与用途），提供「取消」以拒绝该请求并与网页端同步，提供「去连接」直达该连接器的详情页（请求邮箱时直达邮箱页）；远端 state 不含连接器视图时「去连接」提示用户到电脑上的网页端完成。
    scenarios:
      connector-cancel:
        - GIVEN: Bot 请求接入邮箱连接器
        - WHEN: 在停靠区点按取消
        - THEN: 请求卡移出，网页端显示该请求已取消
      connector-go-connect:
        - GIVEN: Bot 请求接入某个未连接的 OAuth 连接器
        - WHEN: 在停靠区点按去连接并完成登录
        - THEN: 打开该连接器的详情页；连接成功后请求卡自动移出，Bot 收到已连接的通知
  pending-dock:
    strength: MUST
    statement: 私聊与群聊在输入框上方提供待处理停靠区：汇集当前聊天（私聊为当前显示的分段，群聊为群会话及成员的群内会话）中等待用户处理的学习审批、工具审批、提问、密钥请求、连接器请求、邮件发送确认、浏览器交接与交互卡片，按「学习/审批 → 提问 → 密钥/连接器/邮件 → 交接 → 卡片」排序；同一时刻只展开一项，首次显示时展开第一项，之后新出现的项不打断正在填写的那项，展开项作答成功移出后自动展开下一项，点按已展开项可收起；停靠区高度不超过键盘之外可用高度的约一半，内容多时可滚动；没有待处理项时不显示停靠区；提问单选点按即提交、多选与自填用提交按钮并可忽略，密钥输入不回显，交互卡片在停靠区原生绘制并作答（见 view-card-render），可关闭；作答语义与网页端一致，成功与失败分别给不同的触感反馈；查看旧分段时不显示只属于当前分段的学习审批与交接。
    scenarios:
      dock-one-at-a-time:
        - GIVEN: 聊天中同时有一个工具审批、一个提问和一张卡片待处理
        - WHEN: 打开该聊天
        - THEN: 停靠区只展开审批，提问与卡片收起；同意审批后审批移出、提问自动展开，网页端同步
      question-tap-submits:
        - GIVEN: 停靠区展开一个单选提问
        - WHEN: 点按其中一个选项
        - THEN: 该选项立即作为回答提交，提问移出停靠区，Bot 收到回答
      dock-height-cap:
        - GIVEN: 待处理项很多
        - WHEN: 打开该聊天（包括在停靠区的输入框里打字、键盘弹出时）
        - THEN: 停靠区高度不超过键盘之外可用高度的约一半，可在其中滚动，消息列表与输入框仍可用
  phone-appearance:
    strength: MUST
    statement: 设置页提供「外观」：跟随系统、浅色、深色三选一，默认跟随系统；切换后界面明暗即时变化，不重新连接、不离开当前页面，强杀重开后保持所选外观。
    scenarios:
      appearance-dark:
        - GIVEN: 外观为跟随系统且系统为浅色
        - WHEN: 在设置页选择「深色」并返回
        - THEN: 整个界面立即变为深色，当前聊天与连接不受影响；强杀重开后仍为深色
  phone-language:
    strength: MUST
    statement: 设置页提供「语言」：跟随系统、简体中文、English 三选一，默认跟随系统（系统为中文时显示中文，否则显示英文）；切换后团队页、聊天页、待处理停靠区、聊天条、提醒横幅、发送箱、设置页与首次设置页等主要界面文案即时切换为所选语言，不重新连接、保留当前所在页面，强杀重开后保持所选语言；聊天内容与 Bot 产生的文本不翻译。
    scenarios:
      switch-to-english:
        - GIVEN: 停在某 Bot 的私聊页，语言为简体中文
        - WHEN: 在设置页选择 English 并返回
        - THEN: 仍在该私聊页，输入框提示、按钮、停靠区与聊天条文案为英文，主要界面无中文残留；强杀重开后仍为英文
  haptics-unified:
    strength: SHOULD
    statement: 发送成功、待处理项作答成功与失败给出一致的触感反馈（成功与失败可区分）；动效统一遵循系统的减少动态效果设置。
    scenarios:
      answer-fail-haptic:
        - GIVEN: 停靠区作答因网络失败
        - WHEN: 失败返回
        - THEN: 给出与成功不同的触感反馈，并显示可读的失败原因
  team-read-state:
    strength: MUST
    statement: 手机按 harness 主机分别保存每个 Bot 与群聊的最后已读时间：聊天页处于前台可见时，以该条目最近活动时间与聊天内最新条目时间中的较大者标记已读，收到当前聊天的实时消息时同步标记；团队页条目在最近活动时间晚于已读时间且不是当前打开的聊天时显示未读点；已读状态保存在应用私有存储，强杀重开后保持；已读只在本机，网页端与手机的已读互不同步。
    scenarios:
      unread-clears-on-open:
        - GIVEN: 某 Bot 有新的活动，团队页显示未读点
        - WHEN: 打开该 Bot 的聊天再返回团队页
        - THEN: 未读点消失；强杀重开应用后该条目仍为已读
      unread-after-new-activity:
        - GIVEN: 某 Bot 已读后又产生了新消息（最近活动时间晚于已读时间）
        - WHEN: 回到团队页（未打开该聊天）
        - THEN: 该条目显示未读点
      per-host:
        - GIVEN: 手机先后连接两个不同 harness 地址
        - WHEN: 在其中一个地址下打开聊天
        - THEN: 只影响该主机下对应条目的已读，另一主机的已读不变
  team-preview-priority:
    strength: MUST
    statement: 团队页条目第二行按优先级显示一行预览：Bot 为 待回答的提问或卡片（「等你回答」）→ 待审批（工具审批、密钥或连接器请求、学习提案，「等你审批」）→ 正在做的工作短语 → 在群里工作（「群名 · 工作短语」）→ 最后一条消息摘要 → 角色；群为 待回答 → 待审批 → 成员工作（「成员名 · 工作短语」）→ 摘要。「等你回答 / 等你审批」以强调色显示。摘要去掉消息来源包装头，浏览器交接、提问卡与卡片回复的英文包装文字转为可读文本（如「浏览器交接：需要登录（已完成）」「已回答「选哪个窗口？」：周六」），文案随界面语言。
    scenarios:
      preview-waiting-answer:
        - GIVEN: 某 Bot 当前会话有待回答的提问
        - WHEN: 团队页渲染
        - THEN: 该条目预览显示「等你回答」（强调色），而不是最后一条消息
      preview-working:
        - GIVEN: 某 Bot 正在运行命令且无待办
        - WHEN: 团队页渲染
        - THEN: 预览显示对应工作短语（如「运行命令」）
      preview-handoff-readable:
        - GIVEN: '某 Bot 最后一条是浏览器交接回复，服务端预览为「[Browser handoff] 需要登录 Answer: done」'
        - WHEN: 团队页渲染
        - THEN: 预览显示「浏览器交接：需要登录（已完成）」，不出现英文包装
  delivered-file-share:
    strength: MUST
    statement: Bot 交付的文件在该消息之后显示为文件条目（名称）；点开后可「打开」（交系统应用）或「分享」（系统分享面板）：文件经 file-download 分块下载到应用缓存目录下的随机子目录，下载中显示进度并可取消，文件在下载中途变更或已不可用时中止并提示；文件名经清洗不会写出缓存目录；下载内容不写入日志与诊断上报。
    scenarios:
      large-file-share:
        - GIVEN: Bot 交付了一个超过 512 KiB 的文件
        - WHEN: 在文件条目上选「分享」
        - THEN: 显示下载进度，完成后弹出系统分享面板，所选应用收到完整文件
      file-changed-abort:
        - GIVEN: 文件在下载中途被服务器端修改
        - WHEN: 下一块请求返回不可用
        - THEN: 下载中止并提示文件已变更或不可用，不交出不完整的文件
  image-gallery:
    strength: MUST
    statement: 点开聊天中的图片进入全屏查看器：同一聊天里已加载的图片可左右滑动切换；远端声明 image-preview 能力时先显示预览再加载原图，原图在内存中最多保留 3 张；可保存到相册；图片内容不写入日志与诊断上报。
    scenarios:
      swipe-images:
        - GIVEN: 聊天里有多张图片
        - WHEN: 点开其中一张并左右滑动
        - THEN: 依次显示其他图片，先出预览再换成原图
  read-full-text:
    strength: MUST
    statement: 群聊里被截断的长帖（带全文文件）与 Bot 交付的文本类文件（md、txt、csv、json、html 等）提供「阅读全文」：取回全文后在全屏可选阅读器中显示，可选择复制；取回中显示进度、可返回取消（取消后不再弹出阅读器）；文本超过 512 KB 时只取回并显示开头 512 KB 并注明未显示完；取回失败给出可读原因，不影响聊天其他操作。
    scenarios:
      long-post-read-full:
        - GIVEN: 群聊里有一条被截断的长帖
        - WHEN: 点「阅读全文」
        - THEN: 阅读器显示完整正文，可选择复制
      text-file-read-full:
        - GIVEN: Bot 交付了一个 md 文件
        - WHEN: 在文件条目上选「阅读全文」
        - THEN: 阅读器显示该文件的文本内容
  view-card-render:
    strength: MUST
    statement: 停靠区里的 show_view 交互卡片按网页端同一组件语义原生绘制：折线、面积、柱、横柱与环形图（按数据绘制坐标与图例，不执行脚本、不访问网络），指标、进度、提示框、来源链接、表格（可横向滚动并复制为 CSV），滑块、数字、开关与单选输入（输入变化时卡片里的公式值与图表即时重算），选项、确认、表单与提交按钮作答（作答带上当前输入值，提交后卡片从停靠区移出并与网页端同步）；沙箱 HTML 组件只显示其说明；卡片格式不合法、超出层级/组件/行列/序列/点数上限或公式无法求值时降级为只读摘要并可关闭，不崩溃。
    scenarios:
      chart-drawn:
        - GIVEN: Bot 显示一张含柱状图、折线图与环形图的卡片
        - WHEN: 在停靠区展开该卡片
        - THEN: 三种图表按数据绘制，带类别标签与图例
      formula-recompute:
        - GIVEN: 卡片含一个滑块与引用它的公式指标和图表
        - WHEN: 拖动滑块
        - THEN: 指标数值与图表随之更新，提交时带上滑块当前值
      malformed-degrades:
        - GIVEN: 卡片的图表序列长度与类别数不一致
        - WHEN: 停靠区显示该卡片
        - THEN: 显示只读摘要与关闭按钮，应用不崩溃
  markdown-rich:
    strength: MUST
    statement: 聊天消息的 Markdown 补充：表格超出宽度时可横向滚动，表格下方提供「复制」（复制为制表符分隔文本，可直接粘贴到表格软件）与「展开」（全屏查看，可横竖滚动）；任务列表（- [ ] / - [x]）以勾选框显示完成状态；独占一行的图片显示为图片——https 与 data 图片直接显示，服务器本地路径图片经服务端取回（同一图片短时内复用，不重复下载），取不到时显示可点按重试的占位，图片内容不写入日志。
    scenarios:
      wide-table-tsv:
        - GIVEN: Bot 回复一张很宽的 Markdown 表格
        - WHEN: 横向滑动表格并点「复制」
        - THEN: 表格可左右滚动看到所有列；剪贴板得到制表符分隔的表头与各行
      local-image-shown:
        - GIVEN: Bot 的回复里有一行 ![截图](工作区内的图片路径)
        - WHEN: 打开该聊天
        - THEN: 该行显示为图片；路径不在工作区或取回失败时显示占位，点按可重试
  bot-manage:
    strength: MUST
    statement: 私聊页提供进入 Bot 详情页的入口；详情页分节显示并可编辑该 Bot 的名称、标签、指令、模型、思考强度、权限预设、外观（形象与颜色）、私有、Main Bot、置顶与隐藏，并只读显示工作文件夹；模型按服务商分组选择，思考强度只列出所选模型提供的级别（无级别时不显示该项），切换到不同运行引擎（本地 Agent 与模型之间）须二次确认；团队页提供新建 Bot（本地先提示名称为空、含禁用字符、为保留词或与已有 Bot 重名），成功后进入新 Bot 的私聊；详情页提供复制（私有 Bot 不提供，成功后进入副本私聊）与删除（Main Bot 不提供，须二次确认，删除后回到团队页）；私有开关在 Bot 为 Main Bot、在群聊中或没有自己的工作文件夹时禁用并说明原因，Main Bot 开关在唯一 Main Bot 上不可关闭、在私有 Bot 上禁用；团队有保留关闭的已删除私有 Bot 时可逐个释放（二次确认）。所有修改保存后网页端显示相同设置；被服务端拒绝时显示服务端给出的原因且不改变显示的设置。
    scenarios:
      edit-syncs:
        - GIVEN: 已连接且团队中有非 Main 的 Bot A
        - WHEN: 在 A 的详情页把标签改为「研究」、模型改为另一个服务商的模型、思考强度选 High、权限预设选只读并保存
        - THEN: 详情页显示新设置，网页端 A 的设置页显示相同的标签、模型、思考强度与权限预设
      create-bot:
        - GIVEN: 团队已有名为 Alice 的 Bot
        - WHEN: 在新建 Bot 页输入 alice 并尝试创建，再改为 Bob、填写标签与指令、选择模型后创建
        - THEN: 第一次在本地提示重名且不发出请求；第二次创建成功并进入 Bob 的私聊，网页端出现 Bob 且设置相同
      duplicate-delete:
        - GIVEN: Bot A 非私有、非 Main Bot
        - WHEN: 在 A 的详情页点复制；再在副本详情页点删除并在确认框确认
        - THEN: 复制后进入副本私聊、网页端出现副本；确认删除后回到团队页，副本从两端消失；在确认框取消则不删除
      main-and-private:
        - GIVEN: Bot A 是唯一的 Main Bot，Bot B 在一个群聊中
        - WHEN: 分别打开 A 与 B 的详情页
        - THEN: A 的 Main Bot 开关不可关闭且不显示删除；B 的私有开关禁用并说明需先离开群聊；把非私有的 Bot C 设为 Main Bot 后网页端 C 显示为 Main Bot
      engine-confirm:
        - GIVEN: Bot A 运行在普通模型上
        - WHEN: 在模型选择页选择一个本地 Agent
        - THEN: 先弹出确认说明将切换运行方式；确认后保存成功，取消则模型不变
      server-refusal:
        - GIVEN: 服务端会拒绝某项修改（如改成服务端保留中的名称，客户端无从提前得知）
        - WHEN: 在详情页保存该修改
        - THEN: 页面显示服务端给出的原因；详情页标题仍为原名，输入框保留未保存的修改并标为未保存、可一键还原
  avatar-library:
    strength: MUST
    statement: Bot 详情页的外观分节显示该 Bot 的照片头像（有照片时），并提供「从头像库选择」与「移除照片」（移除后保留形象与颜色）；头像库页按最新在前分页显示头像库照片，可从手机相册一次选多张或用相机拍摄导入，每张导入前经方形裁剪（可拖动与缩放）并缩小压缩到服务端单张上限之内，导入后显示新增、重复与失败（失败附服务端原因）的结果；压缩后仍超出上限或无法读取的图片在发送前本地提示且不发送；点选头像库中的照片即设为该 Bot 的头像并返回详情页，网页端显示同一照片；删除头像库照片须二次确认，删除后显示服务端结果，已在使用该照片的 Bot 保留其头像；头像图片不写入日志与诊断上报。
    scenarios:
      import-two:
        - GIVEN: 头像库为空，手机相册中有两张照片
        - WHEN: 在头像库页从相册选中这两张，逐张裁剪确认
        - THEN: 头像库显示两张新照片，结果显示新增 2 张；网页端头像库同样出现这两张
      duplicate-import:
        - GIVEN: 头像库已有照片 P
        - WHEN: 再次以相同裁剪导入 P
        - THEN: 结果显示 1 张重复，头像库数量不变
      set-photo:
        - GIVEN: Bot A 当前只有形象，头像库有照片 P
        - WHEN: 从 A 的详情页进入头像库并点选 P
        - THEN: 返回 A 的详情页并显示照片 P；网页端 A 的头像为 P；再点「移除照片」后详情页与网页端都只显示形象
      delete-in-use:
        - GIVEN: 照片 P 正被 Bot A 使用
        - WHEN: 在头像库长按 P 选择删除并在确认框确认
        - THEN: P 从头像库消失并显示删除结果，A 的头像仍为该照片；在确认框取消则不删除
      oversize-guard:
        - GIVEN: 一张经最低质量压缩后仍超出服务端单张上限，或无法读取的图片
        - WHEN: 尝试导入
        - THEN: 本地提示该图片无法导入的原因，不发出导入请求；同批其他图片照常导入
  work-folder-picker:
    strength: MUST
    statement: Bot 详情页、群详情页（从群聊页「详情」进入）与团队页的「团队工作区」入口提供工作文件夹选择：选择页显示当前浏览位置的面包屑（可跳回任一上级）与其子文件夹（隐藏文件夹默认不显示、可切换，列表不完整时提示），可进入子文件夹、选择当前文件夹，也可输入完整路径（非完整路径在本地提示）或点选最近用过的文件夹；远端不支持浏览时只提供输入路径与最近文件夹；Bot 可改回团队工作区，群可改回「各 Bot 用自己的文件夹」；保存后详情页显示新位置并提示该聊天将在新文件夹的新分段继续，网页端显示相同设置；服务端拒绝的位置显示服务端给出的原因且设置不变。App 不打开电脑上的系统选文件夹对话框。
    scenarios:
      browse-select:
        - GIVEN: Bot A 当前在团队工作区工作
        - WHEN: 在 A 的详情页打开文件夹选择，逐级进入 /home/user/projects/alpha，再点面包屑回到 /home/user 后重新进入 alpha 并选择
        - THEN: A 的详情页显示 /home/user/projects/alpha 并提示将在新分段继续；网页端 A 的工作文件夹相同
      refused-location:
        - GIVEN: Bot A 的文件夹为 alpha
        - WHEN: 选择 DeepSeek Harness 数据目录下的文件夹并保存
        - THEN: 页面显示服务端给出的原因，A 的文件夹仍为 alpha
      back-to-team:
        - GIVEN: Bot A 有自己的文件夹
        - WHEN: 在选择页选「团队工作区」
        - THEN: A 的详情页显示团队工作区，网页端一致
      room-folder:
        - GIVEN: 群 G 没有群文件夹
        - WHEN: 在 G 的详情页选择文件夹 notes 保存，之后再改回「各 Bot 用自己的文件夹」
        - THEN: 保存后 G 显示 notes；改回后 G 显示各 Bot 用自己的文件夹，网页端一致
      team-workspace:
        - GIVEN: 团队工作区为默认位置
        - WHEN: 在团队工作区页选择另一个文件夹保存
        - THEN: 团队工作区页显示新位置；选择数据目录下的位置时显示服务端原因且不变
      path-input:
        - GIVEN: 在选择页
        - WHEN: 输入 projects/alpha（不是完整路径）
        - THEN: 本地提示需要完整路径，不发出请求
  group-manage:
    strength: MUST
    statement: 群详情页提供群设置：群名（留空使用按成员生成的名称）、公告（最多 2000 字）、成员（从可搜索的 Bot 列表增删，至少 2 个、至多 12 个，私有 Bot 不能加入）、管理员（成员之一或无）、回复模式（管理员优先 / 全员轮流）、统一权限预设（对所有成员相同，或各 Bot 用自己的权限）、侧栏置顶与隐藏，以及删除群（须二次确认，删除后回到团队页）；团队页提供新建群聊（选管理员与成员、可选群名），成功后进入新群聊。所有修改保存后网页端显示相同设置；服务端拒绝时显示服务端给出的原因且设置不变；成员数不在 2–12 之间、管理员不在成员中或公告超长时在本地先提示。
    scenarios:
      create-room:
        - GIVEN: 团队有 Bot A（Main）、B、C
        - WHEN: 在新建群聊页选 A 为管理员、勾选 B 与 C、群名填「发布组」并创建
        - THEN: 进入「发布组」群聊；网页端出现该群，成员 A、B、C，管理员 A
      edit-room:
        - GIVEN: 群 G 有成员 A、B，管理员 A，回复模式管理员优先
        - WHEN: 在 G 的详情页改公告、加入成员 C、把管理员改为 B、回复模式改为全员轮流、统一权限设为只读
        - THEN: 详情页显示新设置，网页端 G 的设置相同
      delete-room:
        - GIVEN: 群 G 存在
        - WHEN: 在 G 的详情页点删除并确认
        - THEN: 回到团队页，G 从两端消失；在确认框取消则不删除
      member-limits:
        - GIVEN: 群 G 有成员 A、B；团队里有私有 Bot P；另一个群叫「闲聊群」
        - WHEN: 在成员选择页取消 B 后保存；查看候选列表；再把 G 改名为「闲聊群」
        - THEN: 第一次本地提示群聊至少需要 2 个 Bot 且不发请求；候选列表不出现 P；改名时显示服务端给出的重名原因，群名不变
  dsh-agent:
    strength: MUST
    statement: 远端声明 agents 能力时，团队页显示团队的 DSH Agent 条目（没有时提供「添加 DSH Agent」，团队至多一个）；点开进入 Agent 聊天页：显示其最新会话的聊天、可加载更早内容，发送消息沿用发送箱（发送中、失败重试与服务端确认后消去本地行），Agent 工作中可停止，Agent 的回复在实时状态更新或前台兜底同步后出现；Agent 聊天不参与已读标记；会话菜单可新建会话、重命名当前会话（1–80 字）、归档当前会话（二次确认，之后显示上一个会话）与移除 DSH Agent（二次确认，之后回到团队页）。所有操作结果与网页端一致；被拒绝时显示服务端给出的原因；远端未声明 agents 能力时不显示任何 Agent 入口。
    scenarios:
      add-and-chat:
        - GIVEN: 远端声明 agents 能力，团队还没有 DSH Agent
        - WHEN: 在团队页点添加 DSH Agent，进入其聊天发送「你好」
        - THEN: 团队页出现 DSH Agent 条目；消息先以发送中出现，服务端确认后成为正式消息，Agent 的回复随后出现；网页端看到同一会话内容
      stop:
        - GIVEN: DSH Agent 正在工作
        - WHEN: 在 Agent 聊天页点停止
        - THEN: 停止请求发出，Agent 回到空闲，网页端同步
      sessions:
        - GIVEN: DSH Agent 有一个会话
        - WHEN: 新建会话、把新会话重命名为「周报」、再归档它并在确认框确认
        - THEN: 新建后聊天为空的新会话；归档后显示之前的会话；网页端会话列表一致；在确认框取消则不归档
      remove:
        - GIVEN: 团队有 DSH Agent
        - WHEN: 在会话菜单移除 DSH Agent 并确认
        - THEN: 回到团队页，DSH Agent 条目消失，又显示添加入口
      no-capability:
        - GIVEN: 远端未声明 agents 能力
        - WHEN: 打开团队页
        - THEN: 不显示 DSH Agent 条目与添加入口
  memory-panel:
    strength: MUST
    statement: 团队开启记忆时，Bot 详情页与群详情页提供「记忆」：Bot 的记忆页分为它自己的记忆与团队共享记忆、群的记忆页显示群记忆，每条显示正文（长文可展开、可复制）、主题、置顶与到期/已过期标记，同组内置顶在前；可置顶/取消置顶、编辑、新增（单条不超过 300 字，超出在本地提示）、遗忘（须二次确认）、移动到另一个 Bot 或群的记忆、把团队条目设为所有 Bot 总是读到或放回主题；可对记忆提问或下指令，进行中显示加载状态，完成后显示回答与逐条变更结果；可查看变更历史（分页）并恢复某次变更；有最近一次自动整理时显示其结果并可撤销。私有 Bot 的记忆可见性以服务端为准。所有操作结果与网页端一致；被拒绝时显示服务端给出的原因且列表不变。
    scenarios:
      view-groups:
        - GIVEN: Bot A 有自己的记忆与团队共享记忆，其中一条已置顶、一条已过期
        - WHEN: 从 A 的详情页打开记忆
        - THEN: 按「自己的记忆」「团队共享记忆」分组显示，置顶的在组内前面，已过期的带标记；内容与网页端一致
      pin-edit-forget:
        - GIVEN: A 的记忆中有条目 E
        - WHEN: 置顶 E、把 E 改写为新内容、再遗忘 E 并在确认框确认
        - THEN: 每一步后列表即显示服务端结果，网页端一致；在确认框取消则不遗忘
      ask:
        - GIVEN: A 的记忆页
        - WHEN: 提问「把周报时间改成周四」
        - THEN: 提问期间显示加载且不能再次提问；完成后显示回答与逐条变更（如修改了哪条），列表刷新为新内容
      history-restore:
        - GIVEN: A 的记忆最近被删除过一条
        - WHEN: 打开历史，对该删除记录点恢复
        - THEN: 该条目回到记忆中，历史记录标为已恢复；服务端拒绝时显示原因
      move-and-layer:
        - GIVEN: A 有一条自己的条目 F 与一条团队条目 T（在主题中）
        - WHEN: 把 F 移到 Bot B 的记忆，把 T 设为所有 Bot 总是读到
        - THEN: F 从 A 的记忆消失并出现在 B 的记忆中；T 不再属于主题；网页端一致
      add-limit:
        - GIVEN: A 的记忆页
        - WHEN: 新增一条超过 300 字的条目
        - THEN: 本地提示超出长度且不发请求；改短后新增成功
  team-prefs:
    strength: MUST
    statement: 团队页提供「团队偏好」：可修改主题（DeepSeek、Mono、Paper、Moonlight）、强调色（或主题默认）、消息布局（气泡或平铺）、头像动画等级（安静、普通、活泼）、Enter 键发送或换行与新 Bot 默认模型，保存后网页端显示相同偏好；消息宽度不在手机上提供，手机修改其他偏好时服务端已存的宽度不变。App 按团队偏好显示：界面配色取团队主题与强调色（明暗仍按本机外观，未知主题使用默认配色），私聊与群聊按布局显示气泡或平铺，动画等级为安静时工作中指示不做动画，Enter 键发送开启时输入法回车即发送；网页端改了偏好后 App 随之更新。
    scenarios:
      theme-accent:
        - GIVEN: 团队主题为 Paper、本机外观为浅色
        - WHEN: 在团队偏好页改为 Moonlight 并选一个强调色
        - THEN: App 立即换成 Moonlight 浅色配色与所选强调色，网页端同步；把本机外观改为深色后显示 Moonlight 深色配色，团队偏好不变
      layout:
        - GIVEN: 消息布局为气泡
        - WHEN: 改为平铺
        - THEN: 私聊与群聊的消息不再画气泡、整宽显示；网页端同样为平铺
      motion:
        - GIVEN: 动画等级为普通，某个 Bot 正在工作
        - WHEN: 改为安静
        - THEN: 该 Bot 私聊里的工作中指示不再动画；网页端同步为安静
      enter:
        - GIVEN: Enter 键发送开启
        - WHEN: 关闭后在私聊输入框按回车
        - THEN: 回车换行而不发送；重新开启后回车即发送
      width-kept:
        - GIVEN: 网页端把消息宽度设为 90%
        - WHEN: 在手机上修改主题
        - THEN: 服务端的消息宽度仍为 90%；手机上不显示宽度设置
  team-sections:
    strength: MUST
    statement: 团队页按网页端侧栏的分组显示：分组归属以条目的 sectionId 为准，未分组条目（Main Bot 在最前）在前，命名分组按服务端保存的顺序在后，折叠的分组只显示标题与条目数（搜索时显示匹配条目）。团队页可新建分组、点按分组标题折叠或展开、长按分组标题进入分组管理页；分组管理页可重命名（名称去首尾空白、至多 32 字、不能与其他分组重名，本地先提示）、拖动排序（松手后一次提交，失败时恢复原顺序并显示服务端原因）、删除（二次确认，组内条目回到未分组）；条目长按菜单「移到分组」可把 Bot 或群移入某个分组或移出（Main Bot 不提供）。每次修改后网页端侧栏显示相同的分组、顺序与归属，网页端的修改也随之更新到 App。
    scenarios:
      create-rename:
        - GIVEN: 团队没有分组
        - WHEN: 在团队页新建分组「研发」，再在分组管理页把它改名为「研发组」
        - THEN: 团队页出现「研发组」分组（在未分组条目之后），网页端侧栏同样出现；改名为与已有分组同名时本地提示且不提交
      move-entries:
        - GIVEN: 有分组「研发组」
        - WHEN: 长按两个 Bot 分别选择「移到分组 → 研发组」，再把其中一个移回「不分组」
        - THEN: 两个 Bot 先后出现在「研发组」下，移回的那个回到未分组；网页端侧栏归属相同；Main Bot 的长按菜单没有「移到分组」
      reorder:
        - GIVEN: 有分组 A、B、C
        - WHEN: 在分组管理页把 C 拖到最前并松手
        - THEN: 只提交一次新顺序 C、A、B，团队页与网页端都按此顺序显示
      reorder-fails:
        - GIVEN: 网络断开
        - WHEN: 拖动改变分组顺序并松手
        - THEN: 提交失败，分组恢复原顺序并显示失败原因
      collapse-delete:
        - GIVEN: 分组「研发组」里有两个 Bot
        - WHEN: 点按分组标题折叠，再在分组管理页删除该分组并确认
        - THEN: 折叠后只显示标题与条目数，网页端同样折叠；删除后分组消失，两个 Bot 回到未分组
  bot-browser:
    strength: MUST
    statement: Bot 详情页提供「浏览器」入口进入 Bot 浏览器页，私聊待处理停靠区的浏览器交接卡提供「接管」按钮直达本页：页面在可见且 App 处于前台时经 browser-frame 约每 2 秒单飞刷新该 Bot 的浏览器画面快照并显示页面标题与地址，离开页面或进入后台立即停止刷新并丢弃过期结果，支持双指缩放查看，画面快照只保存在内存、不写入日志、诊断上报与磁盘缓存；页面显示持有状态（Bot 使用中、等待用户交接、用户已接管、已停止）并提供接管（browser-takeover）、交还（browser-give-back，面板交还不带 outcome）与停止（browser-stop）控制；按宿主能力降级：宿主未启用 Bot 浏览器（bot/browser-off）时显示「此宿主未启用 Bot 浏览器」并说明需在服务端团队配置启用浏览器插件，Bot 尚未打开浏览器（bot/not-found）时显示「这个 Bot 还没有打开浏览器」，dsh Web 宿主上接管与交还置灰并显示「需在桌面应用中接管或交还」而非报错、停止仍可用，有桌面宿主时接管、交还与停止在两端一致；手机不提供点击输入与视频流、不修改服务端 browserPlugin 配置、不调用 browser-wait/browser-result 充当浏览器宿主。
    scenarios:
      snapshot-polls-and-stops:
        - GIVEN: 宿主已启用浏览器插件且 Bot 正在浏览网页
        - WHEN: 从 Bot 详情页打开浏览器页停留观察并双指缩放，随后返回离开页面或切到后台
        - THEN: 页面显示该 Bot 的浏览器画面快照并约每 2 秒随操作刷新、可双指缩放；离开页面或切到后台后立即停止轮询，不再发出 browser-frame 请求，快照不落磁盘缓存、日志与诊断上报
      web-host-degrade:
        - GIVEN: 连接的是启用了 browserPlugin 的 dsh Web 宿主（无桌面浏览器通道），Bot 已打开网页
        - WHEN: 打开该 Bot 的浏览器页并执行停止
        - THEN: 页面正常显示并刷新画面快照；接管与交还按钮置灰并提示「需在桌面应用中接管或交还」而非报错；点击停止后 Bot 停止工作且两端一致
      plugin-off-and-no-page:
        - GIVEN: 宿主未启用浏览器插件，或已启用但该 Bot 尚未打开浏览器
        - WHEN: 打开该 Bot 的浏览器页
        - THEN: 未启用插件时显示「此宿主未启用 Bot 浏览器」并说明需在服务端团队配置启用浏览器插件；Bot 尚未打开浏览器时显示「这个 Bot 还没有打开浏览器」
      desktop-takeover-giveback-and-handoff:
        - GIVEN: 连接的是支持桌面浏览器通道的宿主，且私聊待处理停靠区有一条该 Bot 的浏览器交接卡
        - WHEN: 点按交接卡的「接管」进入浏览器页，依次执行接管、交还与停止
        - THEN: 交接卡的「接管」直达该 Bot 浏览器页并显示「等待用户交接」；接管后显示「用户已接管」；交还（不带 outcome）后回到「Bot 使用中」；停止后 Bot 停止工作并显示「已停止」，状态与网页端一致
  team-capabilities:
    strength: MUST
    statement: 远端 state 含能力库时，团队页提供「能力」入口进入能力页：列出团队能力库中的 MCP（stdio 与 HTTP）、技能与能力包，显示名称、种类、说明、来源（由你添加或由哪个 Bot 提议）、使用它的 Bot 与按严重程度合成的单一状态（出错 > 待批准 > 连接中 > 就绪，出错时显示原因）；Bot 提议、尚未批准的 stdio MCP 显示为待批准并可批准（capability-approve）；可新增与编辑能力（capability-save）：MCP stdio 填命令、参数与环境变量，MCP HTTP 填 URL 与请求头，技能填说明并在全屏编辑器中编辑技能内容，能力包从已保存的 MCP 与技能中勾选；名称不符合规则（小写字母、数字与单连字符，不超过 32 字符，连接器名保留）时在本地提示而不发送，已保存能力不能改种类；删除能力（capability-delete）须二次确认并说明会从所有 Bot 与能力包中移除；环境变量、请求头与参数中的密钥引用（$DSH_SECRET_名称）按原文显示与保存，App 不解析密钥值，能力配置不写入日志与诊断上报；写操作不自动重试，失败显示服务端原因，成功后以 state 刷新与网页端一致；远端 state 不含能力库时不显示能力入口。
    scenarios:
      list-status-and-approve:
        - GIVEN: 团队能力库有你添加的技能、一个正常连接的 HTTP MCP，以及一个 Bot 提议、尚未批准的 stdio MCP
        - WHEN: 从团队页进入能力页并批准该 stdio MCP
        - THEN: 列表显示各能力的种类、来源与状态，待批准项置顶并标注提议它的 Bot；批准后该项不再待批准，网页端能力页显示一致
      save-edit-delete:
        - GIVEN: 已打开能力页
        - WHEN: 新建一个技能并在全屏编辑器中写入内容，再编辑其说明，随后二次确认删除；另以不合规名称（含大写或下划线）尝试保存
        - THEN: 新建与编辑后网页端显示相同的名称、说明与内容；不合规名称在本地提示且不发送请求；删除需二次确认，确认后能力从列表、所有 Bot 与能力包中消失
      no-library-no-entry:
        - GIVEN: 远端 DS-Bot 的 state 不含能力库字段
        - WHEN: 打开团队页与任一 Bot 详情页
        - THEN: 不显示「能力」入口与 Bot 详情的「能力」分组，其余入口与功能照常
  bot-capabilities:
    strength: MUST
    statement: 远端 state 含能力库时，Bot 详情页提供「能力」分组（显示常驻与按需各几项）进入该 Bot 的能力页：列出团队能力库中的每项能力（能力包在前、其余按名称），每项提供常驻（always，每次对话都加载）、按需（catalog，列入能力包目录、由 Bot 需要时加载）与关闭三段选择（bot-capability），选择在途时该项不可再点；本项未常驻但经由某能力包生效时显示来源（经由某包常驻或按需）；本项已挂载（含经由能力包）且是未批准的本地命令 MCP 时提示待批准并引导到团队页的能力页批准；常驻项显示其在该 Bot 上的状态（就绪、连接中、待批准、无法连接及原因）；写操作不自动重试，失败显示服务端原因，成功后网页端同一 Bot 的能力设置一致。
    scenarios:
      toggle-and-mode:
        - GIVEN: 团队能力库有一个技能与一个能力包，某 Bot 尚未挂载任何能力
        - WHEN: 在该 Bot 的能力页开启技能为常驻、开启能力包为按需，再把技能切换为按需，最后关闭能力包
        - THEN: 每一步后网页端该 Bot 的能力设置与 App 一致：技能先常驻后改为按需，能力包先在按需目录中、关闭后移除；页面显示常驻项在该 Bot 上的状态，能力包内的能力显示经由该包生效的来源
  team-connectors:
    strength: MUST
    statement: 远端 state 含连接器视图时，团队页提供「连接器」入口进入连接器页：可按名称与简介搜索；「已连接」分组列出已连接、正在连接或等待登录的连接器与邮箱（有账号时），其余连接器按类别（开发、文档、工作、设计、数据、商务、搜索、其他 MCP 服务器）分组；每行显示名称（自加的标注「自加」）与一行状态：已连接（以谁的身份、工具数）、连接中、等待登录、需要重新登录、需要应用客户端 ID、无法连接及原因，未连接时显示简介。点行进入详情页，按鉴权类型提供动作：无需登录的直接连接；需要 key 或 token 的在不回显的输入框中填写后连接；OAuth 登录在系统浏览器中打开授权地址，并提示授权后把浏览器打开的 127.0.0.1 页面地址粘贴回来完成登录，也可复制授权链接到电脑浏览器完成；设备码登录显示用户码，可复制并打开验证地址；需要自带客户端的服务显示回调地址（可复制）并填写 Client ID 与不回显的 Client Secret；等待登录时可取消，出错时可重试，需要重新登录时可重新登录；断开与移除自加连接器须二次确认；已连接的远程服务可切换只读。可添加其他 MCP 服务器：按地址（https，可选 OAuth 登录）或命令添加，或扫描电脑上 Claude Desktop、Cursor、VS Code 的 MCP 配置并勾选导入（只显示名称、来源与地址或命令）。key、token、Client Secret 不回显、不写入日志与诊断上报，输入它们的表单显示时禁止截屏与最近任务预览；App 复制的用户码与链接在回到 App 或约 2 分钟后从剪贴板清除。写操作不自动重试，失败显示服务端原因，成功后以 state 刷新与网页端一致；远端 state 不含连接器视图时不显示连接器入口。
    scenarios:
      list-and-direct-connect:
        - GIVEN: 团队有一个已连接的连接器、一个出错的连接器和若干未连接的无需登录连接器
        - WHEN: 从团队页进入连接器页，搜索并直接连接一个无需登录的连接器，再对出错的连接器点重试
        - THEN: 已连接分组显示已连接项及其身份与工具数，出错项显示原因；直接连接后该项进入已连接分组，网页端连接器页显示一致；重试后状态按服务端结果更新
      oauth-paste-back:
        - GIVEN: 某 OAuth 连接器未连接
        - WHEN: 在详情页点连接，App 打开系统浏览器授权，授权后把浏览器停留的 127.0.0.1 页面地址复制并粘贴回 App 提交
        - THEN: 连接器变为已连接，网页端显示同一账号；粘贴的地址不属于本次登录时显示服务端原因且不改变状态
      device-code:
        - GIVEN: GitHub 连接器支持设备码登录
        - WHEN: 点连接
        - THEN: 详情页显示用户码并已复制到剪贴板、打开验证地址；在网站授权后连接器变为已连接；回到 App 后剪贴板中的用户码被清除
      key-and-disconnect:
        - GIVEN: 某连接器需要 key
        - WHEN: 在不回显的输入框填写 key 连接，随后点断开并在确认框确认
        - THEN: 连接时输入内容以掩码显示、不出现在日志中，连接成功后网页端显示已连接；断开须确认，确认后两端均显示未连接
      no-connectors-no-entry:
        - GIVEN: 远端 DS-Bot 的 state 不含连接器视图
        - WHEN: 打开团队页
        - THEN: 不显示连接器入口，其余入口照常
      add-and-import:
        - GIVEN: 已打开连接器页
        - WHEN: 添加一个 https 地址的 MCP 服务器，再扫描电脑上的 MCP 配置并勾选一项导入；另输入一个非 https 且非本机的地址
        - THEN: 两项加入后即为已连接，出现在「已连接」分组并标注自加，网页端显示一致；非 https 地址时本地提示「连接器地址必须以 https:// 开头」，添加按钮不可用、不发送请求
  mailbox-settings:
    strength: MUST
    statement: 连接器页的邮箱进入邮箱页：列出邮箱账号（地址与状态，出错时显示原因），移除账号须二次确认；添加账号时选择服务商（QQ、163、126、Gmail、iCloud、其他，按地址域名自动预选），显示该服务商开启 IMAP/SMTP 并生成授权码或应用密码的步骤与打开链接，填写邮箱地址与不回显的授权码（其他服务商另填 IMAP 与 SMTP 主机），地址格式不对或授权码为空时不发送；服务端登录验证失败时显示原因不保存；远端支持 Google 登录时提供「用 Google 登录」，在浏览器中授权后粘贴落地地址完成；发送规则（允许直接发送的收件人、允许直接发送的 Bot）逐条显示并可移除。授权码不写入日志与诊断上报，输入它的表单显示时禁止截屏与最近任务预览；成功后以 state 刷新与网页端一致。
    scenarios:
      add-remove-account:
        - GIVEN: 邮箱页没有账号
        - WHEN: 选择 QQ、按步骤填写 QQ 邮箱地址与授权码添加，随后移除该账号并确认
        - THEN: 添加时授权码以掩码显示，验证通过后账号出现在列表且网页端一致；移除须确认，确认后两端均不再显示该账号
      remove-rule:
        - GIVEN: 发送规则中有一个允许的收件人和一个允许直接发送的 Bot
        - WHEN: 在邮箱页逐条移除
        - THEN: 两条规则从列表消失，网页端邮箱规则一致
  mail-send-card:
    strength: MUST
    statement: Bot 在自己的聊天中请求发送邮件时，停靠区显示邮件发送卡：显示发件账号（只读）、收件人、抄送、密送（有值时）、主题与正文（均可编辑）与附件名和大小，可选择规则：需要审批（默认）、允许这些收件人、允许此 Bot 直接发送，并可进入邮箱页管理规则；点发送以编辑后的内容发送并带上所选规则，点放弃则不发送（也带上所选规则）；作答在途时卡片不可重复提交，作答后卡片移出停靠区并与网页端同步，发送结果由 Bot 在聊天中告知。
    scenarios:
      edit-and-send:
        - GIVEN: Bot 请求从已添加的邮箱发送一封邮件
        - WHEN: 在停靠区修改主题与收件人后点发送
        - THEN: 按修改后的内容发送，卡片移出，网页端该卡显示已发送
      discard-with-rule:
        - GIVEN: 停靠区有一张邮件发送卡
        - WHEN: 选择「允许这些收件人」后点放弃
        - THEN: 邮件不发送、卡片移出；这些收件人出现在邮箱页的发送规则中，网页端一致
  bot-connectors:
    strength: SHOULD
    statement: 有已连接的连接器时，Bot 详情页提供「连接器」分组，逐个开关已连接的连接器对该 Bot 是否可用；开关在途时不可再点，写操作不自动重试，失败显示服务端原因，成功后网页端该 Bot 的连接器开关一致。
    scenarios:
      toggle-for-bot:
        - GIVEN: 团队已连接一个连接器
        - WHEN: 在某 Bot 的详情页关闭该连接器
        - THEN: 网页端该 Bot 的连接器开关显示为关闭，再打开后两端一致
  team-im-bridges:
    strength: MUST
    statement: 远端 state 含 IM 视图时，团队页提供「IM 接入」入口进入 IM 页：「等你允许」列出各 IM 机器人上请求对话的账号（显示经由哪个 IM 机器人），可允许或拒绝；「我的 IM 机器人」列出已添加的 IM 机器人（名称、平台、状态：已连接、连接中、正在重试、已停用、无法连接及原因，对话的 Bot 与待允许数）；「添加 IM 机器人」列出远端声明可用的平台及各自已添加数。添加时显示该平台的开通步骤与开发者后台链接，选择对话的 Bot 并按平台填写字段（选项、普通文本与不回显的密钥），字段缺失时不能提交，服务端校验失败显示原因；扫码登录的平台（微信）在手机上显示二维码供另一台设备扫描，并可复制链接或在其他应用中打开，依次显示正在获取、用微信扫码、已扫码请在手机上确认、已过期（可换一个二维码），确认后自动添加并返回列表。详情页可在出错时重试、启用或停用、更换对话的 Bot，允许或拒绝请求，二次确认后移除已连接账号或聊天，把群聊绑定到某个 Bot 或群聊或解除绑定，二次确认后移除整个 IM 机器人（其账号与聊天一并移除）。密钥字段不写入日志与诊断上报，输入期间禁止截屏与最近任务预览；写操作不自动重试，成功后以 state 刷新与网页端一致；远端 state 不含 IM 视图时不显示入口。
    scenarios:
      add-field-platform:
        - GIVEN: IM 页可添加 Telegram
        - WHEN: 选择对话的 Bot，在不回显的输入框中填入 Bot token 后连接
        - THEN: 输入以掩码显示，添加后返回列表并出现该 IM 机器人及其状态，网页端 IM 页一致；未填 token 时连接按钮不可用；token 无效时显示服务端原因
      weixin-qr:
        - GIVEN: 远端支持微信扫码登录
        - WHEN: 在添加微信页选择对话的 Bot
        - THEN: 手机上显示二维码并可复制链接；另一台设备扫码后显示已扫码请在手机上确认，确认后自动返回列表并出现微信 IM 机器人；二维码过期时显示已过期并可换一个
      pair-and-bind:
        - GIVEN: 某 IM 机器人有一个待允许的账号请求和一个群聊
        - WHEN: 允许该请求，把群聊绑定到某个群聊，再二次确认移除一个已连接账号
        - THEN: 请求移出「等你允许」、账号出现在已连接账号中；群聊显示绑定到所选群聊；移除需确认，确认后账号消失，网页端一致
      manage-and-remove:
        - GIVEN: 某 IM 机器人无法连接
        - WHEN: 在详情页点重试、停用后再启用、更换对话的 Bot，最后二次确认移除
        - THEN: 状态按服务端结果更新；启停与对话 Bot 在网页端一致；移除后该 IM 机器人从两端消失
      no-im-no-entry:
        - GIVEN: 远端 DS-Bot 的 state 不含 IM 视图
        - WHEN: 打开团队页
        - THEN: 不显示 IM 接入入口，其余入口照常
  local-agents-settings:
    strength: MUST
    statement: 团队页提供「本地 Agent」入口进入本地 Agent 页：「检测到的 Agent」列出电脑上找到的 Agent CLI（名称、简短版本、路径、已登录或未登录），可刷新重新检测，刷新进行中有提示；未登录的显示登录命令并可复制，提示在电脑终端运行；「自定义 Agent」列出按命令添加的 Agent（名称、命令与参数、不可用时标注）。每个 Agent 可展开查看其可用模型。可新增与修改自定义 Agent：名称必填（不超过 40 字），命令须为程序名、绝对路径或 ~/ 路径且不含空白，参数以空格分隔且不含换行，不符合时在本地提示而不发送，服务端拒绝（如电脑上找不到该程序）时显示原因；删除须二次确认。写操作不自动重试，成功后重新读取列表与网页端一致；远端不支持本地 Agent 时页面给出说明。
    scenarios:
      detect-and-refresh:
        - GIVEN: 电脑上装有一个已登录和一个未登录的 Agent CLI
        - WHEN: 进入本地 Agent 页并点刷新，复制未登录那个的登录命令，再展开已登录那个的可用模型
        - THEN: 两个 CLI 分别显示已登录与未登录及版本，刷新期间有进行中提示；登录命令已复制并提示在电脑终端运行；展开后列出该 CLI 的可用模型
      custom-crud:
        - GIVEN: 本地 Agent 页没有自定义 Agent
        - WHEN: 新增一个自定义 Agent（先以含空格的命令尝试），再修改其参数，最后二次确认删除
        - THEN: 含空格的命令在本地提示且不发送；新增与修改后网页端本地 Agent 页显示相同的名称、命令与参数；删除须确认，确认后两端都不再显示
      unsupported-remote:
        - GIVEN: 远端不支持本地 Agent（local-agents 未知或 DSH 无法注册路由）
        - WHEN: 进入本地 Agent 页
        - THEN: 页面说明此远端不支持本地 Agent，不显示列表与新增入口
  bot-models-batch:
    strength: MUST
    statement: 模型与服务商页提供「批量切换 Bot 模型」进入批量页：列出全部 Bot 及当前模型，本地 Agent 上的 Bot 不可选并标注保留自己的模型，可全选可选的 Bot 或清空；为选中的 Bot 选择一个模型后逐个切换（不自动重试），完成后显示已更新、未变、跳过与失败的数量，并在每个 Bot 上标注结果与失败原因；切换后网页端各 Bot 的模型一致。
    scenarios:
      batch-switch:
        - GIVEN: 团队有三个使用 DS Bot 模型的 Bot 与一个本地 Agent 上的 Bot
        - WHEN: 全选后为它们选择同一个模型
        - THEN: 本地 Agent 上的 Bot 不可选；三个 Bot 逐个切换，已是该模型的标为未变，结果汇总显示，网页端三个 Bot 的模型一致
  model-providers:
    strength: MUST
    statement: 团队页提供「模型与服务商」入口进入模型与服务商页：列出 DSH 中已设置的模型服务商（名称与 id、模型数或出错原因、key 状态：需要 API key、已设置或在 DS Bot 之外设置、正在使用它的 Bot），可刷新模型目录；展开服务商可在不回显的输入框中填写或更换 API key（输入期间禁止截屏与最近任务预览，保存后清空输入框，不写入日志与诊断上报）或移除 key，key 在外部设置时说明无法在此修改；可查看该服务商的模型，点模型查看其思考强度。可刷新模型列表的服务商可刷新模型：列出端点返回的模型与端点未返回的已有模型（默认全选），逐个勾选并显示新增、移除与已选数量，至少选一个才能保存；保存前若有 Bot 正在用将被移除的模型，确认框列出这些 Bot 并说明它们下一轮会改用其他可用模型（没有时会失败），本地 Agent 上的 Bot 不受影响；别处已改动设置时显示原因并提示重新刷新。可新增服务商：内置服务商从 DSH 可添加列表中选择并可填 key；自定义 API 填服务商 id（小写字母、数字与连字符，字母开头，连字符不能连续或结尾）、可选名称、http/https 端点、协议与可选 key，可从端点查找模型勾选或手填模型 id（逗号或空白分隔），至少一个模型；key 与其他字段不符合服务端规则时在本地提示而不发送。自加的服务商可删除，须二次确认并说明使用其模型的 Bot 需另选模型。写操作不自动重试，失败显示服务端原因，成功后与网页端一致，且新增、保存模型或更换 key 后 Bot 详情与批量切换中的模型选择随之更新；远端不支持时页面给出说明。
    scenarios:
      add-key-and-models:
        - GIVEN: DSH 可添加某内置服务商
        - WHEN: 在 App 新增该服务商并在不回显的输入框填入 key，刷新其模型、取消勾选一个后保存，再在 Bot 详情把其中一个模型设为某 Bot 的模型
        - THEN: key 以掩码显示且保存后输入框清空，服务商显示已设置；保存后网页端该服务商的模型列表一致；该 Bot 用新模型回复，网页端 Bot 设置一致
      affected-bots-confirm:
        - GIVEN: 某 Bot 正在使用服务商的模型 X
        - WHEN: 刷新该服务商模型时取消勾选 X 并保存
        - THEN: 确认框列出该 Bot 并说明下一轮会改用其他可用模型；确认后保存，取消则不保存
      custom-and-remove:
        - GIVEN: 已打开模型与服务商页
        - WHEN: 新增一个自定义 API 服务商（先填含引号的 key），从端点查找并勾选模型后添加，随后二次确认删除它
        - THEN: 含引号的 key 在本地提示不发送；添加后列表显示该服务商与所选模型，网页端一致；删除须确认，确认后两端都不再显示
      providers-unsupported:
        - GIVEN: 远端不支持模型服务商设置
        - WHEN: 进入模型与服务商页
        - THEN: 页面说明此远端不支持或此 DSH 无法设置模型服务商，其余功能照常
  scheduled-tasks:
    strength: MUST
    statement: 团队页提供「定时任务」入口进入日程页：按 Bot 与群聊分组列出团队的定时任务，每项显示名称、时间规则（一次及其时间、每天几点、每周几几点（工作日、周末与每天有简写）、每隔多久、cron 表达式，时区与手机不同时注明）、所在群聊、下次运行时间或已逾期、已暂停、已结束，点按可展开完整的任务内容；远端支持暂停时，进行中与已暂停的任务可暂停或恢复（到点的一次性任务不可暂停）；删除须二次确认。可新建定时任务：选择发送给哪个 Bot 或群聊，填写名称（不超过 120 字）与要做的事，时间规则为一次（将来的日期与时间）、每天（时刻）、每周（至少一天与时刻）或重复（每隔 N 分钟、小时或天，1 分钟到 7 天），每天与每周按手机当前时区；不满足时不能提交，服务端拒绝时显示原因。Bot 详情页提供「定时任务」行显示该 Bot 进行中的任务数，进入后只显示该 Bot 的任务并可切换为显示全部，新建时预选该 Bot。页面打开期间约每分钟刷新一次；写操作不自动重试，成功后与网页端一致；DSH 未开启 Automation tasks 时说明需在 DSH 设置的插件页开启，远端不支持时页面给出说明。
    scenarios:
      create-and-run:
        - GIVEN: DSH 已开启 Automation tasks
        - WHEN: 在 App 为某 Bot 新建一个每天 09:00 的任务，再新建一个几分钟后运行一次的任务
        - THEN: 两个任务出现在该 Bot 分组下，分别显示每天 09:00 与一次及其时间和下次运行时间；一次性任务按时触发后 Bot 收到任务内容，列表显示已结束，网页端日程页一致
      pause-resume-delete:
        - GIVEN: 某 Bot 有一个每天运行的任务
        - WHEN: 暂停该任务，再恢复，最后二次确认删除
        - THEN: 暂停后显示已暂停，恢复后显示下次运行时间，删除须确认，确认后两端都不再显示
      validation:
        - GIVEN: 正在新建定时任务
        - WHEN: 选择一次但不选将来的时间，或选择每周但不选任何一天，或不填名称
        - THEN: 提交按钮不可用或在本地提示，不发送请求
      automation-off:
        - GIVEN: DSH 未开启 Automation tasks
        - WHEN: 进入日程页
        - THEN: 页面说明需要在 DSH 设置的插件页开启 Automation tasks，不显示新建入口
  secrets-settings:
    strength: MUST
    statement: 远端 state 含密钥视图时，团队页提供「密钥」入口进入密钥设置页：列表只显示密钥名称、用途、作用 Bot（所有 Bot / 指定 Bot / 无）及添加与最近使用时间，绝不显示密钥值；可新增密钥（名称自动规范化为大写字母、数字与下划线且以字母开头、不超过 64 字符，值去首尾空白后至少 4 字符、至多 16384 字符，默认对所有 Bot 可用，本地预校验不通过时不发送）；展开密钥可修改作用 Bot 与用途（secret-update）、在不回显输入框中替换密钥值（secret-set，成功后清空输入并提示已替换），以及二次确认后删除（secret-delete）。远端 state 含密钥存储状态时，页面顶部显示「落盘加密」状态卡：明文模式下可用口令（8–1024 字符，需重复输入确认一致）加密为加密信封（secret-encrypt）；已加密且已解锁时可输入口令并在二次确认后关闭加密写回明文（secret-decrypt）；已加密且锁定时显示锁定原因，可输入口令为当前进程解锁（secret-unlock，不修改磁盘文件），也可在二次确认后输入口令解密写回明文作为恢复路径。密钥值与口令一律使用不回显密码输入框，并在输入表单显示期间禁止截屏与最近任务预览（聊天待处理停靠区的密钥请求卡共用同一敏感输入组件与校验规则），值与口令不写入日志、诊断上报、剪贴板与持久存储；写操作不自动重试，只读宿主或服务端拒绝时显示服务端给出的原因且状态不变，成功后与网页端一致；远端 state 不含密钥视图时不显示入口，不含存储状态时隐藏落盘加密卡。
    scenarios:
      list-add-update-delete:
        - GIVEN: 团队已连接且远端含密钥视图，已有密钥 GITHUB_TOKEN（作用所有 Bot）
        - WHEN: 进入密钥设置页，新增密钥 OPENAI_KEY，展开修改其作用 Bot 为指定 Bot 与用途，最后二次确认删除
        - THEN: 列表只显示名称、用途、作用 Bot 与时间而不显示值；新增与修改后网页端密钥页一致；删除须二次确认，确认后两端均不再显示
      replace-value-and-masking:
        - GIVEN: 密钥设置页已有密钥 GITHUB_TOKEN，且私聊停靠区有一张待填写的密钥请求卡
        - WHEN: 在设置页展开 GITHUB_TOKEN 输入新值替换（先尝试不足 4 字符），并在聊天停靠区填写密钥请求卡
        - THEN: 不足 4 字符时本地禁用提交不发请求；输入过程均不回显且表单显示期间禁止截屏；替换成功后输入框清空并提示，密钥值不出现在日志与诊断上报中
      store-encrypt-unlock-decrypt:
        - GIVEN: 远端密钥存储当前为明文模式
        - WHEN: 在落盘加密卡输入两次一致的 8 位以上口令开启加密；随后在锁定状态下用口令解锁；最后输入口令并在二次确认后关闭加密写回明文（或于锁定态直接二次确认解密恢复）
        - THEN: 加密、解锁与解密后的存储模式及锁定状态与网页端一致；两次口令不一致或不足 8 字符时不发送；解密前须二次确认；口令不回显且不写入日志、诊断上报、剪贴板与持久存储
      readonly-and-no-secrets-degrade:
        - GIVEN: 远端为只读宿主，或远端 state 不含密钥视图
        - WHEN: 在只读宿主上尝试修改或加密密钥；或在不含密钥视图的远端打开团队页
        - THEN: 只读宿主按服务端拒绝原因提示且不改变状态；不含密钥视图时团队页不显示「密钥」入口，其余功能照常
  dsbot-diagnostics-log:
    strength: MUST
    statement: 关于页提供「反馈与诊断」入口进入诊断页：显示远端诊断报告的版本、系统、模型、团队规模与只读状态等信息，以及最近错误（新到旧，含时间、级别、来源、Bot、位置与错误码）与错误总数，无错误时显示暂无错误；可查看远端完整错误日志全文；清理日志须二次确认，确认后只发送一次，成功后错误列表与总数清空。远端诊断报告与日志文本只在页面内显示，不写入 App 日志、诊断上报、剪贴板与持久存储；读取失败显示原因并可重试；远端不支持诊断端点时显示「此远端不支持」。
    scenarios:
      view-report-and-log:
        - GIVEN: 远端 DS-Bot 诊断日志中有 3 条错误
        - WHEN: 从关于页进入反馈与诊断页并展开完整日志
        - THEN: 显示版本与系统等信息、3 条错误（新到旧）与总数 3，完整日志全文可滚动查看，内容与网页端 Feedback 页一致
      clear-with-confirm:
        - GIVEN: 诊断页显示有错误记录
        - WHEN: 点击清理日志，先取消一次再确认
        - THEN: 取消时不发请求；确认后错误列表显示暂无错误且总数为 0，网页端 Feedback 页同样已清空
      text-not-persisted:
        - GIVEN: 诊断页显示了远端错误与日志
        - WHEN: 随后生成 App 自身的诊断上报并检查 App 日志
        - THEN: 远端诊断报告与日志文本不出现在 App 日志与诊断上报中，也未写入剪贴板
  dsbot-about-updates:
    strength: MUST
    statement: 团队页提供「关于 DS Bot」入口进入关于页：显示远端 DS-Bot 与 dsh 当前版本、App 已测基准版本（DS-Bot 0.3.10 与同期实测的 dsh 版本）及与基准一致、不一致或未知；远端提供仓库地址时显示源码链接、Star 数（读取失败时不显示数字）与更新说明链接，链接在系统浏览器中打开。更新区的 DS-Bot 行显示状态（有新版本、已是最新及检查时间、无法检查、更新中、已安装待重启 DSH、已更新、更新失败及原因、随 DS Bot 桌面应用更新、本地目录安装、更新检查已关闭），提供「检查更新」与（有新版本或失败重试时）「更新」；远端报告 dsh 版本时显示 dsh 行，dsh 可通过 npm 更新到已验证版本时提供「更新」，需先更新 DS-Bot 时提示所需版本，随桌面应用更新时只提示不提供按钮。执行任一更新前须二次确认并说明电脑上的服务可能重启、当前会话可能失效、远端版本将偏离 App 基准；确认后只发送一次、不自动重试；更新进行中且关于页可见、App 在前台时约每 2 秒刷新状态直到结束，离开页面或进入后台即停止；连接重建后关于页与版本提示条按新版本刷新。远端不支持版本检查端点时关于页显示「此远端不支持版本检查」，Star 数端点不支持或读取失败时只显示 Star 而不显示数字，其余区块（链接、反馈与诊断入口）照常；未连接时提示连接后自动读取。
    scenarios:
      versions-and-baseline:
        - GIVEN: 团队已连接，远端 DS-Bot 为 0.3.10、dsh 为已测同期版本
        - WHEN: 从团队页进入关于 DS Bot 页
        - THEN: 显示两个远端版本与 App 基准版本并标明一致；显示源码、更新说明链接与 Star 数，点击链接在系统浏览器打开
      check-and-install-dsbot:
        - GIVEN: 远端 DS-Bot 有可用新版本
        - WHEN: 点击检查更新后点击 DS-Bot 行的更新，先取消一次再确认
        - THEN: 取消时不发请求；确认后显示更新中并约 2 秒刷新，结束后显示已安装需重启 DSH 或失败原因；与网页端关于页状态一致
      dsh-row-variants:
        - GIVEN: 远端 dsh 可更新到已验证版本；另一远端的 dsh 需先更新 DS-Bot；第三个远端的 dsh 随桌面应用更新
        - WHEN: 分别打开关于页
        - THEN: 第一种显示 dsh 更新按钮且二次确认后执行；第二种提示先更新 DS-Bot 指定版本且无按钮；第三种只提示随桌面应用更新且无按钮
      reconnect-refresh:
        - GIVEN: DS-Bot 更新完成后电脑上的服务重启，连接中断
        - WHEN: App 重连成功
        - THEN: 关于页与版本提示条按远端新版本刷新，版本与基准不一致时提示条显示
      unsupported-degrade:
        - GIVEN: 远端不支持版本检查端点；另一远端支持版本检查但不支持 Star 数端点
        - WHEN: 分别打开关于页
        - THEN: 第一种显示此远端不支持版本检查，反馈与诊断入口照常可用；第二种版本与更新区照常、Star 按钮只显示 Star 不显示数字
  token-usage:
    strength: MUST
    statement: 团队页提供「用量」入口进入用量页，按手机当前时区显示团队的 token 用量（只显示 token 数，不显示费用）：时间范围可选 24 小时、7 天、30 天、12 周、12 个月或在日历上选择起止日期（最早到有用量记录的月份或 12 个月前），按范围以小时、天、周或月为单位分段；页面显示本范围总 token 数及与上一个同长时段相比的升降百分比、缓存命中率、输出 token 与调用次数，堆叠柱状图可在按 Bot 与按模型之间切换（前 7 项单独显示，其余合并），点按某段显示该时段明细；Bot 排行（Bot 与 DSH Agent 一起按用量排序，群聊与其他排在其后，与网页端一致）与模型排行显示各自 token 数与占比；显示近一年的每日用量热力图。点按 Bot、群聊、Agent、其他或模型进入详情页：显示其占总用量的比例、同样的统计与图表、该 Bot 用过的模型或该模型的使用者、按用途（对话或单聊、群聊、压缩与交接、识图、记忆、标题、侧边对话、其他）的分布与其热力图。远端声明支持 Bot 用量摘要时，Bot 详情页提供「用量」行显示该 Bot 近 24 小时、7 天与 30 天的 token 数，点按进入该 Bot 的用量详情。同一时区、同一时间范围下各数字与网页端一致；页面可见且 App 在前台时自动刷新，远端仍在读取旧会话时提示总数可能增长，离开页面或进入后台即停止刷新；无用量时显示空状态，远端不支持时页面给出说明，读取失败显示原因并可重试。
    scenarios:
      range-matches-web:
        - GIVEN: 远端团队有多个 Bot 与模型的用量记录，手机与电脑浏览器时区相同
        - WHEN: 在 App 用量页与网页端用量页分别选择 7 天、30 天与日历上同一段起止日期
        - THEN: 两端的总 token 数、缓存命中率、调用次数、Bot 排行与模型排行的数字一致，图表按天或周分段
      by-bot-by-model:
        - GIVEN: 用量页显示 7 天范围
        - WHEN: 把图表从按 Bot 切换为按模型，并点按某一天的柱子
        - THEN: 柱子按模型堆叠，点按处显示该天各模型的 token 数
      detail-pages:
        - GIVEN: 用量页的 Bot 排行中有某 Bot
        - WHEN: 点按该 Bot，再在其详情中点按它用过的某个模型
        - THEN: 先显示该 Bot 的占比、统计、图表、用过的模型、用途分布与热力图，再进入该模型详情显示其使用者
      bot-summary:
        - GIVEN: 远端声明支持 Bot 用量摘要
        - WHEN: 打开某 Bot 的详情页
        - THEN: 显示「用量」行及近 24 小时、7 天与 30 天的 token 数，点按进入该 Bot 的用量详情
      unsupported:
        - GIVEN: 远端不支持用量端点
        - WHEN: 进入用量页
        - THEN: 页面说明此远端不支持，其余功能照常
  bot-task-detail:
    strength: MUST
    statement: 在私聊页的后台任务条中点按任一任务进入原生全屏「后台任务详情」页：顶部显示任务标题、状态、来源、已运行或结束时间与显示/隐藏步骤开关，活动态（运行中、等待审批、等待交接）提供停止按钮（bot-stop-task）；页面经 bot-task-read {botId, taskId, cursor?, steps?} 分页读取任务记录（切换显示步骤时传 steps=true 并按各轮展示工具调用步骤），复用聊天条目渲染呈现任务说明（task-brief）、用户追加消息、Bot 回复（含 Markdown、链接点击与长按选择器、代码块复制、图片与交付文件）、工具步骤与分段分隔线；服务端返回非空 cursor 时提供「更早的消息」分页加载并去重前插，cursor 为 null 或缺失时提示已到最早；活动态且页面在前台可见时定期静默刷新最新一页而不丢失已加载的更早记录，底部提供纯文本输入框经 bot-task-send {botId, taskId, text} 向任务追加消息（在途禁用、不自动重试、成功后清空输入并刷新呈现与网页端一致、失败保留草稿并提示可读原因）；任务结束（已完成、已失败、已停止、已中断）后完成最终刷新并自动切为只读（隐藏输入框与停止按钮，显示结束状态与摘要或错误）；未知 Bot/任务或远端不支持（bot/not-found）及网络/读取失败均显示可读原因并支持重试或返回，不崩溃。
    scenarios:
      open-and-toggle-steps:
        - GIVEN: 某 Bot 在私聊页有活动中的后台任务，任务包含任务说明、多轮输出与工具调用步骤
        - WHEN: 在私聊后台任务条展开并点按该任务，进入详情页后点击显示步骤，再点击隐藏步骤
        - THEN: 进入详情页后显示标题、状态与复用聊天样式的任务说明和输出；开启显示步骤后各轮工具步骤出现，隐藏后收起
      load-earlier-pages:
        - GIVEN: 某后台任务存在超过一页的历史记录，首页返回非空 cursor，第二页返回 cursor:null
        - WHEN: 进入任务详情页并点击「更早的消息」
        - THEN: 更早记录前插到列表上方且与最新页不重复，加载完后提示已到最早，且活动态刷新最新页时保留已加载的更早记录
      send-followup-active:
        - GIVEN: 某后台任务处于运行中，用户打开该任务详情页
        - WHEN: 在底部输入框输入追加消息并发送
        - THEN: 发送中按钮禁用，成功后输入框清空、该追问消息出现在详情列表且与网页端同一任务详情一致
      ended-becomes-readonly:
        - GIVEN: 用户正在查看一个运行中的后台任务详情页
        - WHEN: 点击顶部停止按钮或任务在远端结束（completed/failed/stopped/interrupted）
        - THEN: 任务详情页完成最终刷新后显示结束状态（及摘要或错误），隐藏底部输入框与停止按钮变为只读
      send-fail-no-auto-retry:
        - GIVEN: 用户正在查看运行中的后台任务并输入了追加消息
        - WHEN: 网络中断或服务端返回 bot/invalid 导致发送失败
        - THEN: 详情页显示可读失败原因、保留输入草稿，App 不自动重试
      not-found-degrade:
        - GIVEN: 任务或 Bot 已不存在，或远端版本不支持 bot-task-read（返回 bot/not-found）
        - WHEN: 打开该任务详情页或刷新读取
        - THEN: 详情页显示可读的不存在或不可用提示，不崩溃，按返回键正常回到私聊页
  deepseek-services:
    strength: MUST
    statement: 模型与服务商页与团队页提供「DeepSeek 服务」入口进入原生全屏「DeepSeek 服务」页：页面按需调用 deepseek-services 显示官方端点、DeepSeek API key 状态（已设置或需要 API key 及受阻原因，提供「管理模型与服务商」直达模型与服务商页且返回后刷新状态），以及识图（OCR）、朗读（TTS）与听写（ASR，服务端 speech 字段）各自的可用状态与不可用原因（ASR 听写区只读显示状态与原因）；可开关识图 OCR（true/false）、切换朗读方式（系统 / DeepSeek）、在 DeepSeek 朗读时选择音色（如 Stella / Tide）及一键「恢复默认」（提交 null 还原默认配置），修改经 deepseek-services-config 单次发出、在途禁用、不自动重试，成功后直接采用服务端返回视图并与网页端一致，失败显示服务端原因；提供语音试听区，可输入试听文本并经 deepseek-synthesize {text, voice} 合成试听（TTS 关闭回 bot/unavailable、空文本或超长文本回 bot/invalid、上游拒绝回 bot/refused 均按服务端原因显示），返回的 WAV 仅在内存中播放且可停止、离开页面立即停止并释放，绝不写入磁盘、日志与诊断上报；远端不支持 deepseek-services 端点（bot/not-found）时页面说明此远端不支持，其他读取失败显示原因并可重试，不影响其余功能。
    scenarios:
      status-and-key-guide:
        - GIVEN: 团队已连接，远端未设置 DeepSeek API key（或 DeepSeek 路由指向非官方端点）
        - WHEN: 从模型与服务商页或团队页进入「DeepSeek 服务」页并点击「管理模型与服务商」
        - THEN: 页面显示官方端点、API key 未设置及 OCR/TTS/ASR 各自不可用原因；点击后进入模型与服务商页，配置完成后返回「DeepSeek 服务」页自动刷新为已就绪状态
      config-toggle-voice-reset:
        - GIVEN: 团队已连接且 DeepSeek API key 已设置，当前 OCR 关闭、朗读为系统、音色为 Stella
        - WHEN: 在「DeepSeek 服务」页开启 OCR、将朗读切换为 DeepSeek 并将音色改为 Tide，随后点击恢复默认
        - THEN: 每次修改在途禁用、不自动重试，成功后页面立即显示新状态且与网页端 DeepSeek services 页一致；恢复默认后回到 OCR 关闭、系统朗读与默认音色，两端一致
      synthesize-preview-in-memory:
        - GIVEN: DeepSeek 朗读已开启且 API key 就绪
        - WHEN: 在试听区点按试听，随后在播放中点按停止或离开页面
        - THEN: App 经 deepseek-synthesize 取回 WAV 并在手机内存中直接播放；停止或离开页面时播放立即中止并释放；磁盘缓存、App 日志与诊断上报中均不含音频数据
      synthesize-errors-shown:
        - GIVEN: DeepSeek 朗读处于关闭（系统）状态，或开启状态下输入超过服务端限制的文本
        - WHEN: 在试听区尝试试听
        - THEN: 服务端返回 bot/unavailable 或 bot/invalid 时页面显示服务端给出的原因，不自动重试且应用不崩溃
      remote-unsupported-degrade:
        - GIVEN: 远端不支持 deepseek-services 端点（返回 bot/not-found）
        - WHEN: 进入「DeepSeek 服务」页
        - THEN: 页面说明此远端不支持 DeepSeek 服务，不显示可操作开关与试听按钮，其余页面与聊天功能照常
  general-advanced-prefs:
    strength: MUST
    statement: 团队偏好页底部提供默认收起的可折叠「高级」分组（收起时显示摘要「记忆 · 后台工作」），展开后原生提供与 DS-Bot 0.3.10 网页端 Settings → General → Advanced 一致的团队级高级项：自动带上相关记忆开关（memoryAutoRecall，默认开启）、三项记忆容量上限（群记忆容量默认 12000、Bot 记忆容量默认 8000、团队记忆容量默认 4000，单位字符，允许 1000–200000 的整数）与命令转后台秒数（backgroundAfterSec，默认 5 秒，允许 0–600 的整数，0 表示立即转后台）；任一高级项偏离默认值时提供「恢复默认」将高级项统一还原为默认。每次修改经 set-prefs 仅发送被改动的键（单作用域记忆容量仅发送该作用域，恢复默认仅还原高级项），绝不发送 width、flatWidth、effects、thinking 等未改偏好，服务端已存消息宽度与其他偏好保持不变；记忆容量或命令转后台输入为空、非整数或超出允许范围时在本地提示合法范围且不发送请求（防止非法记忆容量被服务端过滤而误清全部记忆上限）；写操作在途禁用、不自动重试，成功后以服务端 state 刷新并与网页端一致，网页端改动后 App 随之更新；只读宿主、网络失败或服务端拒绝时显示可读原因且不改变远端生效偏好。Classic Agent 模式与 DSH 内部设置槽位不在手机端提供。
    scenarios:
      expand-and-edit-memory-bg:
        - GIVEN: 团队已连接，当前团队偏好为默认值且服务端已存消息宽度 90%
        - WHEN: 进入团队偏好页展开「高级」分组，关闭「自动带上相关记忆」，将群记忆容量改为 16000、命令转后台改为 15 秒并保存
        - THEN: 每次修改仅提交对应改动键且在途禁用，保存后显示新值并与网页端 General → Advanced 一致，Bot/团队记忆容量仍为 8000/4000，服务端消息宽度仍为 90%
      local-range-validation:
        - GIVEN: 已展开团队偏好页的「高级」分组，服务端已存 Bot 记忆容量为 10000
        - WHEN: 在群记忆容量输入 500（或 200001、小数、空值），或在命令转后台输入 601（或 -1）并尝试保存
        - THEN: 本地显示允许的整数范围提示且不发出 set-prefs 请求，服务端已存的 Bot 记忆容量 10000 不受影响
      restore-advanced-defaults:
        - GIVEN: 团队已自定义自动带上相关记忆为关闭、群记忆容量为 16000、命令转后台为 0 秒，且主题为 Paper、消息宽度为 90%
        - WHEN: 在「高级」分组点按「恢复默认」
        - THEN: 自动带上相关记忆恢复为开启、三项记忆容量恢复为 12000/8000/4000、命令转后台恢复为 5 秒且与网页端一致，主题仍为 Paper、消息宽度仍为 90%
      server-reject-no-retry:
        - GIVEN: 远端为只读宿主或网络中断
        - WHEN: 在「高级」分组切换自动带上相关记忆或保存命令转后台秒数
        - THEN: 页面显示服务端给出的原因或可读网络失败提示，App 不自动重试，当前生效偏好不变
  group-round-rows:
    strength: MUST
    statement: 群聊页对 DS-Bot 0.3.10 的 room-chat 群轮次呈现与网页端一致：服务端展开的已结束轮次发言逐条显示并带成员名称与颜色（以团队名册的当前名称与颜色为先，条目自带值为后备）；轮次事件（开始处理、做完、等待批准、查找对话、未及时回应、运行失败及原因、被重启打断后继续或停下、被用户停止）显示为可见系统行，文案随 App 语言切换中英文，成员名缺失时显示「某个 Bot」而非原始 id；运行失败的原因按网页端顺序取已知错误码的本地化标签、原始错误消息、错误码、未知错误；room-chat 以布尔 running 与单个 speaking 成员表示进行中时，群页显示该成员工作中；账本之前旧群被压缩的轮次与轮次发言的耗时标签不显示（与网页端的已知差异）。
    scenarios:
      settled-round-events:
        - GIVEN: 某群已结束的轮次中有成员开始处理、回复并做完，room-chat 返回展开的发言行与轮次事件条目
        - WHEN: 打开该群的群聊页
        - THEN: 发言行带成员名称与颜色，轮次事件显示为「某成员 开始做了」「某成员 做完了」等系统行，与网页端同一群一致
      running-speaking-0310:
        - GIVEN: 远端为 DS-Bot 0.3.10，room-chat 返回 running 为 true、speaking 为某成员 id，且 live 工作详情未下发
        - WHEN: 群聊页刷新最新一页
        - THEN: 群聊页显示该成员工作中；running 为 false 或 speaking 为 null 时不显示工作中
      failed-event-reason-label:
        - GIVEN: 某轮次事件为运行失败，条目带已知错误码（如额度用尽）与上游原始错误消息，或只带未知错误码，或两者都缺
        - WHEN: 群聊页显示该轮次
        - THEN: 已知错误码显示本地化标签（如「某成员 停下了：账户额度已用尽。换个模型，或让它继续。」）；只有原始消息时显示该消息，只有未知错误码时显示错误码，两者都缺时显示未知错误
      roster-first-attribution:
        - GIVEN: 群成员已改名，或轮次发言条目没有颜色
        - WHEN: 群聊页显示该成员的轮次发言与轮次事件
        - THEN: 显示团队名册中的当前名称与成员颜色，与网页端一致
  computer-settings:
    strength: MUST
    statement: 远端 state 含 computer 字段时团队页提供「电脑操控」入口进入原生全屏「电脑操控」页（远端不返回该字段时不显示入口）：页面随 state 刷新显示「让 Bot 使用电脑」总开关（computer-set-enabled），开启后显示操控组件状态——加载中、就绪，或无法加载/未安装/被其他组件占用时显示服务端原因并提供重试（computer-provider-retry），未安装时同时显示服务端给出的安装命令文本，组件未就绪时提示 Bot 暂无电脑工具；逐个 Bot 显示操控级别（关闭/仅查看/后台/前台，未设置时为后台）并可切换（computer-set-level），总开关关闭时级别不可修改；每个 Bot 列出已「总是允许」的应用并可在二次确认后撤销（computer-revoke-app）；Bot 详情页在电脑操控开启时提供同样的级别选择与应用授权撤销，关闭时说明需先在电脑操控设置中开启；macOS 宿主且组件就绪时显示辅助功能与屏幕录制权限是否已允许，未允许项可请求授权（computer-permission）并提示需在电脑上完成、完成后可刷新；远端仅返回 {enabled:false} 的最小视图、组件状态为平台不支持，或开启后组件未安装/无法加载时页面显示「此宿主不支持电脑操控」及原因而非报错，并仍可关闭开关；所有修改单次发出、在途禁用、不自动重试，成功后与网页端 Settings → Computer use 显示一致，被拒绝（含只读宿主）时显示服务端原因且显示的设置不变。
    scenarios:
      toggle-and-level-sync:
        - GIVEN: 团队已连接到桌面宿主，电脑操控关闭，Bot A 的级别为后台
        - WHEN: 在「电脑操控」页打开总开关，等待组件就绪后把 Bot A 的级别改为仅查看
        - THEN: 开关在途禁用、成功后显示组件就绪；A 的级别显示为仅查看，网页端 Computer use 页显示相同的开关与级别；关闭总开关后级别选择变为不可修改
      revoke-app-grant:
        - GIVEN: 电脑操控已开启，Bot A 对某应用有「总是允许」的授权
        - WHEN: 在电脑操控页（或 A 的详情页电脑操控分节）对该应用点撤销，先在确认框取消、再次点撤销并确认
        - THEN: 取消时授权保留且不发出请求；确认后该应用从 A 的授权列表消失，网页端 A 的 Control 卡同步不再列出该应用
      provider-error-retry:
        - GIVEN: 电脑操控已开启但组件加载失败或被其他组件占用
        - WHEN: 进入电脑操控页并点按重试
        - THEN: 页面显示服务端给出的原因与重试按钮，重试单次发出且在途禁用，成功后显示组件就绪，失败显示新的原因且应用不崩溃
      macos-permissions:
        - GIVEN: macOS 桌面宿主，电脑操控已开启且组件就绪，屏幕录制尚未允许
        - WHEN: 进入电脑操控页并对屏幕录制点请求授权，在电脑上完成授权后点刷新
        - THEN: 页面显示辅助功能与屏幕录制各自的允许状态，请求授权后提示需在电脑上完成，刷新后屏幕录制显示为已允许
      host-unsupported-degrade:
        - GIVEN: 远端为 dsh Web 宿主（state.computer 仅为 {enabled:false}，或开启后组件为平台不支持或未安装）
        - WHEN: 进入电脑操控页
        - THEN: 页面显示「此宿主不支持电脑操控」及原因，不显示错误页，开启状态下仍可关闭开关，其余页面与聊天中的电脑操作请求卡照常
      read-only-refused:
        - GIVEN: 远端团队由另一个 dsh 宿主持有（只读）
        - WHEN: 在电脑操控页切换总开关或修改 Bot 级别
        - THEN: 页面显示服务端给出的只读原因，开关与级别保持原显示，不自动重试
  group-search:
    strength: MUST
    statement: 群聊页提供群内搜索入口，搜索结果与网页端同一群同一关键词一致：输入至少 2 个字符后搜索该群历史消息（不足 2 个字符时显示输入提示、不发起搜索），结果按新到旧列出，每条显示发言者（自己的消息显示「你」，成员以团队名册的当前名称为先）、时间与高亮关键词的片段；还有更早命中时提供「加载更多」并在已有结果后追加、不重复；点按某条结果打开该消息的详情，显示发言者、时间、高亮关键词的全文以及该消息前后各一条消息，并可返回结果列表（与网页端一致，不跳转到群聊中的位置）；无命中显示「没有找到消息」；搜索失败显示服务端返回的原因，网络失败显示可读提示，修改关键词可重新搜索；加载更多失败时在结果末尾显示原因并保留已有结果；清空输入或修改关键词时旧结果、旧错误与详情不再显示；搜索文案随 App 语言切换中英文。
    scenarios:
      search-lists-hits:
        - GIVEN: 某群历史中有多条消息包含同一关键词
        - WHEN: 在该群群聊页打开搜索并输入该关键词
        - THEN: 结果按新到旧列出，每条显示发言者、时间与高亮关键词的片段，条目与顺序与网页端同一群同一关键词的搜索结果一致
      search-load-more:
        - GIVEN: 某关键词在该群的命中多于一页
        - WHEN: 滚动到结果末尾并点「加载更多」
        - THEN: 更早的命中追加在已有结果之后且不重复，命中计数随之增加；没有更早命中时不再显示「加载更多」
      search-short-and-empty:
        - GIVEN: 群内搜索页已打开
        - WHEN: 只输入 1 个字符，或输入在该群中不存在的词
        - THEN: 1 个字符时显示至少输入两个字符的提示且不发起搜索；不存在的词显示「没有找到消息」
      search-failure-message:
        - GIVEN: 群内搜索请求失败（如该群已不存在）
        - WHEN: 输入关键词发起搜索
        - THEN: 搜索页显示服务端返回的失败原因，不崩溃，修改关键词可重新搜索
      search-open-hit:
        - GIVEN: 群内搜索结果列表中有一条命中
        - WHEN: 点按该条结果
        - THEN: 显示该消息的发言者、时间、高亮关键词的全文，以及该消息前后各一条消息（存在时）；点「返回结果」或系统返回键回到原结果列表，内容与网页端同一命中的详情一致
      search-load-more-failure:
        - GIVEN: 群内搜索已显示一页结果且还有更早命中，此时网络中断或服务端拒绝
        - WHEN: 点「加载更多」
        - THEN: 结果末尾显示失败原因（网络失败为可读提示），已显示的结果保留不变，恢复后再点「加载更多」可继续
      search-change-query:
        - GIVEN: 群内搜索已显示某关键词的结果、详情或失败原因
        - WHEN: 修改关键词
        - THEN: 旧结果、详情与失败原因不再显示，等待新关键词的结果期间显示搜索中，新结果到达后只显示新关键词的命中
  mcp-access-settings:
    strength: MUST
    statement: 远端 state 含 mcp 字段时团队页提供「MCP 访问」入口进入原生全屏「MCP 访问」页（远端不返回该字段时不显示入口）：页面随 state 刷新显示 MCP 访问开关（mcp-set on）与端口（mcp-set port，仅接受 1024–65535 的整数，未改动时不可保存），并显示状态说明——服务端错误原因（如端口被占用、只读宿主）、关闭时其他 Agent 无法访问、开启后显示电脑本机访问地址、其余为连接中，且提示只有运行 DS Bot 的电脑上的程序能连接；可输入名称（非空，最长 60 字）新建外部客户端（mcp-client-add），成功后令牌在页面中只显示一次并提示立即复制，可经复制按钮复制（离开 App 后剪贴板中的该令牌被清理），离开该页面后令牌不再可见；客户端列表逐个显示名称与最近使用时间或可访问的 Bot 与群，可改名并以勾选非私有 Bot 与群调整可访问范围（mcp-client-update），删除需二次确认（mcp-client-remove）；所有修改单次发出、在途禁用、不自动重试，成功后与网页端 Settings → MCP access 显示一致，被拒绝（含只读宿主、端口非法、名称为空、客户端不存在）时显示服务端原因且显示的设置不变；令牌明文不出现在日志、诊断上报与本地存储中。
    scenarios:
      toggle-and-port:
        - GIVEN: 团队已连接，MCP 访问关闭，端口为 8797
        - WHEN: 在「MCP 访问」页打开开关，再把端口改为 8800 并保存；另输入端口 80 尝试保存
        - THEN: 开关在途禁用、成功后状态说明显示已开启及 http://127.0.0.1:8800/mcp 形式的本机地址，网页端 MCP access 页显示相同开关与端口；端口 80 不发出请求或显示服务端给出的端口范围原因，端口保持 8800
      create-client-token-once:
        - GIVEN: MCP 访问已开启
        - WHEN: 输入名称 Claude Desktop 新建客户端，复制令牌后切到其他应用再回到 App，随后返回团队页再重新进入 MCP 访问页
        - THEN: 新建成功后页面显示以 dsb_ 开头的令牌与「只显示一次」提示，列表出现该客户端且可访问对象为服务端缺省的 Main Bot；回到 App 后剪贴板中的该令牌已被清除；重新进入页面后令牌不再显示，客户端仍在列表中；日志与诊断上报中不含该令牌
      edit-scope-sync:
        - GIVEN: 已有外部客户端 X，可访问 Main Bot，团队另有非私有 Bot B、私有 Bot P 与群 G
        - WHEN: 在 X 的范围中勾选 B 与 G、取消 Main Bot，并把 X 改名为 Cursor
        - THEN: 范围候选中不出现私有 Bot P；每次修改在途禁用，成功后 X 显示名称 Cursor、可访问 B 与 G，网页端该客户端的勾选与名称一致
      remove-client-confirm:
        - GIVEN: 已有外部客户端 X
        - WHEN: 对 X 点删除，先在确认框取消，再次点删除并确认
        - THEN: 取消时 X 保留且不发出请求；确认后 X 从列表消失，网页端同步不再列出 X，其令牌随之失效
      port-in-use-error:
        - GIVEN: MCP 访问已开启，但所设端口已被电脑上其他程序占用
        - WHEN: 进入「MCP 访问」页
        - THEN: 状态说明显示服务端给出的端口被占用原因而非已开启，可改端口后保存重试，页面不崩溃
      read-only-refused:
        - GIVEN: 远端团队由另一个 dsh 宿主持有（只读）
        - WHEN: 在 MCP 访问页切换开关或新建客户端
        - THEN: 页面显示服务端给出的只读原因，开关与客户端列表保持原显示，不显示令牌，不自动重试
  group-todos-tasks:
    strength: MUST
    statement: 群聊页提供群的共享待办与任务看板，内容与操作结果与网页端一致：共享待办按未完成在前、再按添加时间列出并显示未完成数，可勾选或取消勾选、删除单条，有已完成项时可「清理已完成」（只移除已完成项），没有待办时提示可以让群里的 Bot 添加；任务看板列出成员在该群登记的任务，进行中、待审核与受阻的任务按开始时间列出并显示数量，每条显示成员、状态、开始时间、目标、进度、受阻原因与最近一条备注，已完成或已取消的任务收在可展开的历史中并显示结果或取消原因；进行中、待审核或受阻的任务可写备注（备注保存在任务上，并以用户身份在群里发出提及该成员的消息）与取消（需确认）；操作进行中对应按钮不可重复点按，操作被拒绝时显示服务端原因、网络失败显示可读提示；结果经实时更新与网页端同步；远端不支持群待办与任务（如 0.3.6）时不显示入口；文案随 App 语言切换中英文。
    scenarios:
      todo-check-sync:
        - GIVEN: 某群共享待办中有两条未完成、一条已完成
        - WHEN: 在手机上勾选一条未完成待办
        - THEN: 该待办显示为已完成并排到未完成待办之后，未完成数减一，网页端同一群的共享待办同步显示已完成
      todo-remove-clear:
        - GIVEN: 某群共享待办中有已完成项与未完成项
        - WHEN: 删除一条未完成待办，再点「清理已完成」
        - THEN: 被删除的待办与所有已完成待办从列表消失，其余未完成待办保留，网页端显示一致；清理后不再显示「清理已完成」
      todo-empty-hint:
        - GIVEN: 某群从未有过共享待办（远端为 0.3.10）
        - WHEN: 打开该群的待办与任务
        - THEN: 共享待办处提示还没有共享待办、可以让群里的 Bot 添加，不提供新增输入框
      task-note-sends:
        - GIVEN: 某群有一条成员正在进行的任务
        - WHEN: 为该任务写备注并发送
        - THEN: 该任务显示这条备注为最近备注，群聊中出现用户提及该成员并附备注内容的消息，网页端任务看板显示同一备注
      task-cancel-confirm:
        - GIVEN: 某群有一条受阻的任务
        - WHEN: 点「取消」并在确认对话框中确认
        - THEN: 该任务移入历史并显示已取消，不再提供写备注与取消，网页端显示一致；在确认对话框中放弃时不发送取消
      task-action-refused:
        - GIVEN: 某任务已在网页端被取消，手机上尚未刷新
        - WHEN: 在手机上为该任务写备注或取消
        - THEN: 显示服务端返回的原因（任务已结束），不崩溃，刷新后该任务位于历史中
      board-absent:
        - GIVEN: 远端为 0.3.6，不支持群待办与任务
        - WHEN: 打开某群群聊页
        - THEN: 不显示待办与任务入口，群聊页其余功能与现在一致
  settings-overview:
    strength: MUST
    statement: 团队页提供「概览」入口进入原生全屏「概览」页，对照 DS-Bot 0.3.10 网页端 Settings → Overview 汇总团队与设置状态并支持直接跳转：(1) 需要处理：当模型服务商缺 API key 且有 Bot 正在使用时逐条提醒（显示服务商名与在用 Bot 名称，点按跳模型与服务商页），否则在需添加可用模型时引导去模型与服务商页，或在仍有模型缺 key 时引导去 Bot 模型页；(2) 团队：显示 Bot 与群聊总数（点按回团队页）及至多 6 个槽位（超出时显示前 4 个 Bot、剩余数与「全部 Bot」及「新建 Bot」入口），每个 Bot 显示头像色（含 Main 标记与缺 key 红点）、名称与当前模型行，点按进入该 Bot 详情页；(3) 状态汇总磁贴：模型（可用模型数、可用服务商芯片、缺 key 芯片与本地 Agent 计数，跳模型与服务商或 Bot 模型页）、连接（已连接邮箱+非关闭连接器+IM+在线手机数与芯片，state 不含 connectors/im/mcp 时隐藏）、工具（能力数与浏览器/电脑操控/密钥芯片，state 不含对应字段且浏览器关闭时隐藏）、近 7 天用量（调用全团队 usage 显示近 7 天总 token、今日 token 与 7 日柱状图，scanning 为真且页面前台可见时约每 3 秒静默轮询、离开或退后台立即停止，usage 不支持时隐藏）、定时任务（进行中任务数与最近一次运行提示，schedules 不支持时隐藏）与外观（当前主题名称、浅深配色色块与气泡/平铺及动画效果摘要，跳团队偏好页）；(4) 分组设置页面列表：按常规与外观、模型、团队、连接、工具、用量与关于列出各已有原生页面并显示实时状态摘要与徽标（如需要处理、出错、待允许、待批准、已开启/已关闭、已锁定、有更新等），点按跳对应原生页面，对应字段未下发或按需端点返回 bot/not-found 时该行隐藏；按需读取（providers/usage/schedules/update-check）失败时对应区块降级显示占位或保留缓存、不阻塞其他区块且不自动重试，点按页顶「刷新」重读全部按需数据；所有敏感凭据与密钥不在概览页输入也不写入日志与诊断上报，文案随 App 语言切换中英文。
    scenarios:
      overview-matches-web:
        - GIVEN: 团队已连接 DS-Bot 0.3.10，含多名 Bot、已连接与缺 key 的服务商、连接器/IM/能力/定时任务与近 7 天用量
        - WHEN: 在团队页点按「概览」进入原生概览页
        - THEN: 页面显示需要处理告警、团队槽位与计数、6 个状态汇总磁贴（数字、芯片、7 日柱状图与主题色块）以及分组设置列表状态徽标，各项汇总结果与网页端 Overview 一致
      tiles-and-rows-navigate:
        - GIVEN: 概览页已显示需要处理告警、Bot 槽位、6 个汇总磁贴与分组列表
        - WHEN: 分别点按缺 key 告警、某个 Bot、模型磁贴、用量磁贴、关于 DS Bot 行并随后按系统返回键
        - THEN: 依次进入模型与服务商页、该 Bot 详情页、模型页、用量页、关于 DS Bot 页，按返回键回到概览页并保持可操作
      legacy-remote-hides-unsupported:
        - GIVEN: 远端为旧版 DS-Bot（state 不含 connectors/im/mcp/capabilities/computer/secrets 且 browser 为 false），且 providers/usage/schedules 返回 bot/not-found
        - WHEN: 打开概览页
        - THEN: 连接与工具磁贴及不支持的磁贴/分组行自动隐藏，其余团队、常规与外观、模型、关于等区块照常显示且无错误页
      ondemand-failure-keeps-state:
        - GIVEN: 概览页打开时 usage 或 schedules 请求因网络中断失败
        - WHEN: 等待首读结束随后恢复网络并点按页顶「刷新」
        - THEN: 失败期间近 7 天显示「–」、基于 state 的区块照常显示与跳转且不自动重试；点按「刷新」后重新读取并更新为完整统计
      scanning-poll-stops-on-leave:
        - GIVEN: usage 应答中 scanning 为 true
        - WHEN: 停留在概览页观察随后返回团队页或切到后台
        - THEN: 在前台可见时约每 3 秒静默重读一次 usage 并更新柱图，离开页面或进入后台后立即停止轮询
