schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: android-app
  title: Android App
requirements:
  first-run-setup-page:
    strength: MUST
    statement: App 启动时如果从未保存过 harness URL，或已有配置损坏、其中地址无效，显示首次设置页：包含欢迎说明、可选的 Tailscale auth key 输入框（密码型、不回显；隧道已连接时改为显示已连接与节点名、不再要求 key）、提示文字为「粘贴 dsh-url 或 dsh web 输出的地址」的地址输入框和「开始使用」按钮；已有配置无效时额外显示已有配置无效、需要重新填写的提示。地址输入时实时校验：地址不合法时「开始使用」按钮不可用并显示说明原因，地址合法时按钮可用且不显示错误；auth key 留空不影响按钮可用。
    scenarios:
      fresh-launch:
        - GIVEN: 应用数据被清除（从未保存过配置）
        - WHEN: 启动 App
        - THEN: 显示首次设置页，地址输入框与 auth key 输入框为空，没有已有配置无效提示
      invalid-config-notice:
        - GIVEN: App 私有存储中的配置文件内容损坏或其中的地址为 ftp://dsh.example.test/
        - WHEN: 启动 App
        - THEN: 显示首次设置页和已有配置无效提示
      live-validation-invalid:
        - GIVEN: 首次设置页已打开
        - WHEN: 输入 ftp://dsh.example.test/
        - THEN: 「开始使用」按钮不可用，并显示只支持 http 或 https 的提示
      live-validation-valid:
        - GIVEN: 首次设置页已打开
        - WHEN: 输入 http://127.0.0.1:13080/?token=abc123，auth key 留空
        - THEN: 「开始使用」按钮可用，不显示错误提示
      tunnel-connected-shows-status:
        - GIVEN: 隧道已连接，配置文件内容损坏
        - WHEN: 启动 App
        - THEN: 首次设置页的 Tailscale 部分显示已连接与节点名，不显示 auth key 输入框
  first-run-complete:
    strength: MUST
    statement: 首次设置页验证全部通过后（见 first-run-verify），App 保存去掉 token 的干净地址到私有存储，界面进入主页面：主页面以 WebView 承载，可达性探测通过后加载 harness 页面，不可达时显示本地错误页；用户输入的原始地址（含 token）只作为主页面加载的输入之一留存内存，不写入配置，也不在界面上显示 token。保存失败时首次设置页显示可读的错误信息并保持打开，错误信息中不含 token 值。
    scenarios:
      paste-token-url:
        - GIVEN: 用户在首次设置页输入 http://127.0.0.1:13080/?token=abc123，该地址可达
        - WHEN: 点击「开始使用」
        - THEN: 私有存储配置中为 http://127.0.0.1:13080/ 且不含 abc123，界面进入主页面并显示该地址的 harness 页面，abc123 不出现在任何界面文本
      no-token-url:
        - GIVEN: 用户在首次设置页输入 https://dsh.example.test/，该地址可达
        - WHEN: 点击「开始使用」
        - THEN: 配置保存 https://dsh.example.test/，界面进入主页面
      save-failure-stays:
        - GIVEN: 私有存储无法写入，输入的合法地址可达
        - WHEN: 点击「开始使用」
        - THEN: 首次设置页显示保存失败的错误且不含 token，停留在首次设置页
  settings-page:
    strength: MUST
    statement: 主页面提供「设置」入口，打开设置页显示当前已保存的干净地址；编辑时实时校验：地址不合法时「保存」不可用并显示原因，合法时可用。点击「保存」后先按 settings-save-verify 验证，通过才保存去掉 token 的干净地址、返回主页面并重新加载已保存地址；「取消」或系统返回不修改配置并返回主页面。设置页包含 Tailscale 卡片（隧道状态、节点名、auth key 连接与清除，见隧道相关 requirement）。
    scenarios:
      open-shows-current:
        - GIVEN: 已保存 http://127.0.0.1:13080/，界面在主页面
        - WHEN: 打开设置页
        - THEN: 输入框中为 http://127.0.0.1:13080/，页面包含 Tailscale 卡片
      save-new-token-url:
        - GIVEN: 设置页已打开，http://127.0.0.1:13080/ 可达
        - WHEN: 把地址改为 http://127.0.0.1:13080/?token=def456 并点击「保存」
        - THEN: 配置中为 http://127.0.0.1:13080/ 且不含 def456，返回主页面重新加载并显示 harness 页面，def456 不出现在任何界面文本
      cancel-keeps-config:
        - GIVEN: 已保存 https://a.example.test/，设置页已打开且地址被改为 https://b.example.test/
        - WHEN: 点击「取消」或按系统返回
        - THEN: 返回主页面，配置仍为 https://a.example.test/
  config-persistence:
    strength: MUST
    statement: 已保存的 harness URL 保存在 App 私有存储中：读取时区分「从未保存过配置」「已有配置无效」（内容损坏或地址不符合 harness-url-config 的校验规则）与「有效」三种情况；保存以原子方式写入，写入中断不会留下内容不完整的配置；App 重启后读取到同一个干净地址；token 查询参数的值不得出现在配置文件、日志或错误信息中。
    scenarios:
      read-after-restart:
        - GIVEN: 用户已保存 http://127.0.0.1:13080/ 并进入主页面
        - WHEN: 强杀 App 后重新启动
        - THEN: 无需再输入地址，直接进入主页面并显示同一干净地址
      overwrite-previous:
        - GIVEN: 已保存 https://a.example.test/
        - WHEN: 在设置页保存 https://b.example.test/ 后重启 App
        - THEN: 读取到 https://b.example.test/，私有存储中没有残留的临时文件
      token-never-in-config:
        - GIVEN: 用户通过首次设置页保存带 token 的地址 http://127.0.0.1:13080/?token=abc123
        - WHEN: 检查 App 私有存储中的配置文件
        - THEN: 内容为 http://127.0.0.1:13080/，不含 abc123
  main-page-load:
    strength: MUST
    statement: App 已保存有效 harness URL 时启动进入原生骨架（android-dsbot）的连接流程：先对干净地址做可达性检查（任何 HTTP 响应视为可达；https 经 TLS 握手与主机名校验），可达且会话有效时进入团队页骨架并启动 feed 同步；DNS 失败、拒绝、超时或 TLS 错误显示本地连接错误页；两种结果都不显示首次设置页。
    scenarios:
      'reachable-native-shell:':
        - GIVEN: 已保存地址可达且会话有效
        - WHEN: 启动 App
        - THEN: 进入团队页骨架，连接状态条从连接中转为在线，不显示任何网页
      'unreachable-native-error:':
        - GIVEN: 已保存地址不可达
        - WHEN: 启动 App
        - THEN: 显示本地连接错误页，不显示首次设置页
  load-error-page:
    strength: MUST
    statement: harness 地址不可达时原生骨架显示本地错误页：展示不含 token 的干净地址与按原因分类的说明（无法解析主机名、连接被拒绝、连接超时、安全连接失败），并提供「重试」与「修改地址」按钮；点击「重试」重新检查地址，恢复可达时回到团队页骨架；点击「修改地址」进入设置页并回显当前地址。
    scenarios:
      'native-error-buttons:':
        - GIVEN: 已保存地址不可达，错误页显示
        - WHEN: 点击修改地址
        - THEN: 进入设置页且回显当前地址；保存新地址后回到原生骨架重新连接
  refresh-entry:
    strength: MUST
    statement: 原生骨架提供刷新入口：点击后重新检查已保存的干净 harness 地址并重连——可达且会话有效时回到团队页骨架（重新取全量 state），不可达时显示本地错误页；没有有效配置时回到首次设置页。
    scenarios:
      'native-refresh-reconnects:':
        - GIVEN: 团队页骨架在线显示
        - WHEN: 点击刷新入口
        - THEN: 重新走可达性与会话检查并回到团队页骨架（重新取全量 state），不出现网页
  cleartext-restriction:
    strength: MUST
    statement: App 的原生网络请求只对已保存 harness 的源放行明文 http：对其他主机的明文请求不发出（原生请求目标本身限定已保存源）；https 请求不受限制。WebView 承载移除后不再存在网页子资源加载面。
    scenarios:
      'native-http-gated-to-origin:':
        - GIVEN: 已保存 http://10.0.2.2:13080/
        - WHEN: 原生客户端请求该源的 /api 端点
        - THEN: 请求正常发出；对任何其他主机的明文请求不会发生（请求构造即限定已保存源）
  session-establish:
    strength: MUST
    statement: 在首次设置页、设置页保存带有效 token 的地址后，App 以原生 HTTP 只请求一次带 token 地址建立会话（跟随同源重定向并携带过程中签发的 cookie），成功后把 dsh-auth cookie 持久化到 App 私有存储（强杀后仍保留）并进入原生骨架（不再加载任何网页）；带 token 地址不进入配置文件或日志。原生建立失败（网络错误、终态未取得会话）时按连接失败或会话失效的既有页面分流，不进入主界面。
    scenarios:
      'establish-enters-native-shell:':
        - GIVEN: mock dsh 在 http://10.0.2.2:13080/，用户粘贴带 token 地址并保存
        - WHEN: 首次设置页点击开始使用
        - THEN: 原生请求一次带 token 地址取得会话 cookie，进入团队页骨架（无网页加载），配置只存干净地址
  session-persist-restart:
    strength: MUST
    statement: 会话建立后强杀并重启 App：无需重新输入地址，直接进入团队页骨架（会话 cookie 已持久化）；只要会话仍有效，重启后不出现首次设置页或重新认证页。
    scenarios:
      'kill-restart-keeps-session:':
        - GIVEN: 用户已建立会话并停留在团队页骨架
        - WHEN: 强杀 App 后重新启动
        - THEN: 直接进入团队页骨架，不出现首次设置页或重新认证页
  session-expired-reauth:
    strength: MUST
    statement: 会话失效时（原生请求对干净地址收到 401，http 与 https 地址同样判定），App 先自动重试一次，仍失效则把主界面切换为本地重新认证提示页：说明需要在 DSH 主机上运行 dsh-url 获取新地址，并提供「打开设置」按钮；提示页不显示 token，也不显示 dsh 返回的 401 原文。在重新认证提示页经设置页粘贴新的带 token 地址并保存后，无需重启 App 即恢复团队页骨架。
    scenarios:
      'reauth-recovers-native:':
        - GIVEN: 主界面显示重新认证提示页
        - WHEN: 点击打开设置，粘贴新带 token 地址并保存
        - THEN: 设置页关闭，主界面经一次原生建立后恢复团队页骨架，配置只存干净地址
  tunnel-optional-onboarding:
    strength: MUST
    statement: App 内嵌可选的 Tailscale 隧道（进程内 userspace 节点）：从未配置 auth key 且无已注册节点状态时，隧道完全不启动（不发起登录）；首次设置页的 auth key 输入可留空，留空且地址不在 tailnet 时首次设置、设置页与主页面行为与无隧道时一致；在首次设置页填写 auth key 或在设置页 Tailscale 卡片粘贴 tagged auth key 都会发起连接；卡片未配置时显示未配置状态，可清除 key 与节点状态回到未配置。
    scenarios:
      unconfigured-no-tunnel:
        - GIVEN: 从未提供 auth key，也无节点状态
        - WHEN: 启动 App，首次设置页 auth key 留空并使用非 tailnet 地址，之后使用全部既有功能
        - THEN: 隧道不启动、不发起任何登录，设置页 Tailscale 卡片显示未配置，其余功能与之前完全一致
      first-run-key-connects:
        - GIVEN: 从未提供 auth key，也无节点状态
        - WHEN: 在首次设置页填写有效 tagged auth key 与地址并通过验证
        - THEN: 隧道连接成功，进入主页面后设置页 Tailscale 卡片显示已连接与节点名
      clear-back-to-unconfigured:
        - GIVEN: 已配置 key 且节点处于任意状态
        - WHEN: 在 Tailscale 卡片点击「清除」
        - THEN: 节点关停、key 与节点状态被删除，卡片回到未配置，隧道不再启动
  tunnel-states:
    strength: MUST
    statement: 隧道状态为五种并在设置页 Tailscale 卡片实时显示：未配置、连接中、已连接（含节点名）、需要 key（已有节点状态但被 tailnet 拒绝或 key 过期，提示重新输入 key）、失败（附原因说明）；粘贴 auth key 后进入连接中，成功进入已连接，被拒绝或过期进入需要 key，其他错误（包括本机权限、证书与网络类错误）进入失败；auth key 不出现在界面回显、日志与错误信息中，节点注册成功后 App 不再保留 auth key（此后重连只凭持久节点状态）。
    scenarios:
      connect-with-key:
        - GIVEN: 卡片处于未配置或需要 key
        - WHEN: 粘贴 tagged auth key 并点击连接
        - THEN: 卡片进入连接中，节点注册成功后显示已连接与节点名，key 不被回显
      needs-key-on-rejection:
        - GIVEN: 已有节点状态，节点在 tailnet 被删除或 key 过期
        - WHEN: 隧道尝试连接
        - THEN: 卡片显示需要 key，提示重新输入，不显示 key 值
      failed-with-reason:
        - GIVEN: 连接因网络或其他错误失败
        - WHEN: 连接尝试结束
        - THEN: 卡片显示失败与原因说明（不含 key）
      key-not-retained-after-connect:
        - GIVEN: 用 tagged auth key 连接且节点注册成功（卡片显示已连接）
        - WHEN: 检查 App 私有存储中的偏好与文件
        - THEN: 不含该 auth key；强杀重启后仍凭节点状态回到已连接
      local-error-not-needs-key:
        - GIVEN: 连接因本机权限错误（如 permission denied）或证书错误失败
        - WHEN: 连接尝试结束
        - THEN: 卡片显示失败与原因说明，而不是需要 key
  tunnel-reconnect-after-restart:
    strength: MUST
    statement: 节点状态持久化在 App 私有存储：已连接后强杀并重启 App，无需重新输入 auth key 即凭持久状态重连并回到已连接；重连期间卡片显示连接中；仅当 tailnet 侧拒绝（节点被删除或 key 失效）时才进入需要 key。
    scenarios:
      kill-restart-reconnects:
        - GIVEN: 节点已连接（曾用 key 注册，状态已持久化）
        - WHEN: 强杀 App 后重新启动
        - THEN: 隧道凭持久状态自动重连，卡片先显示连接中随后回到已连接，全程无需输入 key
  proxy-split-routing:
    strength: MUST
    statement: App 的全部原生网络请求（探测、会话建立、API、feed 长连接）按目标分流：tailnet 目标（100.64.0.0/10、fd7a:115c:a1e0::/48、*.ts.net、MagicDNS 短名）经内嵌 Tailscale 节点的 SOCKS5 转发，其他目标经手机网络直连；feed 的 SSE 长连接在同一分流路径上持续工作；非 tailnet 的 harness 地址在隧道任何状态下都照常直连，不受隧道影响；不存在本机监听的代理端口。
    scenarios:
      'native-split-dial:':
        - GIVEN: 已配置 tailnet 上的 harness 地址，隧道已连接
        - WHEN: App 发起探测、API 请求与 feed 订阅
        - THEN: 请求全部经内嵌节点发出，feed 持续收到事件；非 tailnet 地址的全部请求经手机网络直连
  tunnel-gated-tailnet-load:
    strength: MUST
    statement: 配置的 harness 地址为 tailnet 目标时，原生骨架按隧道状态联动：隧道未配置时显示需要接入 tailnet 的本地说明与「去设置」入口，不发起连接；隧道连接中、需要 key 或失败时显示隧道状态与「重试连接」「去设置」入口；隧道变为已连接后自动进入连接流程（探测、feed 同步）；全部网络请求（探测、会话、API、feed）经同一分流路径发出（tailnet 目标经内嵌节点 SOCKS5、其余直连）。
    scenarios:
      'auto-connect-on-tunnel-up:':
        - GIVEN: 已配置 tailnet 地址，骨架显示隧道等待面板
        - WHEN: 隧道变为已连接
        - THEN: 骨架自动走可达性与会话检查并进入团队页骨架（feed 同步开始）
  update-check-and-verify:
    strength: MUST
    statement: App 在启动后（每个进程至多自动一次）与设置页手动触发时检查公开 GitHub 仓库的最新 Release（匿名、经手机网络）：仅当 Release 含 DSH-Anywhere-<版本>.apk 资产且其 tag 派生的版本号高于本机安装版本时提示更新（无 APK 资产的 Release 视为无新版本）；下载到 App 私有目录支持断点续传：下载中断后重试从已下载处继续，已下载完整但尚未校验的文件不会被重复下载或导致下载失败；下载完成后读取同名 .sha256（每次重新获取）校验：一致才允许安装，不一致或缺失 .sha256 时删除文件、提示失败且不调起安装器；校验通过的更新包在再次检查更新、界面重建与 App 重启后仍保持可安装（直至安装完成）；开始下载新版本前清理旧 APK，安装完成前不删除已校验的文件；更新检查与下载失败（网络、限流）不打扰用户，只在设置页显示原因。
    scenarios:
      newer-release-prompted:
        - GIVEN: 本机安装 1.0.0，最新 Release v1.1.0 含 DSH-Anywhere-1.1.0.apk 与 .sha256
        - WHEN: 启动后自动检查或手动触发
        - THEN: 设置页显示新版本 1.1.0 可下载，下载进度可见，校验通过后提供安装入口
      checksum-mismatch-rejected:
        - GIVEN: 下载完成但 APK 内容与 .sha256 不一致（或 Release 缺 .sha256）
        - WHEN: 校验执行
        - THEN: 已下载文件被删除、提示校验失败，系统安装器没有被调起
      no-apk-release-silent:
        - GIVEN: 最新 Release 只含桌面安装包（无 APK 资产）
        - WHEN: 检查更新
        - THEN: 视为无新版本，不提示更新
      interrupted-download-resumes:
        - GIVEN: 上次下载在 .sha256 已下载完整、APK 只下载了一部分（或已下载完整但尚未校验）时被中断
        - WHEN: 再次点击下载
        - THEN: APK 从已下载处继续（或直接进入校验），校验通过后提供安装入口，不出现下载失败
      ready-survives-recheck-restart:
        - GIVEN: 更新包已下载并校验通过，设置页显示安装入口
        - WHEN: 再次点击「检查更新」，或强杀后重新启动 App
        - THEN: 设置页仍显示安装入口，不回到「可下载」，不重新下载
  update-install-flow:
    strength: MUST
    statement: 校验通过的更新包经系统安装器完成覆盖升级：App 在前台时直接调起安装器，在后台时发送「新版本已就绪」通知、点击通知后调起安装器（App 进程已被回收后点击同样有效）；每个进程会话自动调起至多一次，设置页始终保留手动安装入口；安装调起需要用户在系统安装器中确认，App 不静默安装。App 启动或回到前台时不跳转任何系统权限页、不请求通知权限：仅在即将调起安装器而未授权「安装未知应用」时打开该 App 的授权页，用户返回后已授权则调起安装器、未授权则停留在 App 内且不再跳转；通知权限（Android 13+）只在用户点击下载更新时请求，至多请求一次，拒绝后不再请求。
    scenarios:
      foreground-install-invoked:
        - GIVEN: 下载与校验完成，App 在前台
        - WHEN: 用户点击安装（或本会话首次自动触发）
        - THEN: 系统安装器被调起并显示升级确认，用户确认后完成覆盖升级，新版 versionName 高于旧版
      background-notification:
        - GIVEN: 下载与校验完成时 App 已在后台
        - WHEN: 下载完成
        - THEN: 收到「新版本已就绪」通知，点击通知后系统安装器被调起
      notification-after-process-death:
        - GIVEN: 「新版本已就绪」通知已发出，之后 App 进程被系统回收
        - WHEN: 点击通知
        - THEN: App 冷启动并调起系统安装器
      launch-no-permission-jump:
        - GIVEN: App 未被授予「安装未知应用」与通知权限
        - WHEN: 启动 App、切到后台再回到前台
        - THEN: 界面停留在 App 内（首次设置页或主页面），不打开系统设置页，不弹出权限请求
      install-asks-unknown-sources-on-demand:
        - GIVEN: 更新包已校验，App 未被授予「安装未知应用」
        - WHEN: 点击安装
        - THEN: 打开该 App 的「安装未知应用」授权页；授权后返回即调起系统安装器，未授权返回则停留在设置页且不再跳转，安装入口仍在
      notification-permission-once:
        - GIVEN: Android 13+，App 从未请求过通知权限
        - WHEN: 在设置页点击下载更新，拒绝通知权限后再次下载
        - THEN: 第一次点击时请求一次通知权限，之后不再请求，下载照常进行
  first-run-verify:
    strength: MUST
    statement: 在首次设置页点击「开始使用」后，App 先验证再保存：验证期间输入与按钮不可用并显示当前阶段（连接 Tailscale、检查地址）。验证依次为：(1) 填了 auth key 且隧道未连接时用该 key 连接隧道并等待结果，结果不是已连接时在 auth key 输入下显示隧道状态与原因（不含 key），不再检查地址，且该 auth key 不留存在私有存储（此前没有节点时也不留下节点状态，隧道仍为未配置）；(2) 未填 auth key、地址为 tailnet 目标且隧道未连接时：隧道为未配置或需要 key 则在 auth key 输入下提示该地址位于 tailnet、需要填写 auth key；隧道为连接中或失败则凭已有节点状态重连并等待结果，仍未连接按 (1) 显示；(3) 对去掉 token 的干净地址做与主页面相同定义的可达性探测（任何 HTTP 响应即可达，tailnet 目标经内嵌节点），不可达时在地址输入下显示按原因分类的说明（无法解析主机名、连接被拒绝、连接超时、安全连接失败）与检查地址、确认服务在运行的提示。任一步失败都不保存配置、停留在首次设置页，修改输入后可再次点击；未填 auth key 且地址不在 tailnet 时不启动、不触碰隧道。
    scenarios:
      non-tailnet-no-key-passes:
        - GIVEN: 首次设置页已打开，隧道从未配置，http://10.0.2.2:13080/ 有服务
        - WHEN: 只填该地址（auth key 留空）并点击「开始使用」
        - THEN: 隧道保持未配置、不发起登录，配置保存 http://10.0.2.2:13080/ 并进入主页面
      tailnet-missing-key:
        - GIVEN: 首次设置页已打开，隧道从未配置
        - WHEN: 只填 http://gamepc:13080/ 并点击「开始使用」
        - THEN: auth key 输入下提示该地址位于 tailnet、需要填写 auth key，配置未保存，停留在首次设置页
      key-connects-then-probes:
        - GIVEN: 首次设置页已打开，隧道从未配置，tailnet 地址 http://gamepc:13080/ 有服务
        - WHEN: 填写有效 tagged auth key 与该地址并点击「开始使用」
        - THEN: 先显示连接 Tailscale 阶段，隧道已连接后显示检查地址阶段，可达后进入主页面；key 不出现在界面文本与 App 私有存储中
      bad-key-shows-under-key:
        - GIVEN: 首次设置页已打开，隧道从未配置
        - WHEN: 填写无效或已过期的 auth key 与任意合法地址并点击「开始使用」
        - THEN: auth key 输入下显示需要 key 或连接失败及原因（不含 key 值），不检查地址，配置未保存，停留在首次设置页
      unreachable-shows-under-address:
        - GIVEN: 首次设置页已打开，http://10.0.2.2:13080/ 端口没有服务
        - WHEN: 填写该地址并点击「开始使用」
        - THEN: 地址输入下显示连接被拒绝或连接超时的说明与检查地址、确认服务在运行的提示，配置未保存，停留在首次设置页
      retry-after-fix:
        - GIVEN: 首次设置页显示地址不可达的提示
        - WHEN: 把地址改为可达地址并再次点击「开始使用」
        - THEN: 进入主页面
      bad-key-not-retained:
        - GIVEN: 首次设置页已打开，隧道从未配置，用户填写无效 auth key 后验证失败
        - WHEN: 清空 auth key、填写可达的非 tailnet 地址并通过验证，之后重启 App
        - THEN: App 私有存储中没有该 auth key 与节点状态，设置页 Tailscale 卡片显示未配置，隧道不发起登录
  settings-save-verify:
    strength: MUST
    statement: 在设置页点击「保存」时，App 先做与首次设置页相同的连通验证（设置页的地址区没有 auth key 输入，隧道由 Tailscale 卡片管理）：验证期间「保存」不可用并显示正在验证；地址为 tailnet 目标而隧道未连接时（隧道为连接中或失败先凭已有节点状态重连并等待结果），在地址输入下提示该地址需要 Tailscale 隧道、请在下方 Tailscale 卡片连接；地址不可达时在地址输入下显示按原因分类的说明与检查提示。验证失败时不修改配置、停留在设置页；验证通过才保存并返回主页面。
    scenarios:
      unreachable-not-saved:
        - GIVEN: 已保存 https://a.example.test/，设置页已打开并把地址改为 http://10.0.2.2:13999/（该端口没有服务）
        - WHEN: 点击「保存」
        - THEN: 地址输入下显示连接被拒绝或连接超时的说明，停留在设置页，配置仍为 https://a.example.test/
      tailnet-without-tunnel:
        - GIVEN: 隧道从未配置，设置页已打开
        - WHEN: 把地址改为 http://gamepc:13080/ 并点击「保存」
        - THEN: 地址输入下提示需要在下方 Tailscale 卡片连接隧道，配置不变，停留在设置页
      reachable-saves:
        - GIVEN: 设置页已打开，新地址 http://10.0.2.2:13080/ 有服务
        - WHEN: 把地址改为该地址并点击「保存」
        - THEN: 配置保存为该地址，返回主页面并重新加载 harness 页面
  connection-error-hint:
    strength: MUST
    statement: 主页面连接出错时按原因提示应去设置检查的项目：本地错误页在原因说明下显示检查提示——已保存地址为 tailnet 目标时提示检查设置中的 Tailscale 隧道状态与 dsh 地址，否则提示检查 dsh 地址是否正确并确认 DSH 主机上的服务在运行；隧道等待面板（连接中、需要 key、失败）显示检查设置中 Tailscale auth key 与隧道状态的提示；两者都提供进入设置页的按钮。提示为固定文本，不含 token 或 auth key。
    scenarios:
      non-tailnet-error-hint:
        - GIVEN: 已保存 http://10.0.2.2:13080/，该端口没有服务
        - WHEN: 启动 App
        - THEN: 错误页在原因说明下显示检查 dsh 地址并确认服务在运行的提示，以及「修改地址」按钮
      tailnet-error-hint:
        - GIVEN: 已保存 tailnet 地址，隧道已连接但该地址没有服务
        - WHEN: 打开主页面
        - THEN: 错误页显示检查 Tailscale 隧道状态与 dsh 地址的提示，以及「修改地址」按钮
      tunnel-wait-hint:
        - GIVEN: 已保存 tailnet 地址，隧道处于失败或需要 key
        - WHEN: 打开主页面
        - THEN: 隧道面板显示检查设置中 Tailscale auth key 与隧道状态的提示，以及「打开设置」与「重试连接」按钮
  webview-cookie-migration:
    strength: MUST
    statement: 从 WebView 版本（会话 cookie 只在 WebView CookieManager 中）覆盖升级到本版本后首次启动：App 用 CookieManager.getCookie 读取该保存源的 dsh-auth cookie 并迁入原生存储，成功后直接进入主页面显示 harness 页面，无需重新粘贴带 token 地址；迁移不到或读出的 cookie 无效时显示本地重新认证页，不显示空白页或报错崩溃，重新粘贴新地址后即恢复。
    scenarios:
      'upgrade-migrates-cookie:':
        - GIVEN: 旧版本 App 已建立 dsh 会话（cookie 在 WebView CookieManager），覆盖安装升级到本版本
        - WHEN: 首次启动
        - THEN: App 迁移该源的 dsh-auth cookie 到原生存储并直接进入主页面，无需重新输入地址
      'migration-miss-shows-reauth:':
        - GIVEN: 旧版本从未建立会话或 cookie 已失效（CookieManager 无该源的 dsh-auth cookie）
        - WHEN: 升级后首次启动
        - THEN: 显示本地重新认证页（含运行 dsh-url 说明与打开设置按钮），不出现空白或崩溃，粘贴新带 token 地址保存后恢复主页面
  forbidden-host-hint:
    strength: MUST
    statement: 原生请求对已保存 harness 源收到 403（Host 与 dsh trusted-host 配置不一致）时，主页面显示本地提示页说明需要在 DSH 主机把该地址加入 trusted-host（dsh web 的 --trusted-host 参数），并提供「打开设置」按钮；提示不显示 token 与 cookie。
    scenarios:
      'forbidden-shows-hint:':
        - GIVEN: 已保存地址的 Host 未列入 dsh 服务的 trusted-host（原生探测返回 403）
        - WHEN: 启动 App 或刷新
        - THEN: 主页面显示 trusted-host 配置提示页与「打开设置」按钮，不显示 403 原文
