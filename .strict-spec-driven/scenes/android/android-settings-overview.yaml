schema: strict-spec-driven/scene/v1
schema_version: 1
artifact_type: scene
schema_file: templates/strict-spec-driven/schemas/scene.yaml
scene:
  id: android-settings-overview
  title: 在团队页进入原生设置概览总览团队状态并跳转对应设置页
area: android
status: draft
actors:
  - name: user
    role: 手机端使用团队成员
  - name: dsh
    role: 远端 DS-Bot / dsh 服务
preconditions:
  - App 已连接远端 DS-Bot 服务并同步团队 state
main_flow:
  open-overview:
    action: 用户在团队页点按首位「概览」入口进入全屏设置概览页，页面显示需要处理告警、团队成员与模型槽位、状态汇总磁贴（模型、连接、工具、近 7 天用量、定时任务、外观）及分组设置列表与状态徽标
    covered_by:
      - spec_id: android-dsbot
        requirement_id: settings-overview
  jump-to-settings:
    action: 用户点按概览页上的告警、成员、汇总磁贴或分组列表行，App 跳入对应的原生设置子页、Bot 详情或新建页面，按返回键回到概览页并保持刷新
    covered_by:
      - spec_id: android-dsbot
        requirement_id: settings-overview
  language-and-live-sync:
    action: 远端 state 变化或用户在设置页切换界面语言后返回概览页，概览页标题、芯片与状态徽标按当前语言与最新状态即时更新；usage 扫描中且前台可见时每 3 秒静默刷新，离开或退后台停止轮询
    covered_by:
      - spec_id: android-dsbot
        requirement_id: settings-overview
exception_flows:
  legacy-or-unsupported-remote:
    trigger: 远端未下发连接器/IM/MCP/能力库/电脑操控/密钥/浏览器字段，或按需端点返回 bot/not-found
    steps:
      hide-unavailable-items:
        action: 概览页隐藏不支持的汇总磁贴与分组设置行，其余可用部分照常显示与跳转，不展示错误页或崩溃
        covered_by:
          - spec_id: android-dsbot
            requirement_id: settings-overview
  ondemand-read-failed:
    trigger: 按需读取 providers、usage、schedules 或 update-check 因网络失败或服务端临时错误返回失败
    steps:
      partial-degrade-keep-state:
        action: 对应按需区块保留已有缓存或显示占位（如近 7 天显示「–」），其余基于 state 的概览区块与跳转照常可用，不自动重试，点按手动刷新可重试
        covered_by:
          - spec_id: android-dsbot
            requirement_id: settings-overview
