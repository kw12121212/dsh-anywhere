schema: strict-spec-driven/scene/v1
schema_version: 1
artifact_type: scene
schema_file: templates/strict-spec-driven/schemas/scene.yaml
scene:
  id: android-chat-open-file-link
  title: 在群聊查看 Bot 汇报并打开交付文件与复制文字
area: android
status: draft
actors:
  - name: 手机用户
    role: 用 Android App 查看群聊并取用 Bot 产出的交付文件
preconditions:
  - 已连接团队并进入群聊（如血汗工厂），群内有 Bot 收工汇报，消息 Markdown 的 - 列表行内含多个指向服务器本地路径的文件链接（如 PDF/成片/日报）
main_flow:
  see-report:
    action: 看到汇报消息，列表行中的文件链接以可点样式呈现（与段落行链接一致）
    covered_by:
      - spec_id: android-dsbot
        requirement_id: bot-chat-render
  tap-file:
    action: 点按文件链接，应用经服务器取回文件内容并交系统应用打开（PDF 出查看器、视频出播放器）
    covered_by:
      - spec_id: android-dsbot
        requirement_id: bot-chat-render
  longpress-chooser:
    action: 长按文件链接，弹出「选择打开方式」选择器，选定应用后打开
    covered_by:
      - spec_id: android-dsbot
        requirement_id: bot-chat-render
  select-copy:
    action: 长按消息正文进入文字选择，拖选部分文字复制；点按气泡仍复制整条消息
    covered_by:
      - spec_id: android-dsbot
        requirement_id: bot-chat-render
exception_flows:
  file-open-failed:
    trigger: 文件不存在、超过服务器大小限制或网络失败
    steps:
      show-notice:
        action: 聊天页显示可读失败原因（如文件不存在或已被移动），不崩溃
        covered_by:
          - spec_id: android-dsbot
            requirement_id: bot-chat-render
