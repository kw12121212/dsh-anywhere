schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: macos-cards-dock
approach:
  - 停靠区与卡片全在 App 层 SwiftUI：状态经 state 的 questions/views/approvals/secretRequests/connectorRequests/btwCards/sideChats 装配（TeamHome pending 已有同源），作答经控制器 chatAction（approvalAnswer/answerQuestion/viewReply/secretSet/learningAnswer/browserGiveBack/dismiss 既有构造）；图表用 Swift Charts；沙箱 HTML 卡独立 WKWebView 配置（非持久化、无桥接、WKContentRuleList 阻断网络、拦截导航）
decisions:
  dock-single-expand-kotlin-parity:
    decision: 停靠区排序（学习/审批→提问→密钥/连接器/邮件→交接→卡片）与一次展开一张（首张默认展开、新卡不打断正在填写、作答移出自动展开下一张、点按已展开可收起、高度上限可滚动）在 App 层实现，排序键与状态来源复用 state 装配（TeamHome pendingOf 同源逻辑）
    rationale: pending-dock 规格的排序与展开语义已在 Android 实现定形；状态源单一（state）避免与聊天条目双份解析
  sandbox-webview-no-network:
    decision: 沙箱 HTML 卡用独立 WKWebView：websiteDataStore 非持久化、不注册任何 WKScriptMessageHandler 与 script 桥、决定策略拦截所有导航（cancel）、WKContentRuleList 阻断所有网络子资源请求（img/script/fetch 等）、不授权本地文件读；以构造的含外链图片与 fetch 的 HTML 卡在验收中验证零网络请求
    rationale: 里程碑风险条：沙箱配置不当会让不可信 Bot 内容访问网络或本地文件；规则表全阻断+导航拦截双保险，验证项写入验收
  charts-degrade-readonly:
    decision: show_view 图表段用 Swift Charts 按类型绘制（line/area/bar/column-horizontal/donut 环形）；数据畸形（非数值/负尺寸）、超限（段数/点数）或未知类型整体降级为只读文本（Cards.asReadOnly 既有语义），不崩溃不空白
    rationale: view-card-render 规格：畸形数据降级只读文本；Charts 为系统框架无需第三方依赖
alternatives: []
risks: []
