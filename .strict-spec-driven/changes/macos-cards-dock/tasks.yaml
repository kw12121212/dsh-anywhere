    macos-ci-and-device-acceptance:
      text: 沿用持续授权：推送→CI→产物真机验收（卡片渲染与作答同步、停靠一次展开、图表按数据绘制与畸形降级、密钥不回显、沙箱 HTML 零网络请求验证），通过后归档；阻塞缺陷停下报告
      status: pending
