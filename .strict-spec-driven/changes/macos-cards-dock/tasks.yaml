sections:
  Implementation:
    app-card-views:
      text: macos/App 卡片视图族：审批（同意/拒绝）、提问（单选即交/多选与自填提交/可忽略）、show_view 各段（文本/指标/表格/公式/进度/选择/确认/表单/滑块/数字/开关/来源）与 Swift Charts 图表（畸形超限未知降级只读）、密钥卡（SecureField 不回显）、学习审批差异（逐行差异折叠）、连接器请求（取消/去连接提示）、浏览器交接（dsh 宿主降级提示）、btw 卡、作答动作经 chatAction（构造复用 DshCore）
      status: complete
    app-dock-view:
      text: 停靠区视图：按排序汇集当前会话待处理卡（复用 state 装配），一次展开一张（默认首张、新卡不打断、作答移出展开下一张、可收起）、高度上限可滚动、空时不显示；作答成功本地消隐并触发 state 刷新
      status: complete
    app-sandbox-html:
      text: 沙箱 HTML 卡：独立 WKWebView（非持久化 dataStore、无脚本桥接、导航全拦截、WKContentRuleList 阻断网络子资源、不授权本地文件），加载卡片 HTML；以含外链图片与 fetch 的构造卡验证零网络请求
      status: complete
  Testing:
    swift-core-tests:
      text: DshCore 停靠区纯逻辑移植与测试：ViewFormula/ViewCard（deep-view 0.1.2 公式与组件树校验/图表数据/作答构造）、PendingDock+LineDiff（汇集/排序/作答请求体/学习差异）与 Kotlin 同夹具；既有 Cards 夹具测试维持绿
      status: complete
      command: swift test --package-path macos/Core
    macos-app-local-build:
      text: 推送前本机 swift build --package-path macos/App
      status: complete
      command: swift build --package-path macos/App
    full-regression:
