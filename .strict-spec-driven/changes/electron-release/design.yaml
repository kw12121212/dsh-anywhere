schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: electron-release
approach:
  - 在仓库根新增 electron-builder.yml：appId work.keepwriting.dsh-anywhere、productName DSH Anywhere，图标指向整理后的 buildResources 目录，目标为 Windows NSIS、macOS universal dmg、Linux AppImage 与 deb，artifactName 模板产出 dsh-anywhere_<版本>_<平台>_<架构>[_installer].<扩展> 命名；electron-vite 产物 out/ 作为打包输入，afterPack 钩子复用 scripts/fuses.mts 对解包二进制翻转 fuses。打包入口封装为 npm script，CI 与发布工作流只调用该入口，不在工作流中复制打包命令。
  - 'CI package.yml 三平台矩阵删除 Go、wails3、choco NSIS 与 GTK/WebKitGTK 安装步骤；checkout 保持 fetch-depth: 0，由 git describe --tags --exact-match 计算 VERSION（去 v 前缀，缺省 dev），同一 VERSION 注入 APP_VERSION 环境变量（electron-vite define）与 electron-builder extraMetadata.version，保证关于对话框、安装包元数据与文件名三者同源。release.yml 保持 workflow_call 复用 package.yml、四类安装包齐全性断言、SHA256SUMS、草稿先行失败即删的结构，仅对齐 electron-builder 产物路径与命名。'
  - 删除 Go/Wails：go.mod、go.sum、main.go、internal/、frontend/、Taskfile.yml、build/ 下 Wails 生成资产（图标整理保留）；config.yaml 的 context、code 规则（删 Wails bindings 规则）、回归命令与 coverage scope 改为纯 Node；regression.yml 删 Go 与 GTK 安装步骤；AGENTS.md 与 README 技术栈、常用命令、Linux 依赖说明同步改写；internal/ 的 workflow 断言测试先迁移为 TypeScript（Vitest）再删除 Go 代码，Wails/Go 专属 lessons 标记过时。
decisions:
  electron-builder-config-file:
    decision: electron-builder 配置独立为仓库根 electron-builder.yml，打包命令封装为 npm script（内部执行 electron-vite build 与 electron-builder）
    rationale: 与 electron.vite.config.ts 平级、不与 package.json 运行时字段混杂且可用注释；CI 与本地共用同一入口，满足 packaging 标准打包权威源单一的要求
  version-single-source-via-ci:
    decision: 版本号由 CI 从 git tag 精确匹配派生（去 v 前缀，未命中为 dev），同一值注入 APP_VERSION 环境变量与 electron-builder extraMetadata.version；package.json 的 0.0.0 保持私有占位
    rationale: 满足 build-identity 的 electron-identity-single-source 与 packaging 的 package-version-from-tag：关于页、安装包元数据与文件名必须同源，否则包管理器与关于窗口互相矛盾且只在打包后暴露
  fuses-afterpack:
    decision: electron-builder afterPack 钩子复用 scripts/fuses.mts 对解包产物执行 fuses 翻转，安装包内二进制与开发期基线一致
    rationale: 把 fuses 步骤并入打包权威源，避免 CI 对最终安装包二次处理或本地与 CI 产物不一致
  keep-icons-relocate:
    decision: 保留现有三平台图标（build/darwin/icons.icns、build/windows/icon.ico、build/appicon.png 派生 Linux png），整理进 electron-builder buildResources 约定位置，删除其余 Wails 生成资产
    rationale: app-identity 主规格要求图标不变；Wails 资产（Info.plist、nfpm、nsis、msix 等）在 Electron 管线下已无消费者，保留只会误导
  no-delta-spec:
    decision: 本变更为纯技术迁移（发布管线切换与旧栈移除），不新增、不修改、不退役任何主规格需求，specs/ 目录保持为空
    rationale: 计划变更明确“不改变任何主规格”；全部十个主规格的可观察行为由已归档的 Electron 复刻变更实现并保持原样，本变更只触碰打包、CI、构建资产、技术标准与文档
alternatives:
  - option: 在 package.json 内嵌 electron-builder build 字段
    reason: 与运行时字段混杂且 JSON 无注释，配置评审与维护成本高于独立 YAML
  - option: 保留 Taskfile 作为统一任务入口调用 electron-builder
    reason: 里程碑目标是不再依赖 Go 工具链；npm scripts 已覆盖 dev、build、test 全部入口，保留 Taskfile 只增加一层无收益的间接
risks:
  - electron-builder 各目标默认产物名与 release.yml 断言的命名模板需实测对齐，模板差异会在发布时才发现并阻塞发布
  - internal/ 的 workflow 结构断言测试必须先迁移为 TypeScript 再删 Go 代码，顺序颠倒会留下 CI 断言缺口
  - electron-builder 下载 NSIS 与 AppImage 工具链依赖网络，GitHub runner 可用但本机受限环境打包可能失败
