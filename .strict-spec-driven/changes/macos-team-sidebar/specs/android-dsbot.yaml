schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: android-dsbot
operations:
  ADDED: {}
  MODIFIED:
    team-page-list:
      strength: MUST
      statement: 客户端的团队列表（Android 为团队页、macOS 为主窗口团队侧栏）显示 Bot 与群聊的分组列表：每个条目显示名称（超长截断）与工作/空闲状态点；预览、置顶与分组、Main/私有标记等字段在远端返回时显示、缺失时降级为不显示（条目仍在列表中，头像以颜色圈呈现）；每个分组内 Main Bot 排在最前，其余按置顶优先、最近活动时间（lastAt）新到旧排序，无 lastAt 的排后、名称兜底；未读由本机已读状态计算（见 team-read-state），远端 unread 字段不作为依据；feed 的团队变更事件自动刷新列表，手动刷新入口重取全量；空团队显示首次创建引导（创建第一个 Chief）。平台差异：进入列表的方式（Android 底部导航团队页 / macOS 侧栏常驻）与刷新入口位置（Android 工具栏 / macOS 状态条刷新按钮）不同，列表内容与排序两端一致。
      scenarios:
        list-matches-web:
          - GIVEN: 已连接团队，远端 state 含分组与条目字段
          - WHEN: 打开团队列表
          - THEN: 分组结构与条目按返回数据渲染，返回了预览/置顶字段时对应显示，字段缺失时条目仍显示且不崩溃，与 DS-Bot 网页端同源数据的呈现一致
        empty-team-guide:
          - GIVEN: 远端团队为全新空团队
          - WHEN: 打开团队列表
          - THEN: 显示首次创建引导（创建第一个 Chief），不显示空白列表
        fields-missing-degrade:
          - GIVEN: 远端 state 的条目缺 preview/lastAt/pinned 字段
          - WHEN: 团队列表渲染
          - THEN: 条目正常显示名称与状态，摘要/未读点/置顶不显示，无错误或空白页
        main-bot-first:
          - GIVEN: 同一分组里有 Main Bot、置顶 Bot 与最近活动更新的普通 Bot
          - WHEN: 团队列表渲染
          - THEN: Main Bot 排第一，其次置顶 Bot，其余按最近活动新到旧排列
    team-search:
      strength: MUST
      statement: 团队列表提供搜索框：按名称与最近消息内容过滤当前列表条目，输入即时过滤、清空恢复完整列表；搜索不改变分组与排序结构，无结果时显示无匹配提示。平台差异：Android 搜索框固定在团队页列表顶部；macOS 搜索框在团队侧栏顶部，并提供 ⌘K 快捷键聚焦（视图菜单提供同一入口）。
      scenarios:
        search-filters:
          - GIVEN: 团队列表显示完整列表
          - WHEN: 输入某 Bot 名称片段
          - THEN: 列表只剩名称或摘要含该片段的条目，结构仍按分组；清空输入后恢复完整列表
    needs-you-summary:
      strength: MUST
      statement: 团队列表条目行内提示待办：某 Bot 或群有等待用户处理的工具/密钥/连接器/学习审批、ask_user 提问或交互卡片时，对应条目在名称行显示待办标签（类型文案，强调色），点击该条目进入对应聊天处理；作答完成后标签移出。原「需要你」汇总入口与汇总页已被行内提示取代，两端不再提供独立汇总页。
      scenarios:
        pending-label-jump:
          - GIVEN: 一个 Bot 发起了 ask_user 提问
          - WHEN: 团队列表渲染并点击该条目
          - THEN: 条目名称行显示「提问」待办标签（强调色），点击进入该 Bot 的聊天，作答后该条目标签消失
    team-read-state:
      strength: MUST
      statement: 客户端按 harness 主机分别保存每个 Bot 与群聊的最后已读时间：聊天处于前台可见时（macOS 为该条目在侧栏被选中），以该条目最近活动时间与聊天内最新条目时间中的较大者标记已读，收到当前聊天的实时消息时同步标记；团队列表条目在最近活动时间晚于已读时间且不是当前打开的聊天时显示未读点；已读状态保存在应用私有存储，重启后保持；已读只在本机，网页端与客户端的已读互不同步。平台差异：Android 以聊天页前台可见为已读条件，macOS 以侧栏选中为已读条件。
      scenarios:
        unread-clears-on-open:
          - GIVEN: 某 Bot 有新的活动，团队列表显示未读点
          - WHEN: 打开该 Bot 的聊天再返回团队列表
          - THEN: 未读点消失；重启应用后该条目仍为已读
        unread-after-new-activity:
          - GIVEN: 某 Bot 已读后又产生了新消息（最近活动时间晚于已读时间）
          - WHEN: 回到团队列表（未打开该聊天）
          - THEN: 该条目显示未读点
        per-host:
          - GIVEN: 客户端先后连接两个不同 harness 地址
          - WHEN: 在其中一个地址下打开聊天
          - THEN: 只影响该主机下对应条目的已读，另一主机的已读不变
    team-preview-priority:
      strength: MUST
      statement: 团队列表条目第二行按优先级显示一行预览：Bot 为 待回答的提问或卡片（「等你回答」）→ 待审批（工具审批、密钥或连接器请求、学习提案，「等你审批」）→ 正在做的工作短语 → 在群里工作（「群名 · 工作短语」）→ 最后一条消息摘要 → 角色；群为 待回答 → 待审批 → 成员工作（「成员名 · 工作短语」）→ 摘要。「等你回答 / 等你审批」以强调色显示。摘要去掉消息来源包装头，浏览器交接、提问卡与卡片回复的英文包装文字转为可读文本（如「浏览器交接：需要登录（已完成）」「已回答「选哪个窗口？」：周六」），文案随界面语言。两端预览优先级与清洗规则一致。
      scenarios:
        preview-waiting-answer:
          - GIVEN: 某 Bot 当前会话有待回答的提问
          - WHEN: 团队列表渲染
          - THEN: 该条目预览显示「等你回答」（强调色），而不是最后一条消息
        preview-working:
          - GIVEN: 某 Bot 正在运行命令且无待办
          - WHEN: 团队列表渲染
          - THEN: 预览显示对应工作短语（如「运行命令」）
        preview-handoff-readable:
          - GIVEN: '某 Bot 最后一条是浏览器交接回复，服务端预览为「[Browser handoff] 需要登录 Answer: done」'
          - WHEN: 团队列表渲染
          - THEN: 预览显示「浏览器交接：需要登录（已完成）」，不出现英文包装
    in-app-notice-banner:
      strength: MUST
      statement: 远端声明支持提醒（hello capabilities 含 notices）时，客户端在前台且已连接期间，任一非当前打开聊天里的 Bot 发起提问、请求审批、回复、在群里发消息或完成任务，界面顶部显示约 8 秒的应用内横幅（来源名称、类型与摘要；Android 覆盖在页面顶部，macOS 显示在主窗口内容顶部），点按进入对应 Bot 或群聊天；同时到来多条时只显示最新一条；当前打开的聊天不弹横幅；同一 dsh 运行期间断线重连后补齐断线期间的提醒（只显示最新一条），不重复显示已到达过的提醒；首次连接或 dsh 重启后不补弹历史提醒，改为重新获取整体团队状态；远端不支持提醒时不显示横幅、其余功能照常；横幅文本不写入日志与诊断上报。
      scenarios:
        banner-other-chat:
          - GIVEN: 停在 Bot A 的私聊中
          - WHEN: Bot B 发起提问
          - THEN: 界面顶部出现约 8 秒的横幅显示 B 与提问摘要，点按进入 B 的聊天；8 秒内未点按则自动收起
        no-repeat-after-restart:
          - GIVEN: 已经显示过若干横幅
          - WHEN: dsh 重启后客户端自动重连
          - THEN: 不重复弹出已显示过的横幅，团队列表按重新获取的整体状态显示
        current-chat-no-banner:
          - GIVEN: 停在 Bot A 的私聊中
          - WHEN: Bot A 回复
          - THEN: 不显示横幅，回复照常出现在聊天中
    notice-banner-toggle:
      strength: MUST
      statement: 设置界面提供「应用内提醒」开关（Android 设置页 / macOS 设置窗口），默认开启，保存在本机并跨重启保留；关闭后不再显示任何应用内提醒横幅，重新开启后恢复。
      scenarios:
        toggle-off:
          - GIVEN: 设置界面关闭了「应用内提醒」
          - WHEN: 非当前聊天的 Bot 发起提问
          - THEN: 不显示横幅；重新打开应用后开关仍为关闭
  REMOVED: {}
