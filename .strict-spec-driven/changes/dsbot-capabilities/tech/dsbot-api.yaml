schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: dsbot-api
operations:
  ADDED:
    capability-endpoints-0310:
      strength: MUST
      statement: '能力端点（DS-Bot 0.3.10，经 dsh 的 POST /api/bot，会话 cookie 鉴权）：state.capabilities 为能力库数组，每项 {name, kind: mcp|skill|pack, description(≤2000), createdBy(null=用户界面添加，否则为提议它的 botId), createdAt, updatedAt}，mcp 另有 transport: stdio{command, args[], env{}, approved} 或 streamable-http{url, headers{}, approved:true}，skill 另有 content，pack 另有 items[]（只含已保存的 mcp 与 skill 名）；state.bots[].capabilities 为常驻挂载、bots[].packs 为按需目录挂载；live capabilityStatuses{botId→{name→{state: ready|connecting|needs-approval|error, error?}}} 只为常驻挂载生成，能力包取子项最严重状态。capability-save {name, kind, description?, transport?, command?, args?, env?, url?, headers?, content?, items?} → 能力对象（名称须匹配 ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$ 且 ≤32、github 与 mail 等连接器名保留；已存在时不可改 kind；用户界面保存的 stdio 直接 approved=true；名称与能力包子项在写入前校验）；capability-delete {name} → true（同时从所有 Bot 与能力包移除）；capability-approve {name} → 能力对象（仅 stdio MCP，否则拒绝）；bot-capability {botId, name, attached, mode: always|catalog} → 该 Bot 的常驻列表（先从两个列表移除再按 mode 加入，attached=false 即移除）。失败均为 {ok:false, error:{code:bot/refused, message}}，按服务端 message 显示；只读宿主拒绝写入。0.3.10 hello capabilities 不含能力库能力名，客户端以 state.capabilities 字段存在门控入口。env/headers/args 中的 $DSH_SECRET_<NAME> 引用由服务端挂载时解析，客户端按原文处理、不展开；能力配置不写入日志与诊断上报。实测与源码核对界定：state 字段形态、Bot 挂载数组与 capabilityStatuses 形态及四个写端点的错误应答为本机真实服务只读实测（FINDINGS 第 28 节）；写端点成功应答、能力包与出错状态的形态为源码核对，由 mock --manage 按同一形态覆盖验收，未改动用户真实团队'
      rationale: 能力库端点首次被手机端消费，登记完整字段、挂载模式与状态语义（含 hello 不声明能力名的门控方式）及实测边界作为单一事实来源，避免后续变更把源码核对误当实测或误按 hello 门控
      enforcement:
        method: review
        detail: core JUnit（CapabilityLibraryTest）覆盖能力库/挂载/状态解码、列表与单 Bot 状态派生、经由能力包来源、来源与使用者派生、名称预校验、编辑草稿往返与四个端点请求体字面值；源码核对位置：ds-bot 0.3.10 src/host/capabilities.js（itemInput、capabilityEndpoint、setAttached、statusFor、capabilityStatusesView、libraryView）、channel.js（state.capabilities、live capabilityStatuses、端点分发）、store.js（bots[].capabilities/packs 规整）、client capability-settings.js（CapabilityForm、CapabilitiesPage、BotCapabilitiesCard）；FINDINGS 第 28 节登记 runSpike ProbesCapabilities 只读实测结果与 mock --manage 覆盖范围
  MODIFIED:
    hello-capabilities:
      strength: MUST
      statement: 0.3.10 起新增的端点、字段与 feed/notice 事件一律以 POST /api/bot hello 返回的 capabilities 名单为可用依据：名单未声明的能力视为不可用并隐藏对应入口；hello 不可用（不支持握手的旧版远端——0.3.10 对未知端点回 bot/not-found，0.3.6 对 hello 的应答未实测、按同一分支推断——以及任何读取失败）按 LEGACY 处理，只门控新能力、不门控 0.3.6 已有功能；hello 协商不出共同 api 版本（api 为 null 或高于客户端支持版本）按版本不一致降级；feed 首帧 hello 的 boot 变化或不再携带 boot 时重读能力集合；hello 与 feed hello 携带的 boot/seq 是 notices 补齐的游标来源
      rationale: 上游 mobile.js 约定 api 只在旧客户端会误读应答时才变，其余新增一律登记在 CAPABILITIES 并要求客户端跳过未知项；按能力位而非版本号判定，才能同时兼容 0.3.6 与 0.3.10，并表达 dsh 宿主经 HTTP/SSE 下个别能力不可用的情况
      enforcement:
        method: test
        detail: core JUnit（DsbotHelloTest）覆盖 hello 解码、未声明能力 has() 为 false、LEGACY 降级、api 兼容判定、重读判定（shouldReread）与提示条判定（DsbotVersions.banner）；App 新入口一律经 capabilities.has 判定
      exceptions:
        - 聊天条数据（bots[].tasks、bots[].blocked、computerLive、rooms[].goal、work）及其写端点 bot-stop-task、computer-app-answer、computer-stop、resume：0.3.10 的 hello capabilities 不含对应能力名，按 chat-bars-fields-0310 以字段存在显隐，不经 capabilities.has 判定（dsbot-chat-bars-0310 设计决策 data-presence-gating）
        - 能力库（state.capabilities、state.bots[].capabilities 与 bots[].packs、live capabilityStatuses）及其写端点 capability-save、capability-delete、capability-approve、bot-capability：0.3.10 的 hello capabilities 不含对应能力名（上游 mobile.js CAPABILITIES 无能力库项），按 capability-endpoints-0310 以 state.capabilities 字段存在显隐入口，不经 capabilities.has 判定（dsbot-capabilities 设计决策 data-presence-gating）
  REMOVED: {}
