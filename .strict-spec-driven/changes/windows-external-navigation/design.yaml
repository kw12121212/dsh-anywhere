schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: windows-external-navigation
approach:
  - 分两段：第一段可行性调查已完成并固化为决策记录（不改 Wails 拿不到 ICoreWebView2，升级 nightly 也拿不到）；第二段实现路径待 open questions 中用户决策后展开——若选 fork+replace：在 fork 中给 edge.Chromium 的 NavigationStarting 回调补 args（URL 与 Cancel）、新增 NewWindowRequested 处理（Handled=true + 系统浏览器）、暴露 AddScriptToExecuteOnDocumentCreated 或导出 ICoreWebView2 句柄，应用侧在 windows 构建标签文件里挂接并复用 navigation.SameOrigin/navigation.Handler/session.Handler；若选上游等待或暂缓则本变更停在当前状态
decisions:
  no-icorewebview2-without-modifying-wails:
    decision: 在不修改 Wails 的前提下无法取得 ICoreWebView2，也无法实现计划变更要求的任何一条原生路径
    rationale: 对 wails v3.0.0 与 v3.1.0-nightly.20261027 源码核查：edge.Chromium 为 internal 包且未导出；NavigationStartingCallback 签名只有 sender（无 URL、无取消）；整个 internal/webview2 无 NewWindowRequested 处理器；AddScriptToExecuteOnDocumentCreated 仅以 internal COM 接口存在无外部入口；NativeWindow() 只返回 HWND 而 WebView2 无从 HWND 反查 ICoreWebView2 的公开 API；ExecJS 在 runtimeLoaded 前排队而远程页面永不置位——与计划变更 details 的描述一致
  reuse-existing-navigation-session-logic:
    decision: 无论哪条实现路径，Windows 侧只做事件挂接与脚本注入，同源判定与 401 识别必须复用 internal/navigation 与 internal/session 的既有 Handler/SameOrigin 逻辑，不复制规则
    rationale: 导航与会话规则已有跨平台单测覆盖；复制规则必然与 Linux/macOS 漂移
alternatives:
  - option: 升级到 v3.1.0-nightly
    reason: 已核查 nightly 源码，NavigationStarting 回调签名与 NewWindowRequested 缺失与 v3.0.0 完全相同，升级无法解决；且生产应用依赖 nightly 不可取
risks: []
