schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: windows-external-navigation
  status: proposed
summary:
  what:
    - 在 Windows 上补齐依赖注入脚本的主窗口行为，使导航范围策略与 dsh 会话失效识别与 Linux/macOS 一致：非同源链接与 window.open 交给系统浏览器打开且主窗口不变，同源导航留在主窗口，dsh 会话失效时显示本地重新认证提示页
  why:
    - 当前 Windows 上外部链接仍在主窗口内打开、window.open 弹出 WebView2 自带窗口、会话失效显示 dsh 原始 401 文本，违反 navigation-scope 与 session-auth 主规格在三平台一致的目标；三平台发布里程碑要求 Windows 产物具备同等行为
scope:
  in:
    - 可行性调查已完成（见 design 决策）：wails v3.0.0 与最新 nightly 均未暴露实现所需接口（NavigationStarting 无 args、无 NewWindowRequested、edge 包 internal 不可导入、Chromium 实例未导出、ExecJS 在远程页面永久排队），实现路径存在三个选项需用户决策——fork+replace 最小补丁、推动上游后等待、暂缓本计划变更；决策后的实现须复用 navigation.SameOrigin/navigation.Handler/session.Handler 既有校验逻辑，Windows 专属代码置于 windows 构建标签下
  out:
    - 不改变 Linux/macOS 的既有行为与实现；不改变 navigation/session 包的平台无关逻辑语义；不引入对远程页面内容的额外信任
unchanged_behavior:
  - Linux/macOS 上导航范围与会话失效行为完全不变；guard 对远程页面调用本地服务的拦截不变；harness 配置与单实例行为不变
roadmap:
  milestone: cross-platform-release
  planned_change: windows-external-navigation
