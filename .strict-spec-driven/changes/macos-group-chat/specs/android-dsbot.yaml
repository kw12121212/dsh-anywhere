schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: android-dsbot
operations:
  ADDED: {}
  MODIFIED:
    group-chat:
      strength: MUST
      statement: 群聊页按 DS-Bot 网页端语义渲染与交互：成员消息带名称与颜色标识（成员 [PASS] 事件不可见）、群公告、运行中成员与逐成员停止入口；输入 @ 弹出成员名册（来自群成员 Bot）插入提及，同一消息可 @ 多个成员；可停止群内全部（stop-room-work）或单个成员（stop-member-work）的工作；群目标提供草稿提交与控制操作入口（goal-draft/goal-control，0.3.x 阶段/任务/证据视图数据源未实测，视图按服务端应答可读降级呈现）；room-progress 显示成员工作进度；流式回复与新消息经 feed 实时更新（多成员并行时流式仅作提示、条目以 message 事件落定去重）；与私聊共用条目渲染组件，未知字段降级不崩溃。管理员/回复模式标识与「引用一个聊天」的结构化提交字段在 0.3.x 未观测到实样本：引用以消息内文本标注近似（Bot 可读但无机器可读上下文），管理员标识暂缺——两项移交后续版本实测补齐（已在 questions 登记）。平台差异：Android 从团队页进入群聊页、@ 名册按触屏点选、停止入口在成员条上；macOS 从侧栏选中群进入内容区、@ 名册键盘上下选择 Enter 插入 Esc 关闭、停止入口在头部与成员行右键、待处理停靠区按群归属（roomId）汇集在输入框上方。
      scenarios:
        group-room-dock:
          - GIVEN: 群内有带 roomId 的审批与群会话的提问
          - WHEN: 打开群聊
          - THEN: 停靠区按 roomId/群会话汇集群内待处理项，作答与网页端同步
  REMOVED: {}
