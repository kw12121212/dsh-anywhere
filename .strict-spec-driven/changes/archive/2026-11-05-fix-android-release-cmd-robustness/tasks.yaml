schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: fix-android-release-cmd-robustness
sections:
  Implementation:
    repro-dep0190-and-sort:
      text: 修复前复现（确定性）：(a) 子进程 node 以现行形态 spawnSync(gradlew.bat, [\"--version\"], {shell:true})，其 stderr 含 DEP0190 弃用警告；(b) 假 build-tools 含 9.0.0 与 34.0.0 两目录时现行 apksignerPath 返回 9.0.0（字典序取错）。
      status: complete
      command: node -e "const{spawnSync}=require(\"node:child_process\");const{join}=require(\"node:path\");const r=spawnSync(\"node\",[\"-e\",\"const{spawnSync}=require('node:child_process');spawnSync(process.env.GRADLE_BAT,['--version'],{shell:true})\"],{env:{...process.env,GRADLE_BAT:join(\"android\",\"gradlew.bat\")},encoding:\"utf8\"});console.log(\"DEP0190:\",/DEP0190/.test(r.stderr))"
    regression-quoting-and-sort:
      text: scripts/android-release.test.mts 新增（修复前失败）：quoteForCmd 引用规则（纯实参不变、含空白加引号、内嵌引号加倍）；shellCommandLine 拼装单串；compareVersionDirs 数值比较（9.0.0<34.0.0、10.0.0>9.0.0）；apksignerPath 在 9.0.0+34.0.0 fixture 下取 34.0.0。
      status: complete
      command: npx vitest run scripts/android-release.test.mts
    impl-cmd-robustness:
      text: scripts/android-release.mts：spawnRunner shell 分支经 shellCommandLine 合成单命令串（spawnSync 不再传 args）；新增 quoteForCmd/shellCommandLine/compareVersionDirs 导出；apksignerPath 排序换 compareVersionDirs。
      status: complete
      command: npm run typecheck
  Testing:
    test-targeted:
      text: 目标回归：android-release.test.mts 全部用例通过（新增断言由红转绿，既有 16 用例零改动零回归）。
      status: complete
      command: npx vitest run scripts/android-release.test.mts
    test-spawn-smoke:
      text: 真实 spawn 冒烟（自包含单命令，路径全用 join 构造避免外层 shell 转义干扰）：(a) 子进程内以单命令串形态跑 gradlew.bat --version，inner=0 且 DEP0190=false；(b) 含空格临时目录下的哑 .bat 以显式引用的单命令串执行，status=0。
      status: complete
      command: node -e "const{spawnSync}=require(\"node:child_process\");const{join}=require(\"node:path\");const{mkdtempSync,writeFileSync,rmSync}=require(\"node:fs\");const{tmpdir}=require(\"node:os\");const c=spawnSync(\"node\",[\"-e\",\"const{spawnSync}=require('node:child_process');const r=spawnSync(process.env.LINE,{shell:true,encoding:'utf8'});console.log('inner='+r.status)"],{env:{...process.env,LINE:join("android","gradlew.bat")+" --version"},encoding:"utf8"});const d=mkdtempSync(join(tmpdir(),"dsh sp-"));const b=join(d,"p.bat");writeFileSync(b,"@echo off\r\nexit /b 0\r\n");const s=spawnSync('"""+b+\""\",{shell:true,encoding:\"utf8\"});rmSync(d,{recursive:true,force:true});console.log(\"gradlew=\"+(c.stdout||\"\").trim(),\"DEP0190=\"+/DEP0190/.test(c.stderr||\"\"),\"spaceBat=\"+s.status)"
    test-typecheck:
      text: TypeScript 类型检查通过。
      status: complete
      command: npm run typecheck
    test-coverage:
      text: Vitest 单元测试与 80% 行覆盖率门槛通过。
      status: complete
      command: npm run test:coverage
  Verification:
    verify-change:
      text: strict-spec-cli verify 通过。
      status: complete
      command: strict-spec-cli verify fix-android-release-cmd-robustness
    archive-readiness:
      text: strict-spec-cli ready 确认归档就绪；完整回归命令已在本机逐字执行通过；真实全链路验收仍由下一个 v* tag 发布承担。
      status: complete
      command: strict-spec-cli ready fix-android-release-cmd-robustness
testing_gates:
  validation_task: test-typecheck
  unit_test_task: test-coverage
