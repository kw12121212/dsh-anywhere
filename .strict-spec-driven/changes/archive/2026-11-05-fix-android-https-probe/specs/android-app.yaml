schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: android-app
operations:
  ADDED: {}
  MODIFIED:
    main-page-load:
      strength: MUST
      statement: App 已保存有效 harness URL 时，主页面先显示本地「正在连接」提示并对干净地址做可达性检查：地址返回任何 HTTP 响应（包括 401、5xx 与重定向；https 地址在 TLS 握手与证书、主机名校验通过后收到的响应同样计入）视为可达并在 WebView 中打开干净地址；DNS 解析失败、连接被拒绝、超时（默认 10 秒）或 TLS 错误时显示本地错误页；两种结果都不显示首次设置页。
      scenarios:
        reachable-opens-webview:
          - GIVEN: 已保存 http://10.0.2.2:13080/，该地址有服务响应
          - WHEN: 启动 App（或刷新）
          - THEN: 主页面先显示「正在连接」，随后 WebView 打开 http://10.0.2.2:13080/ 显示远程内容
        http-errors-reachable:
          - GIVEN: 已保存地址返回 502
          - WHEN: 启动 App
          - THEN: WebView 打开该地址显示远程返回的内容，不显示本地错误页
        connecting-then-error:
          - GIVEN: 已保存 http://10.0.2.2:13080/，该端口没有服务
          - WHEN: 启动 App
          - THEN: 主页面先显示「正在连接」，随后显示本地错误页，不显示首次设置页
        https-reachable-opens-webview:
          - GIVEN: 已保存 https://example.com/，该地址以受信任证书提供 https 服务
          - WHEN: 启动 App（或刷新）
          - THEN: 主页面先显示「正在连接」，随后 WebView 打开 https://example.com/ 显示远程内容，不显示本地错误页
        https-untrusted-cert-error:
          - GIVEN: 已保存的 https 地址使用不受信任的证书
          - WHEN: 启动 App
          - THEN: 主页面显示本地错误页，说明为安全连接失败
    session-expired-reauth:
      strength: MUST
      statement: 会话失效时（dsh 对干净地址返回 401 且正文为 dsh 的固定提示文本，http 与 https 地址同样判定），App 先以当前干净地址自动重试一次，仍失效则把主页面切换为本地重新认证提示页：说明需要在 DSH 主机上运行 dsh-url 获取新地址，并提供「打开设置」按钮；提示页不显示 token，也不显示 dsh 返回的 401 原文。在重新认证提示页经设置页粘贴新的带 token 地址并保存后，无需重启 App 即恢复显示 harness 页面。
      scenarios:
        expired-shows-reauth:
          - GIVEN: 已建立会话并显示 harness 页面，之后 dsh 服务重启使会话失效
          - WHEN: 刷新或重新加载 harness 页面
          - THEN: App 自动重试一次后显示本地重新认证提示页（含运行 dsh-url 的说明与「打开设置」按钮），不显示 401 原文，不含 token
        reauth-recovers:
          - GIVEN: 主页面显示重新认证提示页
          - WHEN: 点击「打开设置」，粘贴 dsh-url 输出的新带 token 地址并保存
          - THEN: 设置页关闭，主页面经一次带 token 加载后恢复显示干净地址的 harness 页面，配置只存干净地址
        https-expired-shows-reauth:
          - GIVEN: 已保存 https 的 dsh 地址（如 https://<主机>.ts.net:13080/），dsh 对该地址返回 401 与固定提示文本
          - WHEN: 主页面加载该地址
          - THEN: App 自动重试一次后显示本地重新认证提示页，而不是停留在 401 页面或显示连接错误页
  REMOVED: {}
