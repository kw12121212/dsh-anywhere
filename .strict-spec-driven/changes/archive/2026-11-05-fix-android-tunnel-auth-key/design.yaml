schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: fix-android-tunnel-auth-key
approach:
  - TunnelManager.startNode 在 Up 成功、状态置为已连接时同步 remove 偏好里的 auth key：之后 decideStart(无 key, 有状态) 走免 key 重连，节点被删或登出时 Up 失败/超时分类为需要 key，由用户重新粘贴。注册失败（FAILED/NEEDS_KEY）时 key 保留，便于『重试连接』。classifyUpFailure 先匹配本机/网络类签名（permission denied、x509、certificate、no such host、network is unreachable、connection refused、i/o timeout）直接判 FAILED，再匹配需要 key 的短语；把过宽的 not found 收窄为 node not found，denied 只保留 access denied。
decisions:
  drop-key-after-connect:
    decision: 注册成功即删除 auth key，失败时保留
    rationale: key 只在注册时需要；tsnet 已把节点身份持久在 filesDir/tstunnel，免 key 重连不依赖 key（tunnel-reconnect-after-restart 不变）。留存可复用 key 既扩大泄露面，又会在节点被删后静默重新注册，绕过主规格要求的『需要 key』提示
  classify-in-core:
    decision: 分类修正在 core 的 TunnelStateMachine，以表驱动 JUnit 锁定正负用例
    rationale: tech/android-client 的 pure-logic-in-core；core 测试进入完整回归命令；lesson-0d4784 要求手写接受集配负向用例
  key-removal-in-app:
    decision: 删除 key 的动作留在 :app 的 TunnelManager，以模拟器 run-as 检查偏好文件验收
    rationale: 这是 SharedPreferences 装配代码，属于 pure-logic-in-core 的明确例外；判定（何时启动、免 key 重连）仍由 core 的 decideStart 覆盖
alternatives: []
risks:
  - 注册成功后若节点很快被管理员删除，用户必须重新粘贴 key（这是主规格要求的需要 key 行为，非回退）
  - 错误文本签名依赖 tsnet/Go 的错误措辞；未知文本仍落入 FAILED 并展示原因，最坏情况是本应需要 key 的新措辞显示为失败
