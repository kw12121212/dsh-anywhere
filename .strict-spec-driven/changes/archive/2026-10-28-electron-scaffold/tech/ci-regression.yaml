schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: ci-regression
operations:
  ADDED:
    ci-linux-display:
      strength: MUST
      statement: Linux 回归 CI job 必须在执行回归命令前以独立步骤启动 Xvfb 并导出 DISPLAY，并保证 Electron 沙箱可用；不得把 xvfb-run 或 --no-sandbox 写进回归命令。
      rationale: Playwright 端到端测试需要显示服务器，而回归命令必须三平台逐字一致；用前置步骤提供环境既保持命令一致，也不以关闭沙箱的方式削弱安全基线。
      enforcement:
        method: ci
  MODIFIED:
    ci-regression-verbatim:
      strength: MUST
      statement: 回归 CI 工作流必须在 ubuntu、macos、windows 三个平台的矩阵 job 中逐字执行 config.yaml review_evidence.project_regression.command 的完整回归命令，不得拆分、改写或省略覆盖率门槛
      rationale: CI 与本地回归门槛必须完全一致，任何口径漂移都会让平台特定回归逃逸
      enforcement:
        method: ci
        detail: 覆盖三平台矩阵与完整命令：Go 部分（前端构建、go vet、go build、go test -race、覆盖率 ≥80% awk 门槛）与 Electron 部分（npm ci、typecheck、electron-vite 构建、Vitest 覆盖率 ≥80%、Playwright 端到端）；internal/appinfo/regression_test.go 断言 regression.yml 逐字包含 config 中的回归命令
  REMOVED: {}
