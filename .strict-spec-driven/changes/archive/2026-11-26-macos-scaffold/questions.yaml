  - id: macos-stack
    question: macOS 原生版用什么技术？
    context: 里程碑 intake 问题 macos-stack 已确认（2026-11-22）：决定代码复用方式、工程结构与回归命令。
    answer: Swift + SwiftUI 原生，协议逻辑用 Swift 重写，与 Kotlin 版共享测试向量。
    status: resolved
    answered_by: roadmap
  - id: macos-tailscale
    question: macOS 端是否内置 Tailscale？
    context: 里程碑 intake 问题 macos-tailscale 已确认（2026-11-22）：决定网络层是否需要 SOCKS5 分流与隧道管理。
    answer: 不内置，依赖系统 Tailscale 客户端。
    status: resolved
