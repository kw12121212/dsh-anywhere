schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: macos-side-chat
approach:
  - 右侧检查器改造为 Side chat 面板：SideChatModel（@MainActor）管理当前 Bot 的旁路会话视图——新建经 side-new（应答带 chatId 归属）、提问经 side-ask recent:true（回答不走 feed：作答/刷新后从 state.sideChats 重读条目，进行中状态跨聊天切换保留）、取消 side-cancel、关闭 side-close；流式提示按条目 status=working 显示。入口：聊天头部「旁路提问」按钮 + composer /side 前缀命令（私聊）。无附件：面板提示与网页端一致。btw 卡已在消息流渲染（cards-dock），本变更不动
decisions:
  sidechat-inspector-panel:
    decision: Side chat 放右侧检查器（里程碑 details 交互映射：详情面板与 Side chat 底部抽屉 → 右侧检查器），不自建独立窗口
    rationale: 复用既有三栏外壳的检查器列，避免新窗口管理；Android 的 Sheet 在 macOS 语义对应为检查器面板
  state-refresh-not-feed:
    decision: side 回答不走 feed 事件：提问后本地乐观行 + 定时/事件驱动刷新 state.sideChats 取回条目（tech dsbot-api 0.3.5 探针实证）
    rationale: 上游 side-ask 应答只带 chatId/entryId，回答落 state；feed 不推 side 事件，轮询/刷新取回是唯一可靠通道（on-demand-poll-single-flight 模式）
alternatives: []
risks: []
