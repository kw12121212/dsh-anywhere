schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: fix-gradlew-exec-bit
sections:
  Implementation:
    repro-permission-denied:
      text: 修复前复现：在 Linux 上执行回归命令末段 android/gradlew -p android/core test，以 permission denied 失败；git ls-files -s android/gradlew 显示 100644。
      status: complete
      command: git ls-files -s android/gradlew && android/gradlew -p android/core test
    regression-assertion:
      text: scripts/workflows.test.mts 新增断言：git 索引中 android/gradlew 的模式为 100755（修复前该断言失败）。
      status: complete
      command: npx vitest run scripts/workflows.test.mts
    set-exec-bit:
      text: git update-index --chmod=+x android/gradlew 并同步工作区可执行位，文件内容不变。
      status: complete
      command: git ls-files -s android/gradlew
  Testing:
    test-typecheck:
      text: 运行 TypeScript 类型检查。
      status: complete
      command: npm run typecheck
    test-unit:
      text: 运行 Vitest 单元测试与 80% 行覆盖率门槛。
      status: complete
      command: npm run test:coverage
    test-core-gradlew:
      text: 修复后直接执行 android/gradlew 跑 core JUnit 测试通过。
      status: complete
      command: android/gradlew -p android/core test
    test-regression:
      text: 运行 config.yaml 中 review_evidence.project_regression 的完整回归命令（Linux 本地以 xvfb-run 包裹提供显示服务器）。
      status: complete
      command: xvfb-run -a bash -c 'npm ci && npm run typecheck && npm run build && npm run test:coverage && npm run test:e2e && android/gradlew -p android/core test'
  Verification:
    verify-change:
      text: 运行 strict-spec-cli verify 确认任务与产物一致。
      status: complete
      command: strict-spec-cli verify fix-gradlew-exec-bit
    archive-readiness:
      text: 运行 strict-spec-cli ready 确认归档就绪，并确认完整回归证据齐备。
      status: complete
      command: strict-spec-cli ready fix-gradlew-exec-bit
testing_gates:
  validation_task: test-typecheck
  unit_test_task: test-unit
