schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: fix-gradlew-exec-bit
approach:
  - 用 git update-index --chmod=+x android/gradlew 把索引中的文件模式改为 100755，工作区同步 chmod +x；scripts/workflows.test.mts 在『config.yaml 完整回归口径』组新增断言：git ls-files -s android/gradlew 的模式为 100755，防止在不保留可执行位的平台（Windows）再次提交为 100644。
decisions:
  fix-mode-not-command:
    decision: 修文件模式，不改回归命令文本
    rationale: 回归命令逐字执行是 ci-regression-verbatim 的要求，命令文本本身正确；改成 sh android/gradlew 会让 AGENTS.md/README 中的命令与门禁口径分叉，而可执行位才是 Gradle wrapper 的标准约定
  assert-in-vitest:
    decision: 可执行位由 Vitest 纳管的 workflows.test.mts 断言锁定
    rationale: 该文件已负责锁定回归命令口径（含 android/gradlew 段）；把『命令段可执行』放在同一组，回归命令的 test:coverage 段即可在任何平台拦住模式回退，Windows 上 git 索引模式仍可读取
  no-delta-spec:
    decision: 不新增 delta spec 与 delta tech
    rationale: 纯仓库元数据缺陷，不涉及主规格可观察行为；tech/android-client 的 core-jvm-tests-in-regression 已要求该命令进入回归，本次只是让它可执行，规则文本无需改动
alternatives:
  - option: 回归命令改为 sh android/gradlew -p android/core test
    reason: 与 AGENTS.md、README 及 workflows.test.mts 已锁定的命令文本分叉，且仍会让开发者直接运行 android/gradlew 时失败
risks:
  - Windows 上 core.fileMode=false 的克隆再次提交 gradlew 时可能重置模式；新增断言会在下一次完整回归中拦住
