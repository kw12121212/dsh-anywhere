schema: strict-spec-driven/change-proposal/v1
schema_version: 1
artifact_type: change_proposal
schema_file: templates/strict-spec-driven/schemas/change-proposal.yaml
change:
  id: dsbot-api-client
  status: proposed
summary:
  what:
    - core（纯 JVM、JUnit 覆盖）实现 DS-Bot API 客户端：{endpoint,payload} 请求信封与 ok/fail 结果解码、bot/* 错误码到用户可读原因的映射、SSE 解析器（事件、data 多行、注释保活）、feed 连接状态机（连接/断开/指数退避重连、重连后按 hello 的 revision 与本地对比并带 since/live 取 state 增量补齐）、state 与 chat 条目的可降级解码模型（未知字段与类型保留为原始节点）、按 dsbot-api 技术标准读取远端 DS-Bot/dsh 版本并与基准比对
    - App 侧原生 HTTP 传输与会话管理：通用请求与 SSE 长连接经现有 tailnet 分流路径只发往已保存 harness 的源，携带 dsh-auth cookie 与同源 Host（明文沿用 CleartextPolicy 仅对已保存源放开）；带 token 地址只用一次原生建立会话，cookie 存 App 私有存储并跨重启保留；连接探测与会话失效探测改为原生请求（401→本地重新认证页、403→trusted-host 配置提示）；从 WebView 版本升级后首次启动把 CookieManager 中该源的 dsh-auth cookie 一次性迁入原生存储；token 与 cookie 不进配置、日志与诊断上报
  why:
    - dsbot-api-spike 已验证原生调用 DS-Bot API 的完整路径并落成 dsbot-api 技术标准与脱敏夹具，后续原生界面 planned changes 都需要统一的 API 客户端与传输；会话建立、探测与 401 识别从 WebView 迁到原生是移除 WebView 主页面（dsbot-native-shell）的前置
    - 里程碑 dsbot-native-chat 的团队页/私聊/群聊等 7 个 planned change 依赖本变更的客户端与传输
scope:
  in:
    - core 请求封装、错误映射、SSE 解析器、feed 状态机、解码模型、版本比对，全部以 spike 脱敏夹具驱动的 JUnit 覆盖（含重连补齐与错误码映射）
    - App NativeHttp 传输（复用 TailnetRouting.splitDial 拨号与手写 HTTP 风格）、NativeSessionStore（原子持久化、App 私有存储）、原生会话建立（token 一次）、401/403 原生探测与界面分流、WebView CookieManager 一次性迁移、原生存储与 WebView cookie 的同步（主页面仍由 WebView 承载）
    - android-app 主规格的 session-establish 改写为原生建立、新增迁移与 403 提示的可观察需求
  out:
    - 不替换 WebView 主页面与导航（dsbot-native-shell 承接）
    - 不实现团队/聊天等原生界面（后续 planned changes 承接）
    - 不实现附件的 WebSocket JSON-RPC 通道（dsbot-attachments 承接）
unchanged_behavior:
  - 桌面客户端行为完全不变
  - App 首次设置页、设置页、隧道、自更新、诊断上报行为不变
  - WebView 主页面仍显示 harness 页面，导航范围与隔离要求不变
roadmap:
  milestone: dsbot-native-chat
  planned_change: dsbot-api-client
