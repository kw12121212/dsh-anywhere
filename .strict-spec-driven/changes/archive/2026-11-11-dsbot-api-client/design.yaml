schema: strict-spec-driven/change-design/v1
schema_version: 1
artifact_type: change_design
schema_file: templates/strict-spec-driven/schemas/change-design.yaml
change: dsbot-api-client
approach:
  - core 新增 DsbotApi（信封请求与 ok/fail 解码）、DsbotErrors（bot/* 错误映射）、SseParser（帧解析，纯函数）、FeedClient/FeedStateMachine（连接与指数退避重连，重连以 hello.revision 对比本地决定是否 since/live 增量）、DsbotState/DsbotChat（解码模型，未知字段保留为 Json.Value 原始节点）、DsbotVersions（update-check 读取与基准比对），全部纯 JVM 且以 spike 夹具驱动 JUnit。App 侧新增 NativeHttp（经 TailnetRouting.splitDial 的通用请求与 SSE 长连接，请求目标限定已保存 harness 源）与 NativeSessionStore（原子持久化 cookie 于 App 私有存储），会话建立改为原生 GET 一次带 token 地址（跟随重定向并携带已收 cookie，路径按 dsbot-api exact-path-construction 去尾斜杠拼接），建立后把 dsh-auth cookie 同步写回 WebView CookieManager 供主页面使用；探测与 401/403 识别改走原生请求，401 沿用固定失效标记判定（SessionAuth.isSessionExpired 同源）进本地重新认证页，403 显示 trusted-host 配置提示；升级首启时从 CookieManager.getCookie 读 dsh-auth（HttpOnly，Chromium include_http_only=true 已核证）一次性迁入原生存储，迁移不到则显示本地重新认证页。写操作失败不自动重试。
decisions:
  native-establish-syncs-webview:
    decision: 会话建立改为原生 HTTP 完成，建立成功后把 dsh-auth cookie 同步写入 WebView CookieManager；本变更保留 WebView 主页面
    rationale: spike 实测原生 GET token 地址即可完成 303+Set-Cookie 建会话；WebView 主页面仍需 cookie 才能加载 harness 页面，本变更不切换界面，只把会话职责迁到原生并为 dsbot-native-shell 移除 WebView 铺路
  cookie-store-atomic-private:
    decision: 原生存储以临时文件+重命名原子写入 App 私有存储，损坏按无会话处理（进入重新认证页），不阻断启动
    rationale: 对齐 state-persistence 的 atomic-tolerant-state-read 与 config 的容忍语义；cookie 是凭据，只进私有存储且不进日志与诊断上报
  feed-backoff-and-catchup:
    decision: feed 断开后按指数退避重连，重连收到 hello 后以 revision 与本地对比：变化才以 since/live 取 state 增量，unchanged 则零负载；写操作失败不自动重试
    rationale: spike 实测 since/live 增量语义与 unchanged 三键响应；退避重连避免断线风暴，写操作重试会造成重复发送（里程碑 done_criteria 明确不重复发送）
alternatives:
  - option: 会话建立仍由 WebView 完成后从 CookieManager 抓取 cookie 到原生存储
    reason: spike 已证原生建立可行且少一次 WebView 状态依赖；WebView 抓取在升级迁移场景仍保留为兜底路径，但作为主路径会延续对 WebView 生命周期的耦合
risks:
  - CookieManager 与原生存储不一致导致主页面与原生请求会话状态漂移：以原生存储为唯一事实来源，每次变更后单向同步到 CookieManager
