schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: main-window
spec:
  title: 主窗口
  path: .strict-spec-driven/specs/main-window.yaml
operations:
  ADDED:
    start-harness-when-configured:
      strength: MUST
      statement: 启动时如果已保存有效的 harness URL，主窗口直接打开该地址（不含 token），不显示初始化界面。
      scenarios:
        restart-after-setup:
          - GIVEN: 用户已完成初始化，配置中保存了 https://dsh.example.test/
          - WHEN: 重新启动应用
          - THEN: 主窗口直接打开 https://dsh.example.test/，不显示初始化界面
        unconfigured-start:
          - GIVEN: 配置目录中没有 dsh-anywhere 配置
          - WHEN: 启动应用
          - THEN: 主窗口显示初始化界面
    remote-page-no-local-access:
      strength: MUST
      statement: 主窗口显示远程 harness 页面时，该页面无法调用应用的任何本地服务；调用保存地址等接口的尝试失败，配置文件内容不变，主窗口不被导航到其他地址。
      scenarios:
        remote-save-attempt:
          - GIVEN: 主窗口显示一个远程页面，配置中保存的是该页面地址
          - WHEN: 该页面的脚本尝试以各种请求方式调用本地保存地址接口，把地址改为 http://evil.example.test/
          - THEN: 所有尝试失败，配置文件内容不变，主窗口仍显示原页面
        local-page-still-works:
          - GIVEN: 主窗口显示本地初始化界面
          - WHEN: 界面调用本地服务查询初始化状态
          - THEN: 调用成功
    reload-menu:
      strength: MUST
      statement: 应用菜单提供“重新加载”命令（Windows/Linux 为 Ctrl+R，macOS 为 Cmd+R）：主窗口显示 harness 页面时重新打开已保存的 harness 地址（不含 token）；已保存的配置不再可用时回到本地初始化界面；主窗口显示本地页面时重新打开本地页面。
      scenarios:
        reload-harness:
          - GIVEN: 主窗口正在显示已保存的 harness 地址 https://dsh.example.test/
          - WHEN: 用户选择菜单“重新加载”或按 Ctrl/Cmd+R
          - THEN: 主窗口重新请求 https://dsh.example.test/ 并显示该页面，不显示初始化界面
        reload-without-config:
          - GIVEN: 主窗口正在显示 harness 页面，但配置文件已损坏
          - WHEN: 用户选择“重新加载”
          - THEN: 主窗口显示本地初始化界面并提示已有配置无效
  MODIFIED: {}
  REMOVED: {}
