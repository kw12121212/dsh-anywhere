schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: fix-local-page-undici-race
sections:
  Implementation:
    repro-evidence:
      text: '修复前复现：xvfb 下重复运行 25 次，2–4 次主窗口 5 秒内不出现，失败窗口停在 chrome-error://chromewebdata/，主进程打印 TypeError: Cannot read properties of undefined (reading ''markResourceTiming'')；改为 fs.readFile 的对照组仍 2/30 失败，确认触发点在 Electron 的 app:// 分发器。'
      status: complete
      command: xvfb-run -a npx playwright test e2e/setup-settings.spec.ts -g "配置损坏或地址无效时显示初始化界面" --repeat-each=25
    warm-up-web-globals:
      text: 新增 src/main/web-globals.ts 的 warmUpWebGlobals()（构造空 Response 触发 Web 全局模块初始化），并在 src/main/index.ts 创建窗口与注册 app:// 协议前调用。
      status: complete
    unit-test-warmup:
      text: 新增 src/main/web-globals.test.ts：重复调用不抛错，Response 仍可构造。
      status: complete
      command: npx vitest run src/main/web-globals.test.ts
  Testing:
    test-typecheck:
      text: 运行 TypeScript 类型检查（主进程 / 渲染 / e2e 三份 tsconfig）。
      status: complete
      command: npm run typecheck
    test-unit:
      text: 运行 Vitest 单元测试与 80% 行覆盖率门槛。
      status: complete
      command: npm run test:coverage
    test-repeated-launch:
      text: 修复后重复启动回归：同一用例重复 40 次全部通过（修复前 25 次有 2–4 次失败）。
      status: complete
      command: xvfb-run -a npx playwright test e2e/setup-settings.spec.ts -g "配置损坏或地址无效时显示初始化界面" --repeat-each=40
    test-e2e:
      text: 构建并运行完整 Playwright 端到端套件（本地零重试）。
      status: complete
      command: npm run build && xvfb-run -a npm run test:e2e
    test-regression:
      text: 运行 config.yaml 中 review_evidence.project_regression 的完整回归命令（Linux 本地以 xvfb-run 包裹以提供显示服务器）。
      status: complete
      command: xvfb-run -a bash -c 'npm ci && npm run typecheck && npm run build && npm run test:coverage && npm run test:e2e'
  Verification:
    verify-change:
      text: 运行 strict-spec-cli verify 确认任务与产物一致。
      status: complete
      command: strict-spec-cli verify fix-local-page-undici-race
    archive-readiness:
      text: 运行 strict-spec-cli ready 确认归档就绪，并确认重复启动与完整回归证据齐备。
      status: complete
      command: strict-spec-cli ready fix-local-page-undici-race
testing_gates:
  validation_task: test-typecheck
  unit_test_task: test-unit
