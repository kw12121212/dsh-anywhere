schema: strict-spec-driven/delta-tech/v1
schema_version: 1
artifact_type: delta_tech
schema_file: templates/strict-spec-driven/schemas/delta-tech.yaml
target_standard: security-secrets
operations:
  ADDED:
    android-sensitive-input:
      strength: SHOULD
      statement: Android 原生界面中输入 key、token、Client Secret、授权码、密码等敏感值时使用不回显的 SecretField（密码变换、密码键盘、关闭自动更正），并在含此类输入的表单显示期间以 SecureWhileShown 给窗口加 FLAG_SECURE（按窗口计数，最后一个表单离开才恢复，不对整页常开以免验收截图全黑）；App 主动复制到剪贴板的敏感文本（设备码、授权链接、回调地址等）经 SensitiveClipboard 复制：标记 EXTRA_IS_SENSITIVE，内存只记内容摘要，由 core ClipboardGuard 判断——离开过 App 再取得焦点或约 2 分钟兜底时剪贴板仍是本 App 复制的内容即清除，读不到剪贴板时保留待下次，只在 App 内取回焦点不清；这些值只进请求体，不写日志与诊断上报
      rationale: dsbot-connectors-mail 首次在手机上输入第三方凭据并复制设备码，里程碑风险要求敏感值不回显、不入日志、不在剪贴板残留；同里程碑的密钥页、IM 配对与登录码、本地 Agent 等后续变更都会复用这套做法，模拟器验收与评审已踩过 ON_RESUME 读剪贴板被拒、标签被宿主同步改写、后台 hasPrimaryClip 为 false 三个坑
      enforcement:
        method: review
        detail: 评审检查新增敏感输入是否用 SecretField 并包在 SecureWhileShown 中、复制敏感文本是否经 SensitiveClipboard；ClipboardGuard 的判断由 core JUnit（ClipboardGuardTest）覆盖：离开后回来清除、App 内取回焦点不清、后台读不到保留、用户另行复制不清
      examples:
        good:
          - CredentialForm 中 SecureWhileShown() 后 SecretField(value, ...)；DevicePanel 的复制按钮调用 SensitiveClipboard.copy(context, userCode)
        bad:
          - OutlinedTextField 明文输入 token；ClipboardManager.setPrimaryClip 直接复制设备码且不清理；在 ON_RESUME 读剪贴板判断是否清除
  MODIFIED: {}
  REMOVED: {}
