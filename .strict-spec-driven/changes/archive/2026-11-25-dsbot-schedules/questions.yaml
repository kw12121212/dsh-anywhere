change: dsbot-schedules
open: []
resolved:
  - id: requirement-problem
    question: 现在具体出了什么问题，影响谁？
    context: 影响范围：proposal 的 why。来源：计划变更 dsbot-schedules。
    answer: 用户在手机上无法查看、新建、暂停或删除 Bot 的定时任务，只能回电脑网页端。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: 怎样可观察地证明问题已解决？
    context: 影响范围：delta spec 与验收。来源：里程碑 done_criteria「新建一个日程任务后按时触发，App 可查看与删除」「日程可暂停与恢复」。
    answer: 在 App 新建定时任务后按时触发，App 中可查看、暂停与恢复、删除，网页端日程页一致。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: 这次变更按哪种理解实施？
    context: 影响范围：proposal 范围。来源：计划变更 details（schedules/schedule-create/schedule-delete，0.3.10 另有 schedule-pause，规则选项 at/every/daily/weekly/cron）。
    answer: 交付 Settings → Scheduled tasks 原生页：列表、新建（at/daily/weekly/every，cron 只显示不新建，与网页端一致）、暂停/恢复、删除，以及 Bot 详情的入口；不编辑已有任务。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: 哪些必须明确不改变？
    context: 影响范围：unchanged 与评审。
    answer: 团队页与 Bot 详情既有入口不变；不在手机上开启 DSH 插件。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: 为什么现在做？
    context: 影响范围：优先级。
    answer: 依赖 dsbot-native-shell 与 dsbot-baseline-0310 已完成，roadmap-recommend 按顺序推荐本项为下一个可执行计划变更。
    status: resolved
    kind: requirement
    answered_by: roadmap
