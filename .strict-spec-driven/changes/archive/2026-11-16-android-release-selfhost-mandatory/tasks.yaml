sections:
  Implementation:
    impl-selfhost-mandatory:
      text: android-release.mts：preflight 增 DSH_UPDATES_DIR 非空且目录存在校验（失败文案含 \wsl.localhost UNC 示例）；抽 versionCodeOf(version) 与 publishSelfhost(dir, apk, apkName, sha256, version)（APK+.sha256 先写、latest.json 临时文件加 rename 原子写）；main 中在 gh release upload 之前调用；更新脚本头注释与 AGENTS.md 的 Android 发布句（补环境变量与强制语义）
      status: complete
  Testing:
    test-selfhost-red:
      text: 失败回归证据（先于实现，2026-11-16 本地运行 npx vitest run scripts/android-release.test.mts）：23 例中 3 例失败——(a)『DSH_UPDATES_DIR 未设置即拒绝』toMatch(/DSH_UPDATES_DIR/) 失败（旧 preflight 对缺配 env 返回 null）；(b)『DSH_UPDATES_DIR 目录不存在即拒绝』同因失败；(c) 成功路径顺序断言 selfhostDoneBeforeUpload 为 false（旧实现自托管同步排在 gh release upload 之后，upload 命中时 latest.json 尚未落盘）。实现后同一命令 24 例全绿，(c) 的顺序语义反转（同步先行、上传失败也已落盘）另有独立用例『gh 上传失败时自托管已先落盘』覆盖
      status: complete
      command: npx vitest run scripts/android-release.test.mts
    test-selfhost-green:
      text: GREEN：RED 断言转绿——preflight 两失败类、成功路径自托管三件套（latest.json 字段 version_name/version_code/sha256/size 与文件内容）与『同步先于 gh upload』顺序断言、versionCodeOf 向量（1.8.3→10803 等含边界）；既有用例不回归
      status: complete
      command: npx vitest run scripts/android-release.test.mts
  Verification:
    verify-strict:
      text: strict ready 与 verify 通过（technical-only：specs/ 空、delta-tech 已登记、场景不适用已在 design 说明）
      status: complete
      command: strict-spec-cli ready android-release-selfhost-mandatory && strict-spec-cli verify android-release-selfhost-mandatory
    verify-regression:
      text: 完整项目回归逐字执行并留存输出（技术变更亦跑完整命令）
      status: complete
      command: npm ci && npm run typecheck && npm run build && npm run test:coverage && npm run test:e2e && android/gradlew -p android/core test
