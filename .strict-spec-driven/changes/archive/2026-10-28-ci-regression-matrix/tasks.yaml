schema: strict-spec-driven/task-list/v2
schema_version: 2
artifact_type: task_list
schema_file: templates/strict-spec-driven/schemas/task-list.yaml
change: ci-regression-matrix
sections:
  Implementation:
    create-workflow:
      text: '新增 .github/workflows/regression.yml：push 与 pull_request 触发；matrix 覆盖 ubuntu-latest、macos-latest、windows-latest（fail-fast: false）；defaults.run.shell: bash；actions/setup-go 按 go.mod 装 Go 并缓存；actions/setup-node 装 Node 22 并按 frontend/package-lock.json 缓存 npm；Linux 条件步骤安装 libgtk-4-dev libwebkitgtk-6.0-dev；末步逐字执行 config.yaml review_evidence.project_regression.command；timeout-minutes: 60'
      status: complete
  Testing:
    validate-workflow:
      text: 用 actionlint 校验 .github/workflows/regression.yml 的语法与 GitHub Actions 结构（矩阵、shell、步骤引用）；无 actionlint 时至少用 YAML 解析器确认可解析
      status: complete
      command: actionlint .github/workflows/regression.yml
    run-local-regression:
      text: 在本机（macOS）逐字执行 config.yaml review_evidence.project_regression.command 的完整回归命令，确认工作流末步所执行的命令在本地同样通过（含覆盖率 ≥80% 门槛）
      status: complete
      command: (cd frontend && npm ci && npm run build) && go vet ./... && go build ./... && go test -race -covermode=atomic -coverprofile=coverage.out ./... && grep -v -E '^[^:]*/main\.go:' coverage.out > coverage.filtered.out && go tool cover -func=coverage.filtered.out
  Verification:
    verify-change:
      text: 运行 strict-spec-cli ready ci-regression-matrix 与 strict-spec-cli verify ci-regression-matrix，确认变更工件齐备且无阻塞诊断
      status: complete
      command: strict-spec-cli ready ci-regression-matrix && strict-spec-cli verify ci-regression-matrix
    check-archive-merge:
      text: 确认 delta-tech 新标准 ci-regression 归档时能合入 .strict-spec-driven/tech/ 并更新 INDEX（strict-spec-cli verify 无 tech 相关诊断，目标标准 id 无冲突）
      status: complete
      command: strict-spec-cli verify ci-regression-matrix
testing_gates:
  validation_task: validate-workflow
  unit_test_task: run-local-regression
