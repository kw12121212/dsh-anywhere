change: dsbot-phone-prefs
open: []
resolved:
  - id: requirement-problem
    question: 现在具体出了什么问题，影响谁？
    context: 影响范围：proposal 的 why。来源：路线图计划变更 dsbot-phone-prefs。
    answer: App 只有浅色界面、夜间刺眼；界面文案全部写死为中文，不懂中文的用户无法使用；上游手机端已支持外观与语言切换。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-outcome
    question: 怎样可观察地证明问题已解决？
    context: 影响范围：delta spec 场景与验收。来源：里程碑完成标准第六条与计划变更验收说明。
    answer: 切换外观与语言后界面即时变化并跨重启保留；英文模式下主要界面无中文残留。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-interpretation
    question: 这次变更按哪种理解实施？
    context: 影响范围：proposal 范围。
    answer: 按计划变更 details：设置页外观（跟随系统/浅色/深色）与语言（跟随系统/简体中文/English）、本机持久化、外观覆盖 Material3 配色、语言切换并补全英文文案、切换后保留导航状态、触感统一封装、动效遵循减少动态效果；core 偏好枚举与解析（未知值回退跟随系统）有 JUnit。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-non-goals
    question: 哪些必须明确不改变？
    context: 影响范围：unchanged 与评审。
    answer: 团队主题与强调色由 dsbot-prefs-theme 承接；连接、聊天与各功能行为不变；切换不重连、不清缓存与发送箱；聊天内容不翻译。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: requirement-trigger
    question: 为什么现在做？
    context: 影响范围：优先级。
    answer: 里程碑完成标准第六条；依赖的 dsbot-notices-banner 已完成（设置页的本机偏好分组先行），脚本推荐的下一个可做变更即本项。
    status: resolved
    kind: requirement
    answered_by: roadmap
  - id: language-mechanism
    question: 计划变更写「语言通过 AppCompat 按应用语言切换」「本机 DataStore 持久化」，是否必须照做？
    context: 影响范围：依赖与实现方式。AppCompat per-app locale 依赖 Activity 重建，会销毁组合中的连接对象（重连并清空聊天缓存与发送箱），与「切换后保留导航状态」冲突。
    answer: 不引入 AppCompat 与 DataStore（design 决策 recompose-not-recreate、prefs-sharedpreferences）：以本地化 Context + key(lang) 重组实现即时切换并保留连接与页面，偏好用独立 SharedPreferences 文件；可观察行为与计划一致。
    status: resolved
    answered_by: roadmap
