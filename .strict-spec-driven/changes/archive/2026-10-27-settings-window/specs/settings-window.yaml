schema: strict-spec-driven/delta-spec/v1
schema_version: 1
artifact_type: delta_spec
schema_file: templates/strict-spec-driven/schemas/delta-spec.yaml
target_spec: settings-window
spec:
  title: 设置窗口
  path: .strict-spec-driven/specs/settings-window.yaml
operations:
  ADDED:
    open-settings:
      strength: MUST
      statement: 应用菜单提供“设置…”（Windows/Linux 为 Ctrl+,，macOS 为 Cmd+,），打开一个独立的本地设置窗口，显示当前已保存的干净地址；设置窗口已打开时再次选择会聚焦已有窗口而不是新开；主窗口中的页面不受影响。
      scenarios:
        open-shows-current:
          - GIVEN: 已保存 https://dsh.example.test/，主窗口显示 harness 页面
          - WHEN: 用户选择“设置…”
          - THEN: 出现设置窗口，输入框中为 https://dsh.example.test/，主窗口仍显示 harness 页面
        open-twice-focuses:
          - GIVEN: 设置窗口已打开
          - WHEN: 用户再次选择“设置…”
          - THEN: 已有设置窗口被聚焦，没有出现第二个设置窗口
    settings-validation:
      strength: MUST
      statement: 设置窗口在用户编辑地址时实时校验：地址不合法时“保存”按钮不可用并显示原因；地址合法时按钮可用且不显示错误。
      scenarios:
        invalid-disables-save:
          - GIVEN: 设置窗口已打开
          - WHEN: 用户把地址改为 ftp://dsh.example.test/
          - THEN: “保存”不可用，并显示只支持 http 或 https 的提示
        empty-disables-save:
          - GIVEN: 设置窗口已打开
          - WHEN: 用户清空地址
          - THEN: “保存”不可用
    settings-save:
      strength: MUST
      statement: 点击“保存”后，应用只保存去掉 token 的干净地址并关闭设置窗口，主窗口打开用户输入的原始地址（含 token）一次；新地址在重启后仍生效。地址未改动且输入不带 token 时，保存不重新加载主窗口。
      scenarios:
        save-new-token-url:
          - GIVEN: 已保存 https://a.example.test/，主窗口显示该页面
          - WHEN: 用户在设置窗口粘贴 http://127.0.0.1:13080/?token=abc123 并保存
          - THEN: 配置中为 http://127.0.0.1:13080/ 且不含 abc123，设置窗口关闭，主窗口打开 http://127.0.0.1:13080/?token=abc123；重启后主窗口打开 http://127.0.0.1:13080/
        save-unchanged:
          - GIVEN: 已保存 https://dsh.example.test/，主窗口显示 harness 页面
          - WHEN: 用户不修改地址直接保存
          - THEN: 设置窗口关闭，主窗口不重新加载
        save-same-url-new-token:
          - GIVEN: 已保存 http://127.0.0.1:13080/
          - WHEN: 用户粘贴 http://127.0.0.1:13080/?token=def456 并保存
          - THEN: 配置不变，设置窗口关闭，主窗口打开 http://127.0.0.1:13080/?token=def456
    settings-cancel:
      strength: MUST
      statement: 在设置窗口中点击“取消”或直接关闭窗口时，配置不变，主窗口停留在原页面。
      scenarios:
        cancel-after-edit:
          - GIVEN: 已保存 https://a.example.test/，用户在设置窗口把地址改为 https://b.example.test/
          - WHEN: 点击“取消”或关闭设置窗口
          - THEN: 设置窗口关闭，配置仍为 https://a.example.test/，主窗口停留在原页面
    settings-save-failure:
      strength: MUST
      statement: 保存失败时设置窗口保持打开并显示可读的错误信息，错误中不含 token 值，主窗口不被导航。
      scenarios:
        unwritable-config:
          - GIVEN: 配置目录无法写入
          - WHEN: 用户输入 http://127.0.0.1:13080/?token=abc123 并保存
          - THEN: 设置窗口显示保存失败的错误且不含 abc123，窗口保持打开，主窗口不变
  MODIFIED: {}
  REMOVED: {}
