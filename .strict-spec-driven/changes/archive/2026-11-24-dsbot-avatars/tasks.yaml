      text: 构建 :app 调试 APK
      status: complete
      command: android/gradlew -p android assembleDebug
    full-regression:
      text: 运行项目完整回归命令（WSLg 下以 xvfb-run -a 包裹）
      status: complete
      command: npm ci && npm run typecheck && npm run build && npm run test:coverage && npm run test:e2e && android/gradlew -p android/core test
  Verification:
    device-acceptance:
      text: 设备验收（GAMEPC 模拟器 + mock --manage）：从相册一次选两张照片，逐张裁剪后导入，头像库出现两张、结果摘要正确；再导入同一张显示重复；点选一张设给 Bot，详情页显示照片、mock 收到 avatar.image；移除照片后只剩形象；删除头像库照片二次确认后显示服务端结果；大尺寸原图被压缩到上限内导入
      status: complete
    strict-ready-verify:
