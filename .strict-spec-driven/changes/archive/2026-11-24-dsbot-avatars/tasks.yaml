    core-junit:
      text: core JUnit：AvatarLibraryTest（魔数四种格式与非图片、上限边界 119982/119983、data URL 往返、分页/导入结果解码与畸形降级、裁剪区域边界与夹取、请求体字面值）与 BotManageTest 照片字段
