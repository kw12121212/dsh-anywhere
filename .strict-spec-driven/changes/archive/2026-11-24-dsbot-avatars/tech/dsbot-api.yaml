      statement: 头像库端点（DS-Bot 0.3.10）：avatar-library {offset?, limit?} → {items[{id(sha256), name, mime, bytes, createdAt, image(data URL)}], total, next}（最新在前，每页至多 48；实测空库为 {items:[], total:0, next:offset}）；avatar-import {items[{name, image(data URL)}]} → {imported[条目], duplicates[{id,name}], failed[{name,message}]}（逐张处理，按字节 sha256 去重，库上限 500 张）；avatar-delete {id} → true/false（使用该照片的 Bot 保留自己的副本）。单张 data URL 必须为 PNG/JPEG/WebP/GIF 的 base64，图片字节不超过 119982（(160000-23)/4*3）且 data URL 不超过 160000 字符，格式按魔数判定；设为 Bot 头像为 update-bot {id, avatar:{shape?, image}}，移除为 avatar:{shape} 或 null。avatar-library 实测（只读），导入与删除为源码核对，未写入用户真实头像库
