      text: 模拟器验收通过（2026-11-12，enriched mock 两轮）：团队页渲染分组列表（常用/未分组、置顶、主标记、摘要、未读徽标）；需要你计数与汇总页（审批+提问、类型+摘要+会话尾标）；点击待办与条目跳转正确 sessionId 骨架页、BACK 返回；feed 事件路径两轮验证——第一轮 mock 回全量应答（live 5s + revision 10s 后列表持久），第二轮 mock 按契约对 since+live 回最小 unchanged 形态（首次带 work 变化档、之后纯三键），列表与需要你计数均持久且无空团队页翻转。M1（增量清空）的回归锁定以 core 夹具测试为准（增量夹具不再被误判为全量 + mergeDelta 合并测试），设备验证补充路径覆盖。搜索过滤逻辑由 core 夹具测试覆盖（中文用例；ADB 不支持中文注入，UI 搜索框渲染已验证）；空团队引导由 core isEmpty 与 strings 覆盖。过程修复：ShellPage when 分支 NeedsYou 强转崩溃、decodeState 键形态判别、live 字段合并
