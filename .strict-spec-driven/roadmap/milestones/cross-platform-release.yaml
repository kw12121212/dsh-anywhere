schema: strict-spec-driven/roadmap-milestone/v2
schema_version: 2
artifact_type: roadmap_milestone
schema_file: ../schemas/roadmap-milestone.yaml
milestone:
  cross-platform-release:
    title: 三平台打包与发布
order: 300
goal: 每次打版本 tag 时，CI 自动在 Windows、macOS、Linux 上通过完整回归，并产出可安装的三平台安装包，发布到版本发布页供用户下载。
scope:
  in:
    - 统一的应用身份：应用名、bundle identifier、版本号（由 git tag 注入）、三平台图标
    - CI 在 ubuntu、macos、windows 三个平台上运行完整回归命令
    - 打包产物：Windows NSIS 安装包、macOS .app 及 .dmg、Linux AppImage 与 .deb
    - 打 v* tag 时自动构建并上传全部安装包及 SHA256 校验文件到版本发布页
  out:
    - Windows 代码签名、macOS 签名与公证
    - 应用内自动更新
    - 上架应用商店（Microsoft Store、Mac App Store、Flathub 等）
done_criteria:
  - 向任意分支推送提交后，三个平台的 CI 任务均执行完整回归命令并通过
  - 推送 v0.1.0 tag 后，版本发布页出现 Windows 安装包、macOS dmg、Linux AppImage 与 deb，以及对应的 SHA256 校验文件
  - 在三个平台上分别安装对应产物后，应用能启动并显示初始化界面，在配置 harness URL 后加载该网页；“关于”信息显示的版本号与 tag 一致
intake_questions:
  - id: ci-platform
    question: 仓库托管在哪里、使用哪个 CI 平台？
    context: 当前仓库没有配置远程，CI 与发布页实现完全依赖托管平台。
    impact: 决定 ci-regression-matrix 与 release-workflow 的实现方式和产物存放位置。
    recommendation: 已确认（2026-10-27）：托管在 GitHub，CI 使用 GitHub Actions，安装包发布到 GitHub Releases。
  - id: app-identity
    question: 应用的正式显示名称与 bundle identifier 是什么？
    context: bundle identifier 一旦发布就不宜修改：macOS 按它存放 webview 数据（包括 dsh 会话 cookie），它同时也是单实例标识和安装升级的依据。
    impact: 决定 app-identity 计划变更，以及 desktop-experience 中单实例的标识。
    recommendation: 已确认（2026-10-27）：组织域名为 dsh-anywhere.keepwriting.work，bundle identifier 为其反写 work.keepwriting.dsh-anywhere；显示名称采用 DSH Anywhere。
planned_changes: {}
dependencies:
  - harness-web-shell 里程碑完成
  - 在 GitHub 上创建仓库，并配置为本地仓库的 origin 远程
  - 执行安装验收的三平台机器需接入与 DSH 主机相同的 Tailscale 网络，才能访问 dsh-url 输出的地址
risks:
  - 未签名的安装包会触发 macOS Gatekeeper 与 Windows SmartScreen 警告，需要在发布说明中给出绕过步骤
  - Windows runner 上回归命令依赖 bash、grep、awk，需要在 CI 中显式使用 bash shell
  - macOS 通用二进制（arm64 + amd64）需要 cgo 交叉编译，可能需要分别构建后合并
status: complete
notes: []
details: 打包优先复用 wails3 生成的 Taskfile 与 build/<platform>/ 配置（wails3 package），CI 只负责调用这些任务，不复制一份打包逻辑。版本号经 ldflags 注入并通过“关于”菜单展示。
