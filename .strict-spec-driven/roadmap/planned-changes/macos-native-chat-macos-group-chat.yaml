planned_change:
  id: macos-group-chat
  milestone: macos-native-chat
status: complete
summary: 群聊：成员归属与颜色、群公告、@ 成员补全（可多选）、引用另一个聊天、停止群或单个成员工作、群目标与阶段进度、群进度，以及后台任务条、电脑操作请求与模型失败修复卡等聊天条
details: 以 android-dsbot 的 group-chat 与打磨里程碑 dsbot-chat-bars-0310 为准，复用 macos-bot-chat 的渲染组件。@ 补全：输入 @ 时在输入框上方弹出成员名册（键盘上下选择、Enter 插入），同一消息可提及多个成员。停止：stop-room-work 与 stop-member-work。群目标条显示阶段进度并提供目标操作；room-progress 查看成员进度。聊天条：后台任务条逐任务停止（bot-stop-task）、电脑操作请求拒绝/本次/总是（computer-app-answer）与 computer-stop、模型失败修复卡（此时模型服务商页尚未在 macOS 上线则指引到对应位置，macos-native-manage 完成后直达）。验收：按里程碑完成标准第 3 条。
depends_on:
  - macos-bot-chat
