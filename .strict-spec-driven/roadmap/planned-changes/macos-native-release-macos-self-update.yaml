schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: macos-self-update
  milestone: macos-native-release
status: planned
summary: 原生 macOS 自更新：设置中配置自托管更新源，检查 latest.json 的 macOS 条目、下载 zip、校验 sha256、退出后替换自身并重启，失败回退为打开 dmg；本地发布流程把 Release 中的 macOS 资产同步到 DSH_UPDATES_DIR
details: DshCore：latest.json macOS 条目解析、版本比较、sha256 校验结果判定（与 Android UpdateCheck 契约一致，扩展字段向后兼容 Android 客户端），swift test 覆盖。App：设置窗口「更新」条目（更新源地址校验仅 https、检查更新、下载进度、安装），下载到临时目录并校验 sha256，不符即删除并提示；解压后由随应用打包的辅助脚本在主进程退出后替换 /Applications 中的 .app 并重新打开，替换前移除可能的 quarantine 属性；目标目录不可写时回退为打开同版本 dmg 并提示手动拖拽。发布：扩展 scripts/android-release.mts 或新增 scripts/macos-release.mts，在 tag 提交上用 gh 下载 Release 中的 macOS zip 与 .sha256，同步到 DSH_UPDATES_DIR 并更新 latest.json（与 Android 条目合并写入），沿用工作区干净、tag 与 HEAD 一致、Release 已存在、DSH_UPDATES_DIR 存在的强制前置校验，脚本测试以注入 Runner 断言前置失败与命令序列；tech/packaging 登记 macOS 自更新与同步规则。验收：按里程碑完成标准第 2 条。
depends_on:
  - macos-release-switch
