planned_change:
  id: android-proxy-routing
  milestone: android-app
status: complete
summary: WebView 经进程内本地代理桥按目标分流：tailnet 目标经内嵌节点、其他目标经手机网络直连，并让连接探测走同一路径
details: core 模块实现代理桥与分流：本地 CONNECT/HTTP 代理只监听 127.0.0.1 随机端口，要求本进程随机生成的代理凭据，不带或带错凭据返回 407 且不连接任何目标；手机本机回环目标（127.0.0.0/8、::1、localhost）拒绝；同时在役连接数有上限，超限直接关闭；tailnet 目标（100.64.0.0/10、fd7a:115c:a1e0::/48 字面地址、*.ts.net、不含点的 MagicDNS 短名）经 SOCKS5 交给内嵌节点，其他目标直连；明文 HTTP 转发只允许已保存 harness 的源，其他主机的明文请求被拒绝（与 android-main-webview 的明文放行判定共用 core 逻辑），CONNECT 隧道不受此限。:app 用 androidx.webkit ProxyController 把 WebView 代理指向该桥并提供凭据；系统 WebView 不支持代理覆盖时不加载并提示升级系统 WebView。连接探测与会话失效探测改走同一分流路径，使 tailnet 上的 harness 地址的可达性判定与 WebView 一致。隧道状态联动：配置的 harness 地址为 tailnet 目标时，隧道处于未配置状态则显示需要接入 tailnet 的说明与去设置入口；处于连接中、需要 key 或失败状态则不加载网页，显示隧道状态与“重试连接”“去设置”入口，隧道连上后自动加载；非 tailnet 地址照常直连，不受隧道状态影响。主规格：android-app 主规格新增分流、代理隔离与隧道未连接状态场景。测试：core JUnit 覆盖分流判定（含 100.63.255.255 与 100.128.0.0 等边界地址、主机名大小写与末尾点）、407 凭据、回环拒绝、非 harness 源明文拒绝与连接上限；Windows 宿主模拟器与真机验收 tailnet harness 经节点加载、公网资源直连、同机其他进程（adb shell 下 curl）无凭据访问得到 407，以及 harness 流式回答与 WebSocket 经桥正常，留证。
depends_on:
  - android-tstunnel
  - android-main-webview
