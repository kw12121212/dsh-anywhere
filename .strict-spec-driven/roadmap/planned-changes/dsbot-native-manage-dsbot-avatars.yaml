summary: 头像库：浏览可复用头像、从手机相册或相机导入照片、删除，并设给 Bot
details: avatar-library 列出头像库；avatar-import 把手机上选取并裁剪为方形的图片（按服务端大小与格式限制压缩）以 data URL 导入；avatar-delete 删除（二次确认，正在使用时显示服务端结果）。在 Bot 外观设置中可从头像库选择。头像图片只经 API 传输，不写入日志。 实现要点：入口在 Bot 外观设置与头像库页；App 用系统照片选择器（Photo Picker）与相机取图，提供方形裁剪界面，压缩后编码为 data URL；avatar-import 接收 items 数组，可一次导入多张，单张大小与格式上限以 dsbot-baseline-0310 实测登记为准，超限在发送前本地提示而不是等服务端拒绝。core：data URL 编码、MIME 判定与大小校验、avatar-library 解码，JUnit 覆盖。写操作不自动重试，成功后以 feed/state 刷新。验收：从相册导入两张照片、裁剪后出现在头像库并可设给 Bot，网页端同步显示；删除正在使用的头像时显示服务端结果；超限图片被本地拦截并提示。
depends_on:
  - dsbot-bot-manage
