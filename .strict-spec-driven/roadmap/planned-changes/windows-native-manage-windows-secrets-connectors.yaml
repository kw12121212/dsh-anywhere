summary: 密钥与连接器：密钥设置页（名称、作用 Bot、更新时间，新增、更新、删除，值不回显），连接器与邮箱（连接、断开、重试、取消、登录码、客户端配置、导入扫描，邮箱账号、规则与待发邮件确认）
details: 对应 macos-secrets-connectors。密钥与聊天密钥卡共用 PasswordBox 组件与 Dsh.Core 脱敏。连接器按鉴权类型：直接连接、OAuth 经默认浏览器、key 表单、token 表单、设备码复制后打开验证地址并之后清理剪贴板；本机浏览器可完成的 OAuth 直接完成并标注平台差异；聊天连接器请求卡点「连接」直达本页对应项。验收：按里程碑完成标准第 3 条第二项。
