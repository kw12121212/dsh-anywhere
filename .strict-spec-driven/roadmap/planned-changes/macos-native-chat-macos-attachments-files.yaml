planned_change:
  id: macos-attachments-files
  milestone: macos-native-chat
status: complete
summary: 附件与文件：经打开面板、拖放与粘贴选取图片和文件随消息发送（上传状态、失败单件重试、图片压缩），聊天中附件用 Quick Look 预览并经保存面板保存，服务器文件分块下载，长消息全屏阅读与图片浏览
details: 发送：附件先经 uploadFileBinary 上传（URLSession 流式上传，进度与失败原因可见），receipt 齐备后经 dsh mux/JSON-RPC 提交带附件消息（帧编解码复用 DshCore），纯文本仍走 send；图片按 Android 当时规则压缩（长边约 2048、JPEG 约 0.82）。拖放到聊天区与在输入框粘贴图片均加入附件栏。查看：readAttachment 与 image（先 preview 后原图）取回字节，图片在应用内查看器中浏览（左右切换），文件用 Quick Look 预览；保存经 NSSavePanel。file-download 分块拼接复用 DshCore（版本变化中止、文件名清洗），完成后可在 Finder 中显示或用默认应用打开。长消息：右键「阅读全文」（file-text）在可选择文字的独立窗口或 sheet 中显示。附件与下载内容不写日志与诊断。验收：按里程碑完成标准第 5 条前半。
depends_on:
  - macos-bot-chat
