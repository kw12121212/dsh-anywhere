status: planned
summary: 建立 windows/ 工程：纯 .NET 的 Dsh.Core 类库（Linux 可测）与 WinUI 3 非打包应用、应用身份与版本注入、Package 工作流在 Windows runner 构建自包含产物，并把 Core 的 dotnet test 接入完整回归命令
details: 创建 windows/Core（Dsh.Core.csproj，net10.0，Nullable 启用，Dsh.Core.Tests 用 xUnit 与一个占位测试）与 windows/App（WinUI 3 桌面应用，net10.0-windows10.0.19041.0，WindowsPackageType=None、WindowsAppSDKSelfContained=true，x64，空主窗口占位）与解决方案文件。构建期从仓库根 package.json 读取 version 写入程序集版本与文件版本；显示名 DSH Anywhere，图标由 build/ 下现有图标转换为 .ico。.github/workflows/package.yml 增加原生 Windows 构建 job（windows-latest，dotnet publish 自包含，产物上传为工作流 artifact，不进 Release，Electron 的 dist:win 保持不变），通过 actionlint 与 scripts/workflows.test.mts 结构断言更新。.strict-spec-driven/config.yaml 回归命令追加 dotnet test windows/Core，AGENTS.md 常用命令同步（含 WSL 安装 .NET 10 SDK 的说明与 GAMEPC interop 构建 App 的命令）。新建 tech/windows-client 技术标准登记分层规则（Core 只用 BCL）、目录结构、构建与回归约定。验收：本机 Linux dotnet test 通过；GAMEPC 上构建并运行显示占位窗口；CI 产物可运行。 分支验收：除 GAMEPC 本地构建外，变更分支上可经 gh workflow run 手动触发 Package 工作流（已有 workflow_dispatch）的原生 Windows job 取得产物，无需先合入 main。
