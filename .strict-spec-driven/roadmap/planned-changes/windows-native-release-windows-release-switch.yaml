schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: windows-release-switch
  milestone: windows-native-release
status: planned
summary: Release 与 Package 工作流的 Windows 产物切换为原生按用户安装的安装程序（文件名约定不变）并检测卸载 Electron 版，electron-builder 只保留 Linux，更新 README、packaging 与 build-identity 技术标准及桌面主规格的平台标注
details: 确定安装程序工具（Inno Setup、WiX 或 NSIS 包装 dotnet publish 自包含产物）并登记 tech/packaging；安装到 %LOCALAPPDATA%\Programs\DSH Anywhere，开始菜单快捷方式，卸载项名称与 Electron 版区分，安装时检测 Electron 版卸载项并提示卸载；支持静默安装参数。release.yml 与 package.yml：Windows job 产出 dsh-anywhere_<版本>_windows_amd64_installer.exe 与 .sha256，Release 资产断言同步；electron-builder.yml 删除 win 与 nsis 段，scripts/dist.mts 与 npm dist:win 移除，src/main 中仅 Windows 生效的分支若成为死代码则清理并保持覆盖率门槛；actionlint 与 scripts/workflows.test.mts 通过。README SmartScreen 说明改为原生安装程序并写明从 Electron 迁移。桌面主规格标注 Linux 由 Electron 实现、Windows 与 macOS 由原生规格承接。验收：按里程碑完成标准第 1、3 条。
depends_on:
  - windows-system-about
