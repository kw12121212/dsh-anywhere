summary: 成员 Agent：为 Bot 添加、查看、接管、归档、重命名与移除成员 Agent
details: 在 Bot 详情页的成员 Agent 列表中实现 add-agent、agent-session（查看该 Agent 会话内容，复用聊天条目渲染）、agent-adopt、agent-archive、agent-rename、remove-agent（二次确认），状态与网页端详情面板一致并经 feed 更新。 上游手机端参考（2026-11-22，DS-Bot 0.3.10）：团队「+」菜单在服务端声明 agents 能力且团队尚无 DSH Agent 时提供添加入口（add-agent）；Agent 聊天经 agent-chat 读取，无会话时先经 agent-chat/agent-session 取得（按 Agent 去重），发送沿用发送箱，停止用 stop-agent；Agent 不参与已读标记。
