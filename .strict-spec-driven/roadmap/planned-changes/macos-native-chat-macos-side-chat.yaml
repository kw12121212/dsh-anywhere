planned_change:
  id: macos-side-chat
  milestone: macos-native-chat
status: planned
summary: Side chat 与 btw 卡：在右侧检查器中新建旁路会话、附最近消息快照提问（不运行工具不打断工作）、流式回答、取消与关闭，切换聊天后进行中状态保留；btw 卡查看与删除
details: 以 android-dsbot 的 side-chat 规格为准，纯逻辑复用 DshCore（SideChat）。入口：聊天头部工具栏按钮与输入 /side；检查器中列出该 Bot 的旁路会话，side-new、side-ask（recent:true）、side-cancel、side-close；回答流式显示并标注「基于目前进度回答，未运行任何工具」；不接受附件（与网页端提示一致）。btw 卡显示插话内容与来源，btw-delete 删除后与网页端同步。验收：按里程碑完成标准第 5 条后半。
depends_on:
  - macos-bot-chat
