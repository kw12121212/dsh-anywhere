schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: release-workflow
  milestone: cross-platform-release
status: complete
summary: 推送 v* tag 时自动构建三平台安装包并发布到版本发布页，附带 SHA256 校验文件
details: 新增由 v* tag 触发的 GitHub Actions 发布工作流：从 tag 解析版本号并注入构建，复用打包任务产出全部安装包，生成 SHA256SUMS 文件。先创建草稿 Release 并上传全部产物，全部上传成功后才发布；任一平台构建或上传失败则删除草稿，不留下半成品 Release。以推送 v0.1.0 tag 的端到端演练作为验收。
depends_on:
  - platform-packaging
