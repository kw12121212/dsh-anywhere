schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: macos-release-switch
  milestone: macos-native-release
status: planned
summary: Release 与 Package 工作流的 macOS 产物切换为原生应用（universal dmg、zip 与 .sha256，文件名约定不变），electron-builder 移除 mac 目标与 macOS 专属代码路径，更新 README、packaging 与 build-identity 技术标准及桌面主规格的平台标注
details: release.yml 与 package.yml：macOS job 构建原生应用并产出 dsh-anywhere_<版本>_macos_universal.dmg、dsh-anywhere_<版本>_macos_universal.zip 与对应 .sha256，Release 资产断言同步；Electron job 只保留 Windows 与 Linux；electron-builder.yml 删除 mac 段，scripts/dist.mts 与 npm dist:mac 移除或改为调用原生构建，src/main 中仅 macOS 生效的分支（菜单、Dock 行为等）若因此成为死代码则清理并保持覆盖率门槛。所有工作流变更通过 actionlint 与 scripts/workflows.test.mts。README 的 macOS Gatekeeper 说明改为原生应用，并写明从 Electron 版迁移（安装新版、首次启动带入地址、重新认证、删除旧版）。tech/packaging 与 tech/build-identity 登记原生 macOS 的构建与版本注入；桌面主规格标注 Windows/Linux 由 Electron 实现、macOS 由 macos-app 规格承接。验收：按里程碑完成标准第 1、3 条。
depends_on:
  - macos-system-about
