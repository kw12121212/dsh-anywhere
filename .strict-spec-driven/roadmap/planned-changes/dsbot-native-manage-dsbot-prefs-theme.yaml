planned_change:
  id: dsbot-prefs-theme
  milestone: dsbot-native-manage
status: complete
summary: 团队偏好与外观：主题、强调色、消息布局、头像动画等级、Enter 键行为与新 Bot 默认模型，App 按偏好渲染
details: '设置页 General 部分经 set-prefs 读写团队偏好：主题（浅色、深色、跟随系统）、强调色、消息布局（气泡或平铺）、头像动画等级（安静、普通、活泼）、Enter 键发送或换行、新 Bot 默认模型。网页端的消息宽度滑杆在手机上不显示，App 写偏好时原样保留服务端已存的宽度值。App 的 Compose 主题、聊天布局与头像动画按偏好渲染，偏好变化经 feed 同步到 App 与网页端；在 android-dsbot 规格中写明宽度设置不在手机上提供。 与本机外观的关系（参考上游 ui/tokens.ts）：DS-Bot 的 theme 是命名主题标识（服务端校验 ^[a-z][\w-]{0,31}$），决定配色方案，accent 为 #rrggbb 或清除；明暗由 dsbot-phone-prefs 的本机外观决定（本机为跟随系统时按系统明暗），团队偏好不覆盖本机明暗选择；未知主题标识回退默认配色。'
depends_on:
  - dsbot-team-home
  - dsbot-phone-prefs
