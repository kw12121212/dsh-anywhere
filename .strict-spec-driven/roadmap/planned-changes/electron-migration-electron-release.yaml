schema: strict-spec-driven/planned-change/v1
schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: electron-release
  milestone: electron-migration
status: planned
summary: 用 electron-builder 产出三平台安装包并迁移 CI 与 release workflow，随后移除 Go/Wails 代码完成切换
details: electron-builder 配置应用身份（显示名称 DSH Anywhere、appId work.keepwriting.dsh-anywhere、由 git tag 注入的版本号、现有三平台图标），产出 Windows NSIS 安装包、macOS universal dmg、Linux AppImage 与 deb，文件命名与 release.yml 现有约定一致；package 与 release workflow 改为调用 electron-builder，推送 v* tag 时上传全部安装包与 SHA256 校验文件。确认 Electron 版行为覆盖全部主规格后删除 go.mod、go.sum、main.go、internal/、frontend/（Wails 前端与 bindings）、Taskfile.yml、build/ 中的 Wails 资产；回归命令去掉 Go 部分，coverage scope 只保留 TypeScript；CI 不再安装 GTK4/WebKitGTK 与 Go。用 strict-tech-edit 退役 go-package-layout、webview-isolation 等 Wails 专属技术标准并更新 packaging、ci-regression、build-identity、frontend-dependencies、state-persistence、security-secrets；更新 config.yaml 的 context 与 code 规则（删除 Wails bindings 规则）、AGENTS.md 与 README 的技术栈与常用命令；Wails 专属 lessons 用 lesson-obsolete 标记过时。验收：三平台 CI 通过，在 Windows、macOS、Linux 上分别安装产物验证首次设置、加载 harness、外部链接与会话失效行为。不改变任何主规格。
depends_on:
  - electron-setup-settings
  - electron-desktop-experience
