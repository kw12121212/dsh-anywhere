planned_change:
  id: macos-scaffold
  milestone: macos-native-foundation
status: planned
summary: 建立 macos/ 工程：纯 Foundation 的 Swift Package DshCore（Linux 可测）与 SwiftUI 应用、应用身份与版本注入、Package 工作流在 macOS runner 构建 .app 产物，并把 Core 的 swift test 接入完整回归命令
details: 创建 macos/Core（Package.swift，库 DshCore，swift-tools 6.x，平台声明 macOS 14，测试目标）与 macos/App（SwiftUI App 入口、空主窗口占位）。确定 App 工程生成方式（如 XcodeGen 或 SwiftPM 可执行目标 + 打包脚本），要求 CI 无交互构建、不提交 xcuserdata；构建期从仓库根 package.json 读取 version 写入 CFBundleShortVersionString 与 CFBundleVersion，显示名 DSH Anywhere、bundle id work.keepwriting.dsh-anywhere、图标复用 build/ 下现有图标资源转换为 AppIcon。通用二进制（arm64 + x86_64）。.github/workflows/package.yml 增加原生 macOS 构建 job（macos-latest，产物上传为工作流 artifact，不进 Release，Electron 的 dist:mac 保持不变）并通过 actionlint 与 scripts/workflows.test.mts 结构断言更新。.strict-spec-driven/config.yaml 的 review_evidence.project_regression.command 追加 swift test --package-path macos/Core，AGENTS.md 常用命令同步。新建 tech/macos-client 技术标准登记分层规则（Core 只用 Foundation、Apple API 只在 App）、目录结构、构建与回归约定；最低 macOS 版本按里程碑 macos-min-version 默认 14。验收：本机 Linux swift test 通过（含一个占位测试）；CI 产物在用户 Mac 上可打开显示占位窗口。 分支验收：Package 工作流已有 workflow_dispatch，变更分支上经 gh workflow run 手动触发原生 macOS job 取得产物供用户 Mac 验收，无需先合入 main。
depends_on: []
