status: planned
summary: 模型与能力：Settings 分页中查看模型、思考强度与 thinking 选项，新增与删除服务商、填写 key（不回显）、拉取并选择模型；能力（MCP stdio/HTTP、技能、能力包）列表、保存、批准、删除与按 Bot 开关
details: 对应 Android dsbot-models-providers 与 dsbot-capabilities。provider-key 用 SecureField，value:null 移除；provider-add 支持已知与自定义服务商；provider-models 查找模型；provider-remove 二次确认。能力：capability-save（长文本用多行编辑器）、capability-approve、capability-delete（二次确认）、bot-capability 在 Bot 详情中开关；状态按严重程度合成（DshCore）。上线后模型失败修复卡直达本页。验收：按里程碑完成标准第 3 条第一项与能力操作两端一致。
depends_on:
