planned_change:
  id: dsbot-bot-manage
  milestone: dsbot-native-manage
status: planned
summary: Bot 详情与设置：新建、编辑、复制、删除 Bot，设 Main Bot、私有与标记，配置模型、思考强度、权限预设与外观
details: Bot 详情页（从私聊页头像或菜单进入）展示名称、角色、指令、模型、思考强度、权限预设、私有状态、Main Bot 标记、工作文件夹与成员 Agent 入口。实现 create-bot、update-bot、duplicate-bot、delete-bot（二次确认）、set-main、private-release（释放保留的私有 Bot 文件夹）、set-flags（置顶等）；模型、思考强度来自 models/efforts/thinking 端点的选项；外观选择 20 个角色形象与 12 种颜色或头像库照片（头像库在 dsbot-avatars）。权限预设只有用户能改，与网页端一致。保存后以 feed 刷新确认，两端设置一致。 上游手机端参考（2026-11-22，DS-Bot 0.3.10 mobile/）：聊天页头部提供模型快速切换底部抽屉（模型按服务商分组、思考强度选择，efforts 按模型缓存，update-bot {model, effort}）；新建 Bot 做重名检查，团队列出后直接打开新聊天；update-bot、set-main、bot-capability 采用乐观写入——补丁立即本地生效，在途写在每次新 state 到来时重新叠加防止被旧轮询覆盖，effort:null 与 workDir:'' 表示清除该键，失败时重置 revision 并整体重取（纯逻辑放 core 以 JUnit 覆盖），可替代仅依赖 feed 刷新的做法。
depends_on:
  - dsbot-bot-chat
