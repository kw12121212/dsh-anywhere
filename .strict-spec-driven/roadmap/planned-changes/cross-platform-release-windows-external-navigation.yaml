planned_change:
  id: windows-external-navigation
  milestone: cross-platform-release
status: planned
summary: 在 Windows 上补齐依赖注入脚本的主窗口行为：导航范围策略（非同源链接与 window.open 交给系统浏览器）与 dsh 会话失效识别
details: external-navigation 与 dsh-session-auth 按用户 2026-10-27 的选择（方案 A）只实现了 Linux/macOS：Wails v3.0.0 在 Windows 上只对 HTML 内容使用窗口 JS 选项，远程页面上 ExecJS 永远排队，也不暴露 WebView2 实例。因此 Windows 上外部链接仍在主窗口内打开、window.open 弹出 WebView2 自带窗口，会话失效时主窗口显示 dsh 自身的 401 文本而不是本地重新认证提示页。本计划变更需用 WebView2 原生接口补齐：AddScriptToExecuteOnDocumentCreated 注入 internal/navigation 与 internal/session 的脚本，或 NavigationStarting 取消非同源导航、NewWindowRequested 交给系统浏览器、NavigationCompleted 读取 HTTP 状态识别 401；先确认能否在不修改 Wails 的前提下取得 ICoreWebView2，必要时评估升级 Wails 版本。复用 navigation.SameOrigin、navigation.Handler 与 session.Handler 的校验；需要在真实 Windows 机器上验证 navigation-scope 与 session-auth 主 spec 的全部场景，确认 WebView2 cookie 跨重启保留，并确认 guard 仍拦截远程页面对本地服务的调用。
depends_on:
  - external-navigation
  - dsh-session-auth
team:
  labels:
    - windows
