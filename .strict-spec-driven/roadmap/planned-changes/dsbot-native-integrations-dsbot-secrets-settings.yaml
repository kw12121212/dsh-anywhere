summary: 密钥设置页：列出密钥名称与用途，新增、更新与删除，值不回显
details: Settings → Secrets 原生页：列表只显示名称、作用 Bot 与更新时间，不显示值；新增与更新（secret-update）用不回显输入框，删除（secret-delete）二次确认。与聊天中的密钥请求卡共用输入组件与脱敏规则；core 中的日志与诊断脱敏对密钥字段有 JUnit 覆盖。 端点分工核对（2026-11-22）：DS-Bot 0.3.10 同时存在 secret-set（上游手机端设置页新增用）与 secret-update，两者分工以 dsbot-baseline-0310 的实测登记为准。
