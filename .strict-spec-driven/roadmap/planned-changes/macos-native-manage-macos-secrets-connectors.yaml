planned_change:
  id: macos-secrets-connectors
  milestone: macos-native-manage
status: planned
summary: 密钥与连接器：密钥设置页（名称、作用 Bot、更新时间，新增、更新、删除，值不回显），连接器与邮箱（连接、断开、重试、取消、登录码、客户端配置、导入扫描，邮箱账号、规则与待发邮件确认）
details: 对应 Android dsbot-secrets-settings 与 dsbot-connectors-mail。密钥与聊天密钥卡共用 SecureField 组件与脱敏规则（DshCore 脱敏有测试）。连接器动作按鉴权类型（直接连接、OAuth 浏览器登录经系统浏览器、key 表单、token 表单、设备码复制后打开验证地址并在之后清理剪贴板）；Mac 上 OAuth 回调若能在本机浏览器完成即直接完成，规格中标注与 Android 的差异；聊天中的连接器请求卡点「连接」直达本页对应项。验收：按里程碑完成标准第 3 条第二项。
depends_on:
