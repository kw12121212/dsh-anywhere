schema_version: 1
artifact_type: planned_change
schema_file: ../../templates/strict-spec-driven/schemas/planned-change.yaml
planned_change:
  id: platform-packaging
  milestone: cross-platform-release
status: complete
summary: 为三平台生成安装包：Windows NSIS、macOS .app 与 .dmg、Linux AppImage 与 .deb
details: 复用 wails3 生成的 build/<platform>/ 配置和 Taskfile 打包任务（wails3 package），补齐 dmg 与 deb 所需配置；CI 中按平台调用打包任务并上传产物。架构默认：Windows 与 Linux 只出 amd64；macOS 优先出 arm64 + amd64 通用二进制，若 cgo 交叉编译受阻，则改为分别构建 arm64 与 amd64 两个 dmg。不做签名与公证，在 README 中写明首次启动绕过 Gatekeeper 与 SmartScreen 的步骤。产物文件名包含应用名、版本号、平台与架构。
depends_on:
  - app-identity
  - ci-regression-matrix
