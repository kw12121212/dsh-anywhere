  dsh-agent-endpoints-0310:
    strength: MUST
    statement: 'DSH Agent 端点（DS-Bot 0.3.10）：团队至多一个 DSH Agent，state.agents[{id, name, sessions[], createdAt}]，sessions 末尾为最新会话；live work.agents{agentId→{since, …}} 表示工作中；hello capabilities 的 agents 为入口门控。add-agent {} → Agent 对象（已有时拒绝）；agent-chat {agentId, cursor?} → {sessionId?, items[], cursor?}（最新会话的分页，与 chat 同由 partPage 生成；全部会话已归档时 items 为空；未知 Agent 回 bot/not-found，已实测）；agent-session {agentId} → {sessionId}；agent-archive {agentId, sessionId} → true；agent-rename {agentId, sessionId, title(trim 后非空，截断到 80)} → true；remove-agent {agentId} → 整份 state；stop-agent {agentId} → 是否停止了运行中的回合；agent-adopt {agentId, sessionId} 手机端不使用。发送为 send {sessionId: Agent 最新会话, text}。Agent 会话不发布 feed stream/message，只在状态变化时发布 live，客户端据此或兜底轮询重读 agent-chat'
