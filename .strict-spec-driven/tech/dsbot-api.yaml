  slow-endpoints-executor:
    strength: SHOULD
    statement: 会在服务端等待外部服务（模型调用、IMAP/SMTP 登录与发信、OAuth 发现与令牌校验、导入等）才应答的 /api/bot 端点登记到 core 的慢端点集合（MemoryPanel.SLOW_ENDPOINTS、ConnectorSettings.SLOW_ENDPOINTS 等），由连接层以长读超时（300 秒）在独立的按需线程池发出；不得放在状态 executor 上同步执行，也不得占用 2 线程的聊天读取池；停靠区等经聊天控制器作答的慢端点同样改道；失败后不自动重试，按 manage-write-feedback 显示原因
    rationale: dsbot-memory 发现默认 30 秒读超时会误报失败而服务端照样执行；dsbot-connectors-mail 评审发现 SMTP 发信与 IMAP 验证最长约 2 分钟，两个同时在途会占满读取池、卡住聊天历史与媒体，放在状态 executor 上则卡住 feed 合并；同里程碑 IM 登录等待、更新安装等端点也会遇到
    enforcement:
      method: review
      detail: 评审检查新消费的端点是否核对上游最坏耗时，慢端点是否登记进 core 慢端点集合，NativeShellConnection.postBot 的 slow 判断与 executorFor 是否覆盖该集合；mock 按真实耗时延迟一次
  im-endpoints-0310:
    strength: MUST
    statement: 'IM 接入端点（DS-Bot 0.3.10，经 dsh 的 POST /api/bot，会话 cookie 鉴权）：state.im 为 {connections[], platforms[可添加的平台 id]}，连接 {id, platform, account{id, name}|null, botId|null, settings{非密钥字段}, secrets[密钥字段名，不含值], enabled, paired[{id, name, at}], requests[{id, name, chatKey, chatKind: direct|group, …}], chats{chatKey→{kind: direct|group, title, target?{botId}|{roomId}, at}}, createdAt}；live imStatus{connId→{state: ready|connecting|retrying|error, error?, at}}（未出现视为连接中，enabled=false 显示为已停用）。平台目录（字段 key/label/secret/options、buttons、groups、login:''qr''）只在上游 src/shared/im-platforms.js，客户端内置并以 state.im.platforms 过滤。写端点：im-add {platform, botId, fields{key→value}}（扫码平台拒绝；先向平台校验账号再保存，密钥存为 DS Bot 密钥）→ 连接视图；im-update {id, enabled?, botId?, fields?} → 连接视图；im-remove {id} → true；im-pair {id, senderId, allow} → true；im-unpair {id, senderId} → true；im-chat {id, chatKey, target?:{botId}|{roomId}|null, remove?:true} → true；im-retry {id} → true；im-login-start {platform, botId} → {loginId, qr(编码进二维码的文本), expiresAt, botId}；im-login-wait {platform, botId, loginId} → {status: waiting|scanned|expired} 或 {status:''done'', id}（单次长轮询最长约 35 秒，属慢端点）。失败均为 {ok:false, error:{code:bot/refused, message}}。实测与源码核对界定：state.im 与 imStatus 形态及写端点错误应答为本机真实服务只读实测（FINDINGS 第 30 节）；写端点成功应答与扫码流程为源码核对，由 mock --manage 按同一形态覆盖验收，未改动用户真实 IM 连接'
    rationale: IM 端点首次被手机端消费，平台目录不随 state 下发、扫码登录为长轮询，登记完整字段、门控方式与实测边界作为单一事实来源，避免后续变更把源码核对误当实测或误用默认读超时
    enforcement:
      method: review
      detail: core JUnit（ImBridgesTest）覆盖 state.im/imStatus 解码、状态合成、平台目录过滤、聊天名称与绑定目标、添加校验、扫码应答解码与全部请求体字面值；源码核对位置：ds-bot 0.3.10 src/host/im/index.js（endpoints、viewOf、imView、imStatusView）、src/shared/im-platforms.js、im/platforms/weixin.js（loginStart、loginWait、POLL_TIMEOUT_MS）、channel.js（state im、live imStatus、端点分发）、client.js（ImPage、AddView、QrLogin、DetailView、GUIDES）
  local-agent-endpoints:
    strength: MUST
    statement: '本地 Agent 端点（DS-Bot 0.3.10 核对；经 dsh 的 POST /api/bot）：local-agents {} → {available: boolean（DSH 能否注册 LLM adapter）, detected[{route（如 local-claude-code、local-codex-cli）, name, path, version|null, signIn(登录命令文本), signedIn: true|false|null}], custom[{id, name, command, args[], route: ''local-acp-<id>'', available}]}（对团队数据只读，但会扫描电脑并可能更新已注册的本地 Agent 路由，首次对找到的 CLI 运行 --version、每 60 秒运行登录检查，各自限时）；local-agent-refresh {} → 同上（清模型缓存与登录探测后重扫；不在上游 READS，只读宿主拒绝）；local-agent-models {route} → [{provider, id, name, reasoning?}]（首次会在电脑上启动该 CLI，未注册路由回 []）；local-agent-add {name, command, args[]} → 条目+route（validateCustom：名称必填截 40、命令为程序名/绝对路径/~/路径/盘符路径且无空白、参数不含换行；电脑上找不到程序名时拒绝）；local-agent-update {id, name?, command?, args?} → 条目+route；local-agent-remove {id} → custom 视图。失败为 {ok:false, error:{code:bot/refused, message}}。0.3.10 hello capabilities 不含本地 Agent 能力名、state 中也无对应字段，入口不门控，页面以 local-agents 应答降级（bot/not-found 说明此远端不支持，available=false 说明无法注册）；local-agents、local-agent-refresh、local-agent-models、local-agent-add 属慢端点。实测与源码核对界定：local-agents 应答与写端点错误应答为本机真实服务只读实测（FINDINGS 第 31 节）；local-agent-models 与写端点成功应答为源码核对，由 mock --manage 覆盖，未改动用户真实本地 Agent'
    rationale: 本地 Agent 端点首次被手机端消费，应答不在 state 中、会在电脑上运行 CLI，登记字段、门控方式、慢端点与取证边界作为单一事实来源，避免后续变更误按 hello 门控或在取证时启动 CLI
    enforcement:
      method: review
      detail: core JUnit（LocalAgentsTest）覆盖应答解码、简短版本、登录状态、模型解码、表单校验与参数切分、请求体字面值；源码核对位置：ds-bot 0.3.10 src/host/local-agents/index.js（localAgentsEndpoint、detected、customView、freshList）、engines.js（validateCustom）、adapter.js（probeModels）、channel.js（端点分发）、client.js（LocalAgentsPage、AgentSignInRow、AgentForm、shortVersion）
  provider-endpoints:
    strength: MUST
    statement: '模型服务商端点（DS-Bot 0.3.10 源码核对，经 dsh 的 POST /api/bot）：providers {} → {available:false} 或 {available:true, providers[{id, name, models[{id, ref, name}], declaredModels[{id, ref, name}], refreshable, key: null | {configured, writable}, removable, custom, error?}], addable[{id, name}], protocols[], revision}（内置的在前、自加的在后；key 为 null 表示该路由不用 API key）；provider-key {provider, value: string|null}（null 移除；写入前 checkKey：非空、不是 NAME=value、无引号、仅可见 ASCII；路由不用 key 或 key 在外部设置时拒绝）→ providersView；provider-add {provider, key?} 或 {custom:true, provider（^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$）, name?(≤80), baseURL(http/https), api(protocols 之一), key?, models[≥1, 每项 {id, name?…}，id 不重复，≤500]} → providersView；provider-models {provider} 或 {baseURL, api?, key?}（key 只随本次请求发送、不保存）→ [{id, name?, contextWindow?, maxTokens?, inputModalities?}]；provider-models-save {provider, models[≥1], revision?}（仅可编辑且可列出模型的服务商；revision 不一致回 bot/stale）→ providersView；provider-remove {provider}（仅自加；随之移除其专属 key）→ providersView；models {} → {modelsKey}（刷新模型目录）；服务商与 key 的写入只换模型目录（dropCatalog）、不推进团队 state.revision，state 应答带 modelsKey（目录签名），客户端 state 请求须带 models: 上次的 modelsKey，否则 since 命中即回 unchanged、模型目录永不刷新（网页端同样携带）；efforts {ref} → {efforts[{id, name}], defaultEffort?}。校验失败为 {ok:false, error:{code:bot/invalid, message}}，并发修改为 bot/stale；providers、provider-models、models、efforts 在上游 READS 内。0.3.10 hello capabilities 不含服务商能力名、state 无对应字段，入口不门控，页面以应答降级。provider-models、provider-add、provider-models-save 属慢端点。实测与源码核对界定：providers 应答形态与写端点错误应答为本机真实服务只读实测（FINDINGS 第 32 节；providers 读取会触发上游 repairRoutes 为自定义路由补 compat，属上游读取行为）；写端点成功应答为源码核对，由 mock --manage 覆盖，未改动用户真实服务商与 key'
    rationale: 服务商端点首次被手机端消费，涉及 API key 写入、并发修改检测与自定义路由校验，登记完整字段、错误码、门控方式与取证边界作为单一事实来源，避免后续变更把源码核对误当实测或在取证时改动用户的模型配置
    enforcement:
      method: review
      detail: core JUnit（ModelProvidersTest、BotModelBatchTest、DsbotStatePayloadTest）覆盖 providers 解码、key 状态与使用者、模型草稿与受影响 Bot、key 与自定义服务商校验、批量计划与汇总、本地路由判定（同 client.js badgeOf）、state 请求的 modelsKey、全部请求体字面值；源码核对位置：ds-bot 0.3.10 src/host/providers.js（providersView、checkKey、addProvider、customProfile、discoverModels、saveProviderModels、removeProvider）、channel.js（端点分发与 READS）、client.js（ProvidersPage、ProviderRow、ModelDraft、KeyEditor、AddProvider、KnownForm、CustomForm、draftFrom、draftSummary、fallbacksFor、BotModelsPage、planModelChange、runModelChange、summarizeModelChange）
  on-demand-page-degrade:
    strength: SHOULD
    statement: 数据不在 state 中、按需由端点读取的原生设置页（如 local-agents、providers），若 0.3.10 hello capabilities 不声明对应能力名，入口不做门控，页面按首次读取的应答降级：未知端点（bot/not-found）显示「此远端不支持…」，应答声明 available:false 时显示该 DSH 无法提供的说明，其他失败显示原因并可重试；同时在 hello-capabilities 规则登记该端点组的例外；列表读取不可取消且可能乱序，须以代次号只采用最新一次应答，写端点若返回新视图则直接采用并使旧读取失效
    rationale: dsbot-local-agents 与 dsbot-models-providers 先后遇到同样的情形：hello 不声明、state 无字段，按 hello 门控会让入口永远隐藏，按版本论证又缺证据；按应答降级对旧远端安全、对其他功能无影响；两次评审都指出乱序读取会让旧应答覆盖新结果。同里程碑的日程、用量、系统页等后续变更会复用
    enforcement:
      method: review
      detail: 评审检查新增的按需设置页：首次读取失败时区分 bot/not-found 与其他错误、处理 available:false、读取带代次号、写端点返回视图时直接采用；hello-capabilities 例外已登记
    examples:
      good:
        - LocalAgentsPage / ModelProvidersPage 的 LaLoad/PvLoad 与 gen 计数
      bad:
        - 按 capabilities.has 隐藏入口导致永远不可见；或读取回调直接写页面状态，旧应答后到覆盖新结果
  schedule-endpoints:
    strength: MUST
    statement: '日程端点（DS-Bot 0.3.10 源码核对，经 dsh 的 POST /api/bot）：schedules {} → {available:false, tasks:[]}（DSH 未开启 Automation tasks）或 {available:true, canPause, tasks[{id, title, prompt, kind: at|after|every|daily|weekly|cron|rrule, scheduledAt(下次运行 ISO), everySeconds?, time?(HH:mm:ss), timeZone?, weekdays?(1–7), expression?, status: active|paused|ended…, updatedAt?, sessionId, botId?, roomId?, state: scheduled|overdue|paused|finished}]}（只含团队 Bot 与群聊会话的任务；Bot 在群聊会话创建的任务可同时带 botId 与 roomId，客户端归入该 Bot 分组并在行内注明所在群聊）；schedule-create {target(botId 或 roomId), title(1–120), prompt, when: {kind:''at'', at(ISO，将来)} | {kind:''daily'', time(HH:mm[:ss]), timeZone} | {kind:''weekly'', time, timeZone, weekdays[1–7，至少一个]} | {kind:''every'', minutes(1–10080)}} → schedules 视图；schedule-pause {sessionId, id, active}（canPause 时可用；到点的一次性任务暂停被拒；冲突自动重读一次）→ schedules 视图；schedule-delete {sessionId, id} → schedules 视图。失败为 {ok:false, error:{code:bot/invalid, message}}。schedules 在上游 READS 内。0.3.10 hello capabilities 不含日程能力名、state 无字段，按 on-demand-page-degrade 入口不门控、以应答降级。实测与源码核对界定：schedules 应答与写端点错误应答为本机真实服务只读实测（FINDINGS 第 33 节）；写端点成功应答为源码核对，由 mock --manage 覆盖，未改动用户真实任务'
    rationale: 日程端点首次被手机端消费，依赖 DSH 可选插件、时间规则有多种形态与时区语义，登记字段、校验边界、降级方式与取证范围作为单一事实来源
    enforcement:
      method: review
      detail: core JUnit（SchedulesTest）覆盖应答解码、时间规则与下次运行文案（注入 now 与 zone）、可暂停判定、分组顺序（含同时带 botId 与 roomId）、新建校验与 when 构造、请求体字面值；源码核对位置：ds-bot 0.3.10 src/host/schedules.js（schedulesView、selectorOf、endpoints）、channel.js（端点分发与 READS）、client.js（useSchedules、timingText、nextText、canPauseTask、TaskRow2、TaskForm、SchedulesPage、BotSchedules、ScheduleSummary）
  secret-endpoints-0310:
    strength: MUST
    statement: '密钥与存储加密端点（DS-Bot 0.3.10，经 dsh 的 POST /api/bot，会话 cookie 鉴权）：state 与 live 均携带 secrets[{name, purpose, scope: ''all''|string[], requestedBy: string|null, createdAt, updatedAt, lastUsedAt?}]（按 name 排序，绝不含值）与 secretStore{mode: ''plaintext''|''encrypted'', locked: boolean, source: ''user''|''env''|''file''|null, reason?: ''missing-passphrase''|''wrong-passphrase''|''passphrase-source''|''format''}。端点分工：secret-set {name, value, purpose?, scope?} 用于设置页新增或替换密钥值（带 requestId 时用于聊天密钥请求卡；name 规范化后须匹配 ^[A-Z][A-Z0-9_]{0,63}$，value 去首尾空白后 4–16384 字符，purpose 截断 300 字符）→ secretView；secret-update {name, scope?, purpose?} 仅更新作用 Bot 与用途（不接收 value）→ secretView；secret-delete {name} → true；secret-store {}（READS）→ secretStoreStatus；secret-unlock {passphrase}（READS，不改磁盘文件，8–1024 字符且不做 trim，只读宿主也可为本进程解锁）→ secretStoreStatus；secret-encrypt {passphrase}（明文改写为加密信封，已加密或只读宿主拒绝）→ secretStoreStatus；secret-decrypt {passphrase}（验证口令后写回明文，亦为锁定态恢复路径，未加密或只读宿主拒绝）→ secretStoreStatus。拒绝统一为 {ok:false, error:{code:bot/refused, message}}（7 个写端点非法参数均实测回 bot/refused），按服务端 message 显示。0.3.10 hello capabilities 不含密钥管理能力名，客户端以 state.secrets 字段存在门控入口、以 state.secretStore 字段存在显隐落盘加密卡。密钥值与口令只进请求体，不写入日志、诊断上报、剪贴板与持久存储。实测与源码核对界定：state.secrets、state.secretStore、secret-store 应答与写端点错误应答为本机真实服务只读实测（FINDINGS 第 34 节）；写端点成功应答与加解锁状态流转为源码核对，由 mock --manage 覆盖，未改动用户真实密钥与存储文件'
    rationale: 密钥设置页与落盘加密端点首次被手机端消费，且 secret-set 与 secret-update 分工、口令不做 trim、secret-decrypt 兼作锁定态恢复路径与只读宿主行为容易误判，登记完整契约、门控方式与实测边界作为单一事实来源
    enforcement:
      method: review
      detail: core JUnit（SecretsSettingsTest、DiagReportingTest）覆盖 secrets/secretStore 解码、名称规范化与校验、值与口令边界、作用范围与时间文案、全部端点请求体字面值与日志/诊断脱敏；源码核对位置：ds-bot 0.3.10 src/host/secrets.js（normalizeName、cleanValue、cleanScope、secretView、secretStoreStatus、endpoints、LOCKED_ENDPOINTS）、secrets-crypto.js（cleanPassphrase、MIN_PASSPHRASE、MAX_PASSPHRASE、encryptSecrets/decryptSecrets）、channel.js（view/live 的 secrets/secretStore、READS、端点分发）、client.js（SecretsPage、SecretRow、ScopeEditor、PurposeEditor、ValueEditor、AddSecret、SecretStoreCard）；FINDINGS 第 34 节登记本机真实服务只读探针结果
  system-endpoints-0310:
    strength: MUST
    statement: '关于与诊断端点（DS-Bot 0.3.10，经 dsh 的 POST /api/bot，会话 cookie 鉴权，均在上游 READS 内、只读宿主也可调用）：update-check {fresh?: boolean} → {name, current, latest|null, source: ''registry''|''git''|''path''|''tarball''|''app''|''unknown'', notesUrl|null, repoUrl|null, enabled, checkedAt(ms，0=未检查), phase: ''idle''|''installing''|''installed''|''updated''|''failed'', installed|null, error|null, available, dsh: null|{current|null, verified|null, kind: ''npm''|''app'', blockedBy|null, checkedAt, phase: ''idle''|''installing''|''installed''|''failed'', installed|null, error|null, available}}（非 fresh 时 10 分钟内返回缓存）；update-install {} 与 dsh-update-install {} 立即返回对应视图（phase=installing，已在安装中时原样返回），无可用更新或宿主不支持时为 bot 错误应答，安装结果只经后续 update-check 读回；repo-stars {} → 整数或 null（上游缓存 1 小时，失败保留上次值）；diagnostics {client?: {surface, language, userAgent}} → {facts{botVersion, dshVersion, os, node, team, models?, readOnly?}, entries[≤50，新到旧，{time, level: ''error''|''warn'', source, text, bot?, where?, code?, status?, stack?}], total, markdown, issuesUrl}；diagnostics-log {} → 已脱敏纯文本（每行一条，栈帧缩进）；diagnostics-clear {} → true。客户端必须：安装端点执行前二次确认、不自动重试；安装中仅在页面可见且前台时约 2 秒单飞轮询 update-check；远端诊断文本只在内存中显示，不写入 App 日志、诊断上报、剪贴板与磁盘；runSpike 只读探针不得调用 update-install、dsh-update-install、diagnostics-clear（会升级用户服务或清空真实日志），其成功形态按源码核对实现并在 mock --manage 上验收。'
    rationale: 关于页与诊断页端点首次被手机端消费：安装端点会在电脑上卸载重装 DS-Bot 宿主或替换全局 dsh、清理端点不可逆，且状态分支多（phase × source × kind × blockedBy），登记完整契约、客户端义务与实测边界作为单一事实来源
    enforcement:
      method: review
      detail: core JUnit（DsbotSystemTest）覆盖 update-check 与 dsh 子视图解码、DS-Bot 行与 dsh 行状态/按钮判定、轮询判定、diagnostics 解码与各端点请求体字面值；源码核对位置：ds-bot 0.3.10 src/host/channel.js（READS、update-check/update-install/dsh-update-install/repo-stars/diagnostics*）、update.js（view、check、start、repoStars）、dsh-update.js（view、check、start）、diagnostics.js（report、logText、clear）、client.js（botHint、dshHint、showsDshRow、AboutPage、FeedbackPage、wakeUpdate）；实测登记见 android/core/src/spike/FINDINGS.md 新节
  usage-endpoints:
    strength: MUST
    statement: '用量端点（DS-Bot 0.3.10 源码核对，经 dsh 的 POST /api/bot）：usage {timeZone?(IANA 时区 id，服务端截断 64 字符，非法时用服务端时区)} → {owners[{key, kind: bot|room|agent|other, id?, name?, deleted?}], models[{key: provider/model, provider, model, name, providerName?}], kinds[string：chat|group|compaction|image|memory|session-title|btw|side|other…], rows[[hour(''YYYY-MM-DD HH''，按 timeZone), owner 下标, model 下标, kind 下标, input, cacheRead, cacheWrite, output, calls]]（按 hour 升序，全部历史，以 15 分钟槽累加到小时）, now(''YYYY-MM-DD HH''), scanning: boolean}（上游等待账本扫描至多约 6 秒后以已有数据应答，不属慢端点）；usage-summary {botId, timeZone?} → {botId, day, week, month（近 24 小时、7×24 小时、30×24 小时的 {input, cacheRead, cacheWrite, output, calls}）, models[{key, name, input, cacheRead, cacheWrite, output, calls}]（近 30 天）, scanning}，未知 Bot 回 bot/not-found。客户端必须：请求带手机当前时区；总 token 为 input+cacheRead+cacheWrite+output，显示的输入含 cacheWrite，缓存命中率为 cacheRead/(input+cacheWrite+cacheRead)；分桶、上期对比与排行按网页端 usage-data.js 在客户端计算；小时键或 owner/model/kind 下标非法、元组不足 9 项时跳过该行，数值字段非法（null、非数字、负数、小数）按 0 计入（上游 count）；Bot 排行沿用网页端 isBot，bot 与 agent 同属 Bot 一组。usage 与 usage-summary 在上游 READS 内。usage 不在 0.3.10 hello capabilities 内，按 on-demand-page-degrade 入口不门控；usage-summary 在 capabilities 内，经 capabilities.has 门控。实测与源码核对界定：usage-summary 成功应答已由 dsbot-baseline-0310 实测（FINDINGS 第 12 节）；usage 应答键、行数与字节数由本变更对本机真实服务只读实测登记 FINDINGS 新节，夹具脱敏名称与数值'
    rationale: 用量端点首次被手机端消费，应答只给全部历史的小时明细、汇总全在客户端完成，且数字须与网页端一致；登记元组下标、时区语义、token 口径与门控方式作为单一事实来源，避免口径偏差（如漏算 cacheWrite）造成两端数字不一致
    enforcement:
      method: review
      detail: core JUnit（UsageTest）覆盖 usage 与 usage-summary 解码与缺损降级、各预设与自定义范围的分桶与上期对比、系列取前 7 与合并、排行、命中率与百分比、紧凑数字、热力图分级、请求体字面值，并以同一数据对照网页端算法的数字；源码核对位置：ds-bot 0.3.10 src/host/usage.js（usageView、hourKeys）、mobile.js（usageSummary、totals）、channel.js（usage 分发与 READS）、client.js（src/client/usage-data.js 的 RANGES/spanRange/spanBuckets/bucketsOf/spanOf/summarize/compact/percent2/hitRate，usage-page.js 的 UsagePage/Stats/Chart/Heat/Profile/kindLabel/ownerFace）
  upstream-client-algorithm-parity:
    strength: SHOULD
    statement: 原生端复刻上游网页端在客户端完成的计算（分桶、汇总、排行、数字与百分比文案等）且验收口径为「与网页端数字一致」时，期望值应由仓库内的生成脚本在 node 中直接截取并执行对应基准版本 client.js 的模块原文、对同一夹具计算得出；生成脚本与期望 JSON 和夹具放在 android/core/src/test/resources/dsbot/ 下，core JUnit 逐项全量比对；手写或转述的期望值不作为一致性证据
    rationale: dsbot-usage 的分桶、上期对比与紧凑数字规则细节多（周一起算、月界截断、toFixed 舍入、previous 窗口），转述极易出错；直接执行上游原文生成期望值可排除转述误差，基准版本升级时重跑脚本即可发现口径漂移
    enforcement:
      method: test
      detail: 评审核对生成脚本截取的模块边界与基准版本（如 usage-ref.mjs 截取 // src/client/usage-data.js 至 // src/client/usage-page.js），期望 JSON 与夹具同时提交，JUnit 对每个范围/输入全量比对；并以一次故意改坏口径确认比对能失败
    examples:
      good:
        - UsageTest 读取 usage-ref.mjs 生成的 usage-expected-*.json，对两套夹具 × 12 个范围比对桶键、各桶合计、堆叠、上期与排行
      bad:
        - 测试里手抄几组「看起来对」的数字，或照 Kotlin 实现推算期望值
  on-demand-poll-single-flight:
    strength: SHOULD
    statement: 按需读取且需要轮询的原生页面只在页面可见且 App 在前台时轮询，每轮等上一次应答后再排下一次；协程取消不会取消已发出的 ManageApi 读取，因此同一端点必须在连接层单飞（后到的读取等待在途应答），不得因页面切换、前后台切换或打开同类详情页而让同一端点同时有多个请求占用读取池；同一端点的总览页与详情页共享最近一次读取结果与用户选定的筛选状态，返回时先显示已有结果、不重置筛选
    rationale: dsbot-usage 评审发现：每页各自轮询时，设置页覆盖撤下、前后台切换与连续进入详情都会让多个 usage 请求同时在途（服务端扫描时每个最长约 6 秒），挤占 2 线程读取池上的聊天与媒体读取；详情返回总览时重新转圈并丢失所选范围。同里程碑与后续按需页（带轮询或详情栈）会复用这一做法
    enforcement:
      method: review
      detail: 评审检查新增轮询页：轮询只在 resumed 且未被覆盖时运行、取消即停；同一端点经连接层共享加载器单飞（如 UsageStore.load 以 CompletableDeferred 合并在途请求）；详情跳转保留并回写筛选状态；离开全部相关页后清空共享视图
    examples:
      good:
        - UsageStore：缓存最近视图并合并在途 usage 请求；openUsage 把当前 range/by 写回上一页
  bot-task-detail-endpoints-0310:
    strength: MUST
    statement: 'Bot 后台任务详情端点（DS-Bot 0.3.10，经 dsh 的 POST /api/bot）：bot-task-read {botId, taskId, cursor?, steps?}（在 READS 内，只读宿主也可调用；steps 仅在为 true 时传 true，cursor 透传上一页原始值）→ {sessionId, items[], cursor: {part, beforeSeq?} | null}，items 与 chat 同构并额外包含 taskView 专有条目：kind=task-brief {name?, text, time?, seq?, sessionId?}、kind=steps {turn, tools[{name, label?, ok?}], ms?, time?, sessionId?}（仅 steps=true 时插入每轮末尾）、kind=divider {time}；未知 Bot 或未知任务回 bot/not-found。bot-task-send {botId, taskId, text}（写端点，非 READS）→ {botId, taskId, sessionId}；未知 Bot 或未知任务回 bot/not-found，空文本或任务已结束（非 running/waiting_work/waiting_approval）回 bot/invalid，只读宿主回 bot/read-only。客户端必须：JSON null 与缺键 cursor 一律视为已到最早；刷新最新页时按 (item.sessionId ?: page.sessionId, seq) 与已加载更早页去重合并；从 state.bots[].tasks[] 全量状态（含 completed/failed/stopped/interrupted）查找任务元数据以在任务结束后平滑切为只读；活动态 2.5 秒轮询遵循 on-demand-poll-single-flight 仅在前台可见时单飞运行；发送不自动重试。实测与源码核对界定：未知 Bot/任务的错误形态及本机可用只读样本由本变更 ProbesBotTask 实测登记 FINDINGS 新节，写端点成功形态与无真实任务时的条目形态按 0.3.10 源码核对（src/host/channel.js、bot-tasks.js deliverToTask/taskViewOf、parts.js taskPage/partPage/displayItems/applySteps、client.js TaskReaderView），由 mock --chat-bars/--manage 覆盖。'
    rationale: bot-task-read 与 bot-task-send 首次被手机端消费，包含 task-brief/steps/divider 等任务视图专有条目与分页去重语义，登记请求/响应形态、错误码与实测/源码核对边界作为单一事实来源
    enforcement:
      method: review
      detail: core JUnit（BotTaskDetailTest）覆盖请求体构造、task-brief/steps/divider 与 ChatRender 条目解码、JSON null cursor 判尽、(sessionId, seq) 去重合并、全状态任务元数据解析与错误文案；源码核对位置：ds-bot 0.3.10 src/host/channel.js（853–869 行）、src/host/bot-tasks.js（taskViewOf、deliverToTask）、src/host/parts.js（taskPage、partPage taskView、displayItems、stepsItems、applySteps）、client.js（TaskReaderView）
  deepseek-services-endpoints-0310:
    strength: MUST
    statement: 'DeepSeek 服务端点（DS-Bot 0.3.10，经 dsh 的 POST /api/bot，会话 cookie 鉴权）：deepseek-services {}（在 READS 内）→ {endpoint(''https://api.deepseek.com''), key{ref, configured, reason?}, ocr{supported, enabled, configured, reason?}, tts{supported, enabled, configured, voices[], reason?}, speech{registered, providerId(''deepseek-asr''), configured, ready, reason?}, preferences{ocr: boolean, tts: ''system''|''deepseek'', voice: string}}（默认偏好 {ocr:false, tts:''system'', voice:''stella''}；注意 ASR 字段名为 speech 而非 asr，听写服务商选择走 DSH 宿主内部通道而非 /api/bot，手机端只读显示 speech 状态）。deepseek-services-config {ocr?: true|false|null, tts?: ''deepseek''|''system''|null, voice?: ''stella''|''tide''|null}（写端点，非 READS；null 删除对应已存覆盖恢复默认；非法参数回 bot/invalid、只读宿主回 bot/read-only）→ 更新后的同形 servicesStatus 视图。deepseek-synthesize {text, voice?}（在 READS 内；上游向 api.deepseek.com/v1/tools/tts 请求，TTS_TIMEOUT_MS=300_000，属慢端点，须走 slowExecutor 与长读超时连接；TTS 未设为 deepseek 或未配置 key 回 bot/unavailable，空文本、未知音色、计费长度超过 10000（汉字计 2 其余计 1）或请求体超 60 KiB 回 bot/invalid，上游 HTTP/WAV 校验失败回 bot/refused）→ {audioBase64, mediaType:''audio/wav''}。客户端必须：入口不经 hello capabilities 门控，遵循 on-demand-page-degrade 按应答降级并带代次号防乱序；写操作不自动重试、直接采用返回视图；试听返回的 WAV 仅在内存中经 MediaDataSource 播放并随停止/离开页面释放，audioBase64 与 API key 不写入磁盘、日志、诊断上报与未脱敏夹具。实测与源码核对界定：deepseek-services 只读应答形态与 deepseek-services-config/deepseek-synthesize 参数校验错误形态由本变更 ProbesDeepSeekServices 对本机真实服务只读实测登记 FINDINGS 新节；配置写入与成功 WAV 合成按 0.3.10 源码核对（src/host/deepseek-services.js、channel.js、client.js DeepSeekServicesPage）并由 mock --manage 覆盖，不改动用户真实偏好且不触发付费合成。'
    rationale: DeepSeek 服务三端点首次被手机端消费，包含 speech 字段命名差异、null 恢复默认语义、300 秒长超时慢端点分类及纯内存 WAV 播放隐私边界，登记完整契约作为单一事实来源，防止误按 asr 解码、误用 30 秒超时或将音频落盘/入日志
    enforcement:
      method: review
      detail: core JUnit（DeepSeekServicesTest、DiagReportingTest、DsbotFixturesTest）覆盖三端点请求体构造、servicesStatus 解码与偏好/音色合并、OCR/TTS/ASR 状态派生、计费长度与请求体上限校验、WAV 头校验与 Base64 解码、audioBase64 脱敏；源码核对位置：ds-bot 0.3.10 src/host/deepseek-services.js（defaultServices/normalizeServices/servicesStatus/updateServices/synthesize/billedLength）、channel.js（READS 与 870-873 行分发）、client.js（src/client/services-settings.js 的 capabilityState/asrState/ServicesForm/DeepSeekServicesPage）；FINDINGS 新节登记本机真实服务只读探针结果
