  memory-endpoints-0310:
    strength: MUST
    statement: '记忆端点（DS-Bot 0.3.10）：所有记忆端点以 {botId} 或 {roomId} 指明面板；memory-view → {botId|roomId, entries[{scope: own|team|group, topic|null, text, id, added, by, source, until, pinned, expired}], sizes, limits{entry:300,…}, summary{text, at}|null, fresh, summarizing, tidy{scope, batch, at, merged, moved, retired, items[{op,text}]}|null, keys{scope→key}, places[{key, kind: bot|group, name}], error}（实测；不带 summarize 时不触发模型）；memory-history {…, before?} → {rows[{id, time, op: add|remove|replace, scope, text, by, restored}], more: 下一页的 before|null}（实测，每页 50）；memory-ask {…, text(≤2000)} → {reply, changes[{op, scope, text, before?, ok, error?}], view}（调用模型）；memory-pin {…, scope, topic, text, pin}、memory-forget {…, scope, topic, text}、memory-edit {…, scope, topic, text, next}、memory-add {…, scope, topic?, text}、memory-move {…, scope, topic, text, to: places[].key 或 team}、memory-layer {…, topic, text, always}（仅团队条目）、memory-restore {…, id}、memory-tidy-undo {…, scope, batch} → 均返回最新视图；条目以 (scope, topic, text) 定位，条目已变时回 NO_MATCH 类拒绝。未知 Bot/群回 bot/refused（实测）。写端点为源码核对，未改用户真实记忆。memory-ask 同步等模型（单次 120 秒上限、失败重试并换模型），客户端须用长读超时（≥5 分钟）并在失败后重读视图；只读主机的 READS 含 memory-view 不含 memory-history；整理条目 op 为 merged/moved/retired；条目 id 只在同一记忆范围内唯一'
    rationale: 记忆端点此前未登记；记忆不在 state 里、写端点都返回最新视图，客户端须以应答视图为准；写入会改变真实 Bot 的行为，只能源码核对
    enforcement:
      method: review
      detail: core JUnit（MemoryPanelTest）以按真实形态脱敏的 memory-view/memory-history 夹具覆盖解码与请求体；源码核对位置：ds-bot 0.3.10 src/host/memory.js（memoryView、memoryAsk、memoryForget、memoryEdit、memoryAdd、memoryLayer、memoryMove、memoryPin、memoryHistory、memoryRestore、memoryTidyUndo、panelOf、panelEntries）、memory-tidy.js（tidyView）、memory-entries.js（MEMORY_LIMITS）、channel.js 与 mobile.js（memory-* 分发）；FINDINGS 第 24 节
  team-prefs-0310:
    strength: MUST
    statement: '团队偏好（DS-Bot 0.3.10）：state.prefs 只含与默认不同的键（实测样本含 theme=paper、width=90、defaultBotModel），缺省为 theme=deepseek、accent=主题默认、layout=bubble、motion=normal、effects=full、width=80、flatWidth=100、enterToSend=true、thinking=false；set-prefs（经 dsh 的 POST /api/bot，endpoint 为 set-prefs，鉴权同其他管理端点：会话 cookie）以「键: 值」只处理出现的键并返回最新 prefs，取值不合法时回 bot/invalid：theme 须为小写字母开头、至多 32 位的标识；accent 为 #rrggbb，null 或空串清除；layout 为 bubble 或 flat（bubble 或 null 删除）；motion 为 quiet、normal 或 lively（normal 或 null 删除）；enterToSend 为 false 时保存、true 或 null 删除；defaultBotModel 经模型解析，null 或空串清除，本地 Agent 拒绝。网页端主题配色见 client 的 themes.js（deepseek、mono、paper、moonlight，各有 light 与 dark），强调色候选为 ACCENT_INKS 的首色、深色下用第二色。客户端只发送被修改的键（不发 width 与 flatWidth）。set-prefs 为源码核对，未改用户真实团队'
    rationale: 团队偏好端点与形态此前未登记；客户端按偏好渲染需要与网页端同一套缺省与配色；只发改动键是保留手机不提供的偏好的唯一方式
    enforcement:
      method: review
      detail: core JUnit（TeamPrefsTest）以真实 state-full 夹具的 prefs 覆盖解码与缺省，并逐值锁定四套主题配色、ACCENT_INKS 与 accentInk 判定；源码核对位置：ds-bot 0.3.10 src/host/channel.js 的 setPrefs、client.js 的 themes.js（THEMES、themeVars、darkAccent）与 inks.js（ACCENT_INKS、INKS）；FINDINGS 第 25 节
  sections-0310:
    strength: MUST
    statement: 分组端点（DS-Bot 0.3.10，经 dsh 的 POST /api/bot，鉴权同其他管理端点：会话 cookie）：state.sections 为 [{id, name, collapsed?, color?}]（顺序即侧栏顺序），条目归属记在 bots/rooms/agents 各自的 sectionId（不在分组对象里；Main Bot 不可归组，set-flags 对其设 sectionId 时删除该字段）；section-save {id?, name?, collapsed?, color?, items?, add?, remove?} 无 id 时新建（名称空时服务端取「New section」并加序号）、有 id 时按出现的键修改，名称合并空白后截断为 32 字、空名或与其他分组（大小写与空白归一后）重名时拒绝，color 只能是 blue/orange/green/violet/rose 或 null，value 为保存后的分组对象；section-order {ids} 按给出的 id 重排，未列出的分组按原顺序接在后面，value 为整份 state 视图；section-delete {id} 删除分组并清除组内条目的 sectionId，value 为整份 state 视图；set-flags {id, sectionId} 设或清（null/空串）单个条目的归属，未知分组拒绝「Unknown section」。拒绝为 {ok:false, error:{code, message}}。写端点为源码核对，未改用户真实团队；客户端移动条目用 set-flags 而不是 section-save 的 items 全量
    rationale: 分组端点与 sectionId 归属此前未登记，旧实现按并不存在的 sections[].itemIds 解码，真实分组无法显示；登记形态让团队页与网页端侧栏一致
    enforcement:
      method: review
      detail: core JUnit（TeamSectionsTest、TeamHomeTest）覆盖解码、顺序、名称校验与请求体；源码核对位置：ds-bot 0.3.10 src/host/roster.js 的 saveSection/reorderSections/deleteSection/setFlags/cleanSectionName/freshSectionName、src/host/constants.js 的 SECTION_COLORS 与 SECTION_NAME_MAX、client.js Sidebar 的分组渲染顺序；FINDINGS 第 26 节
