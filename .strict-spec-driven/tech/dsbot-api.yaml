schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: dsbot-api
  title: DS-Bot API 接入契约
  category: architecture
rules:
  endpoint-inventory-source:
    strength: MUST
    statement: Android 原生访问 DS-Bot 的端点、请求/响应字段与 feed 事件格式以本标准登记的端点清单为唯一依据；清单条目必须注明 HTTP 端点、用途与鉴权要求。登记来源：dsbot-api-spike 对 DS-Bot 0.3.2 与 dsh 0.2.2-rc.1 的实测，此后 0.3.5/0.3.6/dsh 0.2.2-rc.3 的复验，以及 dsbot-baseline-0310 对 DS-Bot 0.3.10 的实测（0.3.10 新增端点与事件的登记与待补实测项见 endpoint-inventory-0310，二者共同构成清单）
    rationale: DS-Bot 的 /api/bot 是前后端内部接口、无跨版本稳定承诺，登记实测清单让后续变更与升级检测有单一事实来源
    enforcement:
      method: review
      detail: '已实测登记（完整清单与返回形态见 android/core/src/spike/FINDINGS.md）：POST /api/bot 信封 {endpoint, payload} → {ok, value|error}；state（全量视图+live 字段；since 增量 → unchanged+live 字段；since+live 全命中 → 仅 {revision, unchanged, liveKey}；payload 必须整体是合法 JSON，空参数传 {}）、chat {botId, cursor?} → {sessionId, items[], cursor?（对象 {part, beforeSeq} 透传）}、room-chat {roomId} → {roomId, items[], cursor?, running[], speaking[]}（0.3.5 实测：群历史端点；bot 条目带 botId/name/color 成员归属，cursor 分页同私聊）、earlier {sessionId, cursor}、send {sessionId, text}（纯文本）、update-check；写端点族（bot-chat 登记）：stop-member-work、resume、bot-new-part、bot-open-part、run-stats、exchange、exchange-text、file-text（后两者移交后续实测）；群端点族（group-chat 0.3.5 实测）：群消息提交复用 session/prompt（sessionId 用 room 的会话 id——room.id 与 sessionId 同值，实测 accepted；提及为消息文本中的 @成员名）、stop-room-work {roomId}（无效 id 回 value:false）、room-progress {roomId} → 数组（无效/无工作回空数组）、goal-draft {roomId, text≤2000}（缺 text 回 bot/invalid 提示语；生成群目标草稿）、goal-control {roomId, action}（无效群回 bot/refused Unknown group chat）；goal 的阶段/任务/证据视图数据源未实测（真实群无 goal 实例），goal-draft/goal-control 的应答形态待有 goal 的群取证回填；附件链路（0.3.5 实测）：上传 POST /api/session/uploadFileBinary?sessionId&name[&mediaType]（octet-stream）→ {receiptId, file|image 引用}；带附件消息与附件读取是 dsh unary RPC：POST /api/<channel>/<method>（session/prompt、session/attachment）client-request 信封 {type:client-request,rpcId,method,payload:{args:{request}}} → server-response；session/prompt request={requestId,sessionId,mode,content:[text|file|image blocks]}（room 的 sessionId 同样适用）；session/attachment request={sessionId,attachment:{attachmentId,mediaType(enum),bytes,width,height}} → value={attachment,data:base64}；/connect 是 launch-token 首认证入口（302 remote.mux），remote.mux stream open 对 unary 回 gateway/signature-invalid，WsClient/DshMux 留作 stream 载体。GET /api/bot/feed SSE（chunked，事件 hello/revision/live/message/stream，: keepalive 每 20s；Host 白名单：受信 Host 放行、127.0.0.1 与站点域名实测通过）；错误码族：bot/invalid|refused|stale|not-found|read-only|internal、bot/browser-off、gateway/input-invalid|signature-invalid|bad-request、session/not-found|attachment-invalid；边界：无 cookie→401 固定失效标记、错 Host（单头）→403、重复 Host 头→400、跨站 Origin+有效 cookie→403、无 Origin 原生请求放行；side-ask 应答带新 chatId {chatId, entryId}（每次提问新建会话——App 据此归属后续事件与轮询）；state.sideChats 的条目形态 entries[] = {id, question, answer, status: done|working, createdAt, finishedAt}——回答不走 feed 事件，落 state 由客户端轮询/刷新取回（side-chat 0.3.5 探针实证）。'
  auth-cookie-and-host:
    strength: MUST
    statement: 携带 dsh-auth cookie 的原生请求必须使用与 harness trusted-host 一致的 Host 头且不携带跨站 Origin 等跨站标记；dsh-auth cookie 只保存在 App 私有存储，不得出现在日志、dump 或诊断上报
    rationale: dsh 共享 /api 通道按 Host 白名单与 Origin 校验拦截请求，cookie 为 SameSite=Strict、HttpOnly 且绑定 host:port；凭据外泄违反 security-secrets 标准与项目 config 硬约束
    enforcement:
      method: review
  incremental-sync:
    strength: MUST
    statement: feed 的 revision/live 事件之后必须以 state 的 since=当前 revision 与 live 键做增量补齐，unchanged 响应不得触发全量刷新；message/stream 事件只做当前聊天的增量更新
    rationale: DS-Bot state 端点的 since/live 增量语义是断线重连后低开销补齐的基础，全量刷新会造成不必要负载与 UI 闪动
    enforcement:
      method: test
  version-baseline-and-degrade:
    strength: MUST
    statement: 连接时必须以 POST /api/bot update-check 读取远端版本：DS-Bot 版本取 value.current、dsh 版本取 value.dsh.current；与已测基准（DS-Bot 0.3.10、dsh 0.2.2-rc.3）不一致时显示提示但尽力可用；未知端点与未知字段必须降级显示而不是失败
    rationale: update-check 属 DS-Bot READS 白名单（只读宿主也可应答）；基准随 spike/复验更新：0.3.2（spike 首测）→ 0.3.5（里程碑真机验收）→ 0.3.6（2026-11-13 runSpike 复验）→ dsh 0.2.2-rc.3（2026-11-15 复验）→ DS-Bot 0.3.10（dsbot-baseline-0310 对真实服务 runSpike 实测，dsh 版本以同次 update-check 读数为准）；内部接口随上游漂移不可避免，提示加降级是唯一不锁用户升级的做法
    enforcement:
      method: manual
  fixtures-sanitized:
    strength: MUST
    statement: core 测试夹具必须来自真实响应的脱敏副本：token、cookie、密钥字段替换为占位值，对话内容为合成文本，结构与字段形态原样保留；每个夹具必须能被夹具加载校验测试解析
    rationale: SSE 解析、增量同步与错误码映射的 JUnit 需要真实结构而非编造样本，同时仓库不得含私人内容与凭据
    enforcement:
      method: test
      detail: 脱敏实现必须命中内容键后递归进内容区：区域内所有字符串叶节点（含嵌套对象与字符串数组的每个元素）一律替换占位符——卡片类内容（如问答卡的 options/selected）不是平铺字符串，仅按固定键清单平铺替换必漏（dsbot-api-spike 评审实证：role/why/purpose/question 对象曾整体漏过）。夹具校验测试按同一语义断言内容键值为占位符形态，测试键清单与脱敏键清单保持同步。
    exceptions:
      - android/core/src/test/resources/dsbot-source/ 下的源码核对样本：只用于真实服务尚无样本的字段（chat-bars-fields-0310），必须与真实夹具目录 dsbot/ 分开、由该目录 README 标注来源与替换义务、内容全部为合成文本；同一字段一旦取得真实样本须改为 dsbot/ 下的脱敏夹具并删除对应样本
  secrets-env-gated:
    strength: MUST
    statement: spike 与验证工具的带 token 地址等敏感输入一律经环境变量传入；命令行参数、输出、dump 与仓库内容中不得出现 token、cookie 或密钥
    rationale: dsh-url 输出本身含 token，命令行参数会出现在进程表，打印或入库即泄露
    enforcement:
      method: review
  exact-path-construction:
    strength: MUST
    statement: '原生请求的请求行路径必须精确以 /api/ 开头构造：基准地址先去掉尾部斜杠再拼接子路径；路径错配（如 //api/bot）不会得到路由级错误，而是被 dsh 的 SPA 静态兜底接管（POST → 405 且带 Allow: GET, HEAD），客户端必须把该响应形态识别为路径构造缺陷'
    rationale: spike 实测：HarnessUrl.normalize 产出的根路径带尾斜杠，直接拼 /api/bot 得 //api/bot，dsh 前缀路由按字面 startsWith("/api/") 匹配失败后静默落静态兜底，现象与鉴权问题高度相似，排查代价大
    enforcement:
      method: test
  attachment-path:
    strength: MUST
    statement: 附件路径（0.3.5 实测更新）：上传用 POST /api/session/uploadFileBinary?sessionId=<sid>&name=<名>[&mediaType=<图片类型>]（Content-Type application/octet-stream，原始字节流，返回 receiptId 与 file/image 引用——文件是 file 键、图片是 image 键且经服务端标准化带 width/height）；带附件消息的提交与附件字节读取是 dsh unary RPC，经 POST /api/<channel>/<method>（session/prompt 与 session/attachment）的 client-request 信封（{type:client-request,rpcId,method,payload:{args:{request}}} → server-response），与 /api/bot 同源 cookie 与受信 Host；纯文本发送走 /api/bot 的 send；Bot 对附件消息的回复统一经 /api/bot/feed 的 message/stream 事件呈现。/connect 只是 launch-token 首认证入口（token 换 peer cookie 后 302 至 /api/remote.mux）；remote.mux 的 WebSocket 流载体对 unary 方法回 gateway/signature-invalid，仅适用于 stream 类 RPC（core 的 WsClient/DshMux 已实现并测试，留作该场景载体）
    rationale: spike（0.2.2-rc.1）时期 HTTP envelope 网关 404 的结论对 0.3.5 已过时：dsbot-attachments 设备验收在真实 0.3.5 服务器实测，session 族 unary 方法已注册 HTTP 网关（client-request 信封全通、模型真实读图回复），设计阶段按旧结论准备的 WebSocket 路径保留为已测组件不再使用
    enforcement:
      method: review
  media-reference-file:
    strength: MUST
    statement: 对话内服务器本地路径的取字节端点是 GET/HEAD /api/file?path=<服务器绝对路径>（dsh-api-session-controller 的 serveFile，dsh 0.2.2-rc.1 源码核对）：请求不带当前 v 参数时先回 302，Location 只给查询串（?path=…&v=文件版本）——不是绝对地址也不是根相对路径，客户端必须按 RFC 3986 相对引用解析（core 的 HttpLocation）后重发才得 200 字节；成功响应 Content-Type 按扩展名识别，超过 attachments.imageLimits.maxImageBytes（默认 50MB）回 413，不存在回 404、非普通文件/越权回 403；跟随次数必须封顶防循环
    rationale: 1.6.1–1.6.3 期间 App 只跟随绝对地址与根相对路径 Location，真实 dsh 的查询串 Location 被丢弃，用户侧表现为「文件获取失败（302）」；mock 曾按根相对路径实现掩盖了差异，本次已把 mock 对齐为查询串形态并以 HttpLocationTest + 模拟器 E2E（mock 两次请求 + 系统播放器打开）双重验证
    enforcement:
      method: test
  hello-capabilities:
    strength: MUST
    statement: 0.3.10 起新增的端点、字段与 feed/notice 事件一律以 POST /api/bot hello 返回的 capabilities 名单为可用依据：名单未声明的能力视为不可用并隐藏对应入口；hello 不可用（不支持握手的旧版远端——0.3.10 对未知端点回 bot/not-found，0.3.6 对 hello 的应答未实测、按同一分支推断——以及任何读取失败）按 LEGACY 处理，只门控新能力、不门控 0.3.6 已有功能；hello 协商不出共同 api 版本（api 为 null 或高于客户端支持版本）按版本不一致降级；feed 首帧 hello 的 boot 变化或不再携带 boot 时重读能力集合；hello 与 feed hello 携带的 boot/seq 是 notices 补齐的游标来源
    rationale: 上游 mobile.js 约定 api 只在旧客户端会误读应答时才变，其余新增一律登记在 CAPABILITIES 并要求客户端跳过未知项；按能力位而非版本号判定，才能同时兼容 0.3.6 与 0.3.10，并表达 dsh 宿主经 HTTP/SSE 下个别能力不可用的情况
    enforcement:
      method: test
      detail: core JUnit（DsbotHelloTest）覆盖 hello 解码、未声明能力 has() 为 false、LEGACY 降级、api 兼容判定、重读判定（shouldReread）与提示条判定（DsbotVersions.banner）；App 新入口一律经 capabilities.has 判定
    exceptions:
      - 聊天条数据（bots[].tasks、bots[].blocked、computerLive、rooms[].goal、work）及其写端点 bot-stop-task、computer-app-answer、computer-stop、resume：0.3.10 的 hello capabilities 不含对应能力名，按 chat-bars-fields-0310 以字段存在显隐，不经 capabilities.has 判定（dsbot-chat-bars-0310 设计决策 data-presence-gating）
  endpoint-inventory-0310:
    strength: MUST
    statement: 0.3.10 新端点与事件（hello、notices、feed notice/room、avatar/image 与 avatars:'ref'、markdown-image、file-text、file-download 分块、bot-stop-task、computer-app-answer、computer-stop、learning-answer、connector-request-cancel、agent-chat/stop-agent、usage-summary、memory-add/memory-edit、schedule-pause、stage-image 与 send images）的请求/响应形状、错误码与经 dsh HTTP/SSE 是否可用，以 dsbot-baseline-0310 对真实服务的登记为准（android/core/src/spike/FINDINGS.md 第 12 节），登记须区分「实测」与「源码核对」；消费这些端点的变更以对应脱敏夹具为解码依据，只有源码核对、没有成功样本的形态，首个消费它的变更必须先对真实服务实测并补夹具，不得把源码核对的形态当作已实测
    rationale: 这些是上游为手机端新增的内部接口，可能继续漂移；经 dsh 的 HTTP/SSE 路径与上游手机加密链路不同，只有真实实测能确定哪些可用；本次服务器缺少部分样本（无文件附件、窗口内无群活动），必须把实测债务显式交给消费方
    enforcement:
      method: review
      detail: 实测（DS-Bot 0.3.10 / dsh 0.2.2-rc.3）：hello、notices、feed hello 与 notice、image（preview）、avatar、usage-summary、room-chat 取到成功应答；各写端点与 file-download/file-text/markdown-image 取到错误应答（新增错误码 bot/forbidden、bot/unavailable，经 reasonOf 缺省归 REFUSED）；未知端点回 bot/not-found；聊天条目图片引用为 imageRefs[]={attachmentId,mime,name}。file-download 成功分块已由 dsbot-reader-files 实测（presented 文件以 files[] 的 sessionId/seq/index 定位，512 KiB 分块、version 连续、版本变化与未知会话回 bot/not-found；夹具 file-download-chunk*.json，FINDINGS 第 17 节）。markdown-image 成功应答已由 dsbot-rich-render 实测（{mime, bytes, size, rev}；带 knownRev 且未变回 {mime, unchanged:true, size, rev}；工作区外 bot/forbidden；夹具 markdown-image-ok/unchanged.json，FINDINGS 第 18 节）。仅源码核对、待首个消费变更实测补夹具：feed room 事件形态、file-text 成功应答、state avatars:ref 下的 imageRef（本服务器头像均为 shape）。评审核对新端点的解码实现引用了 0.3.10 夹具与 FINDINGS 登记、源码核对项已先补实测；未实测可用的能力必须经 hello-capabilities 门控
    exceptions:
      - chat-bars-fields-0310 登记的聊天条字段：真实服务暂时无法产生样本（无任务/阻塞/群目标、电脑操作关闭、无零成本可撤销的触发途径）时，消费方可先按源码核对形态实现，前提是缺失或畸形一律降级为不显示、源码核对位置与取样尝试登记在 FINDINGS 第 13 节，并在服务器出现样本时实测替换
      - notices-fields-0310 登记的群类提醒形态（kind=group/done 与群内 approval 的 roomId、title=群名）：真实服务需群里有成员发言或完成任务才产生、取证会触发真实模型运行，消费方可先按源码核对形态实现，前提是 title 只作来源、摘要取 text，缺失字段降级为私聊形态，并在 FINDINGS 第 14 节登记待实测
      - dock-fields-0310 登记的停靠区数据（live learning 提案与 state connectorRequests）：真实服务需 Bot 产生学习提案或请求连接器才会出现，本机当前无样本，消费方可先按源码核对形态实现，前提是缺字段时只显示标题、作答端点错误时给可读提示，并在 FINDINGS 第 16 节登记待实测
      - file-text 成功应答与群帖 whole{length,file}：真实服务暂无带 attachmentId 的文件附件或被截断的长群帖（需用户上传附件或 Bot 在群里发超长帖，取样会触发真实模型运行），消费方可先按 0.3.10 源码核对形态实现「阅读全文」，前提是只在条目带 whole.file 时显示入口、失败给可读提示且不影响其他操作，并在 FINDINGS 第 17 节登记待实测
      - show_view 蓝图（state.views[sessionId].view，deep-view 0.1.2 组件树）：真实服务目前只有 stack/text/choice/submit 的卡片样本（夹具 view-blueprint-choice.json），图表、指标、进度、表格、滑块、数字、开关、选项、确认、表单与公式、let 的形态只能按 deep-view 0.1.2 源码核对（取样需 Bot 调用 show_view，触发真实模型运行）；消费方可先按源码移植的校验规则实现，前提是校验不通过一律降级为只读摘要、作答参数与 validateViewAnswer 一致，并在 FINDINGS 第 18 节登记待实测
      - agent-chat 成功应答与 DSH Agent 写端点（dsh-agent-endpoints-0310）：真实团队没有 DSH Agent，取得成功样本需在用户在用的团队里新建 Agent（项目约定不得改动真实数据）；消费方可先按 0.3.10 源码核对形态实现，前提是 agent-chat 的条目经与 chat 相同的解码与渲染、缺字段降级、失败给可读原因，只读实测未知 Agent 的错误形态，并在 FINDINGS 第 23 节登记待实测
      - memory-add 与 memory-edit 的成功应答（memory-endpoints-0310）：取样需改写用户在用团队的真实记忆（项目约定不得改动真实数据，且记忆变化会改变 Bot 行为）；消费方可先按 0.3.10 源码核对形态实现，前提是成功后以应答视图按已实测的 memory-view 形态解码、失败显示服务端原因且列表不变，只读实测 memory-view/memory-history 与未知 Bot 的错误形态，并在 FINDINGS 第 24 节登记待实测
  spike-write-probes-non-mutating:
    strength: MUST
    statement: 对真实 dsh 做取证或复验时，写类端点（停止、作答、取消、记忆增改、日程暂停、上传暂存、发送等）只能用不存在的 id 或无效参数取错误形态，不得改动真实团队、会话、记忆或日程；需要写端点的成功形态时，由消费它的变更在可撤销的合成对象上取证并记录清理方式
    rationale: 取证对象是用户在用的真实 Bot 团队，误写会造成不可逆的业务影响；错误形态已足以确定路由、信封与错误码，成功形态留给有明确撤销手段的消费方
    enforcement:
      method: review
      detail: 评审检查 android/core/src/spike 探针的写端点 payload 只含不存在的 id 或无效参数，新增成功形态取证附带合成对象与清理步骤
    exceptions:
      - runSpike 的 DSH_SPIKE_SEND=1（默认关闭）向第一个主 Bot 发一条 hi 以取得 message/stream/notice 事件，这是既有的显式开关，不受本规则约束
  chat-bars-fields-0310:
    strength: MUST
    statement: 聊天条的数据来源（DS-Bot 0.3.10，源码核对，待实测）：后台任务取 state 的 bots[].tasks[]={id,title,status,sessionId,roomId?,startedAt,updatedAt,summary?,error?,running}，只显示 status ∈ running/waiting_work/waiting_approval，私聊只取不带 roomId 的任务（群里接的任务属于群，对齐网页端 tasksForChat），等你审批在前、其余按 updatedAt（缺省 startedAt）倒序；停止为 POST /api/bot bot-stop-task {botId,taskId}（无此 Bot 回 bot/not-found，已实测）。电脑操作取 state/live 合并对象的 computerLive.asks{id→{id,botId,sessionId,appName,at,roomId?,icon?,callId?}} 与 computerLive.bots{botId→{state,app?,waitingFor?,steps}}（state 为 bot/waiting 视为正在操作）；作答 computer-app-answer {id,answer:deny|once|always}（请求不存在回 value:false，已实测），停止 computer-stop {botId}（value:true，已实测）。模型失败取 bots[].blocked={code,provider?,status?,requestId?,at}，code ∈ MISSING_CREDENTIAL/INVALID_CREDENTIAL/AUTH/QUOTA/ACCOUNT_QUOTA/ACCOUNT_SIGN_IN_REQUIRED/ACCOUNT_SIGNED_OUT/ACCOUNT_TOKEN_INVALID/LOCAL_AGENT_*，重试为 resume {botId}。群目标取 rooms[].goal={title,status:drafting|active|paused|complete|stopped,stages[{id,title,status:pending|active|passed}],current}。工作详情取 live 的 work.bots{botId→{since,tool?,said?,note?,target?,roomId?}} 与 work.rooms{roomId→[{botId,tool?,said?,note?,target?,speaking?}]}。这些字段不在 hello 能力名单内，客户端按字段存在显隐，缺失或畸形一律降级为不显示
    rationale: 0.3.10 的 hello capabilities 不覆盖这些聊天条，且本次取证服务器没有任务/阻塞/群目标样本、电脑操作关闭；把源码核对位置与形态登记为单一事实来源，并显式标注实测状态，避免后续变更把源码核对当实测，也让上游字段漂移时能定位到对照位置
    enforcement:
      method: test
      detail: core JUnit（ChatBarsTest、WorkPhraseTest）以源码核对形态夹具覆盖解码、活动状态与私聊 roomId 过滤及排序、真实 0.3.10 夹具（state-full、state-unchanged-live 经 mergeDelta）下全部派生为空且 live 字段可读、字段缺失与畸形降级、上限截断、修复卡文案与充值链接判定、工作短语映射顺序；源码核对位置：ds-bot 0.3.10 src/host/channel.js（view/live/state 应答合并）、bot-tasks.js taskViewOf、turns.js blockBot/doingOf/workView/roomWorkView、computer/index.js computerLive/answerAppAccess、goals.js；设备验收取得真实样本后替换夹具并在 FINDINGS 登记
  notices-fields-0310:
    strength: MUST
    statement: 应用内提醒的数据来源（DS-Bot 0.3.10）：feed notice 事件与 POST /api/bot notices {boot, since} 应答的条目形态 {seq,time,botId,name,kind,sessionId?,roomId?,title?,text}，应答外层 {boot,seq,reset,notices[]}（实测，夹具 notices.json、notices-reset.json、feed-stream-0310.sse，样本均为 kind=message）。按上游 mobile.js 源码核对、待实测：kind=group 与 done 来自群日志（roomLineAdded），带 roomId 与 title=群名，group 的 text 为消息正文、done 的 text 为空；kind=approval 的 text 为工具名，群内审批同样带 roomId 与 title=群名；kind=question/view 来自私聊卡片（cardShown），不带 title。客户端只显示 question/approval/message/group/done，title 只作来源（群名）、摘要一律取 text；(boot, seq) 游标去重，reset 或 boot 变化时重取整体状态而不补弹
