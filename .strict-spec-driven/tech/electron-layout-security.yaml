schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: electron-layout-security
  title: Electron 工程布局与安全基线
  category: security
rules:
  electron-project-layout:
    strength: MUST
    statement: Electron 应用代码必须位于仓库根的 src/main、src/preload、src/renderer，由 electron-vite 构建到 out/；打包等构建期脚本放在 scripts/ 并使用 .mts；单元测试与源码同目录命名为 *.test.ts 或 *.test.mts，端到端测试放在 e2e/；tsconfig 开启 strict。
    rationale: 固定的三段布局让 main、preload、渲染进程的权限边界在目录上可见，也让回归命令与覆盖率范围可以按路径稳定声明。
    enforcement:
      method: review
      detail: 审查新增 TypeScript 文件的位置与 tsconfig 的 strict 设置；npm run typecheck 属于回归命令。
  secure-webpreferences:
    strength: MUST
    statement: '每个 BrowserWindow 与 WebContentsView 必须使用 contextIsolation: true、sandbox: true、nodeIntegration: false，且不得关闭 webSecurity、不得开启 allowRunningInsecureContent 或 experimentalFeatures。'
    rationale: 这是 Electron 安全清单的基线；任一项放开都会让渲染进程中的页面脚本获得 Node 或跨源能力。
    enforcement:
      method: test
      detail: 生成窗口选项的函数有单元测试断言这些字段；端到端测试断言渲染进程中 require 与 process 不可用。
    examples:
      good:
        - new BrowserWindow(createMainWindowOptions(preloadPath))
      bad:
        - 'new BrowserWindow({ webPreferences: { nodeIntegration: true } })'
  local-page-protocol-csp:
    strength: MUST
    statement: 生产模式下本地页面必须经应用注册的 app:// 特权协议从构建产物加载，协议处理必须拒绝解析到渲染产物目录之外的路径，并在响应头上附加不含 unsafe-eval 与内联脚本许可的 Content-Security-Policy；不得用 file:// 加载本地页面。
    rationale: file:// 来源为 null 且可触达整个文件系统；自定义协议提供稳定的本地 origin 供来源校验，并统一下发 CSP。
    enforcement:
      method: test
      detail: 路径解析与响应头构造的单元测试覆盖路径穿越被拒与 CSP 内容；端到端测试断言本地页面中 eval 被 CSP 拒绝。
  electron-fuses:
    strength: MUST
    statement: 打包产物必须用 @electron/fuses 关闭 RunAsNode、EnableNodeOptionsEnvironmentVariable 与 EnableNodeCliInspectArguments；fuse 配置集中在一个模块中并有单元测试。
    rationale: 这些能力让任何能启动应用的人以 Node 方式执行任意代码或附加调试器，桌面客户端不需要它们。
    enforcement:
      method: test
      detail: 单元测试断言 fuse 配置；接入打包后审查打包钩子调用该配置，并可用 npx @electron/fuses read 检查产物。
    exceptions:
      - 开发模式与 Playwright 端到端测试使用未翻转的 node_modules Electron，因为 Playwright 依赖调试参数启动。
  remote-content-no-preload:
    strength: MUST
    statement: 显示远程内容的 webContents 不得挂载 preload，也不得暴露任何 IPC 通道或 contextBridge API。
    rationale: 远程 harness 页面及其中的第三方 iframe 不可信；不挂 preload 让远程页面在结构上无法调用本地能力，取代 Wails 时期的 guard。
    enforcement:
      method: review
      detail: 审查加载远程地址的窗口或视图的 webPreferences 与 preload 设置。
  ipc-sender-validation:
    strength: MUST
    statement: 主进程的每个 ipcMain 处理函数必须先校验 event.senderFrame 是主 frame 且其来源是允许的本地页面来源，校验失败即拒绝；允许来源由一个纯函数判定：打包后只接受 app://local，未打包且设置了 ELECTRON_RENDERER_URL 时额外接受该开发服务器的来源。参数按白名单校验，日志不记录参数原文。
    rationale: IPC 是本地页面调用主进程能力的唯一入口，只有逐次校验发送方与参数才能防止被导航到其他内容的 webContents 或子 frame 冒用；开发模式本地页面由 electron-vite 开发服务器提供，允许来源必须随运行模式确定，且打包产物绝不接受开发来源。
    enforcement:
      method: test
      detail: 允许来源判定函数的单元测试覆盖打包模式拒绝开发服务器来源；处理函数的单元测试覆盖非本地来源、子 frame 与非白名单参数被拒。
  e2e-isolated-user-data:
    strength: MUST
    statement: Playwright 启动 Electron 的端到端测试必须为每个测试传入独立的临时 --user-data-dir 并在测试后删除，不得读写真实用户的 userData 或配置目录。
    rationale: Electron 默认 userData 为系统用户配置目录下的 dsh-anywhere，与 Go 版及后续 Electron 版的配置文件目录重合；共享真实目录会污染开发者配置并让测试之间共享状态。
    enforcement:
      method: test
      detail: 端到端测试断言 app.getPath('userData') 等于本测试创建的临时目录。
  remote-view-navigation-policy:
    strength: MUST
    statement: 显示远程内容的 webContents 必须在加载任何远程地址之前注册 will-navigate（主框架导航）与 setWindowOpenHandler，并统一交给一个纯函数导航策略判定：同源留在原视图，非同源 http/https 交给 shell.openExternal，其他协议拒绝；setWindowOpenHandler 一律返回 deny，不得创建新的 BrowserWindow。
    rationale: Electron 默认允许远程页面导航到任意地址并弹出新窗口，新窗口会继承不受控的 webPreferences；集中在纯函数中判定让同源、外部与忽略三类行为可单元测试，取代 Wails 时期注入页面的导航脚本。
    enforcement:
      method: test
      detail: '导航策略纯函数的单元测试覆盖同源、不同端口、非同源 http/https、file: 与 javascript:；端到端测试断言 window.open 不产生新窗口、外部链接调用 shell.openExternal。'
  serialize-navigation-effects:
    strength: MUST
    statement: 导航控制器发起的每次导航必须递增代次；探测、重试等异步步骤完成后，只有代次未变时才可以切换显示的视图或调用 loadURL。
    rationale: 启动探测、重新加载与重试会重叠，较早的异步结果晚到时若仍生效，会把主窗口切回过时的页面或在显示本地页面时加载远程地址；代次比较是 Go 版同名规则在单线程事件循环下的等价约束。
    enforcement:
      method: test
      detail: 导航控制器单元测试用可控完成顺序的假探测发起并发导航，断言只有最新一次导航的结果生效。
  remote-session-permissions-deny:
    strength: MUST
    statement: 显示远程内容的 session 必须设置 setPermissionRequestHandler 与 setPermissionCheckHandler，默认拒绝全部权限，需要放行的权限由一个纯函数按白名单判定。
    rationale: Electron 默认批准所有权限请求，远程页面及其中的第三方 iframe 会自动获得通知、摄像头、麦克风、地理位置等能力；白名单让放行的每项能力都有明确理由并可单元测试。
    enforcement:
      method: test
      detail: 权限判定纯函数的单元测试覆盖白名单放行与其他权限拒绝；端到端测试断言远程页面 Notification.requestPermission() 为 denied；审查远程 session 的接线。
  window-bound-controller-disposal:
    strength: SHOULD
    statement: 绑定到某个窗口的副作用控制器（导航控制器、视图切换等）必须在窗口 closed 时作废，之后到达的异步结果与调用不得触达已销毁的窗口或 webContents。
    rationale: macOS 上关闭最后一个窗口后应用仍运行，探测等异步步骤可能在窗口销毁后完成；不作废控制器会在已销毁对象上调用方法并抛出未处理的异常，这与 Wails 时期 lesson wails-80aace 是同一类问题。
    enforcement:
      method: test
      detail: 控制器单元测试在 dispose 之后完成探测并触发远程事件，断言没有任何副作用调用。
  menu-labels-explicit:
    strength: SHOULD
    statement: 应用菜单中面向用户的菜单与菜单项必须显式设置中文 label，不得依赖 Electron 角色的英文默认标签；需要系统行为时保留 role 只覆盖 label；用显式子菜单替代 editMenu、windowMenu 等组合角色时，必须逐项复刻 Electron 默认子项或在 design 中说明取舍。macOS 应用菜单（appMenu）的系统项除外。
    rationale: Electron 组合角色的默认标签为英文，直接使用会让菜单中英混杂（electron-main-window 的 Windows 验收截图即为此例）；只列常用项替换组合角色又会悄悄丢掉删除、粘贴并匹配样式等默认项与其快捷键。
    enforcement:
      method: test
      detail: 菜单模板单元测试按平台断言每一项的 label 与 role 及结构；端到端测试读取真实应用菜单并通过菜单项执行编辑动作。
