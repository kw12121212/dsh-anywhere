schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: diagnostics
  title: 诊断上报端点与被动能力
  category: security
rules:
  diagnostics-endpoint-user-configured:
    strength: MUST
    statement: 诊断类上报端点只能来自用户在设置中的显式配置:默认未配置即完全关闭(不采集、不落盘、不发送),仅接受 https 地址,提供清除(删除配置并清空待发队列);端点与任何凭据不得硬编码;报告、本地队列与日志中携带地址的文本必须经与 HarnessUrl.redact 同源的脱敏,token 查询参数的值绝不出现。
    rationale: 仓库公开而端点位于私有 tailnet,地址即敏感信息;报告离开设备进入常驻服务,泄漏面大于本地日志(security-secrets/no-input-echo-errors 的延伸)。
    enforcement:
      method: test
    exceptions:
      - 原生 config.json 缺失且原生 diagnostics.json 尚不存在时，从同机原版 Electron 客户端已保存的 diagnostics.json 只读迁移而来的合法 https 端点，视同用户此前的显式配置；只要原生 config.json 仍存在，用户在原生端清除的端点不得被旧 Electron 文件回灌
  passive-capability-nonblocking:
    strength: MUST
    statement: 被动辅助能力(诊断捕获、入队、发送)不得阻塞主线程或 UI、不得触发隧道或网络连接建立、不得弹任何提示;失败静默保留,重试只在启动与错误触发点,不做定时轮询;服务端 4xx 属永久拒绝,直接丢弃该批不再重试。
    rationale: 辅助能力不得反噬主功能;上报是被动诊断,不得反向驱动连接(tunnel-optional-onboarding 的不启动语义)。
    enforcement:
      method: test
  crash-report-atomic-persist:
    strength: MUST
    statement: 崩溃处理器内只做同步原子落盘(临时文件加重命名)后交还系统默认处理,不在崩溃路径做网络发送;报告由下次启动连同待发队列批量补报;损坏或写入中断的报告文件按没有报告处理,不阻断启动(遵循 state-persistence/atomic-tolerant-state-read)。
    rationale: 崩溃时进程即将死亡,网络发送不可靠也不安全;原子写与读取容忍是既有持久化标准对崩溃报告的直接适用。
    enforcement:
      method: test
  diag-sanitize-secret-fields:
    strength: SHOULD
    statement: android/core 与 macos/Core 的 DiagText.sanitize 维护同一份敏感值正则清单（URL token、JSON 密钥/口令字段、secret-set value、键值与环境变量形态、Authorization 头、dsb_ 前缀令牌），任何一端新增敏感请求字段名或凭据前缀时必须同步另一端，并在两端各自的正反例测试中断言原值不出现且非敏感上下文保留（如密钥名）；Electron 桌面基线（地址脱敏 + token 不出现）不因此抬高。
    rationale: 同一脱敏清单自 macos-diagnostics 起存在 Kotlin 与 Swift 两份实现，单端补字段而另一端遗漏会造成跨端泄漏面不一致；把同步义务收口进规则并以两端正反例测试锁定，延续 android/electron 双实现时代以测试向量防漂移的做法。
    enforcement:
      method: test
      detail: 两端测试各自覆盖：android/core 的 DiagReportingTest 与 macos/Core 的 DiagnosticsTests 均断言 URL token、JSON 凭据键、secret-set value、键值/环境变量（无引号及单/双引号包裹）与 Authorization 头脱敏后原值不出现且非敏感上下文保留。
