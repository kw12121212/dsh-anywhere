schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: packaging
  title: 安装包打包
  category: tooling
rules:
  installer-filename-scheme:
    strength: MUST
    statement: 对外发布的安装包文件名必须形如 dsh-anywhere_<版本>_<平台>_<架构>[_installer].<扩展>（如 dsh-anywhere_0.1.0_macos_universal.dmg、dsh-anywhere_0.1.0_windows_amd64_installer.exe、dsh-anywhere_0.1.0_linux_amd64.deb）
    rationale: 统一命名让发布页产物可读可校验，SHA256SUMS 生成与用户下载选择都不依赖各打包器互不相同的默认名
    enforcement:
      method: review
  unsigned-install-bypass-documented:
    strength: MUST
    statement: 未签名安装包首次启动的绕过步骤（macOS Gatekeeper 与 Windows SmartScreen）必须记录在 README
    rationale: 里程碑明确不做签名公证，绕过步骤是用户能装起来的前置条件，缺失即安装体验断裂
    enforcement:
      method: test
  release-draft-verify-then-publish:
    strength: MUST
    statement: tag 发布必须先创建草稿 Release 并上传全部产物与 SHA256SUMS，全部成功后才转为正式发布；任一步失败必须删除草稿，不得留下半成品 Release
    rationale: 半成品发布页会误导用户下载缺失平台的版本；草稿对外不可见，是唯一的原子性实现方式
    enforcement:
      method: ci
  release-reuses-package-workflow:
    strength: MUST
    statement: 发布工作流必须以 workflow_call 复用 package.yml 打包，不得复制打包矩阵或打包命令
    rationale: 与 ci-reuses-wails-package-tasks 同理：发布产物必须与日常打包产物同构，双份打包逻辑必然漂移
    enforcement:
      method: ci
  release-notes-bypass-steps:
    strength: MUST
    statement: 每个发布的说明必须包含未签名安装包首次启动绕过 Gatekeeper 与 SmartScreen 的步骤
    rationale: 发布页是用户第一触点，绕过步骤缺失则安装即受阻；里程碑风险条目明确要求发布说明给出绕过步骤
    enforcement:
      method: ci
  workflow-structure-assertion-tests:
    strength: SHOULD
    statement: 无法直接单测的 CI/发布工作流结构，必须由 Vitest 纳管的仓库 TypeScript 测试断言锁定：关键片段正向断言，至少一条负向断言，并锁定被复用上游的关键前提（如 package.yml 的 workflow_call 触发器）
    rationale: 原 internal 包 Go 断言测试随 Go 栈删除，断言能力必须先迁移为 TypeScript 再删 Go，否则上游工作流改动会让发布断链而测试全绿
    enforcement:
      method: test
      detail: 迁移后的测试覆盖 package.yml workflow_call 前提、release.yml 四类产物齐全断言与 regression.yml 逐字包含回归命令，各含至少一条负向断言
  ci-calls-electron-builder-package:
    strength: MUST
    statement: CI 打包与发布步骤只允许调用仓库封装的 npm 打包 script（内部依次执行 electron-vite build 与 electron-builder），不得在 CI 工作流中复制编译或打包命令
    rationale: 打包权威源单一（仓库根 electron-builder.yml 与 npm script），本地与 CI 产物才可能一致；CI 复制打包逻辑必然漂移，这是原 wails3 任务约束在 Electron 工具链下的等价物
    enforcement:
      method: ci
      detail: 评审 package.yml 与 release.yml：打包步骤只出现 npm run dist 之类入口，不出现 electron-vite/electron-builder 的直接调用与参数复制
  package-version-single-source:
    strength: MUST
    statement: 安装包元数据、安装包文件名与应用内关于页显示的版本号必须同源于 package.json 的 version 字段：electron-vite 构建（__APP_VERSION__ define）与 electron-builder 打包（extraMetadata.version、artifactName 的 ${version}）在构建期读取同一 package.json 注入；版本号必须是 x.y.z 形式，读取或校验失败时打包入口直接报错退出，不得静默回退到 dev 或 0.0.0，也不得引入第二个版本登记处。
    rationale: 版本号只登记在 package.json 一处，npm ci、关于页、安装包元数据、文件名与 Release tag 才能全部对齐；历史上的 0.0.0 安装包与 dev 关于页正是 git describe 未命中时的静默回退造成的漂移。
    enforcement:
      method: test
      detail: 读取与校验集中在 scripts/package-version.mts（versionFromManifest 严格校验 x.y.z），electron.vite.config.ts 与 scripts/dist.mts 复用；由 scripts/package-version.test.mts 与 scripts/workflows.test.mts 断言锁定。
    examples:
      good:
        - package.json version 为 1.0.0 时，关于页显示“版本 1.0.0”，产物名为 dsh-anywhere_1.0.0_macos_universal.dmg。
      bad:
        - package.json version 为 1.0.0 而关于页显示 dev，或产物名内嵌 0.0.0。
  version-semver-policy:
    strength: MUST
    statement: 版本采用语义化版本（MAJOR.MINOR.PATCH）并自 1.0.0 起步（v0.1.0 为 Electron 迁移前的初始预览版，不延续 0.x 线）：不兼容行为变更升 MAJOR，向后兼容的新功能升 MINOR，缺陷修复升 PATCH；版本号只随发布准备提交到 dev 分支的 package.json（用 npm version --no-git-tag-version 同步 package-lock.json），dev 合入 main 后在 main 上打 v + 版本的发布 tag。
    rationale: 用户要求合理而完整的版本管理与 1.0.0 起始；只有明确 bump 判据与唯一落点，各处统一才能长期维持而不是一次性对齐。
    enforcement:
      method: review
      detail: 升版提交后完整回归的第一步 npm ci 会校验 package.json 与 package-lock.json 的版本同步，不同步立即失败。
  release-tag-guard:
    strength: MUST
    statement: Release 工作流在三平台打包开始之前必须校验触发 tag 等于 v + package.json 的 version，不一致即整个工作流失败，不得产出该 tag 下的任何安装包。
    rationale: 单一版本来源需要发布动作与之对齐；此前版本不符只能在发布 job 的产物文件名断言处发现，三平台已打包完毕。前置校验 fail fast，与发布 job 的四产物文件名校验形成双保险。
    enforcement:
      method: test
      detail: release.yml 的 verify-tag job 在 package job 之前执行，结构由 scripts/workflows.test.mts 断言锁定。
    examples:
      bad:
        - tag 为 v1.0.1 而 package.json version 仍为 1.0.0 时，Release 工作流在打包前失败。
  electron-binary-provisioning:
    strength: MUST
    statement: 仓库必须在根包 package.json 的 postinstall 中幂等补装 Electron 平台二进制（electron npm 包自 44 起发布时不再携带 postinstall 脚本，npm ci / npm install 后不会自动下载）：补装脚本位于 scripts/install-electron.mts，node_modules/electron/dist 已存在时跳过，electron 不在依赖中时不阻断安装，补装失败即安装失败。
    rationale: e2e（Playwright 启动 Electron）与 dev 模式都依赖 node_modules/electron/dist；没有该钩子，config.yaml 规定的完整回归命令（npm ci 起链、链尾 e2e）在任何机器都无法端到端通过，CI 之外无人能复现回归证据。
    enforcement:
      method: test
      detail: 由 scripts/workflows.test.mts 断言锁定：package.json 含 postinstall 钩子且指向 scripts/install-electron.mts；完整回归命令的实际执行作为端到端证据。
