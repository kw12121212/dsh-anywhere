schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: security-secrets
  title: 凭据与敏感输入保护
  category: security
rules:
  no-input-echo-errors:
    strength: MUST
    statement: 返回给渲染进程（IPC 处理器与 preload 暴露的调用）或写入日志的错误不得包含原始用户输入或可能带凭据的 URL；使用固定文本的哨兵错误，需要记录地址时必须先经过脱敏（redact）。
    rationale: URL 解析与网络库的错误会回显输入；Electron 主进程错误会经 IPC 序列化传给渲染进程并写入日志，带 token 的地址会因此泄露。
    enforcement:
      method: test
      detail: 对接收地址的函数，用含 token 夹具（如 ?token=abc123）的非法输入调用，断言错误消息不含 abc123；审查新增的错误构造是否拼接了输入。
    examples:
      good:
        - 'return { ok: false, error: ERR_MALFORMED }'
      bad:
        - 'return { ok: false, error: `invalid url ${raw}` }'
  webview-credential-storage-perms:
    strength: SHOULD
    statement: Electron 持久化的会话数据（如 cookie 数据库）必须位于应用专属的 userData 目录（默认 partition），不得把 partition 的 cache/storage 路径配置到多个应用共享的目录，也不得为会话数据自建共享存储位置。
    rationale: dsh 会话 cookie 在 Chromium 存储中明文保存且有效期数天；Chromium 在 userData 下以应用专属子目录与仅当前用户可读写的权限管理这些数据，指向共享位置会破坏这一隔离。
    enforcement:
      method: review
      detail: 审查 session.partition 与 setPath 相关配置；测试断言配置目录位于 app.getPath(userData) 之下（参考 electron-userdata-dsh-anywhere lesson）。
  android-sensitive-input:
    strength: SHOULD
    statement: Android 原生界面中输入 key、token、Client Secret、授权码、密码等敏感值时使用不回显的 SecretField（密码变换、密码键盘、关闭自动更正），并在含此类输入的表单显示期间以 SecureWhileShown 给窗口加 FLAG_SECURE（按窗口计数，最后一个表单离开才恢复，不对整页常开以免验收截图全黑）；App 主动复制到剪贴板的敏感文本（设备码、授权链接、回调地址等）经 SensitiveClipboard 复制：标记 EXTRA_IS_SENSITIVE，内存只记内容摘要，由 core ClipboardGuard 判断——离开过 App 再取得焦点或约 2 分钟兜底时剪贴板仍是本 App 复制的内容即清除，读不到剪贴板时保留待下次，只在 App 内取回焦点不清；这些值只进请求体，不写日志与诊断上报
    rationale: dsbot-connectors-mail 首次在手机上输入第三方凭据并复制设备码，里程碑风险要求敏感值不回显、不入日志、不在剪贴板残留；同里程碑的密钥页、IM 配对与登录码、本地 Agent 等后续变更都会复用这套做法，模拟器验收与评审已踩过 ON_RESUME 读剪贴板被拒、标签被宿主同步改写、后台 hasPrimaryClip 为 false 三个坑
    enforcement:
      method: review
      detail: 评审检查新增敏感输入是否用 SecretField 并包在 SecureWhileShown 中、复制敏感文本是否经 SensitiveClipboard；ClipboardGuard 的判断由 core JUnit（ClipboardGuardTest）覆盖：离开后回来清除、App 内取回焦点不清、后台读不到保留、用户另行复制不清
    examples:
      good:
        - CredentialForm 中 SecureWhileShown() 后 SecretField(value, ...)；DevicePanel 的复制按钮调用 SensitiveClipboard.copy(context, userCode)
      bad:
        - OutlinedTextField 明文输入 token；ClipboardManager.setPrimaryClip 直接复制设备码且不清理；在 ON_RESUME 读剪贴板判断是否清除
  one-time-secret-display:
    strength: SHOULD
    statement: 写端点应答中一次性下发的明文凭据（如 mcp-client-add 的 dsb_ 令牌）：core 解码时与视图分离，放进 toString 脱敏的包装类型；App 只放在页面级 remember 内存状态里一次性显示，禁止 rememberSaveable、本地存储与任何持久化，离开页面即丢弃，对应对象被删除后不再显示；显示期间以 SecureWhileShown 加 FLAG_SECURE，复制经 SensitiveClipboard；凭据前缀同步加入 DiagText.sanitize 的整段脱敏并配正反例测试
    rationale: 服务端通常只存这类凭据的摘要、明文只出现一次，丢失只能重建；rememberSaveable 会把明文写进进程重建用的 Bundle，data class 的默认 toString 会在异常、日志或诊断中打印明文。dsbot-mcp-access 首次在手机上显示此类凭据，独立评审建议把做法固定下来供后续同类端点复用
    enforcement:
      method: review
      detail: 评审检查一次性凭据的 core 类型是否覆盖 toString、App 是否只用 remember（无 rememberSaveable/持久化）、显示组件是否调用 SecureWhileShown、复制是否走 SensitiveClipboard；core JUnit 断言包装类型与所在 data class 的 toString 不含明文（参照 McpAccessTest.createdSplitsViewAndOneTimeToken），DiagReportingTest 覆盖前缀脱敏的正反例
    examples:
      good:
        - 'class Token(val value: String) { override fun toString() = "Token(***)" }；var created by remember { mutableStateOf<Token?>(null) }；TokenCard 内 SecureWhileShown() 与 SensitiveClipboard.copy(context, token.value)'
      bad:
        - 'data class Created(val token: String)；var token by rememberSaveable { mutableStateOf("") }；ClipboardManager.setPrimaryClip 直接复制令牌'
