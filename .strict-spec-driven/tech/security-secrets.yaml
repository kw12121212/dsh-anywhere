schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: security-secrets
  title: 凭据与敏感输入保护
  category: security
rules:
  no-input-echo-errors:
    strength: MUST
    statement: 返回给前端（Wails 绑定方法）或写入日志的错误不得包含原始用户输入或可能带凭据的 URL；使用固定文本的哨兵错误，需要记录地址时必须先经过 config.Redact。
    rationale: net/url 等标准库错误会回显输入；Wails 会以 Error 级别记录绑定方法返回的 err.Error() 并把错误序列化进前端异常的 cause，带 token 的地址会因此泄露。
    enforcement:
      method: test
      detail: 对接收地址的函数，用含 token 夹具（如 ?token=abc123）的非法输入调用，断言 err.Error() 不含 abc123；审查新增的 fmt.Errorf 是否拼接了输入。
    examples:
      good:
        - return "", ErrMalformed
      bad:
        - 'return "", fmt.Errorf("invalid url %q: %w", raw, err)'
  wails-loglevel-not-debug:
    strength: MUST
    statement: 不得把 application.Options.LogLevel 设为 Debug 或更低，除非已没有任何接收凭据或带 token 地址作为参数的绑定方法。
    rationale: Wails v3.0.0 以 Debug 级别记录每次绑定调用的原始参数，SaveURL、ValidateURL 的入参可能是 dsh web 打印的带 token 地址。
    enforcement:
      method: review
      detail: 审查 main.go 与 application.Options 中的 LogLevel 设置（grep -n LogLevel）。
    examples:
      bad:
        - 'LogLevel: slog.LevelDebug'
  webview-credential-storage-perms:
    strength: SHOULD
    statement: webview 持久化的凭据数据（如 cookie 数据库）必须放在应用专属目录，目录 0700、文件仅当前用户可读写，不得放在多个应用共享的 WebKitGTK 默认数据目录。
    rationale: dsh 会话 cookie 在 SQLite 中明文保存且有效期数天；共享目录与 0644 权限会让其他用户或应用读到。
    enforcement:
      method: test
      detail: 单元测试断言准备后的目录为 0700、文件为 0600（含收紧已有的宽松权限）。
