schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: security-secrets
  title: 凭据与敏感输入保护
  category: security
rules:
  no-input-echo-errors:
    strength: MUST
    statement: 返回给渲染进程（IPC 处理器与 preload 暴露的调用）或写入日志的错误不得包含原始用户输入或可能带凭据的 URL；使用固定文本的哨兵错误，需要记录地址时必须先经过脱敏（redact）。
    rationale: URL 解析与网络库的错误会回显输入；Electron 主进程错误会经 IPC 序列化传给渲染进程并写入日志，带 token 的地址会因此泄露。
    enforcement:
      method: test
      detail: 对接收地址的函数，用含 token 夹具（如 ?token=abc123）的非法输入调用，断言错误消息不含 abc123；审查新增的错误构造是否拼接了输入。
    examples:
      good:
        - 'return { ok: false, error: ERR_MALFORMED }'
      bad:
        - 'return { ok: false, error: `invalid url ${raw}` }'
  webview-credential-storage-perms:
    strength: SHOULD
    statement: Electron 持久化的会话数据（如 cookie 数据库）必须位于应用专属的 userData 目录（默认 partition），不得把 partition 的 cache/storage 路径配置到多个应用共享的目录，也不得为会话数据自建共享存储位置。
    rationale: dsh 会话 cookie 在 Chromium 存储中明文保存且有效期数天；Chromium 在 userData 下以应用专属子目录与仅当前用户可读写的权限管理这些数据，指向共享位置会破坏这一隔离。
    enforcement:
      method: review
      detail: 审查 session.partition 与 setPath 相关配置；测试断言配置目录位于 app.getPath(userData) 之下（参考 electron-userdata-dsh-anywhere lesson）。
