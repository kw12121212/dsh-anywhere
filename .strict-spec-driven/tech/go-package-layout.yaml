schema: strict-spec-driven/main-tech/v1
schema_version: 1
artifact_type: main_tech
schema_file: templates/strict-spec-driven/schemas/main-tech.yaml
standard:
  id: go-package-layout
  title: Go 包布局
  category: architecture
rules:
  main-assembly-only:
    strength: MUST
    statement: main.go 只做 Wails 应用与窗口的装配；配置读写、校验、探测、导航判定等需要测试的逻辑必须放在 internal/ 下的非 main 包中。
    rationale: 完整回归命令统计覆盖率时排除 main.go，且 main 包依赖 webview 难以单元测试；逻辑留在 main 包既不计入覆盖率也无法被测试，会使 80% 门槛失效或失败。
    enforcement:
      method: review
      detail: 审查 main.go 中除 application.New、窗口创建、服务注册与 app.Run 之外是否含有分支逻辑；回归命令的覆盖率门槛兜底。
    examples:
      good:
        - internal/appinfo.ConfigDir() 计算配置目录，main.go 只引用 appinfo.Name
      bad:
        - 在 main.go 中直接解析、校验并保存 harness URL
  inject-window-effects:
    strength: SHOULD
    statement: 需要窗口副作用（导航、打开或聚焦窗口等）的逻辑放在 internal 包中，以 func 参数注入副作用；main.go 只提供对窗口方法的闭包，单元测试用记录器断言回调的次数与参数。
    rationale: Wails 窗口无法在单元测试中创建；把副作用注入为回调后，决定何时、以什么参数触发副作用的逻辑可以达到覆盖率门槛，main.go 也保持只做装配。
    enforcement:
      method: review
      detail: 审查 internal 包是否直接引用 application.WebviewWindow；对应测试是否断言注入回调的调用次数与参数。
    examples:
      good:
        - setup.NewService(store, func(url string) { mainWindow.SetURL(url) })
      bad:
        - 在 setup 包中持有 *application.WebviewWindow 并直接调用 SetURL
  window-lifecycle-ownership:
    strength: SHOULD
    statement: 创建辅助窗口时必须明确主窗口关闭时的处理（退出应用或一并关闭辅助窗口）；任何引用 WebviewWindow 的副作用闭包都必须由生命周期逻辑保证调用时窗口仍存在。
    rationale: Wails v3.0.0 在 Linux 与 Windows 上只在窗口数为 0 时退出，对已销毁窗口调用 SetURL 不报错且在 Linux 上仍会发出请求。
    enforcement:
      method: review
      detail: 审查新增窗口时 main.go 是否注册主窗口 WindowClosing 的处理，以及副作用闭包引用的窗口在关闭后是否仍可能被调用。
  first-navigation-after-window-ready:
    strength: MUST
    statement: 不得在 app.Run 之前对窗口做程序化 SetURL；需要启动后立即导航时，在窗口的第一个 WindowRuntimeReady 事件中以 sync.Once 发起。
    rationale: Wails v3.0.0 创建原生窗口时会用初始 URL 覆盖此前的 SetURL，后台任务很快完成时导航会丢失。
    enforcement:
      method: review
      detail: 审查 main.go 与 internal 包在 app.Run 之前是否可能调用 SetURL。
  platform-errno-classification:
    strength: SHOULD
    statement: 按系统错误码分类网络错误时，以带构建标签的文件分别列出 Windows（WSA* 错误码）与其他平台的错误码。
    rationale: Windows 上的 WSAECONNREFUSED 等错误码与 Go 在 Windows 上定义的 syscall.ECONN* 不相等，统一匹配会在 Windows 上误分类。
    enforcement:
      method: review
      detail: 审查 syscall 错误码比较是否覆盖 Windows，并运行 GOOS=windows go vet。
  defer-window-effects-until-ready:
    strength: MUST
    statement: 不得在 app.Run 启动之前调用会触达平台实现的窗口方法（SetURL、Show、Hide、Focus、Minimise、UnMinimise、IsMinimised 等）；窗口事件注册与选项设置不受此限。早于窗口就绪到达的外部事件（单实例通知、深链、托盘或快捷键激活、macOS reopen）只能记录为待处理状态，并在窗口的第一个 WindowRuntimeReady 事件中补做一次；窗口副作用仍以 func 参数注入 internal 包，便于用记录器测试就绪前零调用、就绪后只补做一次。
    rationale: Wails v3.0.0 在 application.New 内就注册单实例监听，早于 app.Run；Run 之前 SetURL 会被原生窗口创建时的初始 URL 覆盖，其他窗口方法的 InvokeSync 会因 globalApplication.impl 为空而 panic。现有 first-navigation-after-window-ready 只约束 SetURL，覆盖不了单实例、深链等窗口激活路径。
    enforcement:
      method: review
      detail: 审查 main.go 与 internal 包在 app.Run 之前是否可能调用窗口方法；早到事件是否先挂起并在首个 WindowRuntimeReady 中补做；对应单元测试是否断言就绪前零调用、Start 后只补做一次（参考 internal/singleinstance）。
    examples:
      good:
        - internal/singleinstance.Activator 在 Start 前只记录 pending，由第一个 WindowRuntimeReady 调用 Start 补做
      bad:
        - 在 OnSecondInstanceLaunch 回调中直接调用 mainWindow.Show() 与 mainWindow.Focus()
