schema: strict-spec-driven/config/v1
schema_version: 1
artifact_type: workflow_config
preferred_human_language: Chinese
context: dsh-anywhere 是一个多平台（Windows / macOS / Linux）桌面客户端，用于接入用户指定的远程 DeepSeek harness URL，并在本地提供交互界面。技术栈：Electron + TypeScript；主进程、preload 与本地页面位于 src/，由 electron-vite 构建到 out/，electron-builder 打包三平台安装包；单元测试用 Vitest，端到端用 Playwright。约定：远程 harness URL 必须可配置、不得硬编码；API key / 令牌等凭据不得提交到仓库或写入日志。
rules:
  specs:
    - Describe observable behavior only — no implementation details, technology choices, or internal structure
    - MUST = required with no exceptions; SHOULD = default unless explicitly justified; MAY = genuinely optional
    - Each requirement must be independently verifiable from outside the system
  change:
    - Implement only what is in scope in proposal.yaml — if scope needs to expand, use strict-spec-modify first, never expand silently
    - When a requirement or task is ambiguous, ask the user before proceeding — do not assume or guess
    - Delta specs must reflect what was actually built, not the original plan
    - Mark tasks done immediately upon completion — never batch at the end
    - Every change must include test tasks (validation + unit tests at minimum)
  code:
    - Read existing code before modifying it
    - Implement only what the current task requires — no speculative features
    - No abstractions for hypothetical future needs (YAGNI)
    - 远程 DeepSeek harness URL 与凭据只能来自用户配置，禁止硬编码、提交到仓库或输出到日志
  test:
    - Tests must verify observable behavior described in specs, not internal implementation details
    - Each test must be independent — no shared mutable state between tests
    - Prefer real dependencies over mocks for code the project owns
review_evidence:
  project_regression:
    method: complete_project_regression
    command: npm ci && npm run typecheck && npm run build && npm run test:coverage && npm run test:e2e
    meaning: Passing this command is required review evidence before strict-spec-review recommends archive or strict-spec-auto performs archive. This command represents the complete project-level regression suite, not only the Testing section tasks for an individual change. When a coverage declaration is present, this command also enforces the minimum coverage threshold, so insufficient coverage is a blocking workflow failure rather than advisory output.
    unavailable_behavior: If the command cannot run because required dependencies, services, credentials, fixtures, or other test conditions are unavailable, review or auto archive is blocked until a human prepares the environment or explicitly provides the missing evidence.
    coverage:
      metric: line
      threshold: 80
      scope:
        include:
          - src/**/*.ts
          - scripts/**/*.mts
        exclude:
          - '**/*.test.ts'
          - '**/*.test.mts'
          - src/main/index.ts
          - scripts/flip-fuses.mts
          - e2e/**
          - node_modules/**
          - out/**
