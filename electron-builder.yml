# electron-builder 打包配置（设计决策 electron-builder-config-file）。
# 身份元数据沿用 Go 版定稿文案（主规格 app-identity / 技术标准 build-identity）：
# 显示名称 DSH Anywhere、包标识 work.keepwriting.dsh-anywhere、版权与描述保持一致。
# 版本号不在本文件出现：package.json 的 version 是唯一登记处（技术标准
# packaging/package-version-single-source），由 scripts/dist.mts 经 extraMetadata.version
# 注入，与 electron-vite define 注入运行时的 APP_VERSION 同源。
appId: work.keepwriting.dsh-anywhere
productName: DSH Anywhere
copyright: © 2026 Keepwriting
directories:
  output: dist
  buildResources: build
# 应用没有运行时 npm 依赖，打包内容只有 electron-vite 产物。
files:
  - out/**
# fuses 用 electron-builder 内建 electronFuses 翻转（universal 构建在两架构合并后、
# 签名前的正确时点执行，自定义 afterPack 会在每架构重签导致 universal 合并校验失败）；
# 值与 scripts/fuses.mts 的 FUSE_CONFIG 同源，由 scripts/workflows.test.mts 断言锁定
# （技术标准 electron-layout-security/electron-fuses）。
electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
win:
  target:
    - nsis
nsis:
  # 文件命名与 release.yml 的发布产物断言保持同一约定（技术标准 packaging/installer-filename-scheme）。
  artifactName: dsh-anywhere_${version}_windows_amd64_installer.exe
mac:
  minimumSystemVersion: 12.0.0
  target:
    - target: dmg
      arch:
        - universal
  artifactName: dsh-anywhere_${version}_macos_universal.dmg
linux:
  # 桌面条目与可执行名保持 Go 版身份：Name 取 productName，Exec/Icon 指向 dsh-anywhere；
  # desktopName（package.json）+ syncDesktopName 让条目文件名与 StartupWMClass 同为 dsh-anywhere，
  # 与 Electron 的 app_id 对齐（窗口与桌面条目正确关联）。
  executableName: dsh-anywhere
  maintainer: Keepwriting <keepwriting@users.noreply.github.com>
  category: Utility
  syncDesktopName: true
  icon: build/appicon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
appImage:
  artifactName: dsh-anywhere_${version}_linux_amd64.AppImage
deb:
  artifactName: dsh-anywhere_${version}_linux_amd64.deb
